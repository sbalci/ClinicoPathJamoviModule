name: Targeted LASSO Cox validation

on:
  push:
    branches: [master]
    paths:
      - 'R/lassocox*'
      - 'R/utils.R'
      - 'R/utils-formula.R'
      - 'jamovi/lassocox.*'
      - 'tests/testthat/test-lassocox-validation.R'
      - 'data/lassocox_*'
      - 'inst/examples/lassocox_example.R'
      - 'vignettes/lassocox-documentation.md'
      - 'development-scripts/validate_lassocox.R'
      - '.github/workflows/lassocox-validation.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'R/lassocox*'
      - 'R/utils.R'
      - 'R/utils-formula.R'
      - 'jamovi/lassocox.*'
      - 'tests/testthat/test-lassocox-validation.R'
      - 'data/lassocox_*'
      - 'inst/examples/lassocox_example.R'
      - 'vignettes/lassocox-documentation.md'
      - 'development-scripts/validate_lassocox.R'
      - '.github/workflows/lassocox-validation.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lassocox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R_PROFILE_USER: ~/.Rprofile
      LASSOCOX_REPORT_DIR: lassocox-validation-results
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      # An explicit dependency set avoids installing the umbrella's hundreds of imports.
      - name: Install targeted validation dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("testthat", "jmvcore", "R6", "glmnet", "survival", "htmltools", "ncvreg", "withr"))
      - name: Execute statistical regression tests
        run: Rscript --vanilla development-scripts/validate_lassocox.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lassocox-validation-results
          path: lassocox-validation-results/
          if-no-files-found: warn
