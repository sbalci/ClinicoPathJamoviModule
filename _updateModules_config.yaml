new_version: "1.0.82.05"
new_date: "2026-09-19"
quick: false
TEST: true
jjstatsplot: false
jsurvival: false
ClinicoPathDescriptives: false
OncoPath: true
meddecide: false
ClinicoPath: false

# ========================================
# DETAILED CONFIGURATION BELOW
# ========================================

global:
  base_repo_dir: "/Users/serdarbalci/Documents/GitHub/ClinicoPathJamoviModule"

modes:
  extended: true        # false: distribute files only; do not prepare/document/verify/install
  check: false          # devtools::check() each module after install
  webpage: false        # pkgdown site for modules that have _pkgdown.yml
  sync_analysis_versions: false # If false (default), preserves per-analysis versions in jamovi/*.a.yaml.
                                # If true, forces .a.yaml version fields to match the package version.
  copy_vignettes: false # Copy vignette_folders into each module's vignettes/ (and prune the rest)
  copy_test_files: false # Distribute the umbrella's per-analysis functional tests to submodules
                         # (name-keyed + namespace-translated). Leave FALSE until the umbrella
                         # test suite is green -- otherwise a submodule's R CMD check goes red.
                         # The dependency-guard test + testthat.R runner always ship.

# Routing -- four categories, by menuGroup suffix:
#   production  <Group>    e.g. Survival   -> the module whose menu_groups lists it
#   tests       <Group>T   e.g. SurvivalT  -> JamoviTest (menu_group_suffix below); also
#                                             <Group>DT / <Group>PT from the dev/test slash commands
#   pending     <Group>P   e.g. SurvivalP  -> umbrella only: written, not release-ready
#   drafts      <Group>D   e.g. SurvivalD  -> umbrella only
# `Power #meddecide` is matched literally; otherwise a `#comment` is ignored. Any other
# group is a plan error, so a typo can never silently drop an analysis.
umbrella_only_suffixes: ["D", "P"]

# What else ships is computed, not listed:
#   - helper R files: every umbrella R/ file whose definitions the shipped analyses use
#     (directly or through other helpers, including exists("f")/get0("f") lookups)
#   - JS: the ./<file>:: handlers named in the shipped .u.yaml
#   - 00refs.yaml trimmed to cited keys, dataset docs, the dependency-guard test
#   - i18n_files: copied from the umbrella, then trimmed to the module's own strings by
#     jmvtools::i18nUpdate() in build_module() (a dry-run therefore always lists them as update)
# Files the updater manages but no longer plans are deleted (R/, jamovi/*.yaml, js,
# data/*.rda). Hand-maintained R/zzz_imports.R, R/data.R, R/*-package.R, R/*-data.R,
# R/data-*.R, jamovi/i18n catalogs, data/*.csv and data/*.omv are never touched.
# .omv example analyses are made in the submodule and never copied from the umbrella
# (an .omv in data_files is skipped with a warning).
modules:
  jjstatsplot:
    directory: "/Users/serdarbalci/Documents/GitHub/jjstatsplot"
    menu_groups: ["JJStatsPlot"]
    data_files:
      - "histopathology.rda"
      - "categorical_quality_data.rda"
      - "groupsummary_financial_data.rda"
      - "groupsummary_simple.rda"
      - "hullplot_clinical_data.rda"
      - "hullplot_customer_data.rda"
      - "hullplot_experimental_data.rda"
      - "hullplot_quality_data.rda"
      - "hullplot_survey_data.rda"
  meddecide:
    directory: "/Users/serdarbalci/Documents/GitHub/meddecide"
    menu_groups: ["meddecide", "Power #meddecide"]
    prune_imports:
      # meddecide's only htmltools use was htmlEscape, which jmvcore also exports.
      # Importing both made `@import jmvcore` and `@importFrom htmltools htmlEscape`
      # collide ("replacing previous import"). The analyses now call
      # jmvcore::htmlEscape, so htmltools is no longer a meddecide dependency.
      - "htmltools"
    i18n_files:
      - "catalog.pot"
      - "en.po"
      - "tr.po"
    data_files:
      - "histopathology.rda"
      - "bayesdca_test_data.rda"
      - "breast_cancer_data.rda"
      - "breast_diagnostic_styles.rda"
      - "lymphoma_diagnostic_styles.rda"
      - "thyroid_function_data.rda"
      - "roc_analysis_test_data.RData"   # bundles master/cancer/cardiac/sepsis/thyroid_data
      # decisioncurve promoted to production meddecide (menuGroup: meddecide) - its
      # bundled example data must ship with it.
      - "comprehensive_dca_data.rda"
      - "dca_test.rda"
      - "dca_test_data.rda"
  jsurvival:
    directory: "/Users/serdarbalci/Documents/GitHub/jsurvival"
    menu_groups: ["Survival"]
    # Declared in jsurvival Imports but referenced by no shipped R file (2026-09-03
    # /check-module audit). maxstat is survminer's own Import, so surv_cutpoint()
    # still gets it transitively. Also dropped from R/zzz_imports.R + NAMESPACE.
    prune_imports:
      - "MASS"
      - "maxstat"
      - "pec"
      - "purrr"
      - "randomForestSRC"
      - "rpart.plot"
      - "survivalsvm"
      - "SurvMetrics"
      - "xgboost"
    # stagemigration_*.rda are NOT shipped here: stagemigration is menuGroup OncoPathT
    # (JamoviTest), and no jsurvival analysis, test or vignette uses them.
    data_files:
      - "histopathology.rda"
      - "melanoma.rda"
      - "data_longitudinal.rda"
      # lassocox_*.rda: used by the lassocox R example (lassocox.a.yaml), tests and vignettes.
      - "lassocox_breast_cancer.rda"
      - "lassocox_cardiovascular.rda"
      - "lassocox_genomic.rda"
      - "lassocox_lung_cancer.rda"
      - "lassocox_multicollinear.rda"
      - "lassocox_small_cohort.rda"
  ClinicoPathDescriptives:
    directory: "/Users/serdarbalci/Documents/GitHub/ClinicoPathDescriptives"
    menu_groups: ["Exploration"]
    i18n_files:
      - "catalog.pot"
      - "en.po"
      - "tr.po"
    # Declared in this module's Imports but used by no shipped R file. The Imports sync
    # only ever ADDS, so drop them here. A pruned package that is still imported by a
    # tag in R/zzz_imports.R fails verification -- remove the tag there.
    #   vcd         - 2026-09-06 /audit-module
    #   DescTools   - only reference is @importFrom DescTools BreslowDayTest in
    #                 zzz_imports.R; BreslowDayTest has no caller in this module
    #                 (its callers are agreement/categoricaladvanced, not shipped here)
    #   robustbase  - outlierdetection's MCD path goes through performance, whose
    #                 backend is MASS::cov.mcd; robustbase::covMcd was never called
    #                 (2026-09-07 /check-module --profile=release)
    prune_imports:
      - "vcd"
      - "DescTools"
      - "robustbase"
    # Used under requireNamespace() in outlierdetection, so the usage scan that
    # drives the import sync cannot see them; declare them explicitly. jamovi
    # installs Imports on first run and cannot fetch a missing package on demand,
    # so an optional runtime dependency still belongs in Imports.
    extra_imports:
      - "ICS"
      - "ICSOutlier"
    data_files:
      - "histopathology.rda"
      - "agepyramid_cancer.rda"
      - "agepyramid_geriatric.rda"
      - "agepyramid_pediatric.rda"
      - "agepyramid_reproductive.rda"
      - "agepyramid_test.rda"
      - "agepyramid_unbalanced.rda"
      - "chisqposttest_test_data.rda"
      - "complex_alluvial_data.rda"
      - "election_survey_data.rda"
      - "ihc_test_data.rda"
      - "multi_group_workflow.rda"
      - "outlierdetection_basic.rda"
      - "outlierdetection_clinical.rda"
      - "outlierdetection_edge_cases.rda"
      - "outlierdetection_international.rda"
      - "outlierdetection_large.rda"
      - "outlierdetection_multivariate.rda"
      - "outlierdetection_problematic.rda"
      - "outlierdetection_psychological.rda"
      - "outlierdetection_temporal.rda"
      - "raw_with_time.rda"
      - "sarcoma_ihc_data.rda"
      - "tableone_test.rda"
      - "treatmentResponse.rda"
      - "ggflowchart_comprehensive_data.rda"
  OncoPath:
    directory: "/Users/serdarbalci/Documents/GitHub/OncoPath"
    menu_groups: ["OncoPath"]
    i18n_files:
      - "catalog.pot"
      - "en.po"
      - "tr.po"
    # OncoPath owns a hand-maintained R/zzz_imports.R (never written or deleted by the
    # updater). OncoPath's pkg:: calls all sit inside R6 method bodies, which R CMD
    # check's installed-namespace scanner cannot walk -- without the @importFrom tags,
    # ggrepel/grDevices/grid/patchwork/psych/rlang/stringr/survival/utils are reported
    # as unused Imports even though every one of them is called at runtime.
    # These remain legitimate umbrella dependencies but have no production
    # OncoPath call site. document() removes their stale NAMESPACE directives.
    prune_imports:
      - "cluster"
      - "tidyr"
      # magrittr is NOT pruned: waterfall.b.R and swimmerplot.b.R use %>% 114
      # times. Pruning it stripped the pipe from the generated DESCRIPTION, and
      # with no importFrom anywhere `waterfall` could not run in jamovi at all
      # (2026-09-16 OncoPath audit, CRITICAL). A bare infix operator is not put
      # in scope by Imports: alone -- R/zzz_imports.R carries the importFrom tag.
    data_files:
      - "histopathology.rda"
      - "waterfall_percentage_basic.rda"
      - "waterfall_raw_longitudinal.rda"
      - "diagnostic_studies.rda"
      - "swimmerplot_sample.rda"
  JamoviTest:
    directory: "/Users/serdarbalci/Documents/GitHub/JamoviTest"
    toggle: "TEST"          # enabled by the top-level TEST switch
    menu_group_suffix: "T"  # every <Group>T analysis (tests category)
    data_files:
      - "histopathology.rda"

# Vignette folder-to-module mapping (used when modes$copy_vignettes is true)
vignette_folders:
  folder_mapping:
    vignettes-ClinicoPathDescriptives: ["ClinicoPathDescriptives"]
    vignettes-jjstatsplot: ["jjstatsplot"]
    vignettes-meddecide: ["meddecide"]
    vignettes-jsurvival: ["jsurvival"]
  # Glob ("*-legacy.Rmd") or regular expression
  exclude_patterns:
    - "*-legacy.Rmd"
    - "test-*.Rmd"
    - "temp-*.Rmd"
    - "draft-*.Rmd"
    - ".*\\.tmp\\."
  extensions: [".qmd", ".Rmd", ".md"]
