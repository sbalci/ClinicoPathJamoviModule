# Global settings (for backward compatibility)
global:
  base_repo_dir: "/Users/serdarbalci/Documents/GitHub/ClinicoPathJamoviModule"

# Operation modes (for backward compatibility)  
modes:
  check: false
  extended: true
  webpage: false
  commit_modules: false
  WIP: false
  
  # File copying control modes
  copy_vignettes: false       # Enable/disable vignette file copying
  copy_data_files: true       # Distribute example data to submodules: copy each module's data_files
                              # (.rda) from main data/, auto-generate roxygen docs for them, copy the
                              # .omv referenced in the submodule 0000.yaml datasets: from main
                              # inst/extdata/, and add omv rules to .Rbuildignore.
  generate_data_docs: true    # Auto-generate roxygen dataset docs (clears R CMD check "undocumented data")
  distribute_omv: true        # Copy .omv referenced in each submodule's 0000.yaml datasets: section
  copy_test_files: false      # Distribute the umbrella's per-analysis functional tests to submodules
                              # (name-keyed + namespace-translated). Leave FALSE until the umbrella
                              # test suite is green -- otherwise a submodule's R CMD check goes red.
                              # The self-contained strict dependency-guard test + testthat.R runner are
                              # shipped regardless to modules with no pre-existing functional tests.
  copy_r_files: true         # Enable/disable R utility file copying
  copy_i18n_files: true      # Copy each module's configured gettext catalogs from jamovi/i18n/
  use_legacy_copying: false   # Use legacy hardcoded file lists instead of config-based copying

  # Build-time integrity checks (added with the submodule critical review)
  check_module_dependencies: true   # Enforce direct declarations for package usage in submodules
  deps_fail_on_error: true          # Hard-stop on required/optional declaration violations
  check_distribution_coverage: true # Report analyses routed to zero or >1 submodule
  coverage_fail_on_gap: false       # Also hard-stop when an analysis routes to NO submodule (release hardening)

  # NAMESPACE-DESCRIPTION synchronization
  sync_namespace_description: true  # Enable NAMESPACE to DESCRIPTION package synchronization
  namespace_sync_dry_run: false     # Perform dry run only (show what would be changed)

