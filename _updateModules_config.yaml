      - "swimmerplot_html.R"
    # The production analyses call only these three shared utilities. Generate a
    # minimal file directly from the umbrella definitions so unrelated helpers
    # such as raw_to_prob(), bootstrapIDI(), and the startup hook cannot leak into
    # OncoPath or drift in a separately maintained template.
    r_symbol_files:
      - source: "utils.R"
        destination: "utils.R"
        symbols:
          - ".quietly"
          - ".fmt"
          - "%||%"
    # Explicit removal matters because changing r_files alone does not delete a
    # helper copied by an earlier updateModules run.
    prune_r_files:
      - "recist_engine.R"
      - "zzz_imports.R"
