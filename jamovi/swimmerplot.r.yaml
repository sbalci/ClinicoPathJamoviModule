---
name: swimmerplot
title: "Swimmer Plot"
jrs: '1.1'

items:
    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - censorVar
          - timeUnit

    - name: warningNotice
      title: ""
      type: Html
      visible: false

    - name: instructions
      title: "Instructions"
      type: Html

    - name: plot
      title: "Patient Timeline Visualization"
      type: Image
      width: 900
      height: 600
      renderFun: .plot
      requiresData: true
      clearWith:
          - maxMilestones
          - patientID
          - startTime
          - endTime
          - responseVar
          - censorVar
          - timeType
          - dateFormat
          - timeUnit
          - timeDisplay
          - milestone1Date
          - milestone1Name
          - milestone2Date
          - milestone2Name
          - milestone3Date
          - milestone3Name
          - milestone4Date
          - milestone4Name
          - milestone5Date
          - milestone5Name
          - showEventMarkers
          - eventVar
          - eventTimeVar
          - laneWidth
          - markerSize
          - colorPalette
          - plotTheme
          - showLegend
          - referenceLines
          - customReferenceTime
          - customReferenceDate
          - sortVariable
          - sortOrder

    - name: summary
      title: "Timeline Summary Statistics"
      type: Table
      rows: 0
      columns:
          - name: metric
            title: "Metric"
            type: text
          - name: value
            title: "Value"
            type: number
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - censorVar
          - timeType
          - dateFormat
          - timeUnit
          - timeDisplay

    - name: interpretation
      title: "Clinical Interpretation"
      type: Html
      visible: (showInterpretation)
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - timeType
          - dateFormat
          - timeUnit
          - timeDisplay
          - showInterpretation
          - personTimeAnalysis
          - responseAnalysis

    - name: personTimeTable
      title: "Person-Time Analysis"
      type: Table
      visible: (personTimeAnalysis)
      rows: 0
      columns:
          - name: response_type
            title: "Response Type"
            type: text
          - name: n_patients
            title: "Patients"
            type: integer
          - name: total_time
            title: "Total Time"
            type: number
          - name: mean_time
            title: "Mean Time"
            type: number
          - name: incidence_rate
            title: "Follow-up Density"
            type: number
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - timeType
          - timeUnit
          - personTimeAnalysis

    - name: milestoneTable
      title: "Milestone Event Summary"
      type: Table
      rows: 0
      columns:
          - name: milestone_name
            title: "Milestone"
            type: text
          - name: n_events
            title: "Events"
            type: integer
          - name: median_time
            title: "Median Time"
            type: number
          - name: time_range
            title: "Time Range"
            type: text
      clearWith:
          - maxMilestones
          - milestone1Date
          - milestone2Date
          - milestone3Date
          - milestone4Date
          - milestone5Date
          - milestone1Name
          - milestone2Name
          - milestone3Name
          - milestone4Name
          - milestone5Name
          - timeUnit

    - name: eventMarkerTable
      title: "Event Marker Summary"
      type: Table
      visible: (showEventMarkers)
      rows: 0
      columns:
          - name: event_type
            title: "Event Type"
            type: text
          - name: n_events
            title: "Count"
            type: integer
          - name: percent
            title: "Percentage"
            type: number
            format: pc
          - name: median_time
            title: "Median Time"
            type: number
      clearWith:
          - showEventMarkers
          - eventVar
          - eventTimeVar
          - timeUnit

    # These were declared as `type: Output`, but an Output result item writes a
    # single computed COLUMN back into the dataset and must be bound to a
    # matching `type: Output` OPTION in the .a.yaml - there was none, and the
    # backend called setState() rather than setRowNums()/setValues(). Neither
    # payload is a per-row column in any case (one is a multi-column frame, the
    # other is one row per metric), so both are tables.
    - name: timelineData
      title: "Export Timeline Data"
      type: Table
      visible: (exportTimeline)
      rows: 0
      columns:
          - name: patient_id
            title: "Patient ID"
            type: text
          - name: start_time
            title: "Start"
            type: number
          - name: end_time
            title: "End"
            type: number
          - name: duration
            title: "Duration"
            type: number
          - name: response
            title: "Best Response"
            type: text
      clearWith:
          - exportTimeline
          - patientID
          - startTime
          - endTime
          - responseVar
          - timeType
          - timeUnit
          - timeDisplay

    - name: summaryData
      title: "Export Summary Statistics"
      type: Table
      visible: (exportSummary)
      rows: 0
      columns:
          - name: metric
            title: "Metric"
            type: text
          - name: value
            title: "Value"
            type: number
      clearWith:
          - exportSummary
          - patientID
          - startTime
          - endTime
          - responseVar
          - timeUnit
          - personTimeAnalysis
          - responseAnalysis

    - name: exportInfo
      title: "Export Information"
      type: Html
      visible: (exportTimeline || exportSummary)
      clearWith:
          - exportTimeline
          - exportSummary

    - name: validationReport
      title: "Data Validation Report"
      type: Html
      visible: false  # Only shown when there are validation issues

    - name: advancedMetrics
      title: "Advanced Clinical Metrics"
      type: Table
      visible: (personTimeAnalysis)
      rows: 0
      columns:
          - name: metric_name
            title: "Metric"
            type: text
          - name: metric_value
            title: "Value"
            type: number
          - name: confidence_interval
            title: "95% CI"
            type: text
          - name: metric_unit
            title: "Unit"
            type: text
          - name: clinical_interpretation
            title: "Clinical Interpretation"
            type: text
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - censorVar
          - timeUnit
          - personTimeAnalysis

    - name: groupComparisonTest
      title: "Group Comparison Statistical Tests"
      type: Table
      visible: (groupVar)
      rows: 0
      columns:
          - name: comparison
            title: "Comparison"
            type: text
          - name: test_statistic
            title: "Test Statistic"
            type: text
          - name: p_value
            title: "P-value"
            type: number
            format: zto,pvalue
          - name: interpretation
            title: "Interpretation"
            type: text
      clearWith:
          - patientID
          - responseVar
          - groupVar

    - name: clinicalGlossary
      title: "Clinical Glossary"
      type: Html
      visible: (showGlossary)
      clearWith: []

    - name: copyReadyReport
      title: "Copy-Ready Manuscript Text"
      type: Html
      visible: (showCopyReady)
      clearWith:
          - patientID
          - startTime
          - endTime
          - responseVar
          - timeUnit
          - showCopyReady

    - name: aboutAnalysis
      title: "About This Analysis"
      type: Html
      visible: (showAbout)
      clearWith: []

refs:
    - ClinicoPathJamoviModule
    - ggswim
...
