      type:  Html
      visible: (vars)
      clearWith:
          - vars
          - distr
          - decimal_places

    - name:  text1
      title: 'Continuous Data Plots'
      type:  Html
      visible: (vars)
      clearWith:
          - vars
          - decimal_places

    - name:  clinicalInterpretation
