---
name: nogoldstandard
title: Analysis Without Gold Standard
menuGroup: meddecide
menuSubgroup: Decision
menuSubtitle: Multiple Test Analysis Without Gold Standard
version: '1.1.2'
jas: '1.2'

description:
    main: >
        Analysis of multiple binary tests when no perfect reference exists. Implements a
        conditional-independence two-class latent class model, fixed-prior penalized EM point
        estimation with numerical refinement, and descriptive agreement with self-built reference rules.
        Latent classes are unlabeled, and reference-rule results are not diagnostic-accuracy estimates.

options:
    - name: data
      type: Data
      description:
          R: The data as a data frame.

    - name: clinicalPreset
      title: Illustrative scenario example
      type: List
      options:
        - name: none
          title: No example
        - name: diagnostic_validation
          title: Diagnostic Test Validation (example)
        - name: pathology_agreement
          title: Pathologist Agreement (example)
        - name: tumor_markers
          title: Tumor Marker Evaluation (example)
        - name: screening_evaluation
          title: Screening Test Assessment (example)
      default: none
      description:
          R: >
            Illustrative scenario examples only. They do not change analysis settings and
            are not clinical guides, validated recommendations, or substitutes for a
            study-specific analysis plan.

    - name: test1
      title: Test 1
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            First diagnostic test variable.

    # allowNone: without it the jamovi client pre-selects levels[0] -- usually the
    # NEGATIVE level (neg/pos, Benign/Malignant, 0/1) -- and every test runs reversed.
    - name: test1Positive
      title: Positive level
      type: Level
      variable: (test1)
      allowNone: true
      description:
          R: >
            The positive level for Test 1.

    - name: test2
      title: Test 2
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Second diagnostic test variable.

    - name: test2Positive
      title: Positive level
      type: Level
      variable: (test2)
      allowNone: true
      description:
          R: >
            The positive level for Test 2.

    - name: test3
      title: Test 3
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Third diagnostic test variable (optional).
      default: NULL

    - name: test3Positive
      title: Positive level
      type: Level
      variable: (test3)
      allowNone: true
      description:
          R: >
            The positive level for Test 3.

    - name: test4
      title: Test 4
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Fourth diagnostic test variable (optional).
      default: NULL


    - name: test4Positive
      title: Positive level
      type: Level
      variable: (test4)
      allowNone: true
      description:
          R: >
            The positive level for Test 4.

    - name: test5
      title: Test 5
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Fifth diagnostic test variable (optional).
      default: NULL


    - name: test5Positive
      title: Positive level
      type: Level
      variable: (test5)
      allowNone: true
      description:
          R: >
            The positive level for Test 5.

    - name: method
      title: Analysis method
      type: List
      options:
        - title: Latent Class Analysis
          name: latent_class
        - title: Composite Reference (strict majority)
          name: composite
        - title: All Tests Positive
          name: all_positive
        - title: Any Test Positive
          name: any_positive
        - title: Penalized EM (MAP-like; fixed priors; 3+ tests)
          name: bayesian
      # BEHAVIOUR CHANGE (1.0.4): the default was `all_positive`, which defines the
      # reference standard as "every test positive" and therefore fixes sensitivity and NPV
      # at 100% for every test on every dataset -- it cannot estimate accuracy at all.
      # `latent_class` is the only method here that estimates sensitivity and specificity
      # without building the reference out of the tests themselves. It requires 3+ tests and
      # says so; with 2 tests no method in this analysis can estimate accuracy.
      default: latent_class
      description:
          R: >
            Method for analyzing tests without a gold standard. Composite Reference uses
            a strict majority (more than half positive); ties with an even number of tests
            are classified as rule negative.

    - name: bootstrap
      title: Bootstrap CI
      type: Bool
      default: false
      description:
          R: >
            Calculate case-resampling percentile confidence intervals. For latent-class
            and penalized-EM models, confidence intervals are reported only when this
            option is enabled because ordinary binomial intervals do not account for
            latent-variable estimation. Latent intervals require a converged, reportable
            full-sample fit and at least 20 finite estimates for each interval. Coverage is
            approximate and may be poor with small samples, boundaries or weak identification;
            case resampling assumes independent rows.

    - name: nboot
      title: Number of bootstrap samples
      # Integer: a fractional Number reached sprintf("%d", nboot) and aborted the run.
      type: Integer
      default: 1000
      min: 100
      max: 10000
      description:
          R: >
            Number of bootstrap samples for confidence intervals.

    - name: alpha
      title: Alpha for confidence intervals
      type: Number
      default: 0.05
      min: 0.01
      max: 0.20
      description:
          R: >
            Alpha level for confidence intervals.

    - name: verbose
      title: Analysis diagnostics
      type: Bool
      default: false
      description:
          R: >
            Show detailed analysis diagnostics, including convergence, random starts,
            exclusions, and bootstrap failures when bootstrap intervals are enabled.

    - name: seed
      title: Random seed
      type: Integer
      default: 0
      description:
          R: >
            Base random seed for the reproducible latent-class multi-start search and
            bootstrap resampling.
            Each start is offset from this base, so changing it shifts the whole
            reproducible sequence; the default (0) reproduces the previous behavior.

    - name: showSummary
      title: Plain-language summary
      type: Bool
      default: false
      description:
          R: >
            Show an optional plain-language summary. The summary describes the fitted
            quantities and their assumptions; it is not clinical guidance.

    - name: showMethodGuide
      title: Method guide
      type: Bool
      default: false
      description:
          R: >
            Show an optional educational guide to the available methods. The scenarios
            are illustrative examples, not clinical guides or validated recommendations.

...
