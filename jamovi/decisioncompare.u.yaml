jus: '3.0'
title: Compare Medical Decision Tests
name: decisioncompare

stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Reference / Comparator
        children:
          - type: VariablesListBox
            name: gold
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: goldPositive
            enable: (gold)
          - type: LevelSelector
            name: goldNegative
            enable: (gold)
      - type: TargetLayoutBox
        label: Test 1
        children:
          - type: VariablesListBox
            name: test1
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test1Positive
            enable: (test1)
          - type: LevelSelector
            name: test1Negative
            enable: (test1)
      - type: TargetLayoutBox
        label: Test 2
        children:
          - type: VariablesListBox
            name: test2
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test2Positive
            enable: (test2)
          - type: LevelSelector
            name: test2Negative
            enable: (test2)
      - type: TargetLayoutBox
        label: Test 3
        children:
          - type: VariablesListBox
            name: test3
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test3Positive
            enable: (test3)
          - type: LevelSelector
            name: test3Negative
            enable: (test3)
      - type: TargetLayoutBox
        label: Stratification (Optional)
        children:
          - type: VariablesListBox
            name: stratify
            maxItemCount: 1
            isTarget: true
  - type: Label
    label: Select exact positive and negative levels. Recode ordinal cutoffs before analysis.
    children:
      - type: CheckBox
        name: excludeIndeterminate
  - type: CollapseBox
    label: Reference Interpretation
    collapsed: false
    children:
      - type: ComboBox
        name: referenceType
      - type: TextBox
        name: referenceDescription
        format: string
      - type: TextBox
        name: targetDefinition
        format: string
  - type: CollapseBox
    label: Statistical Options
    collapsed: true
    children:
      - type: CheckBox
        name: ci
        enable: (!pp || ci || referenceType:consensus || referenceType:method)
      - type: CheckBox
        name: opa
        enable: (referenceType:legacy || referenceType:disease)
      - type: CheckBox
        name: useOpaCriterion
        enable: ((opa) && (referenceType:legacy || referenceType:disease))
      - type: TextBox
        name: niMargin
        label: Minimum acceptable OPA (%)
        format: number
        enable: ((opa && useOpaCriterion) && (referenceType:legacy || referenceType:disease))
      - type: ComboBox
        name: ciMethod
        enable: ((opa) && (referenceType:legacy || referenceType:disease))
      - type: CheckBox
        name: statComp
      - type: ComboBox
        name: mcnemarMethod
        enable: (statComp)
  - type: CollapseBox
    label: Prevalence Settings
    collapsed: true
    children:
      - type: CheckBox
        name: pp
        enable: ((!ci || pp) && (referenceType:legacy || referenceType:disease))
      - type: TextBox
        name: pprob
        label: Prior Probability
        format: number
        enable: ((pp) && (referenceType:legacy || referenceType:disease))
  - type: CollapseBox
    label: Visualizations
    collapsed: true
    children:
      - type: CheckBox
        name: plot
      - type: CheckBox
        name: radarplot
      - type: CheckBox
        name: heatmap
  - type: CollapseBox
    label: Display Options
    collapsed: true
    children:
      - type: CheckBox
        name: od
        enable: (referenceType:legacy || referenceType:disease)
      - type: CheckBox
        name: fnote
        enable: (referenceType:legacy || referenceType:disease)
      - type: CheckBox
        name: showSummary
        enable: ((statComp) && (referenceType:legacy || referenceType:disease))
      - type: CheckBox
        name: showExplanations
        enable: (referenceType:legacy || referenceType:disease)
      - type: CheckBox
        name: showReportSentence
        enable: ((statComp) && (referenceType:legacy || referenceType:disease))
      - type: CheckBox
        name: showDescriptiveReport
        enable: (referenceType:legacy || referenceType:disease)

  - type: CollapseBox
    label: Validation Provenance
    collapsed: true
    children:
    - type: CheckBox
      name: showValidationContext
    - type: TextBox
      name: cohortRole
      format: string
      enable: (showValidationContext)
    - type: TextBox
      name: samplingDesign
      format: string
      enable: (showValidationContext)
    - type: TextBox
      name: thresholdSource
      format: string
      enable: (showValidationContext)
    - type: TextBox
      name: modelVersion
      format: string
      enable: (showValidationContext)
    - type: TextBox
      name: analysisUnit
      format: string
      enable: (showValidationContext)
