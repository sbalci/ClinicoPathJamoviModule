---
name: diagnosticsamplesize
title: Diagnostic Test Sample Size Calculator
menuGroup: meddecideExtraD
menuSubgroup: Sample Size Planning
menuTitle: Diagnostic Sample Size (CI Width)
menuSubtitle: Clopper-Pearson precision-based planning (Bujang 2023)
version: '1.0.0'
jas: '1.2'

options:
    - name: referenceType
      title: Reference interpretation
      type: List
      options:
        - name: disease
          title: Disease reference standard
        - name: consensus
          title: Expert consensus (agreement)
        - name: method
          title: Comparison method (agreement)
      default: disease

    - name: study_purpose
      title: Study Purpose
      type: List
      options:
        - name: diagnostic
          title: Both reference strata
        - name: screening_sens
          title: Positive reference stratum only
        - name: screening_spec
          title: Negative reference stratum only
      default: diagnostic

    - name: target_sensitivity
      title: Target sensitivity / PPA
      type: Number
      min: 0.50
      max: 0.99
      default: 0.90

    - name: target_specificity
      title: Target specificity / NPA
      type: Number
      min: 0.50
      max: 0.99
      default: 0.90

    - name: prevalence
      title: Reference-positive proportion
      type: Number
      min: 0.000000001
      max: 0.999999999
      default: 0.10

    - name: ci_width
      title: Desired confidence interval width
      type: Number
      min: 0.05
      max: 0.30
      default: 0.10

    - name: alpha
      title: Significance Level
      type: Number
      min: 0.01
      max: 0.10
      default: 0.05

    - name: nonresponse_rate
      title: Non-Response Rate ( percent)
      type: Number
      min: 0
      max: 50
      default: 0

    - name: show_statement
      title: Generate Sample Size Statement
      type: Bool
      default: true

    - name: show_methodology
      title: Show Methodology
      type: Bool
      default: true

    - name: show_references
      title: Show References
      type: Bool
      default: false

    - name: show_comparison_table
      title: Comparison of reference-positive proportions
      type: Bool
      default: false

    - name: comparison_prevalences
      title: Reference-positive proportions to compare
      type: String
      default: "0.05, 0.10, 0.20, 0.30, 0.50"

    - name: show_method_comparison
      title: Show CI Method Comparison
      type: Bool
      default: false

    - name: zeroMissPlanning
      title: Plan independent positives assuming zero misses
      type: Bool
      default: false
    - name: minimumSensitivityBound
      title: Required lower sensitivity / PPA confidence bound
      type: Number
      default: 0.95
      min: 0.5
      max: 0.999999
