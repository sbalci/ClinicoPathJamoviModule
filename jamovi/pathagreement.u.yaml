title: Pathology Interrater Reliability
name: pathagreement
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Rater variables (required)
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
            itemDropBehaviour: emptyspace
      - type: TargetLayoutBox
        label: Case ID variable (optional)
        children:
          - type: VariablesListBox
            name: caseID
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Trend sequence variable (optional)
        children:
          - type: VariablesListBox
            name: sequenceVariable
            maxItemCount: 1
            isTarget: true
            enable: (agreementTrendAnalysis)
  - type: CollapseBox
    label: 'Step 1: Core agreement analysis'
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Statistical method selection
          - type: ComboBox
            name: multiraterMethod
            label: Primary analysis method
            options:
              - title: Automatic (recommended for most users)
                name: auto
              - title: Cohen's Kappa (exactly 2 raters)
                name: cohen
              - title: Fleiss' Kappa (3 or more raters)
                name: fleiss
              - title: Krippendorff's Alpha (universal method)
                name: krippendorff
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Data type and weighting
          - type: ComboBox
            name: wght
            label: Weighting scheme
            options:
              - title: Unweighted (nominal/categorical data)
                name: unweighted
              - title: Linear Weighted (ordinal data, equal steps)
                name: equal
              - title: Quadratic Weighted (ordinal data, penalize distant errors)
                name: squared
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Statistical options
          - type: CheckBox
            name: fleissCI
            label: Confidence intervals (recommended)
          - type: CheckBox
            name: exct
            label: Conger's exact kappa (rater-specific marginals)
  - type: CollapseBox
    label: 'Step 2: Clinical output and interpretation'
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Clinical reports
          - type: CheckBox
            name: showClinicalSummary
            label: Clinical summary
          - type: CheckBox
            name: sft
            label: Frequency tables for each rater
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Educational content
          - type: CheckBox
            name: showAboutAnalysis
            label: About this analysis
          - type: CheckBox
            name: showAssumptions
            label: Assumptions and caveats
          - type: CheckBox
            name: showStatisticalGlossary
            label: Glossary of statistical terms
          - type: CheckBox
            name: showWeightedKappaGuide
            label: Weighted kappa guide
            enable: (wght != 'unweighted')
  - type: CollapseBox
    label: 'Step 3: Visualization (optional)'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Agreement visualization
          - type: CheckBox
            name: heatmap
            label: Agreement heatmap
          - type: CheckBox
            name: heatmapDetails
            label: Statistical details in heatmap
            enable: (heatmap)
          - type: ComboBox
            name: heatmapTheme
            label: Color theme
            enable: (heatmap)
            options:
              - title: Viridis (colorblind-safe, recommended)
                name: viridis
              - title: Plasma (colorblind-safe)
                name: plasma
              - title: Cividis (colorblind-safe)
                name: cividis
              - title: Blue-White-Red
                name: bwr
              - title: Red-Yellow-Green (classic)
                name: ryg
  - type: CollapseBox
    label: 'Advanced: Consensus analysis'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: consensus
            label: Consensus scoring
          - type: ComboBox
            name: consensus_method
            label: Consensus threshold
            enable: (consensus)
            options:
              - title: Simple Majority (>50% agreement)
                name: majority
              - title: Supermajority (>=67% agreement)
                name: super_majority
              - title: Unanimous Agreement (100%)
                name: unanimous
          - type: ComboBox
            name: tie_breaking
            label: Handle ties by
            enable: (consensus)
            options:
              - title: Excluding tied cases from analysis
                name: exclude
              - title: Flagging for expert arbitration
                name: arbitration
              - title: Using global most frequent category
                name: global_mode
          - type: CheckBox
            name: show_consensus_table
            label: Case-by-case consensus results
            enable: (consensus)
  - type: CollapseBox
    label: 'Advanced: Statistical methods (Krippendorff, ICC, Gwet, etc.)'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Alternative agreement coefficients
          - type: CheckBox
            name: kripp
            label: Krippendorff's alpha (allows partial ratings)
          - type: ComboBox
            name: krippMethod
            label: Data measurement level
            enable: (kripp)
            options:
              - title: Nominal (unordered categories)
                name: nominal
              - title: Ordinal (ranked categories)
                name: ordinal
              - title: Interval (equal intervals)
                name: interval
              - title: Ratio (true zero point)
                name: ratio
          - type: CheckBox
            name: icc
            label: Intraclass correlation coefficient (ICC)
          - type: CheckBox
            name: gwetAC
            label: Gwet's AC1/AC2 coefficients (prevalence-robust)
          - type: CheckBox
            name: pabak
            label: PABAK (prevalence- and bias-adjusted kappa)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Bootstrap analysis
          - type: CheckBox
            name: bootstrap
            label: Bootstrap confidence intervals
          - type: TextBox
            name: bootstrapSamples
            label: Bootstrap samples (100-5000)
            enable: (bootstrap || agreementStabilityAnalysis)
            format: number
          - type: TextBox
            name: seed
            label: Random seed
            enable: (bootstrap || agreementStabilityAnalysis)
            format: number
          - type: ComboBox
            name: bootstrapCIType
            label: Interval method
            enable: (bootstrap || agreementStabilityAnalysis)
            options:
              - title: Bias-corrected and accelerated (BCa)
                name: bca
              - title: Percentile
                name: percentile
  - type: CollapseBox
    label: 'Advanced: Diagnostic style clustering (Usubutun method)'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: >
              Identify diagnostic style groups (e.g., conservative vs.
              aggressive)

              among raters based on their diagnosis patterns.


              Reference: Usubutun et al. (2012) Modern Pathology 25:877-884
          - type: CheckBox
            name: performClustering
            label: Rater clustering (diagnostic styles)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Clustering settings
          - type: ComboBox
            name: clusteringMethod
            label: Linkage method
            enable: (performClustering)
            options:
              - title: Ward's method (minimize variance, recommended)
                name: ward
              - title: Complete linkage (furthest neighbor)
                name: complete
              - title: Average linkage (mean distance)
                name: average
              - title: Single linkage (nearest neighbor)
                name: single
          - type: ComboBox
            name: styleDistanceMetric
            label: Distance metric
            enable: (performClustering)
            options:
              - title: Percentage Agreement (recommended)
                name: agreement
              - title: Correlation
                name: correlation
              - title: Euclidean Distance
                name: euclidean
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Number of style groups
          - type: CheckBox
            name: autoSelectGroups
            label: Choose the number of groups automatically (silhouette)
            enable: (performClustering)
          - type: TextBox
            name: nStyleGroups
            label: Number of groups (if manual, 2-10)
            format: number
            enable: (performClustering && !autoSelectGroups)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Discordant case analysis
          - type: CheckBox
            name: identifyDiscordant
            label: High-disagreement cases
            enable: (performClustering)
          - type: TextBox
            name: discordantThreshold
            label: Disagreement threshold (0.2-0.8)
            format: number
            enable: (performClustering && identifyDiscordant)
          - type: CheckBox
            name: identifyDiscordantCases
            label: Cases distinguishing diagnostic styles
            enable: (performClustering)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Visualization
          - type: CheckBox
            name: showClusteringHeatmap
            label: Clustering heatmap
            enable: (performClustering)
          - type: ComboBox
            name: heatmapColorScheme
            label: Heatmap color scheme
            enable: (performClustering && showClusteringHeatmap)
            options:
              - title: Diagnostic categories (blue-green-gold)
                name: diagnostic
              - title: Viridis (colorblind-safe)
                name: viridis
              - title: Red-Yellow-Blue (diverging)
                name: RdYlBu
          - type: CheckBox
            name: showClusteringInterpretation
            label: Clustering interpretation guide
            enable: (performClustering)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Rater characteristics (optional, for association testing)
          - type: CheckBox
            name: raterCharacteristics
            label: Association with rater characteristics
            enable: (performClustering)
          - type: Label
            label: Rater characteristics are read from META_ rows in the dataset (see guide below).
          - type: CheckBox
            name: useMetadataRows
            label: Metadata rows in the dataset (see guide below)
            enable: (performClustering && raterCharacteristics)
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Reference/expert standard (optional)
            children:
              - type: VariablesListBox
                name: referenceStandard
                maxItemCount: 1
                isTarget: true
                enable: (performClustering || categoryAnalysis || pathologyContext)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: >
              Metadata Rows Method Guide:


              If you checked "Use metadata rows" above, your dataset should
              include special rows:


              1. Add rows at the bottom of your data

              2. Set case_id to: META_experience, META_specialty,
                 META_institution, or META_volume
              3. Fill rater columns with corresponding values


              Example:

              case_id          | Rater_A | Rater_B | Rater_C

              1                | EIN     | Benign  | EIN

              2                | Benign  | Benign  | Adenoca

              META_experience  | 25      | 13      | 8

              META_specialty   | GYN     | GYN     | GEN
  - type: CollapseBox
    label: 'Advanced: Detailed analysis (pairwise, bias, trends)'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Rater-level analysis
          - type: CheckBox
            name: pairwiseAnalysis
            label: Pairwise rater comparisons
          - type: CheckBox
            name: raterBiasAnalysis
            label: Rater disagreement with consensus
          - type: CheckBox
            name: agreementTrendAnalysis
            label: Agreement trend over case sequence
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Case-level analysis
          - type: CheckBox
            name: categoryAnalysis
            label: Category-specific agreement
          - type: CheckBox
            name: outlierAnalysis
            label: Cases with poor agreement
          - type: CheckBox
            name: caseDifficultyScoring
            label: Case difficulty
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Clinical context analysis
          - type: CheckBox
            name: pathologyContext
            label: Diagnostic accuracy metrics (requires reference standard)
          - type: CheckBox
            name: agreementStabilityAnalysis
            label: Agreement stability (bootstrap)
  - type: CollapseBox
    label: 'Planning: Study design and sample size'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: sampleSizePlanning
            label: Sample size planning
          - type: TextBox
            name: targetKappa
            label: Target kappa value (0.02-0.98)
            format: number
            enable: (sampleSizePlanning)
          - type: TextBox
            name: targetPrecision
            label: Target precision (95% CI half-width, e.g., 0.1)
            format: number
            enable: (sampleSizePlanning)
  - type: CollapseBox
    label: 'Technical: System options'
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Additional output
          - type: CheckBox
            name: showInlineComments
            label: Inline statistical comments
