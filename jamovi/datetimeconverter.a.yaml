---
name: datetimeconverter
title: DateTime Converter
menuGroup: Survival
menuSubgroup: Data Preparation
menuSubtitle: Convert datetime and extract components
version: '1.0.8'
jas: '1.2'

description:
    main: >-
        Convert datetime variables to standardized format and extract datetime components
        (year, month, day, hour, minute, day name, week number, quarter, etc.).
        Features automatic format detection, quality assessment, and preview of converted data.
        Perfect for preparing datetime data for analysis and creating time-based variables.
        
    # R:
    #     dontrun: true
    #     usage: |
    #         # Convert a character date column to standardized datetime:
    #         datetimeconverter(
    #           data = histopathology,
    #           datetime_var = "SurgeryDate",
    #           datetime_format = "ymdhms"
    #         )

    #         # Extract datetime components:
    #         datetimeconverter(
    #           data = histopathology,
    #           datetime_var = "SurgeryDate",
    #           datetime_format = "ymdhms",
    #           extract_year = TRUE,
    #           extract_month = TRUE,
    #           extract_dayname = TRUE
    #         )

options:
    # === CORE DATA INPUT ===
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame containing datetime variable to convert.

    # === DATETIME VARIABLE ===
    - name: datetime_var
      title: DateTime Variable
      type: Variable
      default: null
      suggested:
        - continuous
        - nominal
      permitted:
        - factor
        - numeric
      description:
          R: >
            Variable containing datetime information in various formats.
            Can handle character strings, numeric values, or factors with datetime representations.

    # === FORMAT CONFIGURATION ===
    - name: datetime_format
      title: DateTime Format
      type: List
      options:
        - name: auto
          title: Auto-detect Format
        - name: excel_serial
          title: Excel Serial (Days since 1900)
        - name: excel_serial_1904
          title: Excel Serial (Days since 1904, legacy Mac)
        - name: unix_epoch
          title: Unix Epoch (Seconds since 1970)
        - name: ymdhms
          title: YYYY-MM-DD HH:MM:SS
        - name: ymd
          title: YYYY-MM-DD
        - name: dmy
          title: DD-MM-YYYY (or DD/MM/YYYY)
        - name: mdy
          title: MM-DD-YYYY (or MM/DD/YYYY)
        - name: dmyhms
          title: DD-MM-YYYY HH:MM:SS
        - name: mdyhms
          title: MM-DD-YYYY HH:MM:SS
        - name: dmyhm
          title: DD-MM-YYYY HH:MM
        - name: mdyhm
          title: MM-DD-YYYY HH:MM
        - name: ymdhm
          title: YYYY-MM-DD HH:MM
        - name: ydm
          title: YYYY-DD-MM
        - name: myd
          title: MM-YYYY-DD
        - name: dym
          title: DD-YYYY-MM
      default: auto
      description:
          R: >
            DateTime format specification. 'Auto-detect' attempts to identify the format automatically
            and warns when day-first and month-first parsing both succeed but disagree; manual selection
            ensures accurate parsing for specific datetime formats. Excel serial numbers use the 1899-12-30
            origin, which is exact for dates from 1900-03-01 onward (Excel's 1900 system wrongly counts a
            29 February 1900). A serial number does not record which epoch produced it, so auto-detection
            assumes the 1900 system (the default in Windows Excel and in Mac Excel 2011 and later) and
            discloses that assumption. Choose 'excel_serial_1904' for files exported from Mac Excel 2008
            or earlier; the same number is 1462 days later under that system.

    - name: two_digit_year
      title: Two-digit years
      type: List
      options:
        - name: standard
          title: 1969-2068 (standard pivot)
        - name: past
          title: Always in the past
      default: standard
      description:
          R: >
            How to read a two-digit year. The standard pivot maps 00-68 to 2000-2068 and
            69-99 to 1969-1999, so a date of birth written 14/04/55 becomes 1955 but
            04/12/37 becomes 2037 rather than 1937. Choose 'Always in the past' for
            columns that cannot contain future dates - dates of birth, diagnosis dates,
            specimen dates - and any date that would land after today is moved back one
            century. Columns with four-digit years are unaffected by this setting.

    - name: timezone
      title: Timezone
      type: String
      default: "system"
      description:
          R: >
            Timezone for datetime parsing. Provide an Olson identifier such as "Europe/Istanbul",
            "America/New_York", "UTC", or "system" to use the local machine timezone. Excel serial
            and Unix epoch conversions always use UTC regardless of this setting.

    # === PREVIEW OPTIONS ===
    - name: preview_rows
      title: Number of Rows to Preview
      type: Number
      min: 10
      max: 100
      default: 20
      description:
          R: >
            Number of rows to display in preview tables. Shows original values,
            corrected datetimes, and extracted components for quality checking.

    # === EXTRACTION OPTIONS (for preview) ===
    - name: extract_year
      title: Year
      type: Bool
      default: false
      description:
          R: >
            Extract and display year component in preview table.

    - name: extract_month
      title: Month
      type: Bool
      default: false
      description:
          R: >
            Extract and display month component in preview table.

    - name: extract_monthname
      title: Month name
      type: Bool
      default: false
      description:
          R: >
            Extract and display month name in preview table.

    - name: extract_day
      title: Day
      type: Bool
      default: false
      description:
          R: >
            Extract and display day component in preview table.

    - name: extract_hour
      title: Hour
      type: Bool
      default: false
      description:
          R: >
            Extract and display hour component in preview table.

    - name: extract_minute
      title: Minute
      type: Bool
      default: false
      description:
          R: >
            Extract and display minute component in preview table.

    - name: extract_second
      title: Second
      type: Bool
      default: false
      description:
          R: >
            Extract and display second component in preview table.

    - name: extract_dayname
      title: Day name
      type: Bool
      default: false
      description:
          R: >
            Extract and display day name in preview table.

    - name: extract_weeknum
      title: Week number (Jan-1 blocks, not ISO)
      type: Bool
      default: false
      description:
          R: >
            Extract and display week number in preview table. This is lubridate::week()
            (day-of-year divided into 7-day blocks starting 1 January), NOT the ISO-8601
            week. The two differ around the new year: 2021-01-01 is week 1 here and
            ISO week 53 of 2020.

    - name: extract_quarter
      title: Quarter
      type: Bool
      default: false
      description:
          R: >
            Extract and display quarter in preview table.

    - name: extract_dayofyear
      title: Day of year
      type: Bool
      default: false
      description:
          R: >
            Extract and display day of year in preview table.

    # === DISPLAY OPTIONS ===
    - name: show_quality_metrics
      title: Data quality assessment
      type: Bool
      default: false
      description:
          R: >
            Display comprehensive quality metrics including parsing success rate,
            invalid dates, and data quality warnings.

    - name: show_summary
      title: Natural-language summary
      type: Bool
      default: false
      description:
          R: >
            Generate a plain-language summary suitable for copying into reports
            or clinical documentation.

    - name: show_explanations
      title: Explanatory notes
      type: Bool
      default: false
      description:
          R: >
            Display educational content explaining what this function does,
            when to use it, and how to interpret results.

    - name: show_glossary
      title: Glossary of terms
      type: Bool
      default: false
      description:
          R: >
            Display definitions of datetime-related terms (Excel serial dates,
            Unix epoch, timezones, etc.) to aid interpretation.

    # === OUTPUT OPTIONS (add to data) ===
    - name: corrected_datetime_char
      title: Corrected datetime (text)
      type: Output
      description:
          R: >
            Appends the corrected datetime as a human-readable text variable.

    - name: corrected_datetime_numeric
      title: Corrected datetime (numeric)
      type: Output
      description:
          R: >
            Appends the corrected datetime as a numeric variable (Unix epoch seconds since 1970-01-01 00:00:00 UTC).
            The number identifies an instant, so it is OS-independent and well suited to calculations,
            comparisons, and plotting. It is NOT independent of the Timezone option: a date without a time is
            midnight in the selected timezone, so "2024-01-15" becomes 1705276800 under UTC but 1705266000 under
            Europe/Istanbul. The default timezone is the local machine's, so the same file converted on two
            machines can yield different numbers. Set Timezone to UTC when the value must be reproducible across
            machines or compared against an external source. Differences between two dates converted in the same
            session are unaffected, except across a daylight-saving transition (up to one hour).

    # === COMPONENT EXTRACTION ===
    - name: year_out
      title: Year
      type: Output
      description:
          R: >
            Add extracted year component (YYYY format, e.g., 2024) as new column to data.

    - name: month_out
      title: Month number
      type: Output
      description:
          R: >
            Extract month as numeric value (1-12).

    - name: monthname_out
      title: Month name
      type: Output
      description:
          R: >
            Extract month as text name (January, February, etc.).

    - name: day_out
      title: Day of month
      type: Output
      description:
          R: >
            Extract day of month (1-31).

    - name: hour_out
      title: Hour
      type: Output
      description:
          R: >
            Extract hour component (0-23, 24-hour format).

    - name: minute_out
      title: Minute
      type: Output
      description:
          R: >
            Extract minute component (0-59).

    - name: second_out
      title: Second
      type: Output
      description:
          R: >
            Extract second component (0-59).

    - name: dayname_out
      title: Day name
      type: Output
      description:
          R: >
            Extract day of week as text name (Monday, Tuesday, etc.).

    - name: weeknum_out
      title: Week number (Jan-1 blocks, not ISO)
      type: Output
      description:
          R: >
            Extract week number of the year (1-53), computed with lubridate::week():
            the day of year divided into 7-day blocks counting from 1 January. This is
            NOT the ISO-8601 week and not the MMWR/epidemiological week; those differ
            around the turn of the year (2021-01-01 is week 1 here, ISO week 53 of 2020).
            Use ISO or epi weeks if your reporting standard requires them.

    - name: quarter_out
      title: Quarter
      type: Output
      description:
          R: >
            Extract quarter of the year (1-4).

    - name: dayofyear_out
      title: Day of year
      type: Output
      description:
          R: >
            Extract day of year (1-366).

...
