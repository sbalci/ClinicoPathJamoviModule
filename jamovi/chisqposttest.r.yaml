---
name:  chisqposttest
title: Chi-Square Post-Hoc Tests
jrs:   '1.1'

items:
    - name:  todo
      title: To Do
      type:  Html
      clearWith:
          - rows
          - cols

    - name:  notices
      title: Important Information
      type:  Preformatted
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig

    - name:  chisqTable
      title: Chi-Square Test Results
      type:  Table
      rows:  1
      columns:
        - name: stat
          title: "Statistic"
          type: text
        - name: value
          title: "Value"
          type: number
        - name: df
          title: "df"
          type: integer
        - name: p
          title: "p-value"
          type: number
          format: zto,pvalue
      clearWith:
          - rows
          - cols
          - counts
          - excl

    - name:  assumptionsCheck
      title: 'Assumptions Validation'
      type:  Html
      visible: (showAssumptionsCheck)
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - showAssumptionsCheck

    - name:  clinicalSummary
      title: 'Clinical Summary'
      type:  Html
      visible: (showClinicalSummary)
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - posthoc
          - testSelection
          - showClinicalSummary
          
    - name:  educationalOverview
      title: 'Analysis Guide'
      type:  Html
      visible: (showEducational)
      clearWith:
          - rows
          - cols
          - showEducational

    - name:  weightedDataInfo
      title: 'Weighted Data Information'
      type:  Html
      visible: (counts)
      clearWith:
          - rows
          - cols
          - counts

    - name:  contingencyTable
      title: 'Contingency Table'
      type:  Html
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - exp

    - name:  residualsGuidance
      title: 'Residuals Interpretation Guidance'
      type:  Html
      visible: (showResiduals)
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - showResiduals
          - residualsCriterion
          - residualsCutoff

    - name:  residualsAnalysis
      title: 'Adjusted Standardized Residuals'
      type:  Html
      visible: (showResiduals)
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - showResiduals
          - residualsCriterion
          - residualsCutoff

    - name:  multipleTestingInfo
      title: 'Multiple Testing Information'
      type:  Html
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - posthoc
          - sig
          - testSelection
          - showEducational

    - name:  posthocTable
      title: 'Pairwise Comparison Results'
      type:  Table
      visible: (posthoc:bonferroni || posthoc:holm || posthoc:fdr)
      columns:
        - name: comparison
          title: "Comparison"
          type: text
        - name: test_method
          title: "Test Method"
          type: text
        - name: chi
          title: "Chi-Square"
          type: number
        - name: p
          title: "p-value"
          type: number
          format: zto,pvalue
        - name: padj
          title: "Adj. p-value"
          type: number
          format: zto,pvalue
        - name: effect_size
          title: "Effect Size (Phi/V)"
          type: number
        - name: phi_ci
          title: "Bootstrap 95% CI (Cramer's V)"
          type: text
        - name: sig
          title: "Significant"
          type: text
      clearWith:
          - rows
          - cols
          - counts
          - posthoc
          - sig
          - excl
          - testSelection
          - phiCI

    - name:  detailedComparisons
      title: 'Detailed Pairwise Comparison Tables'
      type:  Html
      visible: (showDetailedTables)
      clearWith:
          - rows
          - cols
          - counts
          - posthoc
          - sig
          - excl
          - showDetailedTables
          - testSelection

    - name:  exportTable
      title: 'Exported Results'
      type:  Table
      visible: (exportResults)
      columns:
        - name: category
          title: "Category"
          type: text
        - name: measure
          title: "Measure"
          type: text
        - name: value
          title: "Value"
          type: text
        - name: interpretation
          title: "Interpretation"
          type: text
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - posthoc
          - sig
          - testSelection
          - showResiduals
          - residualsCriterion
          - residualsCutoff
          - exportResults

    - name:  reportSentences
      title: 'Report-Ready Sentences'
      type:  Html
      visible: (copyReadySentences)
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - copyReadySentences
          
    - name:  glossaryPanel
      title: 'Statistical Glossary'
      type:  Html
      visible: (showGlossary)
      clearWith:
          - showGlossary

    - name:  plot
      title: 'Adjusted Standardized Residuals'
      type:  Image
      width: 600
      height: 400
      renderFun: .plot
      visible: (plot)
      requiresData: true
      clearWith:
          - rows
          - cols
          - counts
          - excl
          - sig
          - residualsCriterion
          - residualsCutoff

refs:
    - Cohen1988
    - ClinicoPathJamoviModule
    - chisq.posthoc.test
    - agresti2013
    - sharpe2015
    - holm1979
    - benjaminihochberg1995

...
