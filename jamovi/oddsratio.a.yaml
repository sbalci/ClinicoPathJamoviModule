---
name:  oddsratio
title: Odds Ratio Table and Plot
menuGroup: Survival
menuSubgroup: General Statistics
menuSubtitle: 'Odds Ratio for Binary Outcomes'
version: '1.1.1'
jas: '1.2'

description:
    main: Logistic regression odds-ratio table, forest plot, prediction nomogram, and optional binary diagnostic metrics.

    # R:
    #     dontrun: true
    #     usage: |
    #         # Odds ratio analysis with a binary outcome:
    #         oddsratio(
    #             data = histopathology,
    #             explanatory = c("New Test", "Rater 1"),
    #             outcome = "Golden Standart",
    #             outcomeLevel = "1",
    #             predictorLevel = NULL
    #         )
            
    #         # Advanced usage (nomogram, multiple predictors) - shown for reference:
    #         # oddsratio(
    #         #     data = histopathology,
    #         #     explanatory = c("New Test", "Rater 1", "Rater 2"),
    #         #     outcome = "Golden Standart",
    #         #     outcomeLevel = "1",
    #         #     predictorLevel = NULL,
    #         #     showNomogram = TRUE,
    #         #     showExplanations = TRUE
    #         # )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: explanatory
      title: Explanatory Variables
      type: Variables
      default: null
      suggested: [ nominal, continuous ]
      permitted: [ factor, numeric ]
      description:
          main: >
              The explanatory variables to be used in the analysis.
          R: >
              The explanatory variables to be used in the analysis.

    - name: outcome
      title: Binary Outcome
      type: Variable
      default: null
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          main: >
              The outcome variable to be used in the analysis.
          R: >
              The outcome variable to be used in the analysis.

    # allowNone: without it the jamovi client pre-fills levels[0], so the first level - not
    # the one the user means - becomes the event. Empty is handled below, never inferred.
    - name: outcomeLevel
      title: Positive Level
      type: Level
      variable: (outcome)
      allowNone: true
      description:
          main: >
              Specify which outcome level represents the positive case (e.g., "Dead", "Event", "Yes").
              Both Positive and Negative outcome levels must be selected; any other outcome levels are excluded.
          R: >
            Specify which outcome level is modeled as the event in logistic regression and
            used as positive for diagnostic metrics. Both outcomeLevel and outcomeNegativeLevel
            are required; until both are specified the analysis asks for them and computes nothing.
            They are never taken from the order of the levels, and any other levels are excluded.

    - name: outcomeNegativeLevel
      title: Negative Level
      type: Level
      variable: (outcome)
      allowNone: true
      description:
          main: >
              Specify which outcome level represents the negative/reference case (e.g., "Alive", "No Event", "No").
              Both Positive and Negative outcome levels must be selected; any other outcome levels are excluded.
          R: >
            Specify which outcome level is modeled as the non-event (reference, 0) in logistic
            regression and used as negative for diagnostic metrics. Both outcomeLevel and
            outcomeNegativeLevel are required; until both are specified the analysis asks for
            them and computes nothing. Any rows with other outcome levels are excluded with a warning.

    - name: diagnosticPredictor
      title: Diagnostic Predictor (for LRs)
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      default: null
      description:
          main: >
              Choose which categorical predictor to use for the separate, unadjusted sensitivity,
              specificity, and likelihood-ratio calculations. In the jamovi interface, select
              this variable here so the 'Predictor Positive Level' and 'Predictor Negative Level'
              selectors below can list its levels; in R, if left empty, the first explanatory variable is used.
          R: >
              Specify the predictor to drive likelihood ratios. Defaults to the first explanatory variable when predictorLevel and predictorNegativeLevel are supplied in R; in the jamovi GUI, populate this box to enable the Predictor Positive Level selector (and Predictor Negative Level selector).

    - name: predictorLevel
      title: Predictor Positive Level
      type: Level
      variable: (diagnosticPredictor)
      allowNone: true
      description:
          main: >
              Choose which level of the diagnostic predictor is the positive test result
              (e.g., "Present", "Test+", "Yes"). Both Predictor Positive Level and Predictor
              Negative Level must be selected for diagnostic metrics; they are never taken from
              the level names or their order, and any other levels are excluded. While either is
              empty the diagnostic metrics wait for them and list the observed levels, and the
              logistic model, odds ratios, forest plot and nomogram still run.
          R: >
              Which level of the diagnostic predictor is the positive test result. Both
              predictorLevel and predictorNegativeLevel are required for diagnostic metrics
              (sensitivity, specificity, likelihood ratios) and are never taken from the level
              names or their order. Because a Level option cannot declare a default, this is a
              required argument of the R function: predictorLevel = NULL leaves the diagnostic
              metrics waiting for the choice while the logistic model, odds ratios, forest plot
              and nomogram still run.

    - name: predictorNegativeLevel
      title: Predictor Negative Level
      type: Level
      variable: (diagnosticPredictor)
      allowNone: true
      description:
          main: >
              Choose which level of the diagnostic predictor is the negative test result
              (e.g., "Absent", "Test-", "No"). Both Predictor Positive Level and Predictor
              Negative Level must be selected for diagnostic metrics; they are never taken from
              the level names or their order, and any other levels are excluded. While either is
              empty the diagnostic metrics wait for them and list the observed levels, and the
              logistic model, odds ratios, forest plot and nomogram still run.
          R: >
              Which level of the diagnostic predictor is the negative test result. Both
              predictorLevel and predictorNegativeLevel are required for diagnostic metrics
              (sensitivity, specificity, likelihood ratios) and are never taken from the level
              names or their order; any other predictor levels are excluded from the 2x2 table
              with a warning. Because a Level option cannot declare a default, this is a required
              argument of the R function: predictorNegativeLevel = NULL leaves the diagnostic
              metrics waiting for the choice while the logistic model, odds ratios, forest plot
              and nomogram still run.

    - name: usePenalized
      title: Firth penalized logistic regression
      type: Bool
      default: false
      description:
          R: >
              Use Firth penalized likelihood logistic regression. This is recommended
              when there is separation (zero cells), small sample sizes, or low events-per-variable.


# Nomogram ----

    - name: showNomogram
      title: Prediction nomogram and diagnostic metrics
      type: Bool
      default: false
      description:
          R: >
            Display a prediction nomogram from the maximum-likelihood logistic model and,
            when a binary diagnostic predictor is available, separate unadjusted sensitivity,
            specificity, and likelihood-ratio estimates. The prediction nomogram is not
            generated when Firth penalized regression is selected.

    - name: showExplanations
      title: "Educational explanations"
      type: Bool
      default: false
      description:
          R: >
            Display educational explanations for odds ratios, their distinction from risk
            ratios, binary diagnostic-test performance, likelihood ratios, and prediction
            nomograms.



...
