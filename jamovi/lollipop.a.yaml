---
name: lollipop
title: Lollipop Chart
menuGroup: JJStatsPlot
menuSubgroup: Categorical vs Continuous
version: '1.0.8'
jas: '1.2'

description:
    main: Creates lollipop charts for categorical data visualization following R Graph Gallery best practices, with emphasis on clinical applications like patient timelines, treatment outcomes, and biomarker comparisons. Uses geom_segment() and geom_point() for optimal visual presentation.
    # Kept commented, as in the great majority of this module's .a.yaml files:
    # jmvtools renders `dontrun: true` as \donttest{}, which R CMD check RUNS
    # under --run-donttest. The same examples live in the roxygen block of
    # R/lollipop.b.R. They are kept correct here so that uncommenting works:
    # `highlight` is a type: Level option, which can carry no default and is
    # therefore a REQUIRED argument of the generated wrapper - every call must
    # pass it, NULL included.
    # R:
    #     dontrun: true
    #     usage: |
    #         data("clinical_lab_data", package = "ClinicoPath")

    #         # Mean haemoglobin by treatment group, largest first
    #         lollipop(
    #             data = clinical_lab_data,
    #             dep = "hemoglobin",
    #             group = "treatment_group",
    #             highlight = NULL,
    #             sortBy = "value_desc",
    #             title = "Hemoglobin by treatment"
    #         )

    #         # Highlight severe disease, horizontal layout
    #         lollipop(
    #             data = clinical_lab_data,
    #             dep = "albumin",
    #             group = "disease_severity",
    #             useHighlight = TRUE,
    #             highlight = "Severe",
    #             orientation = "horizontal",
    #             showValues = TRUE,
    #             colorScheme = "clinical",
    #             title = "Albumin by disease severity"
    #         )

    #         # Colour by a clinical threshold (creatinine > 1.2 mg/dL)
    #         lollipop(
    #             data = clinical_lab_data,
    #             dep = "creatinine",
    #             group = "age_group",
    #             highlight = NULL,
    #             conditionalColor = TRUE,
    #             colorThreshold = 1.2,
    #             lineType = "dashed",
    #             sortBy = "value_asc",
    #             title = "Creatinine by age (threshold 1.2 mg/dL)"
    #         )

    #         # Platelet count against the lower normal limit as the baseline
    #         lollipop(
    #             data = clinical_lab_data,
    #             dep = "platelet_count",
    #             group = "hospital",
    #             baseline = 150,
    #             useHighlight = TRUE,
    #             highlight = "Hospital A",
    #             lineType = "dotted",
    #             pointSize = 4,
    #             showMean = TRUE,
    #             colorScheme = "clinical",
    #             title = "Platelet count by hospital (normal > 150)"
    #         )

options:
    - name: data
      type: Data
      description:
          R: The data as a data frame.

    - name: dep
      title: 'Dependent Variable'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            The numeric variable for the values (lollipop heights/lengths).

    - name: group
      title: 'Grouping Variable'
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            The categorical variable for grouping (lollipop categories).

    - name: useHighlight
      title: "Highlighting"
      type: Bool
      default: false
      description:
          R: >
            Enable or disable highlighting of specific levels in the plot.

    - name: highlight
      title: 'Highlight level'
      type: Level
      variable: (group)
      description:
          R: >
            Specific level to highlight in the plot with different color/style. Only used when useHighlight is TRUE.

    - name: aggregation
      title: 'Data aggregation'
      type: List
      options:
        - title: No Aggregation (Plot All Points)
          name: none
        - title: Mean
          name: mean
        - title: Median
          name: median
        - title: Sum
          name: sum
      default: mean
      description:
          R: >
            How to aggregate multiple values per group. Use 'Mean' or 'Median' for typical clinical measurements, 'Sum' for counts. 'No Aggregation' will over-plot if multiple rows per group exist.

    - name: sortBy
      title: 'Sort order'
      type: List
      options:
        - title: Original Order
          name: original
        - title: Sort by Value (Ascending)
          name: value_asc
        - title: Sort by Value (Descending)
          name: value_desc
        - title: Sort by Group (Alphabetical)
          name: group_alpha
      default: original
      description:
          R: >
            How to sort the lollipops in the chart.

    - name: orientation
      title: 'Chart orientation'
      type: List
      options:
        - title: Vertical
          name: vertical
        - title: Horizontal
          name: horizontal
      default: vertical
      description:
          R: >
            Chart orientation (vertical or horizontal lollipops).

    - name: showValues
      title: "Value labels"
      type: Bool
      default: false
      description:
          R: >
            Whether to display value labels on the lollipops.

    - name: showMean
      title: "Mean reference line"
      type: Bool
      default: false
      description:
          R: >
            Whether to display a reference line at the mean of the plotted values (group summaries when aggregation is selected).

    - name: colorScheme
      title: 'Color scheme'
      type: List
      options:
        - title: Default
          name: default
        - title: Clinical
          name: clinical
        - title: Viridis
          name: viridis
        - title: Colorblind Safe
          name: colorblind
      default: default
      description:
          R: >
            Base color hue for the lollipops. The lollipop chart draws a single data
            series, so the scheme sets one base color (the first color of the chosen
            palette) rather than mapping a different color to each group. This option
            is ignored when Conditional coloring or Highlighting is active, since those
            modes use their own fixed colors.

    - name: theme
      title: 'Plot theme'
      type: List
      options:
        - title: Default
          name: default
        - title: Minimal
          name: minimal
        - title: Classic
          name: classic
        - title: Publication
          name: publication
      default: default
      description:
          R: >
            Overall theme/appearance of the plot.

    - name: pointSize
      title: 'Point size'
      type: Number
      default: 3
      min: 1
      max: 10
      description:
          R: >
            Size of the lollipop points.

    - name: lineWidth
      title: 'Line width'
      type: Number
      default: 1
      min: 0.5
      max: 5
      description:
          R: >
            Width of the lollipop stems.

    - name: lineType
      title: 'Line type'
      type: List
      options:
        - title: Solid
          name: solid
        - title: Dashed
          name: dashed
        - title: Dotted
          name: dotted
        - title: Dot-Dash
          name: dotdash
      default: solid
      description:
          R: >
            Type of line for lollipop stems.

    - name: baseline
      title: 'Baseline value'
      type: Number
      default: 0
      description:
          R: >
            Starting point for lollipop stems (default is 0).

    - name: conditionalColor
      title: "Conditional coloring"
      type: Bool
      default: false
      description:
          R: >
            Enable coloring based on value thresholds.

    - name: colorThreshold
      title: 'Color threshold'
      type: Number
      default: 0
      description:
          R: >
            Threshold value for conditional coloring (values above/below get different colors).

    - name: xlabel
      title: 'X-axis label'
      type: String
      default: ''
      description:
          R: >
            Custom label for the x-axis.

    - name: ylabel
      title: 'Y-axis label'
      type: String
      default: ''
      description:
          R: >
            Custom label for the y-axis.

    - name: title
      title: 'Chart title'
      type: String
      default: ''
      description:
          R: >
            Custom title for the plot.

    - name: width
      title: 'Plot width'
      type: Integer
      default: 800
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels.

    - name: height
      title: 'Plot height'
      type: Integer
      default: 600
      min: 300
      max: 1000
      description:
          R: >
            Height of the plot in pixels.

...
