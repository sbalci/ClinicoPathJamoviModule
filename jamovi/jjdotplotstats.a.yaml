---
name:  jjdotplotstats
title: Horizontal Box-Violin Comparison
menuGroup: JJStatsPlot
menuSubgroup: Categorical vs Continuous
# menuSubtitle: Dot Chart
version: '1.1.6'
jas: '1.2'



description:
    main: >
        Compares a continuous variable across independent groups and draws the
        comparison horizontally - values along the x axis and group labels down
        the y axis - with violins, boxplots, individual observations, and an
        optional vertical reference threshold line. Wraps ggstatsplot between-group
        comparisons using Welch's t-test or Welch's ANOVA (parametric),
        Mann-Whitney U or Kruskal-Wallis (nonparametric), Yuen or Wilcox 20
        percent trimmed-mean tests (robust), and Jeffreys-Zellner-Siow Bayes
        factors (Bayesian). For a Cleveland dot chart with one summary point per
        group tested against a reference value, use Dot Chart (Summary vs
        Reference Value) instead.

    # R:
    #     dontrun: true
    #     usage: |
    #         # Basic dot plot with iris dataset
    #         jjdotplotstats(
    #             data = iris,
    #             dep = "Sepal.Length",
    #             group = "Species",
    #             typestatistics = "parametric"
    #         )
            
    #         # Advanced dot plot with custom settings
    #         jjdotplotstats(
    #             data = iris,
    #             dep = "Petal.Width",
    #             group = "Species",
    #             typestatistics = "nonparametric",
    #             centralityplotting = TRUE,
    #             centralitytype = "nonparametric",
    #             testvalueline = TRUE,
    #             testvalue = 1.0,
    #             mytitle = "Petal Width by Species",
    #             xtitle = "Petal Width (cm)",
    #             ytitle = "Species"
    #         )
            
    #         # Grouped robust analysis with factor-coerced mtcars dataset
    #         mtcars_f <- transform(mtcars, cyl = factor(cyl), am = factor(am))
    #         jjdotplotstats(
    #             data = mtcars_f,
    #             dep = "mpg",
    #             group = "cyl",
    #             grvar = "am",
    #             typestatistics = "robust",
    #             resultssubtitle = TRUE,
    #             centralityplotting = TRUE,
    #             centralitytype = "robust",
    #             conflevel = 0.99,
    #             k = 3
    #         )
            
    #         # Bayesian analysis with ToothGrowth dataset
    #         jjdotplotstats(
    #             data = ToothGrowth,
    #             dep = "len",
    #             group = "supp",
    #             typestatistics = "bayes",
    #             resultssubtitle = TRUE,
    #             centralityplotting = TRUE,
    #             centralitytype = "bayes",
    #             mytitle = "Tooth Growth by Supplement Type"
    #         )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.


    - name: dep
      title: Dependent Variable
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            A continuous numeric variable for which the distribution will be
            displayed across different groups using dot plots.


    - name: group
      title: Grouping Variable
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            A categorical variable that defines the groups for comparison.
            Each level will be displayed as a separate group in the dot plot.

    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Optional grouping variable to create separate dot plots for each
            level of this variable (grouped analysis).


    - name: typestatistics
      title: 'Statistical Test Type'
      type: List
      options:
        - title: Parametric (Welch t-test or Welch ANOVA)
          name: parametric
        - title: Nonparametric (Mann-Whitney U or Kruskal-Wallis)
          name: nonparametric
        - title: Robust (20 percent trimmed means, handles outliers)
          name: robust
        - title: Bayesian (JZS Bayes factors and posterior estimation)
          name: bayes
      default: parametric
      description:
          R: >
            Choose the between-group statistical family: Parametric runs Welch's
            unequal-variance two-sample t-test (2 groups) or Welch's one-way
            ANOVA (3+ groups), assuming approximate within-group normality and
            independent observations without requiring equal variances across
            groups; Nonparametric runs the Mann-Whitney U test (2 groups) or
            Kruskal-Wallis test (3+ groups) on ranks; Robust compares 20 percent
            trimmed means via Yuen's test (2 groups) or Wilcox's heteroscedastic
            t1way test (3+ groups); Bayesian computes Jeffreys-Zellner-Siow
            Bayes factors and posterior effect estimates.

    - name: effsizetype
      title: 'Effect Size Measure'
      type: List
      options:
        - title: Uncorrected - Cohen's d with 2 groups, eta-squared with 3+
          name: biased
        - title: Bias-corrected - Hedges' g with 2 groups, omega-squared with 3+
          name: unbiased
        - title: Eta-squared with 3+ groups (Cohen's d with 2 groups)
          name: eta
        - title: Omega-squared with 3+ groups (Hedges' g with 2 groups)
          name: omega
      default: biased
      description:
          R: >
            Effect size quantifies practical significance. Which statistic you get
            depends on how many groups are compared, because the underlying
            statistics package uses one vocabulary for a two-group test and another
            for a three-or-more-group one. 'biased' and 'eta' both give Cohen's d
            with two groups and partial eta-squared with three or more; 'unbiased'
            and 'omega' both give Hedges' g with two groups and partial
            omega-squared with three or more. Rules of thumb: d and g small=0.2,
            medium=0.5, large=0.8; eta-squared and omega-squared small=0.01,
            medium=0.06, large=0.14. Two limits: it applies to the parametric
            test only - the nonparametric, robust and Bayesian tests each report
            one fixed effect size of their own - and it reaches the single figure
            only, since the Split By panels always use the statistics package
            default. The analysis says so when either limit applies.


    - name: pairwisedisplay
      title: 'Pairwise Comparisons'
      type: List
      options:
        - title: Significant pairs only
          name: significant
        - title: All pairs
          name: all
        - title: None
          name: none
      default: significant
      description:
          R: >
            Which post-hoc comparisons between individual pairs of groups are
            drawn as brackets on comparisons of three or more groups (two-group
            comparisons have only one pair, already tested in the subtitle).
            Parametric comparisons use the Games-Howell studentized-range
            procedure under Holm (default), or pairwise Welch unequal-variance
            t-tests with Benjamini-Hochberg, Bonferroni, or no multiplicity
            adjustment when those options are chosen; nonparametric comparisons
            use Dunn's test; robust comparisons use Yuen's trimmed-mean linear
            contrasts; and Bayesian comparisons display unadjusted natural-log
            JZS Bayes factors across all pairs.

    - name: padjustmethod
      title: 'Multiple Comparison Adjustment'
      type: List
      options:
        - title: Holm (recommended)
          name: holm
        - title: Benjamini-Hochberg (false discovery rate)
          name: fdr
        - title: Bonferroni (most conservative)
          name: bonferroni
        - title: None (not recommended)
          name: none
      default: holm
      description:
          R: >
            Multiplicity adjustment for post-hoc pairwise p values when three or
            more groups are compared. For nonparametric (Dunn) and robust (Yuen)
            comparisons, Holm, Benjamini-Hochberg, or Bonferroni adjustment is
            applied directly. For parametric comparisons, 'holm' (default) uses
            the single-step Games-Howell studentized-range procedure for
            family-wise error control without double-adjusting, 'fdr' and
            'bonferroni' apply Benjamini-Hochberg false-discovery-rate or
            Bonferroni adjustment to pairwise Welch unequal-variance t-tests,
            and 'none' reports unadjusted pairwise Welch t-test p values with a
            multiplicity warning. Bayesian pairwise comparisons report Bayes
            factors rather than p values and are unaffected.

    - name: centralityplotting
      title: Central tendency lines
      type: Bool
      default: false
      description:
          R: >
            Display lines showing the central tendency (mean, median, or trimmed mean)
            for each group. Helps visualize group differences at a glance.

    - name: centralitytype
      title: 'Central Tendency Measure'
      type: List
      options:
        - title: Mean (average value, sensitive to outliers)
          name: parametric
        - title: Median (middle value, robust to outliers)
          name: nonparametric
        - title: Trimmed Mean (average excluding extreme values)
          name: robust
        - title: Bayesian Estimate (MAP estimator)
          name: bayes 
      default: parametric
      description:
          R: >
            Type of central tendency to display: Mean is the average but sensitive
            to outliers; Median is the middle value and robust to outliers; Trimmed
            mean excludes extreme values; Bayesian provides probabilistic estimate.

    - name: mytitle
      title: Plot Title
      type: String
      default: ''
      description:
          R: >
            Main title for the plot. Leave blank for automatic title generation
            based on your variables.

    - name: xtitle
      title: X-axis Label (Values)
      type: String
      default: ''
      description:
          R: >
            Label for the horizontal axis showing the continuous variable values.
            Leave blank to use variable name.

    - name: ytitle
      title: Y-axis Label (Groups)
      type: String
      default: ''
      description:
          R: >
            Label for the vertical axis showing the group categories.
            Leave blank to use variable name.


    - name: originaltheme
      title: Original ggstatsplot theme
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme instead of jamovi's default theme.
            The original theme may be more suitable for publications.

    - name: colorpalette
      title: Color palette
      type: List
      options:
        - title: jamovi (follow global)
          name: jamovi
        - title: Okabe-Ito (color-blind safe)
          name: okabeito
        - title: Viridis (perceptually uniform)
          name: viridis
        - title: Dark2 (classic ggstatsplot)
          name: dark2
      default: jamovi
      description:
          R: >
            Discrete color palette for group violins and points. 'jamovi'
            follows the user's global jamovi plot palette; 'okabeito',
            'viridis', and 'dark2' provide explicit color-blind-safe overrides.


    - name: resultssubtitle
      title: Statistical results in plot
      type: Bool
      default: false
      description:
          R: >
            Display statistical test results (p-value, effect size, confidence interval)
            as a subtitle below the plot. Recommended for most analyses.

    - name: testvalue
      title: Reference Line Value
      type: Number
      default: 0
      description:
          R: >
            Position of the optional reference line, in the units of the dependent
            variable. Use it to mark a clinically meaningful threshold such as an
            upper limit of normal. No hypothesis test is performed against this
            value; it only draws a line, and only when 'Reference value line' is
            ticked.

    - name: bfmessage
      title: Bayes factor caption
      type: Bool
      default: false
      description:
          R: >
            Add a caption reporting the natural logarithm of the JZS Bayes
            factor for the null over the alternative hypothesis, log_e(BF_01),
            with Cauchy prior scale r = 0.707 alongside a two-group parametric
            test. On the log_e(BF_01) scale, 0 indicates equal support (BF_01 =
            1), negative values favor a group difference (below -1.10 moderate
            evidence, BF_10 > 3; below -2.30 strong evidence, BF_10 > 10), and
            positive values favor the null hypothesis of no difference (above
            +1.10 moderate; above +2.30 strong; Jeffreys, 1961; Lee &
            Wagenmakers, 2014). Applies only when Statistical Test Type is
            parametric, Statistical results in plot is enabled, and exactly two
            groups are compared.

    - name: conflevel
      title: Confidence Level
      type: Number
      default: 0.95
      min: 0.5
      max: 0.999
      description:
          R: >
            Confidence level for intervals (0.95 = 95 percent confidence interval).
            This represents the probability that the true population parameter
            lies within the calculated interval. 95 percent is standard for most analyses.

    - name: k
      title: Statistical Precision (Decimal Places)
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of decimal places for statistical results (p-values, effect sizes).
            More decimal places show greater precision but may not be clinically meaningful.

    - name: testvalueline
      title: Reference value line
      type: Bool
      default: false
      description:
          R: >
            Draw a dashed vertical line at 'Reference Line Value'. Useful for
            marking a clinical threshold or a normal reference limit. This is a
            visual annotation only.

    - name: centralityparameter
      title: Central Tendency Display
      type: List
      options:
        - title: Show line (measure taken from Central Tendency Measure)
          name: mean
        - title: Show line (measure taken from Central Tendency Measure)
          name: median
        - title: None (no central line)
          name: none
      default: mean
      description:
          R: >
            Whether a central tendency line is drawn. Only 'none' has an effect of
            its own: it suppresses the line. 'mean' and 'median' both simply allow
            the line, and which statistic it marks is decided by 'Central Tendency
            Measure' (centralitytype), not here - selecting 'mean' while
            centralitytype is 'nonparametric' still draws the median, and the
            analysis says so. Retained with all three levels so existing scripts
            keep running.

    - name: centralityk
      hidden: true
      title: 'Central Tendency Precision (no longer used)'
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Deprecated and ignored. The statistics package no longer accepts a
            separate precision for the centrality labels; they follow
            'Statistical Precision (Decimal Places)'. Retained so existing scripts
            keep running, and removed from the user interface.

    - name: seed
      title: Random seed
      type: Integer
      default: 42
      min: 1
      max: 999999
      description:
          R: >
            Random seed controlling bootstrap resampling for nonparametric (3+
            groups) and robust effect-size confidence intervals, Markov chain
            Monte Carlo posterior sampling for Bayesian tests and Bayes factor
            captions, and horizontal point jittering. Fixing the seed ensures
            that re-rendering on the same data reproduces identical intervals
            and point positions; frequentist parametric test statistics and
            closed-form confidence intervals do not depend on the seed unless
            Bayes factor caption is enabled.

    - name: showexplanation
      title: Assumptions and interpretation
      type: Bool
      default: false
      description:
          R: >
            Show a panel that states the assumptions behind the test that was
            run, reports the result as a sentence in plain language, and gives a
            copy-ready methods line for a report.

    - name: plotwidth
      title: Plot Width (pixels)
      type: Integer
      default: 650
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels. Larger values provide more detail but
            may not fit well in reports. Default: 650 pixels.

    - name: plotheight
      title: Plot Height (pixels)
      type: Integer
      default: 450
      min: 300
      max: 800
      description:
          R: >
            Height of the plot in pixels. Adjust based on number of groups
            to ensure readability. Default: 450 pixels.

...
