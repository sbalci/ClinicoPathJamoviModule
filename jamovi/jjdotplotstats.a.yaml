---
name:  jjdotplotstats
title: Horizontal Box-Violin Comparison
menuGroup: JJStatsPlot
menuSubgroup: Categorical vs Continuous
# menuSubtitle: Dot Chart
version: '1.0.8'
jas: '1.2'



description:
    main: |
        Compares a continuous variable across groups and draws the comparison
        horizontally - values on the x axis, group labels down the y axis - with
        an optional vertical reference line. Wraps ggstatsplot::ggbetweenstats
        and ggstatsplot::grouped_ggbetweenstats, so the figure is a box-violin
        plot with the individual observations shown, and the test is a
        between-groups comparison using every observation.

        This analysis was previously titled "Dot Chart", which described neither
        the figure nor the statistic: it draws violins and boxplots, not a dot
        chart, and it is a between-groups test rather than a one-sample one. For
        a genuine Cleveland dot chart - one summary point per label, tested
        against a reference value - use "Dot Chart (Summary vs Reference Value)",
        which wraps ggstatsplot::ggdotplotstats.

        Prefer this over "Box-Violin Plots to Compare Between Groups" when the
        group labels are long or numerous, since the horizontal layout gives them
        room, or when a clinical threshold line is useful.

    # R:
    #     dontrun: true
    #     usage: |
    #         # Basic dot plot with iris dataset
    #         jjdotplotstats(
    #             data = iris,
    #             dep = "Sepal.Length",
    #             group = "Species",
    #             typestatistics = "parametric"
    #         )
            
    #         # Advanced dot plot with custom settings
    #         jjdotplotstats(
    #             data = iris,
    #             dep = "Petal.Width",
    #             group = "Species",
    #             typestatistics = "nonparametric",
    #             centralityplotting = TRUE,
    #             centralitytype = "nonparametric",
    #             testvalueline = TRUE,
    #             testvalue = 1.0,
    #             mytitle = "Petal Width by Species",
    #             xtitle = "Petal Width (cm)",
    #             ytitle = "Species"
    #         )
            
    #         # Grouped analysis with mtcars dataset
    #         jjdotplotstats(
    #             data = mtcars,
    #             dep = "mpg",
    #             group = "cyl",
    #             grvar = "am",
    #             typestatistics = "robust",
    #             centralityplotting = TRUE,
    #             centralitytype = "robust",
    #             effsizetype = "unbiased",
    #             conflevel = 0.99,
    #             k = 3
    #         )
            
    #         # Bayesian analysis with ToothGrowth dataset
    #         jjdotplotstats(
    #             data = ToothGrowth,
    #             dep = "len",
    #             group = "supp",
    #             typestatistics = "bayes",
    #             bfmessage = TRUE,
    #             centralityparameter = "mean",
    #             mytitle = "Tooth Growth by Supplement Type"
    #         )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.


    - name: dep
      title: Dependent Variable
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            A continuous numeric variable for which the distribution will be
            displayed across different groups using dot plots.


    - name: group
      title: Grouping Variable
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            A categorical variable that defines the groups for comparison.
            Each level will be displayed as a separate group in the dot plot.

    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Optional grouping variable to create separate dot plots for each
            level of this variable (grouped analysis).


    - name: typestatistics
      title: 'Statistical Test Type'
      type: List
      options:
        - title: Parametric (t-test, assumes normal distribution)
          name: parametric
        - title: Nonparametric (Mann-Whitney U, no distribution assumptions)
          name: nonparametric
        - title: Robust (20 percent trimmed means, handles outliers)
          name: robust
        - title: Bayesian (provides evidence strength)
          name: bayes
      default: parametric
      description:
          R: >
            Choose the appropriate statistical test: Parametric (t-test) assumes
            normal distribution and equal variances; Nonparametric (Mann-Whitney U)
            makes no distribution assumptions; Robust uses trimmed means to handle
            outliers by trimming 20 percent from each tail; Bayesian provides
            evidence strength via Bayes factors.

    - name: effsizetype
      title: 'Effect Size Measure'
      type: List
      options:
        - title: Uncorrected - Cohen's d with 2 groups, eta-squared with 3+
          name: biased
        - title: Bias-corrected - Hedge's g with 2 groups, omega-squared with 3+
          name: unbiased
        - title: Eta-squared with 3+ groups (Cohen's d with 2 groups)
          name: eta
        - title: Omega-squared with 3+ groups (Hedge's g with 2 groups)
          name: omega
      default: biased
      description:
          R: >
            Effect size quantifies practical significance. Which statistic you get
            depends on how many groups are compared, because the underlying
            statistics package uses one vocabulary for a two-group test and another
            for a three-or-more-group one. 'biased' and 'eta' both give Cohen's d
            with two groups and partial eta-squared with three or more; 'unbiased'
            and 'omega' both give Hedge's g with two groups and partial
            omega-squared with three or more. Rules of thumb: d and g small=0.2,
            medium=0.5, large=0.8; eta-squared and omega-squared small=0.01,
            medium=0.06, large=0.14. Two limits: it applies to the parametric
            test only - the nonparametric, robust and Bayesian tests each report
            one fixed effect size of their own - and it reaches the single figure
            only, since the Split By panels always use the statistics package
            default. The analysis says so when either limit applies.


    - name: pairwisedisplay
      title: 'Pairwise Comparisons'
      type: List
      options:
        - title: Significant pairs only
          name: significant
        - title: All pairs
          name: all
        - title: None
          name: none
      default: significant
      description:
          R: >
            Which post-hoc comparisons between individual pairs of groups are
            drawn as brackets above the plot. The omnibus test tells you only
            that the groups differ somewhere; these say which pairs. The test
            used follows 'Statistical Test Type' - Games-Howell for the
            parametric family, since it does not assume equal variances, Dunn
            for the nonparametric one. Every p value is adjusted for multiple
            comparisons by the method selected below.

    - name: padjustmethod
      title: 'Multiple Comparison Adjustment'
      type: List
      options:
        - title: Holm (recommended)
          name: holm
        - title: Benjamini-Hochberg (false discovery rate)
          name: fdr
        - title: Bonferroni (most conservative)
          name: bonferroni
        - title: None (not recommended)
          name: none
      default: holm
      description:
          R: >
            How the pairwise p values are corrected for testing several pairs at
            once. Holm is uniformly more powerful than Bonferroni while
            controlling the same family-wise error rate and is the sensible
            default. Benjamini-Hochberg controls the false discovery rate
            instead, which is a weaker guarantee but more powerful when many
            pairs are compared. Choosing 'None' reports uncorrected p values and
            will overstate significance; the analysis warns when it is selected.

    - name: centralityplotting
      title: Central tendency lines
      type: Bool
      default: false
      description:
          R: >
            Display lines showing the central tendency (mean, median, or trimmed mean)
            for each group. Helps visualize group differences at a glance.

    - name: centralitytype
      title: 'Central Tendency Measure'
      type: List
      options:
        - title: Mean (average value, sensitive to outliers)
          name: parametric
        - title: Median (middle value, robust to outliers)
          name: nonparametric
        - title: Trimmed Mean (average excluding extreme values)
          name: robust
        - title: Bayesian Estimate (MAP estimator)
          name: bayes 
      default: parametric
      description:
          R: >
            Type of central tendency to display: Mean is the average but sensitive
            to outliers; Median is the middle value and robust to outliers; Trimmed
            mean excludes extreme values; Bayesian provides probabilistic estimate.

    - name: mytitle
      title: Plot Title
      type: String
      default: ''
      description:
          R: >
            Main title for the plot. Leave blank for automatic title generation
            based on your variables.

    - name: xtitle
      title: X-axis Label (Values)
      type: String
      default: ''
      description:
          R: >
            Label for the horizontal axis showing the continuous variable values.
            Leave blank to use variable name.

    - name: ytitle
      title: Y-axis Label (Groups)
      type: String
      default: ''
      description:
          R: >
            Label for the vertical axis showing the group categories.
            Leave blank to use variable name.


    - name: originaltheme
      title: Original ggstatsplot theme
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme instead of jamovi's default theme.
            The original theme may be more suitable for publications.


    - name: resultssubtitle
      title: Statistical results in plot
      type: Bool
      default: false
      description:
          R: >
            Display statistical test results (p-value, effect size, confidence interval)
            as a subtitle below the plot. Recommended for most analyses.

    - name: testvalue
      title: Reference Line Value
      type: Number
      default: 0
      description:
          R: >
            Position of the optional reference line, in the units of the dependent
            variable. Use it to mark a clinically meaningful threshold such as an
            upper limit of normal. No hypothesis test is performed against this
            value; it only draws a line, and only when 'Reference value line' is
            ticked.

    - name: bfmessage
      title: Bayes factor caption
      type: Bool
      default: false
      description:
          R: >
            Add a caption reporting the Bayes factor for the null hypothesis
            alongside the usual test. It applies only to a parametric comparison
            of exactly two groups: the statistics package defines no Bayes factor
            for a three-or-more-group comparison, and with the Bayesian test
            selected the subtitle already reports one. The analysis says which of
            these applies whenever the box is ticked and no caption appears. A
            Bayes factor above 3 indicates moderate evidence, above 10 strong
            evidence.

    - name: conflevel
      title: Confidence Level
      type: Number
      default: 0.95
      min: 0.5
      max: 0.999
      description:
          R: >
            Confidence level for intervals (0.95 = 95 percent confidence interval).
            This represents the probability that the true population parameter
            lies within the calculated interval. 95 percent is standard for most analyses.

    - name: k
      title: Statistical Precision (Decimal Places)
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of decimal places for statistical results (p-values, effect sizes).
            More decimal places show greater precision but may not be clinically meaningful.

    - name: testvalueline
      title: Reference value line
      type: Bool
      default: false
      description:
          R: >
            Draw a dashed vertical line at 'Reference Line Value'. Useful for
            marking a clinical threshold or a normal reference limit. This is a
            visual annotation only.

    - name: centralityparameter
      title: Central Tendency Display
      type: List
      options:
        - title: Show line (measure taken from Central Tendency Measure)
          name: mean
        - title: Show line (measure taken from Central Tendency Measure)
          name: median
        - title: None (no central line)
          name: none
      default: mean
      description:
          R: >
            Whether a central tendency line is drawn. Only 'none' has an effect of
            its own: it suppresses the line. 'mean' and 'median' both simply allow
            the line, and which statistic it marks is decided by 'Central Tendency
            Measure' (centralitytype), not here - selecting 'mean' while
            centralitytype is 'nonparametric' still draws the median, and the
            analysis says so. Retained with all three levels so existing scripts
            keep running.

    - name: centralityk
      title: 'Central Tendency Precision (no longer used)'
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Deprecated and ignored. The statistics package no longer accepts a
            separate precision for the centrality labels; they follow
            'Statistical Precision (Decimal Places)'. Retained so existing scripts
            keep running, and removed from the user interface.

    - name: seed
      title: Random seed
      type: Integer
      default: 42
      min: 1
      max: 999999
      description:
          R: >
            Seed for the resampling that the nonparametric and robust tests use
            to build the effect size confidence interval. It is fixed so that a
            figure re-rendered on the same data comes back identical; without it
            the reported interval moved on every run. Change it only to confirm
            that a borderline interval is not an artefact of one particular
            resample. It has no effect on the parametric or Bayesian tests.

    - name: showexplanation
      title: Assumptions and interpretation
      type: Bool
      default: false
      description:
          R: >
            Show a panel that states the assumptions behind the test that was
            run, reports the result as a sentence in plain language, and gives a
            copy-ready methods line for a report.

    - name: plotwidth
      title: Plot Width (pixels)
      type: Integer
      default: 650
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels. Larger values provide more detail but
            may not fit well in reports. Default: 650 pixels.

    - name: plotheight
      title: Plot Height (pixels)
      type: Integer
      default: 450
      min: 300
      max: 800
      description:
          R: >
            Height of the plot in pixels. Adjust based on number of groups
            to ensure readability. Default: 450 pixels.

...
