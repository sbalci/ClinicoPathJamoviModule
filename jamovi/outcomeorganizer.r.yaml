---
name:  outcomeorganizer
title: Enhanced Outcome Organizer for Survival Analysis
jrs:   '1.1'

items:

    - name:  eventRecodeInfo
      title: 'Outcome Recode'
      type:  Html
      visible: true
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name:  todo
      title: To Do
      type:  Html
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel

    - name:  errors
      title: Critical Errors
      type:  Html
      visible: false

    - name:  strongWarnings
      title: Strong Warnings
      type:  Html
      visible: false

    - name:  warnings
      title: Warnings
      type:  Html
      visible: false

    - name:  infoMessages
      title: Information
      type:  Html
      visible: false

    - name:  summary
      refs:
          - AustinLeeFine2016
          - survival
          - cmprsk
          - mstate

      title: Summary of Outcome Recoding
      type:  Html
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name: outputTable
      title: 'Recoded Outcome Summary'
      type: Table
      visible: (outputTable)
      rows: 0
      columns:
        - name: outcome
          title: "Value"
          type: text
        - name: label
          title: "Meaning"
          type: text
        - name: count
          title: "Count"
          type: integer
        - name: percentage
          title: "Percentage"
          type: number
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name: diagnosticsTable
      title: 'Diagnostic Information'
      type: Table
      visible: (diagnostics)
      rows: 0
      columns:
        - name: check
          title: "Check"
          type: text
        - name: result
          title: "Result"
          type: text
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name: outcomeViz
      title: 'Outcome Distribution'
      type: Image
      width: 500
      height: 400
      renderFun: .plotOutcome
      visible: (visualization)
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name: naturalSummary
      refs:
          - AustinLeeFine2016

      title: 'Natural Language Summary (Copy-Ready)'
      type: Html
      visible: (showNaturalSummary)
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

    - name: glossary
      refs:
          - AustinLeeFine2016
          - AalenJohansen1978

      title: 'Survival Analysis Glossary'
      type: Html
      visible: (showGlossary)

    - name: addOutcome

      title: Add Recoded Outcome to Data
      type: Output
      varTitle: 'Recoded Outcome'
      varDescription: 'Outcome variable recoded for survival analysis based on selected analysis type'
      measureType: nominal
      clearWith:
          - outcome
          - patientID
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - intervalCensoring
          - adminCensoring
          # Both of these change the exported values: adminCensoring is a no-op
          # without a follow-up time, and the cut-off date decides which rows
          # are truncated back to censored.
          - adminDate
          - followupTime

    # Paired with the addAdminTime option of the SAME NAME -- jmvcore's Output
    # resolves its gating option by the result item's own name, and emits nothing
    # when it cannot find one.
    - name: addAdminTime
      title: Add Truncated Follow-up Time to Data
      type: Output
      varTitle: 'Follow-up Truncated at Administrative Cut-off'
      varDescription: 'Follow-up time truncated at the administrative censoring cut-off; pair this with the recoded outcome, not the original follow-up column'
      measureType: continuous
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - recurrence
          - recurrenceLevel
          - useHierarchy
          - eventPriority
          - patientID
          - intervalCensoring
          - intervalStart
          - intervalEnd
          - adminCensoring
          - adminDate
          - followupTime

refs:
    - survival
    - survminer
    - finalfit
    - cmprsk
    - mstate
    - survivaltutorial
    - ClinicoPathJamoviModule


    - janitor
    - labelled
    - glue
...
