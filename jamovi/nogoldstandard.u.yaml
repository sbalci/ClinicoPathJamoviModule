title: Analysis Without Gold Standard
name: nogoldstandard
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Test 1
        children:
          - type: VariablesListBox
            name: test1
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test1Positive
            enable: (test1)
      - type: TargetLayoutBox
        label: Test 2
        children:
          - type: VariablesListBox
            name: test2
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test2Positive
            enable: (test2)
      - type: TargetLayoutBox
        label: Test 3 (Optional)
        children:
          - type: VariablesListBox
            name: test3
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test3Positive
            enable: (test3)
      - type: TargetLayoutBox
        label: Test 4 (Optional)
        children:
          - type: VariablesListBox
            name: test4
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test4Positive
            enable: (test4)
      - type: TargetLayoutBox
        label: Test 5 (Optional)
        children:
          - type: VariablesListBox
            name: test5
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test5Positive
            enable: (test5)
            
  - type: CollapseBox
    label: Analysis Options
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: method
            label: "Analysis method"
            options:
              - name: latent_class
                title: "Latent Class Analysis"
              - name: bayesian  
                title: "Penalized EM (MAP-like; fixed priors; 3+ tests)"
              - name: composite
                title: "Composite Reference (strict majority)"
              - name: all_positive
                title: "All Tests Positive"
              - name: any_positive
                title: "Any Test Positive"

  - type: CollapseBox
    label: Uncertainty and Diagnostics
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: bootstrap
          - type: TextBox
            name: nboot
            label: Samples
            format: number
            enable: (bootstrap)
          - type: TextBox
            name: alpha
            label: Alpha
            format: number
          - type: CheckBox
            name: verbose
            label: Analysis diagnostics
          - type: TextBox
            name: seed
            format: number
            label: Random seed

  - type: CollapseBox
    label: Explanatory Output
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: clinicalPreset
            label: "Illustrative scenario (not clinical guidance)"
          - type: CheckBox
            name: showSummary
            label: Plain-language summary
          - type: CheckBox
            name: showMethodGuide
            label: Method guide
