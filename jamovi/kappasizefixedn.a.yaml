---
name:  kappaSizeFixedN
title: Lowest Expected Value for a fixed sample size
menuGroup: Power #meddecide
menuSubgroup:  Power Analysis by meddecide 
menuSubtitle: Find lower Kappa based on sample size
version: '1.0.52'
jas: '1.2'

description:
    main: >
        Lowest Expected Value for a fixed sample size.
    # R:
    #     dontrun: true
    #     usage: |
    #         # example will be added

options:
    - name: outcome
      title: Number of outcome level
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      default: "2"
      description:
          ui: >
              Number of outcome level.
          R: >
              Number of outcome level.


    - name: kappa0
      title: kappa0
      type: Number
      default: 0.40
      min: 0.01
      max: 0.99
      description:
          ui: >
              The preliminary (anticipated) value of kappa - the agreement you expect to
              observe. It is not a null hypothesis value.
          R: >
              The preliminary (anticipated) value of kappa - the agreement you expect to
              observe. kappaSize documents this argument as "the preliminary value of
              kappa". Contrast kappaSizePower, where kappa0 IS the null being tested.

    - name: props
      title: Proportions of outcome level
      type: String
      default: '0.20 , 0.80'
      description:
          ui: >
              Proportions of outcome level.
          R: >
              Proportions of outcome level.


    - name: raters
      title: raters
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "2"
      description:
          ui: >
              Number of raters.
          R: >
              Number of raters.


    - name: alpha
      title: alpha
      type: Number
      default: 0.05
      min: 0.001
      max: 0.20
      description:
          ui: >
              Significance level.
          R: >
              Significance level.

    - name: 'n'
      title: N
      type: Number
      default: 100
      min: 11
      max: 1000000
      description:
          ui: >
              Sample size.
          R: >
              Sample size.

