title: Odds Ratio Table and Plot
name: oddsratio
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Explanatory Variables
        children:
          - type: VariablesListBox
            name: explanatory
            isTarget: true
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: outcomeLevel
            label: Positive level
            enable: (outcome)
          - type: LevelSelector
            name: outcomeNegativeLevel
            label: Negative level
            enable: (outcome)
      - type: TargetLayoutBox
        label: Diagnostic Predictor (binary)
        children:
          - type: VariablesListBox
            name: diagnosticPredictor
            maxItemCount: 1
            isTarget: true
            enable: (showNomogram)
          - type: LevelSelector
            name: predictorLevel
            label: Predictor positive level
            enable: (showNomogram && diagnosticPredictor)
          - type: LevelSelector
            name: predictorNegativeLevel
            label: Predictor negative level
            enable: (showNomogram && diagnosticPredictor)
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showNomogram
        label: Prediction nomogram and diagnostic metrics
      - type: CheckBox
        name: usePenalized
        label: Firth penalized logistic regression
      - type: CheckBox
        name: showExplanations
