title: Confidence Interval Approach for the Number of Subjects Required
name: kappaSizeCI
jus: '3.0'
stage: 0
compilerMode: tame
children:

  - type: LayoutBox
    margin: large
    children:
      - type: LayoutBox
        margin: large
        cell:
          row: 1
          column: 1
        children:
          - type: Label
            label: Number of Outcome Levels
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: outcome
                    label: Outcome levels
                    events:
                      change: ./kappaSizeCI.events::onChange_outcome
      - type: LayoutBox
        margin: large
        cell:
          row: 1
          column: 2
        children:
          - type: Label
            label: Number of Raters
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: raters
                    label: Raters


  - type: Label
    label: Confidence Interval Type
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: citype
            label: ''


  - type: Label
    label: Kappa Levels
    children:
        - type: LayoutBox
          margin: large
          cell:
            row: 1
            column: 1
          children:
            - type: TextBox
              name: kappa0
              label: 'Anticipated kappa (kappa0)'
              format: number
        - type: LayoutBox
          margin: large
          cell:
            row: 1
            column: 2
          children:
            - type: TextBox
              name: kappaL
              label: 'Lower confidence limit (kappaL)'
              format: number
        - type: LayoutBox
          margin: large
          cell:
            row: 2
            column: 2
          children:
            - type: TextBox
              name: kappaU
              label: 'Upper confidence limit (kappaU)'
              format: number
              enable: (citype:two_sided)



  - type: Label
    label: "Expected Proportion of Cases in Each Category"
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 2
        fitToGrid: true
        children:
          - type: TextBox
            name: props
            label: "Proportions (comma-separated, sum to 1)"
            format: string
            stretchFactor: 2
            fitToGrid: true


  - type: Label
    label: "Significance Level"
    children:
        - type: LayoutBox
          margin: large
          children:
            - type: LayoutBox
              margin: large
              children:
                - type: TextBox
                  name: alpha
                  label: 'Alpha'
                  format: number


  - type: CollapseBox
    label: Additional Output
    collapsed: true
    children:
      - type: CheckBox
        name: showExplanations
      - type: CheckBox
        name: showSummary
