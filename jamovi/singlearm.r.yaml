---
name:  singlearm
title: Single Arm Survival
jrs:   '1.1'

items:


    - name:  eventRecodeInfo
      title: 'Outcome Recode'
      type:  Html
      visible: true
      clearWith:
          - outcome
          - outcomeLevel
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod

    - name:  todo
      title: To Do
      type:  Html
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent

    - name:  errors
      title: Errors
      type:  Html
      visible: false
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype

    - name:  warnings
      title: Warnings
      type:  Html
      visible: false
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype

    - name:  info
      title: Information
      type:  Html
      visible: false
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype


    # Median section. Under competing risks the number in this table is a
    # QUANTILE OF THE CUMULATIVE INCIDENCE FUNCTION, not median survival, and it
    # deliberately carries no confidence interval. The titles below are the
    # Kaplan-Meier defaults; .medianSurv() overrides every one of them (heading,
    # table, median column, summary, explanation heading and explanation) on
    # each run, in BOTH branches, so a title can neither claim the wrong
    # estimand nor carry over from a previous mode. Do not "fix" these titles
    # here - fix them in .medianSurv().
    - name:  medianHeading
      title: Median Survival Analysis
      type:  Preformatted



    - name:  medianTable
      title: Median Survival Table
      type:  Table
      rows: 0
      columns:
        - name: records
          title: "Records"
          type: integer
        - name: events
          title: "Events"
          type: integer
        - name: rmean
          title: "Restricted Mean Survival Time"
          type: number
        - name: se_rmean
          title: "SE of Restricted Mean"
          type: number
        - name: median
          title: "Median"
          type: number
        - name: x0_95lcl
          title: "Lower"
          superTitle: '95% Confidence Interval'
          type: number
        - name: x0_95ucl
          title: "Upper"
          superTitle: '95% Confidence Interval'
          type: number
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - uselandmark
          - landmark
          - timetypeoutput
          - timetypedata



    - name:  clinicalSummary
      title: 'Clinical Summary (Copy-Ready for Reports)'
      type:  Html
      visible: (showSummaries)
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype
          - uselandmark
          - landmark
          - timetypeoutput

    - name:  medianSummary
      title: Median Survival Analysis Natural Language Summary
      type:  Preformatted
      visible: (showSummaries)
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - showExplanations


    - name:  medianHeading3
      title: Median Survival Analysis Explanations
      type:  Preformatted
      visible: (showExplanations)


    - name: medianSurvivalExplanation
      title: 'Understanding Median Survival Analysis'
      type: Html
      visible: (showExplanations)
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - showExplanations




    # Titles here are the neutral defaults. The cutpoints are user-settable and
    # can be in any time unit, so "1, 3, 5 year" was wrong whenever they were
    # changed; and under competing risks the quantity is cumulative incidence,
    # not survival. .medianSurv() and .survTable() set the precise titles at
    # run time with setTitle().
    - name:  survTableHeading
      title: 'Survival at Selected Time Points'
      type:  Preformatted



    - name:  survTable
      title: 'Survival at Selected Time Points'
      type:  Table
      rows: 0
      columns:
        - name: 'time'
          title: "time"
          type: number
          format: zto
        - name: n.risk
          title: "Number at Risk"
          type: integer
        - name: n.event
          title: "Number of Events"
          type: integer
        - name: surv
          title: "Survival"
          type: number
          format: pc
        - name: lower
          title: "Lower"
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: "Upper"
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - analysistype
          - dod
          - dooc
          - awd
          - awod
          - uselandmark
          - landmark
          - timetypeoutput
          - timetypedata
          - showExplanations
          - cutp



    - name:  survTableSummary
      title: 'Survival Table Natural Language Summary'
      type:  Preformatted
      visible: (showSummaries)
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - showExplanations
          - analysistype
          - uselandmark
          - landmark
          - timetypeoutput
          - cutp


    - name:  survTableHeading3
      title: Survival Table Explanations
      type:  Preformatted
      visible: (showExplanations)
      
    - name: survivalProbabilityExplanation
      title: 'Understanding Survival Probabilities'
      type: Html
      visible: (showExplanations)
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fudate
          - dxdate
          - tint
          - multievent
          - showExplanations



    - name:  personTimeHeading
      title: Person-Time Analysis
      type:  Preformatted
      visible: (person_time)


    - name: personTimeTable
      title: 'Person-Time Analysis'
      type: Table
      visible: (person_time)
      rows: 0
      columns:
        - name: interval
          title: "Time Interval"
          type: text
        - name: events
          title: "Events"
          type: integer
        - name: person_time
          title: "Person-Time"
          type: number
          format: zto
        - name: rate
          title: "Incidence Rate"
          type: number
          format: zto
        - name: rate_ci_lower
          title: "Lower"
          superTitle: '95% CI'
          type: number
          format: zto
        - name: rate_ci_upper
          title: "Upper"
          superTitle: '95% CI'
          type: number
          format: zto
      clearWith:
        - outcome
        - outcomeLevel
        - elapsedtime
        - rate_multiplier
        - time_intervals
        - person_time
        - fudate
        - dxdate
        - tint
        - multievent
        - analysistype
        - dod
        - dooc
        - awd
        - awod
        - uselandmark
        - landmark
        - timetypeoutput
        - timetypedata
        - showExplanations


    - name:  personTimeHeading2
      title: Person-Time Analysis Natural Language Summary
      type:  Preformatted
      visible: (person_time && showSummaries)


    - name: personTimeSummary
      title: 'Person-Time Summary'
      type: Html
      visible: (person_time && showSummaries)
      clearWith:
        - outcome
        - outcomeLevel
        - elapsedtime
        - rate_multiplier
        - time_intervals
        - person_time
        - outcome
        - outcomeLevel
        - fudate
