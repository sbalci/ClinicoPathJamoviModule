---
name:  oddsratio
title: Odds Ratio Table and Plot
jrs:   '1.1'

items:
    # Welcome/Todo Message
    - name:  todo
      title: To Do
      type:  Html
      visible: (length(explanatory) == 0 || length(outcome) == 0 || length(outcomeLevel) == 0 || length(outcomeNegativeLevel) == 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel

    - name:  errors
      title: Critical Errors
      type:  Html
      visible: false

    - name:  strongWarnings
      title: Strong Warnings
      type:  Html
      visible: false

    - name:  warnings
      title: Warnings
      type:  Html
      visible: false

    - name:  infoMessages
      title: Information
      type:  Html
      visible: false

    # === MAIN ODDS RATIO ANALYSIS ===
    - name: fittedTable
      title: Odds Ratios
      type: Table
      rows: 0
      columns: []
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0 && length(outcomeNegativeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized

    - name:  text
      title: Odds Ratio Table
      type:  Html
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0 && length(outcomeNegativeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized

    - name:  text2
      title: Model Performance Metrics
      type:  Html
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0 && length(outcomeNegativeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized


    # Plot Section
    - name: plot
      title: ''
      type: Image
      width:  600
      height: 450
      renderFun: .plot
      requiresData: true
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0 && length(outcomeNegativeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized

    # Odds Ratio Explanations (right after odds ratio analysis)
    - name: oddsRatioExplanation
      title: 'Understanding Odds Ratio Analysis'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    - name: riskMeasuresExplanation
      title: 'Understanding Risk Measures'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    - name: diagnosticTestExplanation
      title: 'Understanding Diagnostic Test Performance'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    # === NOMOGRAM ANALYSIS ===
    - name: plot_nomogram
      title: Prediction Nomogram
      type: Image
      width: 800
      height: 600
      renderFun: .plot_nomogram
      visible: (showNomogram && !usePenalized)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized

    - name: diagnosticContingency
      title: Diagnostic Contingency Table
      type: Table
      rows: 0
      columns: []
      visible: (showNomogram)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - diagnosticPredictor
          - predictorLevel
          - predictorNegativeLevel

    - name: diagnosticMetrics
      title: Diagnostic Test Performance
      type: Html
      visible: (showNomogram)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - diagnosticPredictor
          - predictorLevel
          - predictorNegativeLevel

    - name: nomogram
      title: "Prediction Nomogram Details"
      type: Html
      visible: (showNomogram)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - outcomeNegativeLevel
          - usePenalized

    # Nomogram Explanations (right after nomogram analysis)
    - name: nomogramAnalysisExplanation
      title: ''
      type: Html
      visible: (showNomogram && showExplanations)
      clearWith:
          - showNomogram
          - explanatory
          - outcome

refs:
    - ClinicoPathJamoviModule
    - finalfit
    - logistf
    - epiR
    - rms
    - MASS
    - pROC
    - graphics
    - knitr
...
