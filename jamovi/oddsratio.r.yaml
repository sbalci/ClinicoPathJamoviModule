---
name:  oddsratio
title: Odds Ratio Table and Plot
jrs:   '1.1'

items:
    # Welcome/Todo Message
    - name:  todo
      title: To Do
      type:  Html
      visible: (length(explanatory) == 0 || length(outcome) == 0 || length(outcomeLevel) == 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel

    - name:  errors
      title: Critical Errors
      type:  Html
      visible: false

    - name:  strongWarnings
      title: Strong Warnings
      type:  Html
      visible: false

    - name:  warnings
      title: Warnings
      type:  Html
      visible: false

    - name:  infoMessages
      title: Information
      type:  Html
      visible: false

    # === MAIN ODDS RATIO ANALYSIS ===
    - name:  text
      title: Odds Ratio Table
      type:  Html
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - usePenalized

    - name:  text2
      title: Model Performance Metrics
      type:  Html
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - usePenalized


    # Plot Section
    - name: plot
      title: ''
      type: Image
      width:  600
      height: 450
      renderFun: .plot
      requiresData: true
      visible: (length(explanatory) > 0 && length(outcome) > 0 && length(outcomeLevel) > 0)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - usePenalized

    # Odds Ratio Explanations (right after odds ratio analysis)
    - name: oddsRatioExplanation
      title: 'Understanding Odds Ratio Analysis'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    - name: riskMeasuresExplanation
      title: 'Understanding Risk Measures'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    - name: diagnosticTestExplanation
      title: 'Understanding Diagnostic Test Performance'
      type: Html
      visible: (showExplanations)
      clearWith:
          - explanatory
          - outcome

    # === NOMOGRAM ANALYSIS ===
    - name: plot_nomogram
      title: Prediction Nomogram
      type: Image
      width: 800
      height: 600
      requiresData: true
      renderFun: .plot_nomogram
      visible: (showNomogram && !usePenalized)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - usePenalized

    - name: diagnosticMetrics
      title: Diagnostic Test Performance
      type: Html
      visible: (showNomogram)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - diagnosticPredictor
          - predictorLevel

    - name: nomogram
      title: "Prediction Nomogram Details"
      type: Html
      visible: (showNomogram)
      clearWith:
          - explanatory
          - outcome
          - outcomeLevel
          - usePenalized

    # Nomogram Explanations (right after nomogram analysis)
    - name: nomogramAnalysisExplanation
      title: ''
      type: Html
      visible: (showNomogram && showExplanations)
      clearWith:
          - showNomogram
          - explanatory
          - outcome

refs:
    - finalfit
    - logistf
    - epiR
    - rms
    - survivaltutorial
    - ClinicoPathJamoviModule

...
