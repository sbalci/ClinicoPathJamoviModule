title: Bar Charts
name: jjbarstats
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable (what you're measuring)
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
      - type: TargetLayoutBox
        label: Group Variable (what you're comparing)
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Subgroup Analysis (Optional)
        children:
          - type: VariablesListBox
            name: grvar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Frequency Counts (Optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Quick Clinical Setup
    collapsed: true
    children:
      - type: ComboBox
        name: clinicalpreset
        label: Analysis type
        events:
          change: ./jjbarstats.events::onChange_clinicalpreset
      - type: CheckBox
        name: showexplanations
        label: Clinical guidance
  - type: CollapseBox
    label: Statistical Analysis
    collapsed: true
    children:
      - type: Label
        label: Data Handling
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: paired
                label: Paired/matched data (McNemar's test)
      - type: Label
        label: Statistical Method
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: typestatistics
                label: Test type
              - type: CheckBox
                name: proportiontest
                label: Proportion tests
              - type: CheckBox
                name: bfmessage
                label: Bayes factor message (parametric test)
                enable: (typestatistics:parametric)
      - type: Label
        label: Advanced Parameters
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: conflevel
                label: Confidence level
                format: number
              - type: TextBox
                name: ratio
                label: Expected proportions (e.g., 0.5,0.5)
                format: string
  - type: CollapseBox
    label: Plot Appearance
    collapsed: true
    children:
      - type: Label
        label: Plot Styling
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: originaltheme
                label: ggstatsplot theme
              - type: CheckBox
                name: resultssubtitle
                label: Statistics in plot subtitle
              - type: ComboBox
                name: palette
                label: Color palette
      - type: Label
        label: Bar Chart Labels
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: label
                label: Bar label type
              - type: TextBox
                name: digits
                label: Decimal places (statistics)
                format: number
              - type: TextBox
                name: digitsperc
                label: Decimal places (percentages)
                format: number
  - type: CollapseBox
    label: Balloon Plot (ggpubr)
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: addGGPubrBalloon
            children:
              - type: ComboBox
                name: ggpubrBalloonPalette
                label: Palette
                enable: (addGGPubrBalloon)
  - type: CollapseBox
    label: Report & Explanations
    collapsed: true
    children:
      - type: Label
        label: Educational Content
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: showSummary
                label: Analysis summary
              - type: CheckBox
                name: showAssumptions
                label: Assumptions & warnings
              - type: CheckBox
                name: showInterpretation
                label: Interpretation guide
