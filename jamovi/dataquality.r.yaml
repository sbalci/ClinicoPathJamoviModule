---
name: dataquality
title: Multi-Variable Visual Quality
jrs: '1.1'

items:
    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
          - vars
          - check_duplicates
          - check_missing
          - row_level_duplicates
          - missing_threshold_visual
          - plot_data_overview
          - plot_missing_patterns
          - plot_data_types

    - name: todo
      type: Html
      visible: true

    # Every one of these four blocks reports numbers derived from the selected
    # variables and the enabled checks, so all of them must be discarded when any
    # of those change - otherwise a stale report (stale counts, stale variable
    # names, stale verdict) stays on screen under the new welcome/error panel.
    - name: text
      title: Data Quality Summary
      type: Html
      clearWith:
          - vars
          - check_duplicates
          - check_missing
          - row_level_duplicates
          - missing_threshold_visual
          - plot_data_overview
          - plot_missing_patterns
          - plot_data_types

    - name: summary
      title: "Plain-Language Summary"
      type: Html
      visible: (showSummary)
      clearWith:
          - vars
          - check_duplicates
          - check_missing
          - row_level_duplicates
          - missing_threshold_visual

    - name: recommendations
      title: "Recommended Actions"
      type: Html
      visible: (showRecommendations)
      clearWith:
          - vars
          - check_duplicates
          - check_missing
          - row_level_duplicates
          - missing_threshold_visual

    - name: explanations
      title: "Understanding Quality Metrics"
      type: Html
      visible: (showExplanations)
      clearWith:
          - vars
          - plot_data_overview
          - plot_missing_patterns
          - plot_data_types

    - name: plotDataOverview
      title: Data Overview
      type: Image
      width: 900
      height: 600
      renderFun: .plotDataOverview
      visible: (plot_data_overview)
      requiresData: true
      clearWith:
          - vars
          - missing_threshold_visual

    - name: plotMissingPatterns
      title: Missing Patterns
      type: Image
      width: 900
      height: 600
      renderFun: .plotMissingPatterns
      visible: (plot_missing_patterns)
      requiresData: true
      clearWith:
          - vars
          - missing_threshold_visual

    - name: plotDataTypes
      title: Data Types
      type: Image
      width: 900
      height: 600
      renderFun: .plotDataTypes
      visible: (plot_data_types)
      requiresData: true
      clearWith:
          - vars

    # NOTE: vis_expect disabled until expectation formulas can be configured
    # - name: plotValueExpectations
    #   title: Value Expectations
    #   type: Image
    #   width: 900
    #   height: 600
    #   renderFun: .plotValueExpectations
    #   visible: (plot_value_expectations)
    #   requiresData: true
    #   clearWith:
    #       - vars


refs:
    - ClinicoPathJamoviModule
    - visdat
    - naniar
    - dplyr
    - ggplot2
...
