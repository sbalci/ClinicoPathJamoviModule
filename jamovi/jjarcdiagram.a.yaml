options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: source
      title: Source node (from)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Starting entity in each relationship. Select the variable containing the "from" nodes.

            Clinical Examples:
            • Gene regulatory networks: Regulator gene (e.g., TP53, BRCA1)
            • Patient networks: First patient in similarity pair (Patient_ID)
            • Disease co-occurrence: Primary diagnosis (ICD10 code)
            • Protein interactions: Upstream protein
            • Treatment pathways: Initial intervention

    - name: target
      title: Target node (to)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          R: >
            Ending entity in each relationship. Select the variable containing the "to" nodes.

            Clinical Examples:
            • Gene regulatory networks: Target gene being regulated (e.g., CDK4, MYC)
            • Patient networks: Second patient in similarity pair
            • Disease co-occurrence: Secondary diagnosis or comorbidity
            • Protein interactions: Downstream protein
            • Treatment pathways: Next intervention in sequence

    - name: weight
      title: Edge weight (optional)
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
          R: >
            Optional numeric measure of connection strength or importance.

            Clinical Examples:
            • Gene networks: Correlation coefficient (0-1), fold-change, or interaction score
            • Patient networks: Similarity score (e.g., Jaccard index, cosine similarity)
            • Disease co-occurrence: Number of co-occurrences or relative risk
            • Protein interactions: Binding affinity (Kd) or confidence score
            • Treatment pathways: Transition probability (0-1)

            Leave empty for unweighted networks (all edges treated equally).

    - name: group
      title: Node categories (optional)
      type: Variable
      suggested: [ nominal ]
      permitted: [ factor ]
      default: NULL
      description:
          R: >
            Optional grouping variable for color-coding entities. Examples: Gene families, 
            patient subtypes, disease categories, or functional classifications.

    - name: analysisPreset
      title: Analysis type
      type: List
      options:
        - name: custom
          title: Custom network
        - name: gene_interaction  
          title: Gene interaction network (recommended)
        - name: patient_network
          title: Patient similarity network (clinical)
        - name: pathway_network
          title: Biological pathway network (research)
        - name: comorbidity_network
          title: Disease co-occurrence network (epidemiology)
      default: custom
      description:
          R: >
            Choose a preset configuration optimized for specific clinical or research scenarios. 
            Gene networks focus on regulatory relationships, patient networks on similarity patterns, 
            pathway networks on biological processes, and comorbidity networks on disease associations.

    - name: showNodes
      title: Nodes
      type: Bool
      default: false
      description:
          R: >
            Whether to display node points along the arc baseline. When enabled, nodes are shown as circles at their sorted positions.

    - name: nodeSize
      title: Node size
      type: List
      options:
        - title: Fixed
          name: fixed
        - title: By degree
          name: degree
      default: fixed
      description:
          R: >
            Method for determining node sizes. 'Fixed' uses constant size, 'By degree' scales nodes proportionally to their connectivity (number of connections).

    - name: nodeSizeValue
      title: Node size value
      type: Number
      default: 2
      min: 0.1
      max: 10
      description:
          R: >
            Size of nodes when using fixed sizing, or base size multiplier when using degree-based sizing. Range: 0.1 to 10.

    - name: sortNodes
      title: Node order
      type: List
      options:
        - title: None
          name: none
        - title: By name
          name: name
        - title: By group
          name: group
        - title: By degree
          name: degree
      default: none
      description:
          R: >
            Order in which nodes are arranged along the baseline. 'None' preserves original order, 'By name' sorts alphabetically, 'By group' clusters by categories, 'By degree' orders by connectivity.

    - name: sortDecreasing
      title: Descending order
      type: Bool
      default: false
      description:
          R: >
            When sorting nodes, whether to use descending order. Only applies when Node order is not 'None'.

    - name: horizontal
      title: Horizontal layout
      type: Bool
      default: false
      description:
          R: >
            Layout orientation of the arc diagram. When TRUE, nodes are arranged horizontally with arcs above. When FALSE, nodes are arranged vertically with arcs to the side.

    - name: arcWidth
      title: Arc width
      type: List
      options:
        - title: Fixed
          name: fixed
        - title: By weight
          name: weight
      default: fixed
      description:
          R: >
            Method for determining arc line widths. 'Fixed' uses constant width, 'By weight' scales arc thickness proportionally to edge weights.

    - name: arcWidthValue
      title: Arc width value
      type: Number
      default: 1
      min: 0.1
      max: 5
      description:
          R: >
            Width of arcs when using fixed sizing, or base width when using weight-based sizing. Range: 0.1 to 5.

    - name: arcTransparency
      title: Arc transparency
      type: Number
      default: 0.5
      min: 0
      max: 1
      description:
          R: >
            Transparency level of arc lines. 0 = fully transparent (invisible), 1 = fully opaque. Lower values reduce visual clutter in dense networks.

    - name: directed
      title: Directed network
      type: Bool
      default: false
      description:
          R: >
            Whether to treat the network as directed (edges have direction from source to target) or undirected (edges represent bidirectional relationships).

    - name: aggregateEdges
      title: Duplicate edge aggregation
      type: Bool
      default: true
      description:
          R: >
            "RECOMMENDED: Combine multiple edges between the same nodes by summing weights.
            Why it matters:
            Prevents inflated degree, strength and centrality measures
            (density is unaffected either way: it is computed on distinct node pairs)
            Provides accurate statistical summaries
            Example: If Gene A→Gene B appears 3 times with weights (2, 3, 5),
            aggregation creates a single edge with weight 10.
            When to disable: Only if you specifically need to preserve parallel edges for specialized analyses."

    - name: weightMode
      title: Edge weight interpretation
      type: List
      options:
        - name: strength
          title: Strength (higher = stronger connection)
        - name: distance
          title: Distance (higher = longer path)
      default: strength
      description:
          R: >
            "How edge weights should be interpreted for centrality calculations.
            STRENGTH mode (default): Higher values = stronger connections
              Use for: Correlations, interaction scores, similarity indices
              Examples: r=0.8 (strong), binding affinity score=90
            DISTANCE mode: Higher values = longer paths/weaker connections
              Use for: Costs, physical distances, dissimilarity measures
              Examples: Euclidean distance, cost metrics
            Most clinical/biological networks use STRENGTH mode."

    - name: arcColorMode
      title: Arc color
      type: List
      options:
        - name: source
          title: By source node
        - name: target
          title: By target node
        - name: gradient
          title: Gradient (source to target)
      default: source
      description:
          R: >
            How to color arcs when nodes are grouped. 'Source' colors arcs by source node's group,
            'Target' by target node's group, 'Gradient' creates a gradient from source to target colors.
            Only applies when Node color by group is enabled.

    - name: colorByGroup
      title: Node color by group
      type: Bool
      default: false
      description:
          R: >
            When a grouping variable is specified, whether to color-code nodes by their group membership. Requires a group variable.

    - name: showStats
      title: Network statistics
      type: Bool
      default: false
      description:
          R: >
            Whether to display network statistics including number of nodes, edges, density, and centrality measures.

    - name: showLegend
      title: Legend
      type: Bool
      default: false
      description:
          R: >
            Whether to display a color legend when nodes are colored by groups. Only appears when grouping variable is specified and color by group is enabled.

    - name: labelSize
      title: Label size
      type: Number
      default: 0.8
      min: 0.1
      max: 2
      description:
          R: >
            Size of node labels (text). 0.8 is standard size, values above 1.0 increase label size, below 1.0 decrease it. Range: 0.1 to 2.0.

    - name: plotTitle
      title: Plot title
      type: String
      default: ""
      description:
          R: >
            Optional title to display above the arc diagram. Leave empty for no title.

    - name: showSummary
      title: Copy-ready summary
      type: Bool
      default: true
      description:
          R: >
            Whether to display a natural-language summary paragraph suitable for copying into reports or publications. Includes network overview, key findings, and grouping information.

    - name: showAssumptions
      title: Assumptions & guidelines
      type: Bool
      default: true
      description:
          R: >
            Whether to display detailed assumptions, interpretation guidelines, and common pitfalls panel. Includes network requirements, centrality measure explanations, and important notes for proper interpretation.

    - name: showGlossary
      title: Glossary
      type: Bool
      default: false
      description:
          R: >
            Whether to display a glossary panel with definitions of key network analysis terms (nodes, edges, centrality measures, density). Useful for users new to network analysis.

...
