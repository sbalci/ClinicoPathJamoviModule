title: Histogram
name: jjhistostats
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
      - type: TargetLayoutBox
        label: Split by (optional)
        children:
          - type: VariablesListBox
            name: grvar
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Analysis Options
    collapsed: true
    children:
      - type: Label
        label: Clinical presets
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: clinicalPreset
                events:
                  change: ./jjhistostats.events::onChange_clinicalPreset
      - type: Label
        label: Statistical analysis
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: typestatistics
                events:
                  change: ./jjhistostats.events::onChange_typestatistics
              - type: CheckBox
                name: resultssubtitle
              - type: CheckBox
                name: enableOneSampleTest
                children:
                  - type: TextBox
                    name: test.value
                    format: number
                    enable: (enableOneSampleTest)
              - type: TextBox
                name: conf.level
                format: number
                enable: (resultssubtitle)
                events:
                  change: ./jjhistostats.events::onChange_conf_level
              - type: CheckBox
                name: bf.message
                enable: (resultssubtitle)
              - type: TextBox
                name: digits
                format: number
                enable: (resultssubtitle)
                events:
                  change: ./jjhistostats.events::onChange_digits
              - type: CheckBox
                name: showInterpretation
      - type: Label
        label: Test parameters
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: alternative
                enable: (resultssubtitle)
              # Gated on the statistic that actually consumes it.
              - type: TextBox
                name: trimlevel
                format: number
                enable: (typestatistics:robust || centralitytype:robust)
              # Deliberately NOT gated: bf.message produces a Bayes factor for the
              # PARAMETRIC test too, so the prior matters outside typestatistics:bayes.
              # Gating on it would need `bf.message` inside a binding expression, and no
              # .u.yaml in this module references a dotted option name that way - the same
              # trap that made ui.bf_message inert in the events JS. Leaving the box live
              # is harmless; the analysis discloses the prior whenever a BF runs.
              - type: TextBox
                name: bfprior
                format: number
  - type: CollapseBox
    label: Histogram
    collapsed: true
    children:
      - type: Label
        label: Bins
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: changebinwidth
                children:
                  - type: TextBox
                    name: binwidth
                    format: number
                    enable: (changebinwidth)
                    events:
                      change: ./jjhistostats.events::onChange_binwidth
      - type: Label
        label: Bin appearance
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: binfill
                format: string
                width: large
                events:
                  change: ./jjhistostats.events::onChange_binfill
              - type: TextBox
                name: bincolor
                format: string
                width: large
              - type: TextBox
                name: binalpha
                format: number
                events:
                  change: ./jjhistostats.events::onChange_binalpha
  - type: CollapseBox
    label: Centrality Line
    collapsed: true
    children:
      - type: Label
        label: Measure
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: centralityline
              - type: ComboBox
                name: centralitytype
                enable: (centralityline)
      - type: Label
        label: Line appearance
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: centralitylinecolor
                format: string
                enable: (centralityline)
              - type: TextBox
                name: centralitylinewidth
                format: number
                enable: (centralityline)
                events:
                  change: ./jjhistostats.events::onChange_centralitylinewidth
              - type: ComboBox
                name: centralitylinetype
                enable: (centralityline)
  - type: CollapseBox
    label: Plot Labels
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: title
            format: string
            width: largest
          - type: TextBox
            name: subtitle
            format: string
            width: largest
            enable: (resultssubtitle == false)
          - type: TextBox
            name: caption
            format: string
            width: largest
          - type: TextBox
            name: xlab
            format: string
            width: largest
  - type: CollapseBox
    label: Plot Size and Theme
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: plotwidth
            format: number
            events:
              change: ./jjhistostats.events::onChange_plotwidth
          - type: TextBox
            name: plotheight
            format: number
            events:
              change: ./jjhistostats.events::onChange_plotheight
          - type: CheckBox
            name: originaltheme
  - type: CollapseBox
    label: Publication-Ready Plots (ggpubr)
    collapsed: true
    children:
      - type: Label
        label: Histogram
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              # jamovi allows a CheckBox only ONE non-fragmented child, so the
              # sub-options are siblings gated on the parent rather than nested under it.
              - type: CheckBox
                name: addGGPubrPlot
              - type: TextBox
                name: ggpubrPalette
                format: string
                width: large
                enable: (addGGPubrPlot)
              - type: CheckBox
                name: ggpubrAddDensity
                enable: (addGGPubrPlot)
              - type: CheckBox
                name: ggpubrAddMean
                enable: (addGGPubrPlot)
      - type: Label
        label: Distribution diagnostics
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: addDistributionDiagnostics
              - type: TextBox
                name: ggpubrDensityColor
                format: string
                width: large
                enable: (addDistributionDiagnostics)
              - type: CheckBox
                name: ggpubrShowQQ
                enable: (addDistributionDiagnostics)
              - type: CheckBox
                name: ggpubrShowECDF
                enable: (addDistributionDiagnostics)
