---
name:  jjdotchart
title: Dot Chart (Summary vs Reference Value)
menuGroup: JJStatsPlotT
menuSubgroup: Categorical vs Continuous
version: '1.0.82'
jas: '1.2'

description:
    main: >
        Cleveland dot chart for cross-sectional multi-unit benchmarking: collapses
        finite complete observations within each level of Groups to a single
        within-group location summary, orders the k groups ascending by summary
        value with within-group confidence intervals and a dashed Reference Value
        line, and runs an unweighted one-sample test of those k group summaries
        (equal weight 1/k per group, sample size n = k groups rather than N
        patients; per-stratum n = k_s when Split By is used) against the Reference
        Value. Selecting Parametric plots group arithmetic means with Student-t
        intervals and a one-sample t-test (Hedges' g); Nonparametric plots group
        medians with percentile bootstrap intervals and a Wilcoxon signed-rank
        test (rank-biserial r); Robust plots symmetric trimmed means with Yuen
        Winsorized-t intervals and a bootstrapped trimmed-mean test; and Bayesian
        plots Sheather-Jones kernel-density MAP modes with percentile bootstrap
        intervals alongside a Gaussian Cauchy-JZS Bayes factor test (where
        log_e(BF_01) > 0 favors the null hypothesis that the group-summary mean
        equals the Reference Value). Because equal cluster weights can diverge
        from caseload-weighted or precision-weighted benchmarks when group sizes
        or within-group standard errors vary, an optional Weighted sensitivity
        table compares unweighted (1/k), caseload-weighted cluster-robust (n_g/N),
        and DerSimonian-Laird random-effects precision-weighted estimates against
        the Reference Value; to compare groups directly using individual
        observations, use Box-Violin Plots to Compare Between Groups instead.

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: dep
      title: Measurement
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            The continuous variable to summarize across complete finite
            observations within each group. Each group is reduced to one point on
            the chart - its mean, median, 20 percent trimmed mean, or kernel MAP
            estimate, matching the Statistical test selected below.
          ui: >
            Continuous outcome variable summarized to one value per group (mean,
            median, 20 percent trimmed mean, or kernel MAP mode).

    - name: group
      title: Groups (One Point Each)
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            The clustering or unit variable (for example laboratory, center, or
            rater). Every observed non-missing level contributes one equally
            weighted point (weight 1/k), and the number of groups k is the sample
            size of the one-sample test.
          ui: >
            Unit or cluster variable (such as laboratory, hospital center, or
            rater); each group becomes one equally weighted dot (n = k groups).

    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Optional stratification variable producing a separate dot chart and
            separate per-stratum one-sample test (sample size k_s groups within
            each stratum) for each non-missing level, without removing rows that
            are missing only Split By from the unstratified table and chart.
          ui: >
            Optional stratification variable creating a separate dot chart panel
            and separate test (n = k_s groups) for each level.

    - name: testvalue
      title: Reference value
      type: Number
      default: 0
      description:
          R: >
            The target benchmark value that the k group summaries are tested
            against (for example an upper limit of normal, a target turnaround
            time, or an external calibration standard). Replace the default of 0
            whenever 0 is not a meaningful clinical benchmark on the scale of your
            measurement, because extreme separation from 0 can make standardized
            effect-size intervals non-estimable.
          ui: >
            Target benchmark or standard (drawn as a dashed red vertical line)
            that the k group summaries are tested against.

    - name: typestatistics
      title: 'Statistical test'
      type: List
      options:
        - title: Parametric (one-sample t-test)
          name: parametric
        - title: Nonparametric (Wilcoxon signed-rank)
          name: nonparametric
        - title: Robust (bootstrapped trimmed mean)
          name: robust
        - title: Bayesian (evidence for and against)
          name: bayes
      default: parametric
      description:
          R: >
            Selects both the within-group summary and the one-sample test across
            the k group summaries: Parametric uses arithmetic means (Student-t
            within-group CIs) and a one-sample t-test with Hedges' g;
            Nonparametric uses medians (B = 2000 percentile bootstrap CIs) and a
            continuity-corrected Wilcoxon signed-rank test with Fisher-z
            rank-biserial correlation; Robust uses 20 percent trimmed means (Yuen
            Winsorized-t within-group CIs) and Wilcox's bootstrapped trimmed-mean
            t-test (nboot = 200, Phipson-Smyth bounded p-values); Bayesian uses
            1024-grid Sheather-Jones kernel MAP modes (B = 500 percentile
            bootstrap CIs) and a Cauchy-JZS Bayes factor t-test (r = 0.707, where
            positive log_e(BF_01) favors the Reference Value null).
          ui: >
            Selects both the plotted per-group location estimator (mean, median,
            20 percent trimmed mean, or kernel MAP mode) and the one-sample test
            against the Reference value.

    - name: conflevel
      title: Confidence level
      type: Number
      default: 0.95
      min: 0.50
      max: 0.999
      description:
          R: >
            Confidence (or credible) level for both the within-group error bars in
            the chart and Group Summaries table and the one-sample effect-size
            interval in the plot subtitle (0.95 gives 95 percent intervals).
          ui: >
            Confidence or credible level (0.50 to 0.999) for per-group error bars
            and subtitle effect-size intervals.

    - name: k
      title: Decimal places (plot annotation)
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of decimal places for the statistics annotated on the plot
            subtitle and optional centrality label. Table cell rounding follows
            jamovi's global Results number-format setting.
          ui: >
            Decimal places (0 to 5) shown in the plot subtitle and centrality
            annotation.

    - name: trimprop
      title: Trimming proportion
      type: Number
      default: 0.20
      min: 0.05
      max: 0.40
      description:
          R: >
            Symmetric tail-trimming proportion (0.05 to 0.40 per tail; default
            0.20 for 20 percent trimmed means) used in Robust mode for
            within-group trimmed means, Yuen Winsorized-t intervals, the
            bootstrapped trimmed-mean test, and the optional trimmed-mean center
            line.
          ui: >
            Symmetric proportion trimmed from each tail (0.05 to 0.40) when using
            trimmed-mean summaries.

    - name: bfprior
      title: Cauchy prior scale
      type: Number
      default: 0.707
      min: 0.10
      max: 2.00
      description:
          R: >
            Scale parameter r (0.10 to 2.00; default 0.707 = sqrt(2)/2 medium
            prior) of the zero-centered Cauchy Jeffreys-Zellner-Siow prior on
            standardized effect size in Bayesian mode.
          ui: >
            Cauchy JZS prior width r (0.10 to 2.00; 0.707 = medium default) for
            the Bayesian one-sample test.

    - name: nboot
      title: Trimmed-mean test resamples
      type: Integer
      default: 200
      min: 100
      max: 5000
      description:
          R: >
            Number of percentile-t bootstrap resamples (100 to 5000; default 200)
            for Wilcox's one-sample trimmed-mean test across the k group summaries
            in Robust mode. Larger values refine the Phipson-Smyth lower p-value
            bound 1 / (B + 1).
          ui: >
            Bootstrap resamples (100 to 5000) for the Robust one-sample
            trimmed-mean test.

    - name: ciresamples
      title: Median interval resamples
      type: Integer
      default: 2000
      min: 200
      max: 10000
      description:
          R: >
            Number of within-group percentile bootstrap resamples (200 to 10000;
            default 2000) used to form group-median confidence intervals and
            bootstrap standard errors in Nonparametric mode.
          ui: >
            Bootstrap resamples (200 to 10000) for within-group median confidence
            intervals in Nonparametric mode.

    - name: mapresamples
      title: MAP interval resamples
      type: Integer
      default: 500
      min: 100
      max: 5000
      description:
          R: >
            Number of within-group percentile bootstrap resamples (100 to 5000;
            default 500) used to form Sheather-Jones kernel MAP mode intervals and
            bootstrap standard errors in Bayesian mode.
          ui: >
            Bootstrap resamples (100 to 5000) for within-group kernel MAP
            intervals in Bayesian mode.

    - name: resultssubtitle
      title: Statistical results in plot
      type: Bool
      # Deliberately NOT default:false: this subtitle carries the entire
      # one-sample statistical test of the k group summaries against the
      # Reference value (test statistic, p-value / Bayes factor, effect size,
      # CI, and k).
      default: true
      description:
          R: >
            Show the one-sample test result against the Reference Value as the
            plot subtitle.
          ui: >
            Annotate the plot subtitle with the one-sample test of the k group
            summaries against the Reference value.

    - name: showSummaryTable
      title: Group summary table
      type: Bool
      # Deliberately NOT default:false: this table is the primary numerical
      # audit output reporting N obs, group summary, SD, CI limits, and signed
      # difference from the Reference value for every plotted dot.
      default: true
      description:
          R: >
            Show the per-group audit table behind the chart: complete observation
            count, plotted group summary (dynamically titled Mean, Median, Trimmed
            mean, or MAP estimate), raw within-group SD, within-group confidence
            limits matching the plotted error bars, and signed difference from the
            Reference Value.
          ui: >
            Display the per-group numerical summary table (N obs, location
            summary, SD, confidence interval, and difference vs Reference).

    - name: showWeightedTable
      title: Weighted sensitivity table
      type: Bool
      default: false
      description:
          R: >
            Display a companion sensitivity table comparing the unweighted group
            mean (equal weight 1/k per group) against a caseload-weighted
            cluster-robust estimate (weights n_g / N with CR1 cluster sandwich SE)
            and a DerSimonian-Laird random-effects precision-weighted estimate
            (inverse-variance weights incorporating between-group heterogeneity
            tau-squared and I-squared) relative to the Reference Value.
          ui: >
            Compare equal-weight (1/k), caseload-weighted (n_g/N), and
            random-effects precision-weighted group syntheses against the
            Reference value.

    - name: centralityplotting
      title: Center line across plotted points
      type: Bool
      default: false
      description:
          R: >
            Draw a second solid blue vertical line at the center of the k plotted
            group summaries (distinct from the dashed red Reference Value line,
            which is always drawn and labeled in the caption).
          ui: >
            Draw an optional solid blue vertical line marking the overall center
            of the k plotted group summaries.

    - name: centralitytype
      title: 'Central tendency measure'
      type: List
      options:
        - title: Mean
          name: parametric
        - title: Median
          name: nonparametric
        - title: Trimmed mean
          name: robust
        - title: Bayesian estimate (MAP)
          name: bayes
      default: parametric
      description:
          R: >
            Which center to use for the optional second line, when 'Center line
            across plotted points' is ticked. It affects that line ONLY - the
            plotted points always follow the Statistical test. Leave it matching
            your Statistical test unless you have a specific reason.
          ui: >
            Location estimator used for the optional solid blue center line across
            the k plotted group summaries.

    - name: originaltheme
      title: Original ggstatsplot theme
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme rather than jamovi's default.
          ui: >
            Use ggstatsplot's visual theme instead of matching jamovi's active
            plot theme.

    - name: mytitle
      title: Plot title
      type: String
      default: ''
      description:
          R: >
            Main title for the plot. Leave blank for no title.
          ui: >
            Custom main plot title (leave blank for none).

    - name: xtitle
      title: X-axis label (measurement)
      type: String
      default: ''
      description:
          R: >
            Label for the horizontal axis, which carries the measurement values.
            Leave blank to use the variable name.
          ui: >
            Custom horizontal axis label (leave blank to use the Measurement
            variable name).

    - name: ytitle
      title: Y-axis label (groups)
      type: String
      default: ''
      description:
          R: >
            Label for the vertical axis, which carries the group labels. Leave
            blank to use the variable name.
          ui: >
            Custom vertical axis label (leave blank to use the Groups variable
            name).

    - name: plotwidth
      title: Plot width (pixels)
      type: Integer
      default: 650
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels.
          ui: >
            Plot width in pixels (300 to 1200).

    - name: plotheight
      title: Plot height (pixels)
      type: Integer
      default: 450
      min: 300
      max: 800
      description:
          R: >
            Height of the plot in pixels. Increase it when there are many groups,
            since each one needs a labeled row.
          ui: >
            Plot height in pixels (300 to 800).

    - name: seed
      title: Random seed
      type: Integer
      default: 20250101
      min: 0
      description:
          R: >
            Seed for reproducible bootstrap intervals and stochastic statistical
            methods.
          ui: >
            Integer random seed for reproducible bootstrap confidence intervals
            and stochastic p-values.

...
