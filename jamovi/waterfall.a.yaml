---
name: waterfall
title: 'Treatment Response: Patient-Level Burden'
menuGroup: OncoPath
menuSubgroup: 'Patient Follow-Up Plots'
menuSubtitle: 'One burden value per patient or visit'
version: '1.0.53'
jas: '1.2'

description:
    main: >
        Use this when you have one tumour burden number per patient: either a percent
        change from baseline you have already calculated (one row per patient), or a single
        measurement recorded at each visit (one row per patient per visit). It draws waterfall
        and spider plots, assigns each patient a best response from their largest shrinkage
        from baseline, and reports ORR and DCR with exact binomial confidence intervals,
        group comparison, time to response and duration of response. When a time variable is
        supplied, progression is measured against the patient's smallest recorded burden
        (nadir), not against baseline.
        Categories are named CR, PR, SD and PD and the thresholds are adapted from RECIST
        v1.1, but this is NOT a RECIST v1.1 implementation: because it never sees individual
        lesions it cannot sum target lesions, detect a new lesion, or judge non-target
        progression, and it cannot apply the 4-week confirmation rule itself (you may supply
        your own confirmation column). If your data list each lesion separately, use the
        lesion-level RECIST v1.1 analysis. It will be available in upcoming releases.

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: patientID
      title: Patient ID Variable
      type: Variable
      default: null
      suggested: [nominal]
      permitted: [numeric, factor, id]
      description:
          R: >
            Variable containing patient identifiers (e.g., PT001, Patient_1, Study_ID).
            Each patient should have a unique identifier for proper analysis.
          jamovi: >
            Variable containing patient identifiers (e.g., PT001, Patient_1, Study_ID).
            Each patient should have a unique identifier for proper analysis.

    - name: responseVar
      title: Response Value (Raw or Percentage)
      type: Variable
      default: null
      suggested: [continuous]
      permitted: [numeric]
      description:
          R: >
            Response variable: either raw tumor measurements (mm, cm, sum of diameters) or
            pre-calculated percentage changes from baseline.
            For raw measurements: requires time variable with baseline at time = 0.
            For percentages: negative values = tumor shrinkage (good response),
            positive values = tumor growth (poor response). Example: -30 means 30 percent decrease.
          jamovi: >
            Response variable: tumor measurements or percentage changes from baseline.
            • Raw measurements: actual tumor sizes (mm, cm, sum of diameters)
            • Percentage changes: pre-calculated changes (-30 = 30 percent shrinkage = good response)
            Tip: Use percentage format if changes already calculated, raw format for actual measurements.


    - name: timeVar
      title: Time Variable (Required for Spider Plot)
      type: Variable
      suggested: [continuous]
      permitted: [numeric]
      default: null
      description:
          R: >
            Time point of measurement (e.g., months from baseline, days from treatment start).
            Required for spider plot and raw measurement processing. Baseline should be time = 0.
          jamovi: >
            Time point of measurement for tracking response over time.
            • Examples: months from baseline, weeks from treatment start
            • Required for: Spider plot visualization and raw measurement processing
            • Format: Baseline = 0, follow-up = positive numbers (1, 2, 3, etc.)
            Tip: Spider plots show treatment response trajectories over time.

    - name: groupVar
      title: Group Variable
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor, numeric]
      default: null
      description:
          R: >
            Optional grouping variable for coloring bars by patient groups (e.g., treatment arms, disease subtypes).
            When specified, overrides RECIST category coloring to show group-based colors.
          jamovi: >
            Optional grouping variable for coloring bars by patient groups (e.g., treatment arms, disease subtypes).
            When specified, overrides RECIST category coloring to show group-based colors.


    - name: inputType
      title: Data Input Type
      type: List
      options:
        - title: "Percentage Changes"
          name: percentage
        - title: "Raw Measurements"
          name: raw
      default: percentage
      description:
          R: >
            Specify data format: 'raw' for actual tumor measurements (requires time variable)
            or 'percentage' for pre-calculated percentage changes from baseline
          jamovi: >
            Choose your data format:
            • Percentage Changes: Pre-calculated changes from baseline (-30 = 30 percent shrinkage)
            • Raw Measurements: Actual tumor sizes (requires Time Variable for baseline calculation)
            Most oncology studies use percentage changes. Use raw measurements only if you have
            actual tumor measurements and want automatic percentage calculation.


    - name: sortBy
      title: Sort By
      type: List
      options:
        - title: Best Response
          name: response
        - title: Patient ID
          name: id
      default: response
      description:
          R: >
            Sort the waterfall plot by best response or patient ID.
          jamovi: >
            Sort the waterfall plot by best response or patient ID.

    - name: sortDirection
      title: Sort Direction
      type: List
      options:
        - title: "Conventional (worst on left, best on right)"
          name: conventional
        - title: "Reverse (best on left, worst on right)"
          name: reverse
      default: conventional
      description:
          R: >
            Direction for the response sort. 'conventional' places the highest
            (worst) response on the left and the lowest (best, most negative) on
            the right, following the standard oncology waterfall convention.
          jamovi: >
            Direction for the response sort. Conventional = worst (highest) on the
            left, best (lowest/most negative) on the right — the standard oncology
            waterfall layout.

    - name: showBaseline
      title: Baseline (Y = 0) line
      type: Bool
      default: true
      description:
          R: >
            Draw a horizontal reference line at 0 percent change to mark the
            baseline.
          jamovi: >
            Draw a horizontal reference line at 0% change to mark the baseline.

    - name: confirmationVar
      title: Confirmation Status (optional)
      type: Variable
      suggested: [nominal]
      permitted: [factor]
      default: NULL
      description:
          R: >
            Optional categorical variable indicating response confirmation status
            (e.g., Confirmed vs Unconfirmed CR/PR). A distinct marker is drawn at
            each bar tip according to the level of this variable.
          jamovi: >
            Optional variable indicating confirmation status (e.g., Confirmed vs
            Unconfirmed). A distinct marker is drawn at each bar tip per level.

    - name: ongoingVar
      title: On-Treatment / Ongoing (optional)
      type: Variable
      suggested: [nominal]
      permitted: [factor, numeric]
      default: NULL
      description:
          R: >
            Optional variable flagging patients still on treatment / with an
            ongoing response. Truthy values (TRUE, non-zero, or text matching
            yes/y/true/on/ongoing/1) draw an upward arrow at the bar tip.
          jamovi: >
            Optional flag for patients still on treatment / ongoing response.
            'Yes'/TRUE/1 draws an upward arrow at the bar tip.

    - name: responseCategoryVar
      title: Response Category Override (optional)
      type: Variable
      suggested: [nominal]
      permitted: [factor]
      default: NULL
      description:
          R: >
            Optional per-patient RECIST category (CR/PR/SD/PD). When supplied it
            overrides the category computed from the percentage value, so a patient
            with target-lesion shrinkage can still be classified PD (e.g., a new
            lesion). Affects both bar coloring and response metrics (ORR/DCR).
          jamovi: >
            Optional per-patient RECIST category (CR/PR/SD/PD). When supplied it
            overrides the category computed from the % value — e.g., a shrinking
            tumor can still be PD due to a new lesion. Affects coloring and metrics.

    - name: showCategoryLabels
      title: Response category above each bar
      type: Bool
      default: false
      description:
          R: >
            Print the response category (CR, PR, SD, PD) above each waterfall bar, so
            the category can be read directly instead of being mapped back from the
            bar colour.

    - name: showSpiderLabels
      title: Label each spider line with the patient ID
      type: Bool
      default: false
      description:
          R: >
            Label the end of every spider trajectory with its patient ID, so an
            outlying line can be traced to a patient without reading a large legend.

    - name: annotationVars
      title: Annotation Tracks (below the bars)
      type: Variables
      default: NULL
      description:
          R: >
            Optional patient-level variables drawn as coloured tracks beneath the
            waterfall bars, aligned to the same patient ordering. One row of tiles per
            variable. Use for biomarker status, mutation, prior therapy, treatment arm
            or any covariate you want read off against each patient's response.
          jamovi: >
            Optional. Variables shown as coloured annotation rows under the waterfall,
            aligned with each patient's bar.

    - name: showThresholds
      title: RECIST thresholds
      type: Bool
      default: true
      description:
          R: >
            Show +20 percent and -30 percent RECIST v1.1 thresholds as dashed lines.
            Helps identify Progressive Disease (PD) and Partial Response (PR) cutoffs.
          jamovi: >
            Show RECIST v1.1 threshold lines on plots:
            • -30 percent line: Partial Response (PR) cutoff - tumor shrinkage threshold
            • +20 percent line: Progressive Disease (PD) cutoff - tumor growth threshold
            Recommended: Keep enabled for clinical interpretation

    - name: labelOutliers
      title: Label large changes
      type: Bool
      default: false
      description:
          R: >
            Label responses exceeding the specified threshold.
          jamovi: >
            Label responses exceeding the specified threshold.

    - name: showMedian
      title: Median response
      type: Bool
      default: false
      description:
          R: >
            Show median response as a horizontal line.
          jamovi: >
            Show median response as a horizontal line.

    - name: showCI
      title: Confidence interval
      type: Bool
      default: false
      description:
          R: >
            Show confidence interval around median response.
          jamovi: >
            Show confidence interval around median response.

    - name: minResponseForLabel
      title: Minimum Response for Labels ( percent)
      type: Number
      default: 50
      min: 0
      max: 100
      description:
          R: >
            Minimum response value for labels to be displayed.
          jamovi: >
            Minimum response value for labels to be displayed.


    - name: colorBy
      title: Color By
      type: List
      options:
        - title: RECIST Categories (CR/PR/SD/PD)
          name: recist
        - title: Patient Groups
          name: group
      default: recist
      description:
          R: >
