        - title: Colorful (for groups)
          name: colorful
        - title: Colorblind-Safe (Okabe-Ito)
          name: colorblind
      default: classic
      description:
          R: >
            Color scheme for spider plot lines and points.
          jamovi: >
            Color scheme for spider plot lines and points.

    - name: timeUnitLabel
      title: Spider Plot Time Unit Label
      type: List
      options:
        - title: Generic (Time)
          name: generic
        - title: Days
          name: days
        - title: Weeks
          name: weeks
        - title: Months
          name: months
        - title: Years
          name: years
      default: generic
      description:
          R: >
            Label to use for the spider plot time axis. Does not rescale data; only affects axis labeling.
          jamovi: >
            Choose the time unit label for the spider plot x-axis (for display only). Does not change your data values.

    # Clinical Reporting Options
    - name: generateCopyReadyReport
      title: Copy-ready report
      type: Bool
      default: false
      description:
          R: >
            Generate publication-ready result sentences with statistical details
          jamovi: >
            Generate copy-ready sentences for manuscripts and reports:
            • Auto-filled with your results (ORR, DCR, confidence intervals)
            • Publication-ready language following oncology standards
            • Copy-paste directly into manuscripts or clinical reports
            Recommended for publication or clinical documentation

    - name: showClinicalSignificance
      title: Clinical significance thresholds
      type: Bool
      default: false
      description:
          R: >
            Display clinical significance interpretations for ORR and DCR
          jamovi: >
            Add clinical significance context to results:
            • ORR thresholds: <15 percent (low), 15-30 percent (moderate), >30 percent (promising)
            • DCR interpretations with clinical relevance
            • Sample size adequacy assessment
            Helps interpret results in clinical context

    - name: showConfidenceIntervals
      title: Confidence intervals for clinical metrics
      type: Bool
      default: true
      description:
          R: >
            Calculate and display exact binomial confidence intervals for ORR and DCR
          jamovi: >
            Add statistical confidence intervals to clinical metrics:
            • Exact binomial CIs for ORR and DCR (more accurate than normal approximation)
            • Helps assess precision of response rate estimates
            • Essential for clinical trial reporting
            Recommended: Keep enabled for statistical rigor

    - name: enableGuidedMode
      title: Guided analysis mode
      type: Bool
      default: false
      description:
          R: >
            Enable step-by-step guidance for new users
          jamovi: >
            Enable guided mode with step-by-step instructions:
            • Walks through variable selection and options
            • Provides contextual help and best practice recommendations
            • Includes misuse detection and warnings
            Recommended for new users or complex analyses

    - name: showExplanations
      title: Analysis explanations
      type: Bool
      default: false
      description:
          R: >
            Display comprehensive explanation of what this analysis does, when to use it,
            data requirements, and key assumptions/limitations
          jamovi: >
            Show detailed explanations at the bottom of results:
            • What this analysis does (waterfall and spider plots)
            • When to use this analysis (clinical trials, response monitoring)
            • Data requirements (patient ID, response data, time variable)
            • Key assumptions and limitations (RECIST thresholds, baseline handling)
            Recommended for new users or when documenting analysis methods

    - name: showResponseDuration
      title: Time-to-response & duration of response (KM)
      type: Bool
      default: false
      description:
          R: >
            Show a censoring-aware time-to-response (TTR) and duration-of-response (DoR)
            table. DoR is summarized with the Kaplan-Meier median (accounting for responders
            still in response at last follow-up), which the naive median understates.
          jamovi: >
            Add a dedicated efficacy table with:
            • Median time to first response (RECIST PR or better)
            • Kaplan-Meier median duration of response (censoring-aware)
            • Number of responders and events
            Requires a time variable and raw (per-visit) input.

    - name: addResponseCategory
      title: Add Response Category to Data
      type: Output
      description:
          R: >
            Add a new variable to the data frame indicating response category (CR/PR/SD/PD).
          jamovi: >
            Add RECIST response categories (CR/PR/SD/PD) as a new variable to your dataset.

    - name: seed
      title: Random Seed
      type: Integer
      default: 123
      description:
          R: >
            Random seed for the reproducible bootstrap confidence interval of the
            median response (used when 'Show Confidence Interval' is enabled).
            Change it to draw a different bootstrap sample; the default (123)
            reproduces the previous fixed behaviour.



