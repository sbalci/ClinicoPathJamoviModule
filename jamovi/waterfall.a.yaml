    - name: showSpiderPlot
      title: Spider plot
      type: Bool
      default: false
      description:
          R: >
            Display spider plot showing response trajectories over time (requires time variable).
          jamovi: >
            Display spider plot showing response trajectories over time (requires time variable).

    - name: spiderColorBy
