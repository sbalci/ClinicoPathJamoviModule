---
name:  mixedcox
title: Mixed-Effects Cox Regression
menuGroup: SurvivalD
menuSubgroup: ClinicoPath Survival
menuSubtitle: 'Cox models with random effects for clustered data'
version: '0.0.1'
jas: '1.2'

description:
    main: >-
        Performs Cox proportional hazards regression with random effects for 
        clustered or hierarchical survival data. This method accounts for 
        correlation within clusters (e.g., patients within hospitals, multiple 
        events per patient) using mixed-effects modeling. The random effects 
        capture cluster-specific variation while estimating population-level 
        fixed effects.
    # R:
    #     dontrun: true
    #     usage: |
    #         # Example 1: Patients clustered within hospitals
    #         library(survival)
    #         library(coxme)
            
    #         mixedcox(
    #             data = hospital_data,
    #             elapsedtime = "time",
    #             outcome = "status",
    #             outcomeLevel = "1",
    #             fixed_effects = c("age", "sex", "treatment"),
    #             cluster_var = "hospital_id",
    #             random_effects = "intercept"
    #         )
            
    #         # Example 2: Multiple tumors per patient
    #         mixedcox(
    #             data = tumor_data,
    #             elapsedtime = "survival_time",
    #             outcome = "recurrence",
    #             outcomeLevel = "Yes",
    #             fixed_effects = c("tumor_size", "grade", "stage"),
    #             continuous_effects = c("age", "biomarker_level"),
    #             cluster_var = "patient_id",
    #             random_effects = "slope",
    #             random_slope_var = "treatment"
    #         )

options:

# Data ----

    - name: data
      type: Data
      description:
          R: >
            The dataset for analysis, provided as a data frame. Should contain
            survival variables, fixed effects, and clustering variables.

# Time Variables ----

    - name: elapsedtime
      title: 'Time Elapsed'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
        R: >
          The numeric variable representing follow-up time until the event or censoring.

    - name: tint
      title: Using Dates to Calculate Survival Time
      type: Bool
      default: false
      description:
        R: >
          If true, survival time is calculated in days from the diagnosis and
          follow-up dates, and the elapsed-time variable is not used. Rows
          with an empty or missing date are excluded and counted in a note; a
          non-blank date that does not have the selected layout (4-digit year,
          with '-', '/' or '.' between the parts) stops the analysis with a
          message, because a wrong day-month order would otherwise give wrong
          survival times.

    - name: dxdate
      title: 'Diagnosis Date'
      type: Variable
      default: NULL
      description:
        R: >
          Date of diagnosis or start of follow-up. Required if tint = true.

    - name: fudate
      title: 'Follow-up Date'
      type: Variable
      default: NULL
      description:
        R: >
          Follow-up date or date of last observation. Required if tint = true.

    - name: timetypedata
      title: 'Time Type in Data'
      type: List
      options:
        - title: 'Year-Month-Day'
          name: ymd
        - title: 'Month-Day-Year'
          name: mdy
        - title: 'Day-Month-Year'
          name: dmy
      default: ymd
      description:
        R: >
          Specifies the format of date variables in the input data.

# Outcome Variables ----

    - name: outcome
      title: 'Outcome'
      type: Variable
      suggested: [ ordinal, nominal, continuous ]
      permitted: [ factor, numeric ]
      default: NULL
      description:
        R: >
          The outcome variable indicating event status (e.g., death, recurrence).

    - name: outcomeLevel
      title: Event Level
      type: Level
      variable: (outcome)
      description:
        R: >
          The level of outcome considered as the event.

# Fixed Effects ----

    - name: fixed_effects
      title: Fixed Effects (Categorical)
      type: Variables
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      default: NULL
      description:
        R: >
          Categorical variables for fixed effects in the mixed-effects model.

    - name: continuous_effects
      title: Fixed Effects (Continuous)
      type: Variables
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
        R: >
          Continuous variables for fixed effects in the mixed-effects model.

# Random Effects and Clustering ----

    - name: cluster_var
      title: 'Clustering Variable'
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      default: NULL
      description:
        R: >
          Variable defining clusters (e.g., hospital, patient, family).
          Observations within the same cluster are assumed correlated.

    - name: random_effects
      title: 'Random Effects Type'
      type: List
      options:
        - title: Random Intercept Only
          name: intercept
        - title: Random Slope Only
          name: slope
        - title: Random Intercept and Slope
          name: both
      default: intercept
      description:
        R: >
          Type of random effects to include in the model.

    - name: random_slope_var
      title: 'Random Slope Variable'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
        R: >
          Numeric variable whose effect varies between clusters when
          random_effects includes slopes (coxme cannot fit random slopes for
          categorical variables). It is added to the fixed effects if it is not
          already there, so the cluster slopes vary around a population slope.

    - name: nested_clustering
      title: 'Nested Clustering'
      type: Bool
      default: false
      description:
        R: >
          Whether to model nested clustering structure (e.g., patients within
          hospitals). Used only with random_effects = "intercept"; it is
          ignored, with a note, for random-slope models.

    - name: nested_cluster_var
      title: 'Nested Cluster Variable'
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      default: NULL
      description:
        R: >
          Higher-level clustering variable for nested structures (random
          intercept models only).

# Model Options ----

    - name: sparse_matrix
      title: 'Use Sparse Matrix Methods'
      type: Bool
      default: true
      description:
        R: >
          Use coxme's sparse approximation for the random intercept
          (coxme.control(sparse = c(50, 0.02)), the coxme default): when the
          grouping has at least 50 levels, the second-derivative terms
          between groups that each hold 2 percent or less of the rows are
          treated as zero. It is an approximation that can change the
          estimates slightly. With nested clustering the grouping is the
          (higher-level, cluster) pairs and more than 50 of them are needed,
          so a clustering variable with few levels (for example wards
          numbered 1 to 5 in every hospital) is still approximated when it
          is nested in enough higher-level units. Random-slope-only models
          are never approximated. When false, the full (non-sparse) matrix
          is always used.

    - name: icc_calculation
      title: 'Show Approximate Latent-Scale Variance Fraction'
      type: Bool
      default: true
      description:
        R: >
          Show an approximate variance fraction on the latent log-hazard scale,
          sigma^2 / (sigma^2 + pi^2/6), where pi^2/6 is the variance of the
          standard extreme-value error of a proportional-hazards model. Nested
          models use both variance components; intercept-and-slope models
          report it at a slope-variable value of 0. It is not an intracluster
          correlation of observed event times and is not shown for
          random-slope-only models.

# Output Options ----

    - name: show_fixed_effects
      title: 'Show Fixed Effects Table'
      type: Bool
      default: true
      description:
        R: >
          Display table of fixed effects estimates.

    - name: show_random_effects
      title: 'Show Random Effects Summary'
      type: Bool
      default: true
      description:
        R: >
          Display summary of random effects variance components.

    - name: show_model_comparison
      title: 'Show Model Comparison'
      type: Bool
      default: true
      description:
        R: >
          Display the standard Cox and mixed-effects (integrated) log partial
          likelihoods and their likelihood-ratio statistic, truncated at 0.
          When the model has a single variance component, a boundary-corrected
          p-value from the 50:50 mixture of chi-square(0) and chi-square(1) is
          shown (half the chi-square(1) tail probability, or 1 when the
          statistic is 0); models with several variance parameters get no
          p-value.

...
