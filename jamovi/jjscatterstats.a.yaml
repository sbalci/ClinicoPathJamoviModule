---
name:  jjscatterstats
title: Scatter Plot
menuGroup: JJStatsPlot
menuSubgroup: Continuous vs Continuous
# menuSubtitle: Scatter Plot
version: '1.2.0'
jas: '1.2'



description:
    main: >
        Wrapper Function for ggstatsplot::ggscatterstats and
        ggstatsplot::grouped_ggscatterstats to generate scatter plots
        with correlation analysis and optional marginal distributions.
    R:
        dontrun: true
        usage: |
            # Load test data
            data("mtcars")

            # Basic scatter plot with Pearson correlation
            jjscatterstats(
              data = mtcars,
              dep = "mpg",
              group = "hp",
              typestatistics = "parametric",
              conflevel = 0.95,
              k = 2
            )

            # Scatter plot with marginal histograms
            jjscatterstats(
              data = mtcars,
              dep = "mpg",
              group = "hp",
              marginal = TRUE,
              xsidefill = "#009E73",
              ysidefill = "#D55E00",
              pointsize = 4,
              pointalpha = 0.6,
              smoothlinesize = 2,
              smoothlinecolor = "red"
            )

            # Grouped scatter plot by number of cylinders
            jjscatterstats(
              data = mtcars,
              dep = "mpg",
              group = "hp",
              grvar = "cyl",
              typestatistics = "nonparametric",
              bfmessage = FALSE,
              resultssubtitle = TRUE
            )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.


    - name: dep
      title: 'x-axis (First Variable)'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            First continuous variable for correlation analysis (e.g., biomarker levels, age, tumor size). 
            This will appear on the horizontal axis. Use numeric variables like lab values, measurements, or scores.

    - name: group
      title: 'y-axis (Second Variable)'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            Second continuous variable for correlation analysis (e.g., expression levels, treatment response, tumor size).
            This will appear on the vertical axis. Use independent, uncensored numeric variables that you want to
            correlate with the x-axis variable (for right-censored survival time, use survival analysis instead).

    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Optional categorical variable to create separate correlation plots for each group
            (e.g., by treatment group, tumor stage, or gender). Creates multiple panels for comparison.

    - name: colorvar
      title: 'Color Variable (Optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor, numeric ]
      description:
          R: >
            Optional variable to map point colors. When specified, adds an enhanced scatter plot
            with ggplot2 aesthetic mappings alongside the main ggstatsplot correlation plot.

    - name: sizevar
      title: 'Size Variable (Optional)'
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            Optional continuous variable to map point sizes. When specified, adds an enhanced scatter plot
            with ggplot2 aesthetic mappings alongside the main ggstatsplot correlation plot.

    - name: shapevar
      title: 'Shape Variable (Optional)'
      type: Variable
      default: NULL
      suggested: [ nominal, ordinal ]
      permitted: [ factor ]
      description:
          R: >
            Optional categorical variable to map point shapes. When specified, adds an enhanced scatter plot
            alongside the main plot. Works best with variables having 6 or fewer levels.

    - name: alphavar
      title: 'Alpha Variable (Optional)'
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            Optional continuous variable to map point transparency (alpha). When specified, adds an enhanced scatter plot
            alongside the main plot.

    - name: labelvar
      title: 'Label Variable (Optional)'
      type: Variable
      default: NULL
      suggested: [ nominal, id ]
      permitted: [ factor, numeric ]
      description:
          R: >
            Optional variable to label points. Uses ggrepel to avoid overlapping labels.

    - name: showRugPlot
      title: "Rug plot"
      type: Bool
      default: false
      description:
          R: >
            Add rug plot along axes to show data distribution.

    - name: marginalType
      title: 'Marginal Plot Type'
      type: List
      options:
        - title: None
          name: none
        - title: Histogram
          name: histogram
        - title: Density
          name: density
        - title: Boxplot
          name: boxplot
      default: none
      description:
          R: >
            Add marginal distribution plots using ggExtra package.

    - name: smoothMethod
      title: 'Smooth Method'
      type: List
      options:
        - title: Linear Model (lm)
          name: lm
        - title: LOESS (loess)
          name: loess
        - title: GAM (gam)
          name: gam
      default: lm
      description:
          R: >
            Method for the fitted smooth trend line on the scatter plots.



    - name: typestatistics
      title: 'Statistical Test Type'
      type: List
      options:
        - title: Parametric (Pearson) - for normally distributed data
          name: parametric
        - title: Nonparametric (Spearman) - for skewed data or ordinal scales
          name: nonparametric
        - title: Robust (Winsorized Pearson) - handles outliers well
          name: robust
        - title: Bayesian - provides evidence strength
          name: bayes
      default: parametric
      description:
          R: >
            Choose based on your data distribution. Pearson assumes bivariate normality and a
            linear relationship (common for lab values after transformation).
            Spearman works for any monotonic relationship (tumor grades, symptom scores), using
            exact permutation p-values when untied (n <= 1290) and Bonett-Wright confidence intervals.
            Robust uses a 20% two-sided WINSORIZED PEARSON correlation (Wilcox df = n - 2g - 2 with
            seeded percentile-bootstrap confidence intervals), pulling extreme values in to the 20th
            and 80th percentiles before computing Pearson's r; report it by that name, not as a
            percentage-bend correlation. Bayesian analysis uses a shifted Beta(1.41, 1.41) prior
            (rscale = 0.707) and reports log_e(BF01) alongside the posterior median and highest-density
            credible interval at the selected confidence level.


    - name: seed
      title: Random seed
      type: Integer
      default: 20250101
      description:
          R: >
            Random seed for the statistics computed by resampling or posterior sampling (robust tests, Bayesian estimates, and some nonparametric effect-size intervals). The plot caption names the seed whenever it affected the numbers shown. The default reproduces the previous fixed behavior.

    - name: mytitle
      title: Title
      type: String
      default: ''
      description:
          R: >
            Optional custom plot title. When empty, a default title is constructed from the selected variable names.

    - name: xtitle
      title: X-Title
      type: String
      default: ''
      description:
          R: >
            Optional custom x-axis label. When empty, the x-axis variable name is used.

    - name: ytitle
      title: Y-Title
      type: String
      default: ''
      description:
          R: >
            Optional custom y-axis label. When empty, the y-axis variable name is used.


    - name: originaltheme
      title: GGStatsPlot theme layer
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme layer instead of the active jamovi theme.

    - name: resultssubtitle
      title: Statistical results
      type: Bool
      # Deliberately NOT default:false. The module-wide "checkboxes default to false to
      # reduce compute" policy does not fit here: this option carries the correlation
      # coefficient, its confidence interval, the p-value and n -- the entire statistical
      # output of a correlation analysis. With it off the default result is a scatter plot
      # reporting no correlation at all (verified: the subtitle is absent, not empty).
      default: true
      description:
          R: >
            Display the statistical correlation subtitle (coefficient, confidence or credible interval, p-value or Bayes factor, and sample size) on the plots.

    - name: conflevel
      title: Confidence Level
      type: Number
      default: 0.95
      min: 0.50
      max: 0.999
      description:
          R: >
            Confidence level for confidence intervals (between 0.50 and 0.999).

    - name: bfmessage
      title: Bayes factor for the null (BF01)
      type: Bool
      default: false
      description:
          ui: >
            Adds a caption reporting the Bayes factor in favor of NO association.
            Applies to the parametric (Pearson) test only.
          R: >
            Adds a caption below the plot reporting log(BF01), the Bayes factor in favor
            of the NULL hypothesis of no association. Note the direction: BF01 is the
            RECIPROCAL of the more commonly quoted BF10, so a large negative log(BF01) is
            strong evidence FOR an association, not against it. This applies to the
            parametric (Pearson) test only; under the Bayesian test type it has no effect,
            because the Bayes factor already appears in the subtitle.

    - name: k
      title: Decimal Places
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of decimal places for displaying statistics in the subtitle.

    - name: marginal
      title: Marginal histograms
      type: Bool
      default: false
      description:
          R: >
            Whether to display marginal histogram plots on the axes using ggside.

    - name: xsidefill
      title: X-axis Marginal Fill Color
      type: String
      default: '#009E73'
      description:
          R: >
            Fill color for x-axis marginal histogram.

    - name: ysidefill
      title: Y-axis Marginal Fill Color
      type: String
      default: '#D55E00'
      description:
          R: >
            Fill color for y-axis marginal histogram.

    - name: pointsize
      title: Point Size
      type: Number
      default: 3
      min: 0.1
      max: 10
      description:
          R: >
            Size of the scatter plot points.

    - name: pointalpha
      title: Point Transparency
      type: Number
      default: 0.4
      min: 0
      max: 1
      description:
          R: >
            Transparency level for scatter plot points.

    - name: smoothlinesize
      title: Smooth Line Size
      type: Number
      default: 1.5
      min: 0.1
      max: 5
      description:
          R: >
            Width of the regression/smooth line.

    - name: smoothlinecolor
      title: Smooth Line Color
      type: String
      default: 'blue'
      description:
          R: >
            Color of the regression/smooth line.

    - name: plotwidth
      title: Plot Width
      type: Integer
      default: 600
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels. Default is 600.

    - name: plotheight
      title: Plot Height
      type: Integer
      default: 450
      min: 300
      max: 800
      description:
          R: >
            Height of the plot in pixels. Default is 450.

    - name: addGGPubrPlot
      title: Publication-ready plot (ggpubr)
      type: Bool
      default: false
      description:
          R: >
            Add publication-ready scatter plot using ggpubr package.

    - name: ggpubrPalette
      title: ggpubr Color Palette
      type: List
      options:
        - title: Journal of Clinical Oncology (jco)
          name: jco
        - title: Nature Publishing Group (npg)
          name: npg
        - title: AAAS Science
          name: aaas
        - title: Lancet
          name: lancet
        - title: JAMA
          name: jama
        - title: New England Journal of Medicine (nejm)
          name: nejm
      default: jco
      description:
          R: >
            Color palette for ggpubr scatter plot.

    - name: ggpubrAddCorr
      title: Correlation coefficient (ggpubr)
      type: Bool
      default: false
      description:
          R: >
            Add correlation statistics to ggpubr scatter plot.

    - name: ggpubrCorrMethod
      title: Correlation Method (ggpubr)
      type: List
      options:
        - title: Pearson
          name: pearson
        - title: Spearman
          name: spearman
      default: pearson
      description:
          R: >
            Method for correlation in ggpubr plot.

    - name: ggpubrAddSmooth
      title: Smooth trend line (ggpubr)
      type: Bool
      default: false
      description:
          R: >
            Add smoothed trend line to ggpubr scatter plot.

    - name: showSummary
      title: Summary (natural-language)
      type: Bool
      default: false
      description:
          ui: >
            Display a copy-ready natural-language summary of the correlation results
          R: >
            Display a copy-ready plain-language summary paragraph reporting the correlation
            coefficient, confidence or credible interval, p-value or Bayes factor, sample size,
            and clinical magnitude/direction interpretation.

    - name: showExplanations
      title: Explanations
      type: Bool
      default: false
      description:
          ui: >
            Show explanations of the statistical results
          R: >
            Show explanations of the statistical results

    - name: clinicalPreset
      title: Clinical Preset
      type: List
      options:
        - title: Custom
          name: custom
        - title: Biomarker Correlation
          name: biomarker_correlation
        - title: Treatment Response Analysis
          name: treatment_response_analysis
        - title: Publication Ready
          name: publication_ready
      default: custom
      description:
          ui: >
            Apply a preset for a specific clinical analysis
          R: >
            Clinical analysis preset

...
