---
name: ihcheterogeneity
title: IHC Heterogeneity Analysis
menuGroup: OncoPath
menuSubgroup: IHC Analysis
version: '1.0.81'
jas: '1.2'

description:
    main: >
        Quantifies how well regional IHC measurements (biopsies, cores, fields) represent a case.
        With a reference measurement (whole section, hotspot or overall score) it reports the
        Spearman correlation of each region with the reference, the absolute-agreement ICC(2,1),
        the per-case coefficient of variation, and, for each region, the mean difference from the
        reference with its 95 percent CI and Bland-Altman limits of agreement. Without a reference
        it compares the regions with one another. Each difference is judged against a margin set
        by the user (bias_margin, default 5 percent of the comparison mean): ruled out when its
        90 percent CI lies inside the margin (two one-sided tests), shown to be material when a
        Bonferroni-adjusted CI lies entirely beyond it, and inconclusive otherwise. Optional
        variance components, sample-size planning for ICC precision (Bonett 2002) and
        comparisons between spatial compartments.
    R:
        dontrun: true
        usage: |
            data('ihcheterogeneity_test', package = 'ClinicoPath')

            # Three regional Ki67 scores against the whole-section score
            ihcheterogeneity(
                data = ihcheterogeneity_test,
                wholesection = 'wholesection',
                biopsy1 = 'biopsy1',
                biopsy2 = 'biopsy2',
                biopsy3 = 'biopsy3',
                bias_margin = 5)

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: wholesection
      title: "Overall / Whole Slide / HotSpot (Optional)"
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Optional reference measurement for comparison with regional measurements. Can be whole section average,
            hotspot area, or overall tumor measurement. Leave empty for inter-regional comparison studies.
            Example: Ki67 proliferation index (0-100 percent), ER H-score (0-300), PR percentage (0-100 percent).
      default: NULL
    - name: biopsy1
      title: Regional Measurement 1
      type: Variable
      default: NULL
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Continuous biomarker measurement from first tissue region or area.
            Should represent same biomarker as reference measurement for heterogeneity comparison.
            Example: Ki67  percent from tumor periphery, ER H-score from invasive front.

    - name: biopsy2
      title: Regional Measurement 2 (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Second tissue region biomarker measurement for heterogeneity analysis
      default: NULL

    - name: biopsy3
      title: Regional Measurement 3 (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Third tissue region biomarker measurement
      default: NULL

    - name: biopsy4
      title: Regional Measurement 4 (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Fourth tissue region biomarker measurement
      default: NULL

    - name: biopsies
      title: Additional regional measurements
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            Further regional measurements, any number, analysed like Regional Measurements 1 to 4.
      default: NULL

    - name: spatial_id
      title: Spatial Region ID (Optional)
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      description:
          R: >
            The compartment each case was sampled from (e.g., Central/Invasive,
            Preinvasive/Invasive): one row per case, one compartment per case. Data with one row per
            case and compartment count each case once per row, as if they were different patients,
            which overstates the sample and narrows every interval. Compartments are listed in the level order of the variable;
            cases without an identifier are left out of the compartment tables. In R, convert a
            haven-labelled code column with haven::as_factor() first, or the codes are shown
            instead of the labels.
      default: NULL

    - name: compareCompartments
      title: Spatial compartment comparison
      type: Bool
      default: false
      description:
          R: >
            Compares the ICC, the within-case CV and, when a reference is supplied, the mean
            bias between spatial compartments. Requires the Spatial Region ID variable;
            compartments need at least 3 cases.

    - name: compartmentTests
      title: Compartment comparison tests
      type: Bool
      default: false
      description:
          R: >
            Tests whether heterogeneity differs between compartments: Kruskal-Wallis test on the
            per-case CV (is one compartment more heterogeneous?), Brown-Forsythe test on the spread
            of per-case CVs, and Kruskal-Wallis test on the per-case mean biomarker level.
            Compartments need at least 3 cases.

    - name: analysis_type
      title: Analysis focus
      type: List
      options:
        - name: reproducibility
          title: 'Reproducibility & Bias Assessment'
        - name: variability
          title: "Variance component analysis"
        - name: comprehensive
          title: 'Comprehensive Analysis'
      default: comprehensive
      description:
          R: >
            Primary focus of the heterogeneity analysis. (The former 'bias' level
            was merged into 'reproducibility': the two were computationally
            identical - the bias table is always computed when a reference is
            supplied.)

    - name: sampling_strategy
      title: Sampling strategy
      type: List
      options:
        - name: random
          title: 'Random Sampling'
        - name: systematic
          title: 'Systematic Sampling'
        - name: stratified
          title: 'Stratified Sampling'
        - name: unknown
          title: 'Not specified'
      default: unknown
      description:
          R: >
            How the regions were chosen. Recorded for reporting only: it changes no computation,
            and systematic or stratified sampling adds a note on how to read the estimates.

    - name: cv_threshold
      title: CV Threshold for Acceptable Variability
      type: Number
      min: 5.0
      max: 50.0
      default: 20.0
      description:
          R: >
            Largest acceptable within-case coefficient of variation (the root mean square of the
            per-case CVs), in percent. The CV is graded
            low at or below half of this value, moderate up to it and high above it. Choose it for
            your marker and scoring method before looking at the results.

    - name: correlation_threshold
      title: Minimum acceptable correlation
      type: Number
      min: 0.50
      max: 0.99
      default: 0.80
      description:
          R: >
            Smallest acceptable Spearman correlation. With a reference, the mean correlation of the
            regions with the reference is graded, unless a region is shown to fall below the threshold
            (its upper 95 percent limit below it), in which case that region is graded; without a
            reference, the mean correlation between regions is graded. Choose it before looking at
            the results.

    - name: bias_margin
      title: Systematic difference margin (%)
      type: Number
      min: 0.5
      max: 50.0
      default: 5.0
      description:
          R: >
            Largest systematic difference, as a percentage of the comparison mean (the reference,
            or the other regions), that is still clinically acceptable. A difference is ruled out
            when its 90 percent CI lies inside the margin (two one-sided tests), and shown to be
            material when a Bonferroni-adjusted CI lies entirely beyond it; otherwise it is
            inconclusive. A difference shown to change with the level (proportional bias) is
            also judged at the 5th and 95th percentiles of the level, and is ruled out only when
            both ends lie inside the margin. Choose it before looking at the results.

    - name: show_variability_plots
      title: Variability plots
      type: Bool
      default: false
      description:
          R: >
            Show the regional-measurement, per-case CV and spatial plots. They are always shown
            under the Variance and Comprehensive focuses (Comprehensive is the default), so this
            option adds them under the Reproducibility focus.

    - name: variance_components
      title: Variance component analysis
      type: Bool
      default: false
      description:
          R: >
            Two-way random-effects decomposition into between-case, within-case and method
            variance. Always shown under the Variance and Comprehensive focuses (Comprehensive is
            the default), so this option adds it under the Reproducibility focus.

    - name: sample_size_planning
      title: Sample size for ICC precision
      type: Bool
      default: false
      description:
          R: >
            Number of cases needed to estimate the ICC with a 95 percent CI of width 0.20 or 0.10
            (Bonett 2002), at planning ICCs of 0.75 and 0.90 and at the observed ICC, for the
            number of measurements per case in this analysis. Always shown under the
            Comprehensive focus.

    - name: generate_recommendations
      title: Clinical recommendations
      type: Bool
      default: false
      description:
          R: >
            Recommendations on regions per case, calibration of systematic differences and
            quality control, derived from the results of this analysis.

    - name: showSummary
      title: Plain-language summary
      type: Bool
      default: false
      description:
          R: >
            Display natural-language summary of heterogeneity analysis results

    - name: showGlossary
      title: Statistical glossary
      type: Bool
      default: false
      description:
          R: >
            Display definitions of statistical terms (ICC, CV, correlation)

    - name: showReportSentences
      title: Copy-ready report sentences
      type: Bool
      default: false
      description:
          R: >
            Display pre-formatted sentences ready for clinical reports and publications

    - name: showAssumptions
      title: Methodology & assumptions
      type: Bool
      default: false
      description:
          R: >
            Display analysis assumptions, data requirements, and methodological considerations

...
