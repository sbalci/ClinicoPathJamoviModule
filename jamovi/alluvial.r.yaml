---
name:  alluvial
title: Alluvial Diagrams
jrs:   '1.1'

items:

    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
          - vars
          - weight
          - maxvars
          - engine
          - condensationvar
          - excl
          - fillGgalluvial
          - marg
          - usetitle
          - fill
          - curveType
          - colorPalette
          - themeStyle
          - enhancedGradients
          - orient
          - flowDirection
          - sankeyStyle
          - labelNodes
          - showCounts
          - plotSubtitle
          - mytitle

    - name: todo
      title: To Do
      type: Html
      clearWith:
          - vars

    - name: flowTable
      title: Flow Table
      type: Table
      visible: (showFlowTable)
      rows: 0
      columns:
        - name: path
          title: Path
          type: text
        - name: n
          title: Cases
          type: integer
        - name: pct
          title: Percent of cases
          type: number
          format: pc
        - name: w
          title: Weight total
          type: number
          visible: false
      clearWith:
          - vars
          - excl
          - maxvars
          - weight
          - engine
          - showFlowTable

    - title: Alluvial Diagrams
      name: plot
      type: Image
      width:  600
      height: 450
      renderFun: .plot
      clearWith:
          - vars
          - excl
          - marg
          - fill
          - orient
          - usetitle
          - mytitle
          - maxvars
          - colorPalette
          - showCounts
          - themeStyle
          - enhancedGradients
          - plotSubtitle
          - weight
          - fillGgalluvial
          - sankeyStyle
          - curveType
          - flowDirection
          - engine
          - labelNodes


    - name: condensationWarning
      title: Condensation Plot Information
      type: Html
      visible: (condensationvar)
      clearWith:
          - vars
          - condensationvar
          - excl

    - title: '`Condensation Plot ${condensationvar}`'
      name: plot2
      type: Image
      width:  600
      height: 450
      renderFun: .plot2
      clearWith:
          - vars
          - condensationvar
          - excl
          - colorPalette
          - themeStyle
      visible: (condensationvar)


refs:
    - easyalluvial
    - ggalluvial
    - ClinicoPathJamoviModule


...
