          - testPositive
          - goldNegative
          - testNegative

    - name:  nTable
      title: 'n'
      type: Table
      visible: (referenceType:legacy || referenceType:disease)
      swapRowsColumns: true
      rows:  1
      columns:
        - name: tablename
          title: ''
          type: text
        - name: TotalPop
          title: 'Total'
          type: number
        - name: DiseaseP
          title: 'Reference Positive'
          type: number
        - name: DiseaseN
          title: 'Reference Negative'
          type: number
        - name: TestP
          title: 'Positive Tests'
          type: number
        - name: TestN
          title: 'Negative Tests'
          type: number
