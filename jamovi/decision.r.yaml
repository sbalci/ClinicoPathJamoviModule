      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative
      refs:
          - jaeschke1994
          - HosmerLemeshow2013
          - Pewsner2004
          - Buderer1996
          - ClopperPearson1934
          - Simel1991
          - Glas2003
          - AgrestiCaffo2000
          - AltmanBland1994b
