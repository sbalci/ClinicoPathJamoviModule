---
name:  decision
title: Medical Decision
jrs:   '1.1'

items:

    - name: welcome
      title: 'Getting Started'
      type: Html
      # Must not start with '!': jmvcore routes to the R evaluator only on
      # ^\([\$A-Za-z].*\)$, so a leading '!' returns the raw (truthy) string and
      # the panel is permanently visible. Bare option names are also unusable
      # here -- a Variable's value is a list, which R's && rejects.
      visible: (length(gold) == 0 || length(newtest) == 0 || length(goldPositive) == 0 || length(testPositive) == 0)
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    # An Html panel, not jmvcore::Notice items: the notices here run to several
    # sentences, and Notice content renders as single-line plain text.
    - name: notices
      title: 'Important Information'
      type: Html
      refs:
          - HosmerLemeshow2013
          - Buderer1996
          - haldane1956
          - anscombe1956
          - ClopperPearson1934
          - youden1950
          - AltmanBland1994b
          - UsherSmith2016
          - STARD2015
          - Schuetz2012
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative
        - pp
        - pprob
        - ci
        - showMisclassified
        - maxCasesShow

    - name: rawContingency
      title: Analysed Contingency Table
      type: Table
      visible: (od)
      rows: 0
      columns:
        - name: test_level
          title: ''
          type: text
        - name: gold_pos
          title: ''
          type: integer
        - name: gold_neg
          title: ''
          type: integer
        - name: row_total
          title: Total
          type: integer
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    - name: rawCounts
      title: Analysed Combination Counts
      type: Table
      visible: (od)
      rows: 0
      columns:
        - name: test_level
          title: ''
          type: text
        - name: gold_level
          title: ''
          type: text
        - name: count
          title: Count
          type: integer
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    - name:  cTable
      title: '2x2 Table'
      type: Table
      rows: 0
      columns:
        - name: newtest
          title: ''
          type: text
        - name: GP
          title: 'Reference Positive'
          type: number
        - name: GN
          title: 'Reference Negative'
          type: number
        - name: Total
          title: 'Total'
          type: number
      clearWith:
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative

    - name:  nTable
      title: 'n'
      type: Table
      swapRowsColumns: true
      rows:  1
      columns:
        - name: tablename
          title: ''
          type: text
        - name: TotalPop
          title: 'Total'
          type: number
        - name: DiseaseP
          title: 'Reference Positive'
          type: number
        - name: DiseaseN
          title: 'Reference Negative'
          type: number
        - name: TestP
          title: 'Positive Tests'
          type: number
        - name: TestN
          title: 'Negative Tests'
          type: number
        - name: TestT
          title: 'Agree with Reference'
          type: number
        - name: TestW
          title: 'Disagree with Reference'
          type: number
      clearWith:
          - pp
          - pprob
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
      refs:
          - Ying2020

    - name:  ratioTable
      title: ''
      type: Table
      swapRowsColumns: true
      rows:  1
      columns:
        - name: tablename
          title: ''
          type: text
        - name: Sens
          title: 'Sensitivity'
          type: number
          format: pc
        - name: Spec
          title: 'Specificity'
          type: number
          format: pc
        - name: AccurT
          title: 'Sample Accuracy'
          type: number
          format: pc
        - name: PrevalenceD
          title: 'Prevalence'
          type: number
          format: pc
        - name: PPV
          title: 'Positive Predictive Value'
          type: number
          format: pc
        - name: NPV
          title: 'Negative Predictive Value'
          type: number
          format: pc
        - name: LRP
          title: Positive Likelihood Ratio
          type: number
        - name: LRN
          title: Negative Likelihood Ratio
          type: number
      clearWith:
          - pp
          - pprob
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
      refs:
          - AltmanBland1994
          - AltmanBland1994b
          - DeeksAltman2004
          - jaeschke1994
          - haldane1956
          - anscombe1956
          - Alberg2004
          - UsherSmith2016
          - Pewsner2004

    - name: missingDataSummary
      title: 'Data Quality Summary'
      type: Html
      visible: (od)
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    - name: epirTable_ratio
      title: 'Sensitivity, Specificity and Predictive Values with 95% CI'
      type: Table
      visible: (ci)
      rows: 0
      columns:
        - name: statsnames
          title: "Decision Statistics"
          type: text
        - name: est
          title: "Estimate"
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
      clearWith:
          - pp
          - pprob
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
          - ci
      refs:
          - epiR
          - ClopperPearson1934
          - AltmanBland1994b
          - Pewsner2004

    - name: epirTable_number
      title: ''
      type: Table
      visible: (ci)
      rows: 0
      columns:
        - name: statsnames
          title: "Decision Statistics"
          type: text
        - name: est
          title: "Estimate"
          type: number
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
      clearWith:
          - pp
          - pprob
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
          - ci
      refs:
          - epiR
          - Simel1991
          - Glas2003
          - youden1950
          - AgrestiCaffo2000
          - LinnGrunau2006
          - jaeschke1994
          - haldane1956
          - anscombe1956

    - name: plot1
      title: 'Fagan nomogram'
      type: Image
      width:  600
      height: 450
      renderFun: .plot1
      visible: (fagan)
      clearWith:
          - pp
          - pprob
          - fagan
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
      refs:
          - Fagan1975
          - Fagan

    - name: naturalLanguageSummary
      title: 'Clinical Summary'
      type: Html
      visible: (showNaturalLanguage)
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative
