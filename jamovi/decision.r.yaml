      type: Html
      visible: (referenceType:consensus || referenceType:method)
      clearWith: [referenceType, referenceDescription, targetDefinition, gold, goldPositive, goldNegative, ci, pp, pprob, newtest, testPositive, testNegative, showMisclassified, saveClassifications]

    - name: comparatorCases
      title: Discordant Comparator Calls
      type: Table
      visible: (referenceType:consensus && (showMisclassified) || referenceType:method && (showMisclassified))
      rows: 0
      clearWith: [referenceType, referenceDescription, targetDefinition, gold, goldPositive, goldNegative, ci, pp, pprob, newtest, testPositive, testNegative, showMisclassified, saveClassifications]
