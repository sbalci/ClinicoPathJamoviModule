          type: text
        - name: numerator
          title: "Numerator"
          type: integer
        - name: denominator
          title: "Denominator"
          type: integer
        - name: estimate
          title: "Estimate"
          type: number
          format: pc
        - name: lower
          title: "Lower 95% CI"
          type: number
          format: pc
        - name: upper
          title: "Upper 95% CI"
          type: number
          format: pc
        - name: method
          title: "Interval method"
          type: text

    - name: comparatorReport
