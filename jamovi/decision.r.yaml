      - showValidationContext
      - cohortRole
      - samplingDesign
      - thresholdSource
      - modelVersion
      - analysisUnit
      - referenceType
      - referenceDescription
      columns:
      - name: setting
        title: Setting
        type: text
      - name: value
        title: Value
        type: text

refs:
