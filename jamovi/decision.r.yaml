          title: 'Agree with Reference'
          type: number
        - name: TestW
          title: 'Disagree with Reference'
          type: number
      clearWith:
          - referenceType
          - referenceDescription
          - targetDefinition
          - pp
          - pprob
          - gold
          - newtest
          - goldPositive
          - testPositive
          - goldNegative
          - testNegative
      refs:
          - Ying2020

    - name:  ratioTable
      title: ''
      type: Table
      visible: (referenceType:legacy || referenceType:disease)
      swapRowsColumns: true
      rows:  1
      columns:
