          title: Total
          type: integer
      clearWith:
        - referenceType
        - referenceDescription
        - targetDefinition
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    - name: rawCounts
      title: Analyzed Combination Counts
      type: Table
      visible: (referenceType:legacy && (od) || referenceType:disease && (od))
