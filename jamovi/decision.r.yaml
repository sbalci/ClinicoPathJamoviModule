---
name:  decision
title: Medical Decision
jrs:   '1.1'

items:

    - name: welcome
      title: 'Getting Started'
      type: Html
      # Must not start with '!': jmvcore routes to the R evaluator only on
      # ^\([\$A-Za-z].*\)$, so a leading '!' returns the raw (truthy) string and
      # the panel is permanently visible. Bare option names are also unusable
      # here -- a Variable's value is a list, which R's && rejects.
      visible: (referenceType:legacy && (length(gold) == 0 || length(newtest) == 0 || length(goldPositive) == 0 || length(testPositive) == 0) || referenceType:disease && (length(gold) == 0 || length(newtest) == 0 || length(goldPositive) == 0 || length(testPositive) == 0))
      clearWith:
        - referenceType
        - referenceDescription
        - targetDefinition
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    # An Html panel, not jmvcore::Notice items: the notices here run to several
    # sentences, and Notice content renders as single-line plain text.
    - name: notices
      title: 'Important Information'
      type: Html
      refs:
          - HosmerLemeshow2013
          - Buderer1996
          - haldane1956
          - anscombe1956
          - ClopperPearson1934
          - youden1950
          - AltmanBland1994b
          - UsherSmith2016
          - STARD2015
          - Schuetz2012
      clearWith:
        - referenceType
        - referenceDescription
        - targetDefinition
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative
        - pp
        - pprob
        - ci
        - showMisclassified
        - maxCasesShow

    - name: rawContingency
      title: Analyzed Contingency Table
      type: Table
      visible: (referenceType:legacy && (od) || referenceType:disease && (od))
      rows: 0
      columns:
        - name: test_level
          title: ''
          type: text
        - name: gold_pos
          title: ''
          type: integer
        - name: gold_neg
          title: ''
          type: integer
