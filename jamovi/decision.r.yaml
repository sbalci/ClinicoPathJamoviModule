          type: text
        - name: gold_level
          title: ''
          type: text
        - name: count
          title: Count
          type: integer
      clearWith:
        - referenceType
        - referenceDescription
        - targetDefinition
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative

    - name:  cTable
