          - haldane1956
          - anscombe1956

    - name: reportTemplate
      title: 'Copy-Ready Results Paragraph'
      type: Html
      visible: (showReportTemplate)
      clearWith:
        - gold
        - newtest
        - goldPositive
        - testPositive
        - goldNegative
        - testNegative
      refs:
          - STARD2015
          - ClopperPearson1934
          - Simel1991
          - jaeschke1994
          - haldane1956
          - anscombe1956
          - AltmanBland1994b

    - name: aboutAnalysis
