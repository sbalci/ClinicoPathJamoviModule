title: Decision Curve Analysis
name: decisioncurve
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: outcomePositive
            label: Positive outcome
            enable: (outcome)
      - type: TargetLayoutBox
        label: Prediction Models/Variables
        children:
          - type: VariablesListBox
            name: models
            isTarget: true
          - type: TextBox
            name: modelNames
            label: Model names (optional)
            format: string
      - type: TargetLayoutBox
        label: Clinical Decision Rule (Binary)
        children:
          - type: VariablesListBox
            name: decisionRuleVar
            isTarget: true
            maxItemCount: 1
            enable: (clinicalDecisionRule)
          - type: LevelSelector
            name: decisionRulePositive
            label: Positive rule level
            enable: (clinicalDecisionRule && decisionRuleVar)
  - type: CollapseBox
    label: Analysis Options
    margin: normal
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Threshold range
            children:
              - type: ComboBox
                name: thresholdRange
                label: Threshold range
              - type: TextBox
                name: thresholdMin
                format: number
                label: Minimum threshold
                enable: (thresholdRange:custom)
              - type: TextBox
                name: thresholdMax
                format: number
                label: Maximum threshold
                enable: (thresholdRange:custom)
              - type: TextBox
                name: thresholdStep
                format: number
                label: Step size
      # decisionRuleVar's box is in the top VariableSupplier (a target box takes its
      # source list from the nearest ancestor supplier), greyed until this is ticked.
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: clinicalDecisionRule
            label: Clinical decision rule
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: decisionRuleLabel
            format: string
            label: Decision rule label
            enable: (clinicalDecisionRule)
  - type: CollapseBox
    label: Tables & Outputs
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showTable
            label: Results table
          - type: TextBox
            name: selectedThresholds
            format: string
            label: Thresholds for table (probabilities 0-1, comma-separated)
          - type: CheckBox
            name: showBenefitRange
            label: Range of benefit table
          - type: CheckBox
            name: showDecisionConsequences
            label: Decision consequences table
          - type: CheckBox
            name: showInterpretation
            label: Clinical interpretation
  - type: CollapseBox
    label: Plots
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showPlot
            label: Decision curve plot
          - type: ComboBox
            name: plotStyle
            label: Plot style
            enable: (showPlot)
          - type: CheckBox
            name: showReferenceLinesLabels
            label: Reference line labels
            enable: (showPlot)
          - type: CheckBox
            name: highlightRange
            label: Clinical range highlight
            enable: (showPlot)
          - type: TextBox
            name: highlightMin
            format: number
            label: Range minimum
            enable: (highlightRange && showPlot)
          - type: TextBox
            name: highlightMax
            format: number
            label: Range maximum
            enable: (highlightRange && showPlot)
          - type: CheckBox
            name: showClinicalImpactPlot
            label: Clinical impact plot
          - type: CheckBox
            name: showRelativeUtility
            label: Relative utility plot
          - type: CheckBox
            name: showStandardizedNetBenefit
            label: Standardized net benefit plot
  # Renamed from "Cost-Benefit Analysis": the option, the table, the table note and the
  # .a.yaml description were all deliberately renamed to "Exploratory Monetary Payoff"
  # and explicitly disclaim being an ICER / cost-effectiveness analysis. The heading is
  # the largest text the user reads, so it must not promise health economics.
  - type: CollapseBox
    label: Exploratory Monetary Payoff
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: costBenefitAnalysis
            label: Exploratory monetary payoff
          - type: TextBox
            name: testCost
            format: number
            label: Cost per test
            enable: (costBenefitAnalysis)
          - type: TextBox
            name: treatmentCost
            format: number
            label: Cost per treatment
            enable: (costBenefitAnalysis)
          # "Monetary": the payoff is in one currency, and a QALY or utility entered here is
          # silently treated as money (the option descriptions forbid it; the labels did not).
          - type: TextBox
            name: benefitCorrectTreatment
            format: number
            label: Monetary value per true positive
            enable: (costBenefitAnalysis)
          - type: TextBox
            name: harmFalseTreatment
            format: number
            label: Monetary harm per false positive
            enable: (costBenefitAnalysis)
  - type: CollapseBox
    label: Model Comparison
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: compareModels
            label: Statistical comparison
          - type: CheckBox
            name: multiModelComparison
            label: Enhanced pairwise comparison
          - type: CheckBox
            name: weightedAUC
            label: Average net benefit table
  - type: CollapseBox
    label: Clinical Impact
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: calculateClinicalImpact
            label: Clinical impact metrics
          - type: TextBox
            name: populationSize
            format: number
            label: Population size
          - type: CheckBox
            name: showInterventionAvoided
            label: Net interventions avoided
          - type: CheckBox
            name: resourceUtilization
            label: Resource utilization
  # Not "Bootstrap Confidence Intervals": the replications and the seed here also drive both
  # model-comparison tables, whose checkboxes sit in another box.
  - type: CollapseBox
    label: Bootstrap and Resampling
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          # The intervals are drawn only on the decision curve plot.
          - type: CheckBox
            name: confidenceIntervals
            label: Bootstrap confidence intervals
            enable: (showPlot)
          - type: TextBox
            name: bootReps
            format: number
            label: Bootstrap replications
            enable: ((confidenceIntervals && showPlot) || compareModels || multiModelComparison)
          - type: TextBox
            name: ciLevel
            format: number
            label: Confidence level
            enable: ((confidenceIntervals && showPlot) || compareModels)
          - type: ComboBox
            name: ciBand
            label: Interval type
            enable: (confidenceIntervals && showPlot)
          - type: TextBox
            name: seed
            format: number
            label: Random seed
