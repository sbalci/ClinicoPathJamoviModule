---
name:  venn
title: Venn Diagram
menuGroup: Exploration
menuSubgroup: ClinicoPath Descriptive Plots
menuSubtitle: Venn Diagram, UpSet Plot
version: '1.0.81'
jas: '1.2'

options:

    - name: data
      type: Data
      description:
          R: >
            The dataset as a data frame containing the variables for analysis.
          jamovi: >
            The data as a data frame.

    - name: var1
      title: 'Variable 1 (required)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            A string naming the primary variable from `data` for the diagram.
          jamovi: >
            A string naming the primary variable from `data`.

    - name: var1true
      title: 'True level'
      type: Level
      variable: (var1)
      description:
          R: >
            The level in `var1` that represents the positive condition.
          jamovi: >
            The level in `var1` that represents the true condition.

    - name: var2
      title: 'Variable 2 (required)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            A string naming the secondary variable from `data` used in the diagram.
          jamovi: >
            A string naming the secondary variable from `data`.

    - name: var2true
      title: 'True level'
      type: Level
      variable: (var2)
      description:
          R: >
            The level in `var2` that represents the positive condition.
          jamovi: >
            The level in `var2` that represents the true condition.

    - name: var3
      title: 'Variable 3 (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            An optional variable from `data` to include in the diagram.
          jamovi: >
            An optional variable from `data`.

    - name: var3true
      title: 'True level'
      type: Level
      variable: (var3)
      description:
          R: >
            The level in `var3` that represents the positive condition.
          jamovi: >
            The level in `var3` that represents the true condition.

    - name: var4
      title: 'Variable 4 (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            An optional variable from `data` for additional overlap analysis.
          jamovi: >
            An optional variable from `data`.

    - name: var4true
      title: 'True level'
      type: Level
      variable: (var4)
      description:
          R: >
            The level in `var4` that represents the positive condition.
          jamovi: >
            The level in `var4` that represents the true condition.


    - name: var5
      title: 'Variable 5 (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Fifth variable for 5-set Venn diagrams (automatically switches to advanced engine).
          jamovi: >
            Fifth variable for 5+ set analysis.

    - name: var5true
      title: 'True level'
      type: Level
      variable: (var5)
      description:
          R: >
            The level in `var5` that represents the positive condition.
          jamovi: >
            The level in `var5` that represents the true condition.

    - name: var6
      title: 'Variable 6 (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Sixth variable for 6-set Venn diagrams (uses advanced engine automatically).
          jamovi: >
            Sixth variable for 6+ set analysis.

    - name: var6true
      title: 'True level'
      type: Level
      variable: (var6)
      description:
          R: >
            The level in `var6` that represents the positive condition.
          jamovi: >
            The level in `var6` that represents the true condition.

    - name: var7
      title: 'Variable 7 (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Seventh variable for 7-set Venn diagrams (uses advanced engine automatically).
          jamovi: >
            Seventh variable for 7+ set analysis.

    - name: var7true
      title: 'True level'
      type: Level
      variable: (var7)
      description:
          R: >
            The level in `var7` that represents the positive condition.
          jamovi: >
            The level in `var7` that represents the true condition.

    - name: show_upsetR
      title: "UpSetR plot"
      type: Bool
      default: false
      description:
          R: >
            Show the UpSetR matrix-style intersection plot. Suited to 4 or more sets, where a Venn diagram becomes unreadable.
          jamovi: >
            Show the UpSetR intersection plot (best for 4 or more variables).


    - name: show_complexUpset
      title: "ComplexUpset plot"
      type: Bool
      default: false
      description:
          R: >
            Show the ComplexUpset intersection plot: the same matrix layout as UpSetR, plus optional percentage labels, a minimum intersection size filter and degree sorting.
          jamovi: >
            Show the ComplexUpset intersection plot, which adds percentage labels, minimum-size filtering and degree sorting.


    - name: show_ggvenn
      title: "ggvenn plot"
      type: Bool
      default: true
      description:
          R: >
            Show the classic ggvenn Venn diagram. Handles up to 4 sets; with 5 or more it displays a message pointing to ggVennDiagram instead.
          jamovi: >
            Show the classic Venn diagram (up to 4 variables).


    - name: show_ggVennDiagram
      title: "ggVennDiagram plot"
      type: Bool
      default: false
      description:
          R: >
            Show the ggVennDiagram Venn diagram, which supports 2 to 7 sets and the shape, label, edge and palette options in the ggVennDiagram Styling panel.
          jamovi: >
            Show the advanced Venn diagram (2 to 7 variables, with styling options).




    - name: sortBy
      title: 'Sort intersections by'
      type: List
      options:
        - name: freq
          title: 'Frequency'
        - name: degree
          title: 'Degree'
        - name: none
          title: 'None'
      default: freq
      description:
          R: >
            How to sort the intersections in the UpSet plots. 'Frequency' orders by
            intersection size and 'Degree' groups by the number of sets involved;
            both engines honour these. 'None' (unsorted) applies to the ComplexUpset
            engine only - UpSetR has no unsorted mode and falls back to frequency.
          jamovi: >
            Choose how to sort the intersections. 'None' applies to ComplexUpset
            only; UpSetR falls back to frequency when 'None' is selected.

    - name: minSize
      title: 'Minimum intersection size'
      type: Integer
      min: 0
      default: 0
      description:
          R: >
            Minimum size of intersections to display. Applies to the ComplexUpset
            engine only; UpSetR does not filter intersections by minimum size.
          jamovi: >
            Only show intersections with at least this many members (ComplexUpset
            engine only; not applied to UpSetR).

    - name: showAnnotations
      title: "Percentage labels"
      type: Bool
      default: false
      description:
          R: >
            Add percentage labels to intersection sizes in ComplexUpset plots or enhanced text scaling in UpSetR plots.
          jamovi: >
            Add percentage labels and enhanced text formatting to the plot.

    - name: explanatory
      title: "All explanatory panels"
      type: Bool
      default: false
      description:
          R: >
            Show all four explanatory panels at once - About This Analysis, Clinical
            Summary, Copy-Ready Clinical Summary and Interpretation Guide & Assumptions -
            without ticking them individually.
          jamovi: >
            Show all four explanatory panels at once (About this analysis, Clinical
            summary, Report sentences, Assumptions).

    - name: aboutAnalysis
      title: "About this analysis"
      type: Bool
      default: false
      description:
          R: >
            Display detailed information about Venn diagram analysis and interpretation.
          jamovi: >
            Show detailed information about the analysis method.

    - name: clinicalSummary
      title: "Clinical summary"
      type: Bool
      default: false
      description:
          R: >
            Display clinical interpretation of overlap patterns and key findings.
          jamovi: >
            Show clinical interpretation and key findings.

    - name: reportSentences
      title: "Report sentences"
      type: Bool
      default: false
      description:
          R: >
            Generate copy-ready sentences for clinical reports and publications.
          jamovi: >
            Generate copy-ready sentences for reports.

    - name: assumptions
      title: "Assumptions"
      type: Bool
      default: false
      description:
          R: >
            Display interpretation guidelines and statistical assumptions.
          jamovi: >
            Show interpretation guidelines and assumptions.



    - name: shapeType
      title: 'Venn diagram shape'
      type: List
      options:
        - name: auto
          title: 'Automatic'
        - name: circle
          title: 'Circle'
        - name: ellipse
          title: 'Ellipse'
        - name: polygon
          title: 'Polygon'
        - name: triangle
          title: 'Triangle'
      default: auto
      description:
          R: >
            Shape type for ggVennDiagram. Auto selects optimal shape based on number of sets.
          jamovi: >
            Choose the shape type for the Venn diagram.

    - name: regionLabels
      title: 'Region labels'
      type: List
      options:
        - name: count
          title: 'Count'
        - name: percent
          title: 'Percent'
        - name: both
          title: 'Both count and percent'
        - name: none
          title: 'None'
      default: count
      description:
          R: >
            What to display in Venn diagram regions (available for advanced diagrams).

    - name: labelGeometry
      title: 'Label style'
      type: List
      options:
        - name: label
          title: 'Label (with background)'
        - name: text
          title: 'Text (no background)'
      default: label
      description:
          R: >
            Whether to use label geometry (with background) or text geometry for region labels.
          jamovi: >
            Choose label style for region text.

    - name: labelPrecisionDigits
      title: 'Percentage decimal places'
      type: Integer
      min: 0
      max: 3
      default: 1
      description:
          R: >
            Number of decimal places for percentage labels (available for advanced diagrams).
          jamovi: >
            Decimal precision for percentages.

    - name: setNameSize
      title: 'Set name size'
      type: Number
      min: 1
      max: 20
      default: 5
      description:
          R: >
            Font size for set names (available for advanced diagrams).
          jamovi: >
            Size of set name labels.

    - name: labelSize
      title: 'Region label size'
      type: Number
      min: 1
      max: 20
      default: 4
      description:
          R: >
            Font size for region labels (available for advanced diagrams).
          jamovi: >
            Size of region labels.

    - name: edgeSize
      title: 'Edge line width'
      type: Number
      min: 0.1
      max: 5
      default: 1
      description:
          R: >
            Width of set boundary lines (available for advanced diagrams).
          jamovi: >
            Width of boundary lines.

    - name: edgeColor
      title: 'Edge color'
      type: String
      default: 'black'
      description:
          R: >
            Color of set boundary lines (available for advanced diagrams).
          jamovi: >
            Color of boundary lines.

    - name: edgeLineType
      title: 'Edge line type'
      type: List
      options:
        - name: solid
          title: 'Solid'
        - name: dashed
          title: 'Dashed'
        - name: dotted
          title: 'Dotted'
        - name: dotdash
          title: 'Dot-dash'
        - name: longdash
          title: 'Long dash'
        - name: twodash
          title: 'Two dash'
      default: solid
      description:
          R: >
            Line type for set boundaries in ggVennDiagram.
          jamovi: >
            Choose the line style for set boundaries.

    - name: edgeAlpha
      title: 'Edge transparency'
      type: Number
      min: 0
      max: 1
      default: 1
      description:
          R: >
            Transparency level for set boundary lines (0=transparent, 1=opaque).
          jamovi: >
            Set transparency of boundary lines.

    - name: fillAlpha
      title: 'Fill transparency'
      type: Number
      min: 0
      max: 1
      default: 0.5
      description:
          R: >
            Transparency level for region fills (0=transparent, 1=opaque).
          jamovi: >
            Set transparency of region fills.

    - name: showSetLabels
      title: "Set names"
      type: Bool
      default: true
      description:
          R: >
            Whether to display set names on the diagram.
          jamovi: >
            Show or hide set name labels.

    - name: setLabelColor
      title: 'Set label color'
      type: String
      default: 'black'
      description:
          R: >
            Color for set name labels.
          jamovi: >
            Set the color of set name labels.

    - name: fillColorMapping
      title: "Fill color mapping"
      type: Bool
      default: true
      description:
          R: >
            Map fill colors to intersection sizes (available for advanced diagrams).
          jamovi: >
            Use color gradient based on intersection sizes.

    - name: colorPalette
      title: 'Color palette'
      type: List
      options:
        - name: default
          title: 'Default'
        - name: Set1
          title: 'Set1 (Qualitative)'
        - name: Set2
          title: 'Set2 (Qualitative)'
        - name: Set3
          title: 'Set3 (Qualitative)'
        - name: Pastel1
          title: 'Pastel1'
        - name: Pastel2
          title: 'Pastel2'
        - name: Dark2
          title: 'Dark2'
        - name: Accent
          title: 'Accent'
        - name: viridis
          title: 'Viridis'
        - name: plasma
          title: 'Plasma'
        - name: magma
          title: 'Magma'
        - name: inferno
          title: 'Inferno'
      default: default
      description:
          R: >
            Color palette for Venn diagram regions (available for advanced diagrams).
          jamovi: >
            Choose color palette for regions.

    - name: showSetCalculations
      title: "Set calculations"
      type: Bool
      default: false
      description:
          R: >
            Display detailed set calculations including overlaps, unique members, and unions.
          jamovi: >
            Show detailed set calculations and membership tables.

    - name: calculateOverlap
      title: "Overlap calculations"
      type: Bool
      default: false
      description:
          R: >
            Calculate and display overlap intersections between sets.
          jamovi: >
            Calculate overlap intersections.

    - name: calculateDiscern
      title: "Unique member calculations"
      type: Bool
      default: false
      description:
          R: >
            Calculate and display unique members for each set (discern operation).
          jamovi: >
            Calculate unique members per set.

    - name: calculateUnite
      title: "Union calculations"
      type: Bool
      default: false
      description:
          R: >
            Calculate and display union of all sets.
          jamovi: >
            Calculate union of all sets.

    - name: showMembershipTable
      title: "Membership table"
      type: Bool
      default: false
      description:
          R: >
            Display detailed membership table showing which items belong to which sets.
          jamovi: >
            Show detailed membership information.

    - name: membershipGroups
      title: 'Add membership groups to data'
      type: Output
      description:
          R: >
            Adds a categorical variable to the data set describing the combination of selected sets each case belongs to.
          jamovi: >
            Add a column with the membership group for each row.

    - name: showGlossary
      title: "Statistical glossary"
      type: Bool
      default: false
      description:
          R: >
            Display glossary of statistical terms and clinical interpretations.
          jamovi: >
            Show definitions of statistical terms used in Venn diagram analysis.

...
