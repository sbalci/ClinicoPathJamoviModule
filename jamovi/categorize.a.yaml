---
name:  categorize
title: Categorize Continuous Variables
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Data Preparation
version: '1.0.8'
jas: '1.2'

description:
    main: >
        Converts a continuous numeric variable into an ordered set of categories
        using equal-width intervals, sample quantiles, hand-entered break points,
        mean +/- SD bands, a median split, or Fisher-Jenks natural breaks. Reports
        the break points and the resulting category frequencies, draws the
        distribution with the boundaries marked, and can add the categorised
        variable straight to the dataset.
    R:
        dontrun: true
        usage: |
            # Age split into quartiles
            categorize(
                data = histopathology,
                var = Age,
                method = 'quantile',
                nbins = 4)

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: var
      title: Variable to categorize
      type: Variable
      default: NULL
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            A numeric variable to be categorized into bins.
          jamovi: >
            Select the continuous variable you want to convert into categories.

    - name: method
      title: Binning method
      type: List
      options:
        - title: Equal Intervals
          name: equal
        - title: Quantiles
          name: quantile
        - title: Manual Breaks
          name: manual
        - title: Mean +/- SD
          name: meansd
        - title: Median Split
          name: median
        - title: Natural Breaks (Jenks)
          name: jenks
      default: quantile
      description:
          R: >
            Method for creating bins. Options are 'equal' for equal-width intervals,
            'quantile' for quantile-based bins, 'manual' for custom break points,
            'meansd' for mean +/- standard deviation bins, 'median' for median split,
            or 'jenks' for Fisher-Jenks natural breaks clustering. Jenks breaks are
            computed exactly up to 20000 observations; above that classInt works from
            a fixed-seed subsample and a note reports its size. Repeated runs always
            give identical break points.
          jamovi: >
            Choose how to divide the variable into categories.

    - name: nbins
      title: Number of categories
      type: Integer
      min: 2
      max: 20
      default: 4
      description:
          R: >
            Number of categories to create (2-20). Used for equal, quantile, and jenks methods.
          jamovi: >
            Number of categories to create (2-20).

    - name: breaks
      title: Custom break points
      type: String
      default: ''
      description:
          R: >
            Comma-separated break points for manual binning (e.g., "0, 25, 50, 75, 100").
            Values should be in ascending order.
          jamovi: >
            For manual binning, enter comma-separated break points (e.g., "0, 25, 50, 75, 100").

    - name: sdmult
      title: SD multiplier
      type: Number
      min: 0.5
      max: 3
      default: 1
      description:
          R: >
            Multiplier for standard deviation when using meansd method (default = 1).
          jamovi: >
            How many standard deviations from mean to use for category boundaries.

    - name: labels
      title: Category labels
      type: List
      options:
        - title: Auto (numeric ranges)
          name: auto
        - title: Low/Medium/High
          name: semantic
        - title: Numbered (1, 2, 3...)
          name: numbered
        - title: Lettered (A, B, C...)
          name: lettered
        - title: Custom Labels
          name: custom
      default: auto
      description:
          R: >
            How to label the resulting categories.
          jamovi: >
            Choose label style for the new categories.

    - name: customlabels
      title: Custom label names
      type: String
      default: ''
      description:
          R: >
            Comma-separated custom labels (e.g., "Low, Medium, High").
            Must match the number of categories.
          jamovi: >
            Enter custom labels separated by commas (must match number of categories).

    - name: newvarname
      title: New variable name
      type: String
      default: ''
      description:
          R: >
            Name for the new categorized variable, used both for the column added
            to the dataset and in the generated R code. Leave empty to name it
            after the source variable with a '_cat' suffix.
          jamovi: >
            Name for the new categorized variable. Leave empty for automatic naming.

    - name: addtodata
      title: Categorized variable
      type: Output
      description:
          R: >
            Add the new categorized variable directly to the dataset.
          jamovi: >
            Add the new categorized variable directly to the dataset.

    - name: excludeoutofrange
      title: Out-of-range value exclusion
      type: Bool
      default: false
      description:
          R: >
            Applies to the 'manual' method only. By default the break points are
            extended to the data minimum and maximum, so every observation falls in
            a category and no case is lost. Set this to TRUE to keep the break
            points exactly as entered and drop observations that fall outside them;
            the number excluded is reported. Has no effect on the computed methods,
            whose break points already span the data.
          jamovi: >
            Manual breaks only. Keep the break points exactly as entered and drop
            values outside them, instead of extending the outer breaks to cover the
            data.

    - name: includelowest
      title: Lowest value in first bin
      type: Bool
      default: true
      description:
          R: >
            If TRUE, the first interval will be left-closed (include.lowest in cut).
          jamovi: >
            Include the minimum value in the lowest category.

    - name: rightclosed
      title: Right-closed intervals
      type: Bool
      default: true
      description:
          R: >
            If TRUE, intervals are right-closed (left-open). If FALSE, left-closed (right-open).
          jamovi: >
            Whether intervals include the right endpoint (e.g., (0,10] vs [0,10)).

    - name: ordered
      title: Ordered factor
      type: Bool
      default: true
      description:
          R: >
            If TRUE, creates an ordered factor to preserve category ordering, and
            the variable added to the dataset is marked as ordinal rather than
            nominal so the category order is kept in later analyses.
          jamovi: >
            Create an ordered factor to preserve the natural ordering of
            categories. The variable added to the dataset is then marked ordinal
            rather than nominal.

    - name: excl
      title: Missing-value exclusion
      type: Bool
      default: true
      description:
          R: >
            If TRUE (default), the percentages in the frequency table are taken
            over the categorized observations only, and missing or out-of-range
            rows carry no percentage. If FALSE, every row of the data is used as
            the denominator, so the missing and out-of-range rows carry their own
            share and the category percentages no longer sum to 100 on their own.
            Break points are always computed from the non-missing values.
          jamovi: >
            Base the percentages on the categorized observations only. Turn this
            off to use every row as the denominator, so missing and out-of-range
            cases carry their own percentage.

    - name: showcode
      title: R code
      type: Bool
      default: true
      description:
          R: >
            Display R code to reproduce the categorization.
          jamovi: >
            Show R code to recreate this categorization in R.

    - name: showplot
      title: Distribution plot
      type: Bool
      default: true
      description:
          R: >
            Display a histogram/density plot showing the original distribution and cut points.
          jamovi: >
            Display a plot showing the distribution and category boundaries.

...
