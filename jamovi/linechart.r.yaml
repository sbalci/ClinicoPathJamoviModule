---
name: linechart
title: Line Chart
jrs: '1.1'

items:
    - name: todo
      title: Instructions
      type: Html
      visible: false
      clearWith:
        - xvar
        - yvar

    - name: naturalSummary
      title: Summary
      type: Html
      visible: (length(xvar) > 0 && length(yvar) > 0)
      clearWith:
        - xvar
        - yvar
        - groupby
        - trendline

    - name: summary
      title: Data Summary
      type: Table
      visible: (length(xvar) > 0 && length(yvar) > 0)
      clearWith:
        - xvar
        - yvar
        - groupby
      columns:
        - name: statistic
          title: Statistic
          type: text
        - name: value
          title: Value
          type: text

    - name: correlation
      title: Correlation Analysis
      type: Table
      visible: (length(xvar) > 0 && length(yvar) > 0 && trendline)
      clearWith:
        - xvar
        - yvar
        - groupby
        - trendline
      columns:
        - name: measure
          title: Measure
          type: text
        - name: value
          title: Value
          type: number
        - name: ci_lower
          title: Lower
          superTitle: 95% Confidence Interval
          type: number
        - name: ci_upper
          title: Upper
          superTitle: 95% Confidence Interval
          type: number
        - name: pvalue
          title: p
          type: number
          format: zto,pvalue
        - name: interpretation
          title: Interpretation
          type: text

    - name: assumptions
      title: Statistical Assumptions & Guidelines
      type: Html
      visible: (length(xvar) > 0 && length(yvar) > 0 && trendline)
      clearWith:
        - xvar
        - yvar
        - groupby
        - trendline

    - name: plot
      title: '`Line Chart: {yvar} by {xvar}`'
      type: Image
      width: 800
      height: 600
      renderFun: .plot
      # library-audit 2026-09-16 jjstatsplot [LOW] DONE: data-driven render route; .plot() reads self$data instead of storing raw rows in image$state
      requiresData: true
      visible: (length(xvar) > 0 && length(yvar) > 0)
      clearWith:
        - xvar
        - yvar
        - groupby
        - theme
        - colorPalette
        - points
        - smooth
        - confidence
        - trendline
        - showRefline
        - refline
        - reflineLabel
        - xlabel
        - ylabel
        - title

refs:
    - ClinicoPathJamoviModule
    - RCorTestDocumentation
    - ggplot2


...
