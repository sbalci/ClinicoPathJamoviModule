---
name: diagnosticmeta
title: Diagnostic Test Meta-Analysis for Pathology
jrs: '1.1'

items:

    - name: instructions
      title: Getting Started
      type: Html
      visible: true

    - name: notices
      title: Notices
      type: Html
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
          - method
          - confidence_level
          - meta_regression
          - covariate
          - publication_bias
          - bivariate_analysis
          - hsroc_analysis
          - heterogeneity_analysis

    - name: summary
      title: Analysis Summary
      type: Html
      visible: (show_analysis_summary)
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
          - confidence_level
          - method
          - bivariate_analysis

    - name: about
      title: About This Analysis
      type: Html
      visible: (show_methodology)

    - name: bivariateresults
      title: Bivariate Meta-Analysis Results
      type: Table
      visible: (bivariate_analysis)
      refs:
        - Reitsma2005
        - mada
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - confidence_level
          - method
          - zero_cell_correction
          - bivariate_analysis
      columns:
        - name: parameter
          title: Parameter
          type: text
        - name: estimate
          title: Estimate
          type: number
          format: zto
        - name: ci_lower
          title: CI Lower
          type: number
          format: zto
        - name: ci_upper
          title: CI Upper
          type: number
          format: zto
        - name: p_value
          title: P-value
          type: number
          format: zto,pvalue

    - name: hsrocresults
      title: Proportional-Hazards SROC Model Results
      type: Table
      visible: (hsroc_analysis)
      refs:
        - HollingBoehningBoehning2012
        - mada
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - method
          - zero_cell_correction
          - confidence_level
      columns:
        - name: parameter
          title: Parameter
          type: text
        - name: estimate
          title: Estimate
          type: number
          format: zto
        - name: std_error
          title: Std. Error
          type: number
          format: zto
        - name: z_value
          title: Z Value
          type: number
          format: zto
        - name: p_value
          title: P-value
          type: number
          format: zto,pvalue

    - name: heterogeneity
      title: Heterogeneity Assessment
      type: Table
      visible: (heterogeneity_analysis)
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - method
          - zero_cell_correction
          - confidence_level
      columns:
        - name: measure
          title: Measure
          type: text
        - name: q_statistic
          title: Q Statistic
          type: number
          format: zto
        - name: df
          title: df
          type: integer
        - name: p_value
          title: P-value
          type: number
          format: zto,pvalue
        - name: i_squared
          title: "I\u00B2 (%)"
          type: number
          format: zto
        - name: tau_squared
          title: "\u03C4\u00B2"
          type: number
          format: zto

    - name: metaregression
      title: Meta-Regression Results
      type: Table
      visible: (meta_regression && !is.null(covariate))
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - covariate
          - method
          - zero_cell_correction
          - confidence_level
      columns:
        - name: measure
          title: Measure
          type: text
        - name: parameter
          title: Parameter
          type: text
        - name: estimate
          title: Estimate
          type: number
          format: zto
        - name: std_error
          title: Std. Error
          type: number
          format: zto
        - name: ci_lower
          title: Lower
          type: number
          format: zto
          superTitle: Confidence interval
        - name: ci_upper
          title: Upper
          type: number
          format: zto
          superTitle: Confidence interval
        - name: z_value
          title: Test Statistic
          type: number
          format: zto
        - name: p_value
          title: P-value
          type: number
          format: zto,pvalue

    - name: publicationbias
      title: Publication Bias Assessment
      type: Table
      visible: (publication_bias)
      refs:
        - DeeksMacaskillIrwig2005
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
      columns:
        - name: test
          title: Test
          type: text
        - name: statistic
          title: Statistic
          type: number
          format: zto
        - name: p_value
          title: P-value
          type: number
          format: zto,pvalue
        - name: interpretation
          title: Interpretation
          type: text

    - name: individualstudies
      title: Individual Study Results
      type: Table
      visible: (show_individual_studies)
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - confidence_level
          - zero_cell_correction
      columns:
        - name: study
          title: Study
          type: text
        - name: sensitivity
          title: "Sensitivity (%)"
          type: number
          format: dp:1
        - name: sens_ci_lower
          title: CI Lower
          type: number
          format: dp:1
        - name: sens_ci_upper
          title: CI Upper
          type: number
          format: dp:1
        - name: specificity
          title: "Specificity (%)"
          type: number
          format: dp:1
        - name: spec_ci_lower
          title: CI Lower
          type: number
          format: dp:1
        - name: spec_ci_upper
          title: CI Upper
          type: number
          format: dp:1
        - name: tp
          title: TP
          type: integer
        - name: fp
          title: FP
          type: integer
        - name: fn
          title: FN
          type: integer
        - name: tn
          title: TN
          type: integer
        - name: sample_size
          title: N
          type: integer

    - name: forestplot
      title: Forest Plot
      type: Image
      width: 800
      height: 600
      visible: (forest_plot)
      renderFun: .forestplot
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
          - confidence_level
          - color_palette
          - method
          - bivariate_analysis

    - name: srocplot
      title: Summary ROC Plot
      type: Image
      width: 600
      height: 600
      visible: (sroc_plot)
      renderFun: .srocplot
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
          - color_palette
          - confidence_level
          - method
          - bivariate_analysis

    - name: funnelplot
      title: Funnel Plot for Publication Bias
      type: Image
      width: 600
      height: 500
      visible: (funnel_plot && publication_bias)
      renderFun: .funnelplot
      clearWith:
          - study
          - true_positives
          - false_positives
          - false_negatives
          - true_negatives
          - zero_cell_correction
          - color_palette

    - name: interpretation
      title: Clinical Interpretation and Guidelines
      type: Html
      visible: (show_interpretation)

    # library-audit 2026-09-22 OncoPath [MEDIUM] DONE: reference tables belong in Table results, not hand-built HTML (guide section 26)
    - name: likelihoodRatioGuide
      title: Likelihood Ratios for Clinical Decision-Making
      type: Table
      visible: (show_interpretation)
      rows: 6
      columns:
        - name: lr_type
          title: Likelihood Ratio
          type: text
        - name: range
          title: Value Range
          type: text
        - name: interpretation
          title: Clinical Interpretation
          type: text

    # library-audit 2026-09-22 OncoPath [MEDIUM] DONE: computed clinical tables belong in Table results, derived from pooled estimates (guide section 26)
    - name: predictiveValues
      title: Predictive Values by Prevalence
      type: Table
      visible: (show_interpretation)
      rows: 0
      columns:
        - name: prevalence
          title: Prevalence
          type: number
          format: pc
        - name: ppv
          title: PPV
          type: number
          format: pc
        - name: npv
          title: NPV
          type: number
          format: pc
      clearWith:
        - study
        - true_positives
        - false_positives
        - false_negatives
        - true_negatives
        - method
        - zero_cell_correction
        - confidence_level

    # The three explanation panels are static interpretation guides populated
    # once in .init(); they carry no clearWith so a data change can never leave
    # a visible-but-empty titled panel.
    - name: forestplot_explanation
      title: Forest Plot Explanation
      type: Html
      visible: (show_plot_explanations && forest_plot)

    - name: srocplot_explanation
      title: SROC Plot Explanation
      type: Html
      visible: (show_plot_explanations && sroc_plot)

    - name: funnelplot_explanation
      title: Funnel Plot Explanation
      type: Html
      visible: (show_plot_explanations && funnel_plot && publication_bias)

refs:
    - ClinicoPathJamoviModule
    - mada
    - metafor
    - Reitsma2005
    - CochraneDTAHandbook2023
    - DeeksMacaskillIrwig2005
    - ZwindermanBossuyt2008
    - RileyHigginsDeeks2011
    - SweetingSuttonLambert2004
    - HollingBoehningBoehning2012

...
