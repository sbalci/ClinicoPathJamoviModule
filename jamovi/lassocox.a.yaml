---
name: lassocox
title: Lasso-Cox Regression
menuGroup: SurvivalT
menuSubgroup: Penalized Cox Regression
menuTitle: LASSO Cox
menuSubtitle: Sparse Cox model development with cross-validated L1 penalization.
version: '0.0.3'
jas: '1.2'

description:
    main: >
        Fits a cross-validated LASSO-penalized Cox model for exploratory model
        development. Apparent performance requires internal and external validation
        before clinical use.
    # R:
    #     dontrun: true
    #     usage: |
    #         lassocox(data = data, elapsedtime = "Time", outcome = "Status",
    #             outcomeLevel = "1", censorLevel = "0",
    #             explanatory = vars(age, stage, grade))

options:
    - name: data
      type: Data
      description:
          R: The data as a data frame.

    - name: elapsedtime
      title: 'Time Elapsed'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
        R: >
          The numeric variable representing follow-up time until the event or last observation.

    - name: outcome
      title: 'Outcome'
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor, numeric ]
      default: NULL
      description:
        R: >
          Binary event indicator variable (event vs censored). Can be factor or
          numeric with exactly two observed values.

    - name: outcomeLevel
      title: Event Level
      type: Level
      variable: (outcome)
      description:
        R: >
          Level of `outcome` considered as the event. For binary factor outcomes,
          if left empty the second observed level is used; for numeric binary
          outcomes, the larger observed value is used (or 1 for 0/1 coding).

    - name: censorLevel
      title: Censored Level
      type: Level
      variable: (outcome)
      description:
        R: >
          Level of `outcome` considered as censored (no event). Together with
          `outcomeLevel`, this defines a strict two-level encoding: rows whose
          outcome matches neither level are treated as missing and excluded.

    - name: explanatory
      title: Explanatory Variables
      type: Variables
      suggested: [ nominal, ordinal, continuous ]
      permitted: [ factor, numeric ]
      default: NULL
      description:
        R: >
          Variables to be considered for selection in the Lasso-Cox regression.
          Constant variables are removed before fitting. Categorical predictors are
          expanded into indicator columns, which LASSO selects individually rather
          than as a grouped factor.
      
    - name: lambda
      title: Lambda Selection Method
      type: List
      options:
        - title: Minimum CV Error
          name: lambda.min
        - title: 1SE Rule
          name: lambda.1se
      default: lambda.1se
      description:
        R: >
          Cross-validation rule used to select lambda. A valid empty model selected
          by the 1-SE rule is preserved and is not replaced by lambda.min.

    - name: nfolds
      title: Number of CV Folds
      type: Integer
      default: 10
      min: 3
      description:
        R: >
          Requested number of cross-validation folds. The count is reduced when
          necessary so every fold contains event and censored observations; at least
          three of each outcome state are required.

    - name: random_seed
      title: Random Seed
      type: Integer
      default: 123456
      min: 1
      max: 999999
      description:
        R: >
          Random seed for reproducible cross-validation fold assignment.
      
    - name: standardize
      title: Standardize Variables
      type: Bool
      default: true
      description:
        R: >
          Whether glmnet should standardize predictors internally during each model fit.
          Cross-validation training fits therefore do not reuse full-cohort means and
          standard deviations. Displayed coefficients are back-transformed by glmnet to
          the original design-column scale. Factor indicators are still penalized and
          selected separately rather than as a grouped factor.

    - name: suitabilityCheck
      title: Data Suitability Assessment
      type: Bool
      default: true
      description:
        R: >
          Display an advisory assessment of outcome information, model dimension,
          missingness, collinearity, and an exploratory proportional-hazards
          diagnostic for an unpenalized refit of the selected encoded columns.

    - name: cv_plot
      title: Cross-validation Plot
      type: Bool
      default: true
      description:
        R: >
          Whether to show the cross-validation plot.

    - name: coef_plot
      title: Coefficient Plot
      type: Bool
      default: true
      description:
        R: >
          Whether to show a bar plot of selected-variable coefficients at the
          chosen lambda value.

    - name: survival_plot
      title: Risk Group Survival Plot
      type: Bool
      default: true
      description:
        R: >
          Whether to show exploratory survival curves after splitting the development
          sample at its median fitted score. The split is not a validated clinical
          cutoff and no group-comparison p-value is reported.

    - name: riskScore
      title: Add Risk Score to Data
      type: Output
      description:
        R: >
          Adds calculated risk scores to the dataset (complete cases only;
          excluded rows receive missing values).

    # Explanatory Output Options
    - name: showSummary
      title: Show Results Summary
      type: Bool
      default: false
      description:
        R: >
          Display a natural-language development summary that labels discrimination
          as apparent and states the required validation.

    - name: showExplanations
      title: Show Method Explanations
      type: Bool
      default: false
      description:
        R: >
          Display detailed explanations of LASSO Cox regression methodology,
          including regularization concepts and interpretation guidance.

    - name: showMethodologyNotes
      title: Detailed Methodology Notes
      type: Bool
      default: false
      description:
        R: >
          Show comprehensive technical notes about LASSO regularization,
          cross-validation, and variable selection process.

    - name: includeClinicalGuidance
      title: Clinical Interpretation Guidance
      type: Bool
      default: false
      description:
        R: >
          Include guidance for clinical interpretation of LASSO Cox regression
          results, emphasizing that this development analysis alone cannot support
          patient-level decisions.

    - name: showVariableImportance
      title: Variable Importance Analysis
      type: Bool
      default: false
      description:
        R: >
          Display absolute penalized coefficients and path-inclusion proportions.
          Path inclusion is not a bootstrap selection frequency or stability measure.

    - name: showModelComparison
      title: Exploratory Unpenalized Refit Comparison
      type: Bool
      default: false
      description:
        R: >
          Descriptively compare an unpenalized Cox refit after LASSO selection with
          an unpenalized Cox model using all encoded predictors. All statistics are
          apparent and selection-biased; AIC is not a formal comparison here.

...
