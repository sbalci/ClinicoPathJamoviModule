---
name:  jjdotchart
title: Dot Chart (Summary vs Reference Value)
jrs:   '1.1'

items:

    - name: todo
      title: To Do
      type: Html
      clearWith:
          - dep
          - group

    - name: notices
      title: Notices
      type: Html
      clearWith:
          - seed
          - dep
          - group
          - grvar
          - testvalue
          - typestatistics
          - conflevel
          - k
          - trimprop
          - bfprior
          - nboot
          - ciresamples
          - mapresamples
          - resultssubtitle

    - name: summary
      title: Group Summaries (one row per plotted point)
      type: Table
      visible: (showSummaryTable)
      rows: 0
      clearWith:
          - seed
          - dep
          - group
          - grvar
          - testvalue
          - typestatistics
          - conflevel
          - trimprop
          - ciresamples
          - mapresamples
      columns:
          - name: grp
            title: Group
            type: text
          - name: n
            title: 'N obs'
            type: integer
          - name: value
            title: Summary
            type: number
          - name: sd
            title: SD
            type: number
          - name: ci_low
            title: Lower
            type: number
          - name: ci_high
            title: Upper
            type: number
          - name: vsref
            title: 'vs Reference'
            type: number

    - name: weightsensitivity
      title: Benchmarking Sensitivity Check (Weighting Comparison)
      type: Table
      visible: (showWeightedTable)
      rows: 0
      clearWith:
          - seed
          - dep
          - group
          - testvalue
          - typestatistics
          - conflevel
          - trimprop
          - ciresamples
          - mapresamples
      columns:
          - name: scheme
            title: Weighting scheme
            type: text
          - name: units
            title: Effective units
            type: text
          - name: estimate
            title: Estimate
            type: number
          - name: se
            title: SE
            type: number
          - name: ci_low
            title: Lower
            type: number
          - name: ci_high
            title: Upper
            type: number
          - name: vsref
            title: 'vs Reference'
            type: number
          - name: pvalue
            title: p
            type: number
            format: zto,pvalue

    - name: plot2
      title: Dot Chart (Split By)
      type: Image
      width:  800
      height: 450
      renderFun: .plot2
      requiresData: true
      visible: (grvar)
      clearWith:
          - seed
          - dep
          - group
          - grvar
          - testvalue
          - typestatistics
          - conflevel
          - k
          - trimprop
          - bfprior
          - nboot
          - ciresamples
          - mapresamples
          - resultssubtitle
          - centralityplotting
          - centralitytype
          - originaltheme
          - mytitle
          - xtitle
          - ytitle
          - plotwidth
          - plotheight

    - name: plot
      title: Dot Chart
      type: Image
      width:  650
      height: 450
      renderFun: .plot
      requiresData: true
      clearWith:
          - seed
          - dep
          - group
          - testvalue
          - typestatistics
          - conflevel
          - k
          - trimprop
          - bfprior
          - nboot
          - ciresamples
          - mapresamples
          - resultssubtitle
          - centralityplotting
          - centralitytype
          - originaltheme
          - mytitle
          - xtitle
          - ytitle
          - plotwidth
          - plotheight

refs:
    - ClinicoPathJamoviModule
    - Cleveland1984
    - DerSimonian1986
    - Hedges1981
    - Kerby2014
    - Phipson2010
    - btt
    - ggplot2
    - ggstatsplot
    - statsExpressions
    - patchwork
    - WRS2
    - BayesFactor
    - bayestestR
    - effectsize
    - datawizard
...
