title: Synoptic Report Completeness
name: synopticcompleteness
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Required Data Elements
        children:
          - type: VariablesListBox
            name: items
            isTarget: true
      - type: TargetLayoutBox
        label: Group By (subspecialty / pathologist)
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Time / Period (optional)
        children:
          - type: VariablesListBox
            name: timeVar
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: presenceRule
      - type: TextBox
        name: presentValue
        format: string
      - type: TextBox
        name: completeThreshold
        format: number
  - type: CollapseBox
    label: Output Options
    collapsed: false
    children:
      - type: CheckBox
        name: showOverall
      - type: CheckBox
        name: showPerItem
      - type: CheckBox
        name: showByGroup
      - type: CheckBox
        name: showTrend
      - type: CheckBox
        name: showPlot
      - type: Output
        name: addCompletenessToData
      - type: CheckBox
        name: showSummary
      - type: CheckBox
        name: showExplanation
