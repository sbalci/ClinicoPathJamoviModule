---
name:  kappaSizeFixedN
title: Lowest Expected Kappa for a Fixed Sample Size
menuGroup: Power #meddecide
menuSubgroup:  Power Analysis by meddecide
menuSubtitle: Find lower Kappa based on sample size
version: '1.1.2'
jas: '1.2'

description:
    main: >
        For an interobserver agreement study whose number of subjects is already fixed, the
        lowest kappa the study would still be unable to rule out - the lower bound of the
        one-sided confidence interval around the anticipated kappa (kappa0); every value below
        it is excluded. Solved from the goodness-of-fit models of the kappaSize package; with
        three or more raters or categories it also allows for re-estimating the category
        proportions when the study is analyzed. Use kappaSizePower to size a study for a
        hypothesis test and kappaSizeCI to size it for target confidence limits.
    R:
        dontrun: true
        usage: |
            # kappaSize::FixedNBinary example: anticipated kappa 0.7, 100 subjects,
            # 4 raters, trait prevalence 0.50
            kappaSizeFixedN(
                outcome = "2",
                kappa0 = 0.7,
                props = "0.50",
                raters = "4",
                alpha = 0.05,
                n = 100)

options:
    - name: outcome
      title: Number of outcome levels
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      default: "2"
      description:
          ui: >
              Number of outcome levels (categories) of the rated variable.
          R: >
              Number of outcome levels (categories) of the rated variable.


    - name: kappa0
      title: kappa0
      type: Number
      default: 0.60
      min: 0.01
      max: 0.99
      description:
          ui: >
              The preliminary (anticipated) value of kappa - the agreement you expect to
              observe. It is not a null hypothesis value.
          R: >
              The preliminary (anticipated) value of kappa - the agreement you expect to
              observe. kappaSize documents this argument as "the preliminary value of
              kappa". Contrast kappaSizePower, where kappa0 IS the null being tested.

    # library-audit 2026-10-23 meddecide [MEDIUM] REJECTED: one proportion per outcome category,
    #   2-5 by the outcome option; five greyed p1..p5 boxes would show unused ones and break saved
    #   props (guide section 12)
    # number-list: one value per outcome category (2-5)
    - name: props
      title: Expected proportion of cases in each category
      type: String
      default: '0.20, 0.80'
      description:
          ui: >
              Anticipated share of subjects in each outcome category, separated by commas,
              semicolons or spaces, using a decimal point, and summing to 1 (for example
              0.20, 0.80 for a finding present in one case in five). For a binary outcome a
              single prevalence is enough. Enter exactly one value per outcome level otherwise.
          R: >
              Anticipated share of subjects in each outcome category as a single string,
              separated by commas, semicolons or spaces, using a decimal point, and summing
              to 1 (for example "0.20, 0.80" for a finding present in one case in five). For a
              binary outcome a single prevalence is enough. Enter exactly one value per
              outcome level otherwise.


    - name: raters
      title: raters
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "2"
      description:
          ui: >
              Number of raters who will each rate every subject (2 to 6).
          R: >
              Number of raters who will each rate every subject (2 to 6).


    - name: alpha
      title: alpha
      type: Number
      default: 0.05
      min: 0.001
      max: 0.20
      description:
          ui: >
              Significance level of the one-sided lower confidence bound (capped at 0.20).
          R: >
              Significance level of the one-sided lower confidence bound (capped at 0.20).

    - name: 'n'
      title: N
      type: Integer
      default: 100
      min: 11
      max: 1000000
      description:
          ui: >
              Number of subjects available, each rated by all raters (at least 11).
          R: >
              Number of subjects available, each rated by all raters (at least 11; the
              kappaSize engine refuses 10 or fewer).

    - name: showExplanations
      title: Methodology and study explanation
      type: Bool
      default: false
      description:
          ui: >
              Adds the methodology (models, how the bound is computed, analysis advice) and
              the step-by-step Study Explanation. The bound, the warnings and the main caveats
              are always shown.
          R: >
              If TRUE, adds the methodology to the caveats panel and shows the Study
              Explanation.

    - name: showSummary
      title: kappaSize package summary
      type: Bool
      default: false
      description:
          ui: >
              Adds the kappaSize package's own printed summary, with a note on why its bound
              can differ from the one reported here.
          R: >
              If TRUE, shows the kappaSize package's own summary output.

...
