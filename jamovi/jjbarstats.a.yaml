---
name:  jjbarstats
title: Bar Charts
menuGroup: JJStatsPlot
menuSubgroup: 'Categorical vs Categorical'
# menuSubtitle: 'Bar Charts, Grouped Bar Charts'
version: '1.0.8'
jas: '1.2'

description:
    main: >
        Bar charts of one or more categorical outcomes by a grouping variable, with
        the test in the subtitle: Pearson's chi-squared, Fisher's exact test on a
        sparse 2x2 table, McNemar's test for paired data, or a Bayesian contingency
        analysis. Wraps ggstatsplot::ggbarstats and ggstatsplot::grouped_ggbarstats.
    R:
        dontrun: true
        usage: |
            jjbarstats(
                data = jjbarstats_test,
                dep = "response",
                group = "treatment",
                resultssubtitle = TRUE
            )

options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.


    - name: dep
      title: Dependent Variable
      type: Variables
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            One or more categorical outcome variables; each gets its own chart.

    - name: group
      title: Grouping Variable
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Categorical grouping variable shown on the x axis.

    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      default: NULL
      description:
          R: >
            Optional categorical variable; the chart is repeated for each of its levels.

    - name: counts
      title: 'Counts (Optional)'
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: NULL
      description:
          R: >
            A variable in data containing counts, or NULL if each row 
            represents a single observation.


    # - name: direction
    #   title: 'Measurement Type'
    #   type: List
    #   options:
    #     - title: Repeated (within groups)
    #       name: repeated
    #     - title: Independent (between groups)
    #       name: independent
    #   default: independent
    #   description:
    #       ui: options for measurement type
    #       R: select measurement type (repeated or independent)


    - name: typestatistics
      title: 'Type of Statistic'
      type: List
      options:
        - title: Frequentist (chi-squared)
          name: parametric
        - title: Bayesian
          name: bayes
      default: parametric
      description:
          R: >
            Frequentist (Pearson's chi-squared; Fisher's exact test on a sparse 2x2
            table; McNemar's test when paired) or Bayesian contingency analysis.

    - name: originaltheme
      title: Add GGStatsPlot layer
      type: Bool
      default: false
      description:
          R: >
            Use the ggstatsplot theme instead of the jamovi theme.

    - name: palette
      title: Color palette
      type: List
      options:
        - title: Dark2 (colour-blind safe)
          name: Dark2
        - title: Set2 (colour-blind safe)
          name: Set2
        - title: Paired
          name: Paired
        - title: gdoc (ggstatsplot default)
          name: gdoc
      default: Dark2
      description:
          R: >
            Palette for the bar segments: an RColorBrewer palette, or gdoc, the
            ggstatsplot default.

    - name: resultssubtitle
      title: Statistical results in subtitle
      type: Bool
      default: false
      description:
          R: >
            Display statistical test results in plot subtitle. 
            Disabling improves performance significantly.

    - name: paired
      title: Paired/Repeated measures
      type: Bool
      default: false
      description:
          R: >
            Logical indicating whether data came from a within-subjects 
            or repeated measures design study. If TRUE, McNemar's test 
            will be used. If FALSE, Pearson's chi-square test will be used.

    - name: label
      title: Label Display
      type: List
      options:
        - title: Percentage
          name: percentage
        - title: Counts
          name: counts
        - title: Both
          name: both
      default: percentage
      description:
          R: >
            What information needs to be displayed on the label 
            in each bar segment.

    - name: digits
      title: Decimal Digits
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of digits after decimal point for statistical results.

    - name: digitsperc
      title: Percentage Decimal Digits
      type: Integer
      default: 0
      min: 0
      max: 2
      description:
          R: >
            Number of decimal places for percentage labels.

    - name: proportiontest
      title: Proportion test
      type: Bool
      default: false
      description:
          R: >
            Decides whether proportion test for x variable is to be 
            carried out for each level of y.

    - name: bfmessage
      title: Bayes factor message
      type: Bool
      default: false
      description:
          R: >
            Display Bayes Factor in favor of the null hypothesis. 
            Only relevant for parametric test.

    - name: conflevel
      title: Confidence Level
      type: Number
      default: 0.95
      min: 0.50
      max: 0.999
      description:
          R: >
            Confidence/credible interval level.

    - name: ratio
      title: Expected Proportions (Optional)
      type: String
      default: ''
      description:
          R: >
            A comma-separated list of expected proportions for the proportion test 
            (should sum to 1). For example: '0.5,0.5' for two equal groups or 
            '0.25,0.25,0.25,0.25' for four equal groups. Leave empty for equal 
            theoretical proportions.

    - name: clinicalpreset
      title: Clinical Analysis Preset
      type: List
      options:
        - title: Custom (manual configuration)
          name: custom
        - title: Diagnostic Test (2×2 table)
          name: diagnostic
        - title: Treatment Response (multiple groups)
          name: treatment
        - title: Biomarker Expression (ordinal levels)
          name: biomarker
        - title: Risk Factor Analysis
          name: riskfactor
      default: custom
      description:
          R: >
            Tailors the interpretation guide and the prevalence check to a common
            clinical scenario. In the jamovi interface choosing a preset also switches
            on the statistics subtitle (and, for risk factor analysis, the proportion
            tests); the R function leaves those options as given.

    - name: showexplanations
      title: Clinical explanations
      type: Bool
      default: false
      description:
          R: >
            Display detailed explanations of statistical methods, assumptions,
            and clinical interpretations to guide analysis and result interpretation.

    - name: showSummary
      title: Analysis summary
      type: Bool
      default: true
      description:
          R: >
            Display natural-language summary paragraph with key findings
            suitable for copying into reports and publications.

    - name: showAssumptions
      title: Assumptions & warnings
      type: Bool
      default: true
      description:
          R: >
            Display statistical assumptions panel with detected violations,
            warnings about chi-square expected counts, and Fisher exact test
            recommendations.

    - name: showInterpretation
      title: Interpretation guide
      type: Bool
      default: false
      description:
          R: >
            Display effect size interpretation guidelines (Cramér's V thresholds),
            clinical context based on analysis preset, and methodological notes.

    - name: addGGPubrBalloon
      title: Balloon plot (ggpubr)
      type: Bool
      default: false
      description:
          R: >
            Add balloon plot for contingency table visualization using ggpubr.

    - name: ggpubrBalloonPalette
      title: Balloon Plot Palette
      type: List
      options:
        - title: Journal of Clinical Oncology (jco)
          name: jco
        - title: Lancet
          name: lancet
        - title: Grey scale
          name: grey
      default: jco
      description:
          R: >
            Color palette for balloon plot.

...

