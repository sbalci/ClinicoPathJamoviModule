title: Outcome Organizer for Survival Analysis
name: outcomeorganizer
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: CollapseBox
    label: Basic Outcome Settings
    collapsed: false
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Outcome Variable
            children:
              - type: VariablesListBox
                name: outcome
                maxItemCount: 1
                isTarget: true
              - type: LevelSelector
                name: outcomeLevel
                enable: (outcome)
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: analysistype
  - type: CollapseBox
    label: Multiple Event Types
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: multievent
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: LevelSelector
                    name: dod
                  - type: LevelSelector
                    name: dooc
                  - type: LevelSelector
                    name: awd
                  - type: LevelSelector
                    name: awod

  - type: CollapseBox
    label: Recurrence/Progression
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Recurrence/Progression Variable
            children:
              - type: VariablesListBox
                name: recurrence
                maxItemCount: 1
                isTarget: true
              - type: LevelSelector
                name: recurrenceLevel
                enable: (recurrence)

  - type: CollapseBox
    label: Advanced Options
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Patient ID
            children:
              - type: VariablesListBox
                name: patientID
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Follow-up Time
            children:
              - type: VariablesListBox
                name: followupTime
                maxItemCount: 1
                isTarget: true
      - type: LayoutBox
        margin: large
        children:
          # The backend runs the hierarchy only inside the multi-event branch, so
          # enabling it on patientID alone let a user tick a control that could not
          # act. Both operands are paren-wrapped in one expression: a jamovi
          # `enable:` that is not paren-wrapped is an inert literal and the control
          # is always enabled.
          - type: CheckBox
            name: useHierarchy
            label: Event hierarchy (long-format data only)
            enable: (patientID && multievent)
            children:
              - type: TextBox
                name: eventPriority
                format: number
                enable: (useHierarchy && patientID && multievent)

  - type: CollapseBox
    label: Censoring Options
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: intervalCensoring
            label: Interval censoring
            children:
              - type: VariableSupplier
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Interval Start Variable
                    children:
                      - type: VariablesListBox
                        name: intervalStart
                        maxItemCount: 1
                        isTarget: true
                  - type: TargetLayoutBox
                    label: Interval End Variable
                    children:
                      - type: VariablesListBox
                        name: intervalEnd
                        maxItemCount: 1
                        isTarget: true
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: adminCensoring
            label: Administrative censoring
            children:
              - type: VariableSupplier
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Administrative Censoring Date
                    children:
                      - type: VariablesListBox
                        name: adminDate
                        maxItemCount: 1
                        isTarget: true

  - type: CollapseBox
    label: Display Options
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: outputTable
          - type: CheckBox
            name: diagnostics
          - type: CheckBox
            name: visualization
          - type: CheckBox
            name: showNaturalSummary
          - type: CheckBox
            name: showGlossary
          - type: Output
            name: addOutcome
          - type: Output
            name: addAdminTime
            enable: (adminCensoring)
