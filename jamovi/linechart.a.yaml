---
name: linechart
title: Line Chart
menuGroup: JJStatsPlot
menuSubgroup: Lines
menuSubtitle: 'Time Series and Trend Analysis'
version: '1.0.8'
jas: '1.2'

description:
    main: Creates line charts for time series analysis and trend visualization, with support for multiple groups, confidence intervals, and statistical overlays.
    # R:
    #     dontrun: true
    #     usage: |
    #         # Basic line chart
    #         linechart(
    #             data = clinical_data,
    #             xvar = "time_point",
    #             yvar = "lab_value"
    #         )
            
    #         # Grouped line chart with confidence intervals
    #         linechart(
    #             data = clinical_data,
    #             xvar = "time_point",
    #             yvar = "lab_value",
    #             groupby = "treatment_group",
    #             confidence = TRUE,
    #             trendline = TRUE
    #         )

options:
    - name: data
      type: Data
      description:
          R: The data as a data frame.

    # default: NULL is required on both. The analysis is written to run without
    # them - .init() shows a welcome panel when either is unset - but without a
    # default the compiler makes them REQUIRED arguments of the generated R
    # wrapper, so linechart(data = df) throws "argument \"xvar\" is missing, with
    # no default". The GUI never hits this (it passes nothing positionally); any
    # programmatic caller does, including R CMD check --run-donttest on the
    # examples. Same trap that previously broke agreement() and diagnosticmeta().
    #
    # One wrapper-only limitation remains: linechart(data = df) with NO variables
    # selected dies inside jmvcore's own select() with "invalid 'row.names'
    # length" before any module code runs, so the welcome panel .init() writes
    # for that state is reachable only in the GUI. linechart() with no data at
    # all constructs fine. That is jmvcore behaviour, not a module bug.
    - name: xvar
      title: 'X-axis Variable'
      type: Variable
      default: NULL
      suggested: [ continuous, ordinal ]
      permitted: [ numeric, factor ]
      description:
          R: >
            The variable for the x-axis. Typically represents time, sequence, or ordered categories.

    - name: yvar
      title: 'Y-axis Variable'
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            The variable for the y-axis. Must be numeric (continuous variable).

    - name: groupby
      title: 'Group By'
      type: Variable
      suggested: [ nominal, ordinal ]
      permitted: [ factor ]
      default: NULL
      description:
          R: >
            Optional grouping variable to create multiple lines (e.g., treatment groups, patient categories).

    - name: confidence
      title: "Confidence interval"
      type: Bool
      default: false
      description:
          R: >
            Whether to display confidence intervals around the line(s).

    - name: trendline
      title: "Trend line"
      type: Bool
      default: false
      description:
          R: >
            Whether to add a trend line (linear regression) to the plot.

    - name: points
      title: "Points"
      type: Bool
      default: true
      description:
          R: >
            Whether to show individual data points on the line(s).

    - name: smooth
      title: "Smooth line"
      type: Bool
      default: false
      description:
          R: >
            Whether to apply smoothing (loess) to the line(s).

    # The reference line needs its own on/off switch. Using 0 as the "no line"
    # sentinel made the single most common clinical reference impossible to draw:
    # zero is where change-from-baseline, a difference, and a log fold-change all
    # sit. Verified - refline = 0 drew nothing while 1 and -1 drew correctly.
    - name: showRefline
      title: "Reference line"
      type: Bool
      default: false
      description:
          R: >
            Whether to draw a horizontal reference line at the value below. Enable
            this to draw the line at any value, including zero.

    - name: refline
      title: 'Reference Line Value'
      type: Number
      default: 0
      min: -999999
      max: 999999
      description:
          R: >
            Value at which to draw the reference line (e.g., a normal-range limit,
            a clinical threshold, or zero for no change from baseline). Only drawn
            when Reference line is enabled.

    - name: reflineLabel
      title: 'Reference Line Label'
      type: String
      default: 'Reference'
      description:
          R: >
            Label for the reference line.

    - name: colorPalette
      title: 'Color Palette'
      type: List
      options:
        - title: Default
          name: default
        - title: Colorblind safe (Okabe-Ito)
          name: colorblind
        - title: Viridis
          name: viridis
        # "clinical" is matplotlib's tab10 palette. It was previously offered in
        # the UI as "Clinical (Colorblind Safe)", which is wrong: tab10 puts
        # #2ca02c (green) and #d62728 (red) at adjacent series 3 and 4 - the
        # canonical red/green pair. Only the Okabe-Ito set above is designed for
        # colour-vision deficiency.
        - title: Clinical (tab10)
          name: clinical
      default: default
      description:
          R: >
            Color palette for multiple groups.

    - name: theme
      title: 'Plot Theme'
      type: List
      options:
        - title: Default
          name: default
        - title: Minimal
          name: minimal
        - title: Classic
          name: classic
        - title: Publication
          name: publication
      default: default
      description:
          R: >
            Overall theme/appearance of the plot.

    - name: xlabel
      title: 'X-axis Label'
      type: String
      default: ''
      description:
          R: >
            Custom label for the x-axis.

    - name: ylabel
      title: 'Y-axis Label'
      type: String
      default: ''
      description:
          R: >
            Custom label for the y-axis.

    - name: title
      title: 'Plot Title'
      type: String
      default: ''
      description:
          R: >
            Custom title for the plot.

    - name: width
      title: 'Plot Width'
      type: Integer
      default: 800
      min: 300
      max: 1200
      description:
          R: >
            Width of the plot in pixels.

    - name: height
      title: 'Plot Height'
      type: Integer
      default: 600
      min: 300
      max: 1000
      description:
          R: >
            Height of the plot in pixels.

...
