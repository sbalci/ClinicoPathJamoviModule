---
name:  agepyramid
title: Age Pyramid
jrs:   '1.1'

items:

    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
          - age
          - gender
          - female
          - male
          - age_groups
          - age_interval
          - bin_width
          - custom_breaks
          - enableGGCharts

    - name: welcome
      title: 'Getting Started'
      type: Html
      # NOT `visible: (!age || !gender)`. jmvcore only treats a visible string as
      # an expression when it starts with "(" followed by a letter, so a leading
      # "!" is never recognised - the string is read as truthy and the (empty)
      # "Getting Started" box stayed on screen for every run once both variables
      # were chosen (verified: welcome$visible was TRUE with both set).
      # Visibility is driven from .run() instead.
      visible: false

    - name: dataInfo
      title: 'Data Summary'
      type: Html
      clearWith:
          - age
          - gender
          - female
          - male
          - age_groups
          - age_interval
          - bin_width
          - custom_breaks

    - name:  pyramidTable
      title: 'Population Data'
      type: Table
      rows: 0
      columns:
        - name: Pop
          title: "Age Group"
          type: text
        - name: Female
          title: "Female (n)"
          type: number
        - name: Male
          title: "Male (n)"
          type: number
        - name: Female_Pct
          title: "Female (%)"
          type: number
        - name: Male_Pct
          title: "Male (%)"
          type: number
      clearWith:
          - age
          - gender
          - female
          - male
          - age_groups
          - age_interval
          - bin_width
          - custom_breaks
          - pct_base

    - name: plot
      title: 'Age Pyramid'
      type: Image
      width:  600
      height: 450
      renderFun: .plot
      clearWith:
          - age
          - gender
          - female
          - male
          - age_groups
          - age_interval
          - bin_width
          - custom_breaks
          - pct_base
          - plot_values
          - plot_title
          - color_palette
          - female_color
          - male_color
          - originaltheme

    - name: plotGGCharts
      title: 'Age Pyramid (ggcharts)'
      type: Image
      width:  700
      height: 500
      renderFun: .plotGGCharts
      visible: (enableGGCharts)
      refs: [ggcharts]
      clearWith:
          - age
          - gender
          - female
          - male
          - age_groups
          - age_interval
          - bin_width
          - custom_breaks
          - pct_base
          - plot_values
          - ggcharts_sort
          - ggcharts_colors
          - ggcharts_color1
          - ggcharts_color2
          - ggcharts_title
          - ggcharts_xlab

refs:
    - ClinicoPathJamoviModule

...
