title: IHC Heterogeneity Analysis
name: ihcheterogeneity
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Overall / Whole Slide / HotSpot (Optional)
        children:
          - type: VariablesListBox
            name: wholesection
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Regional Measurement 1 (Required)
        children:
          - type: VariablesListBox
            name: biopsy1
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Regional Measurement 2 (Optional)
        children:
          - type: VariablesListBox
            name: biopsy2
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Regional Measurement 3 (Optional)
        children:
          - type: VariablesListBox
            name: biopsy3
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Regional Measurement 4 (Optional)
        children:
          - type: VariablesListBox
            name: biopsy4
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Additional Regional Measurements
        children:
          - type: VariablesListBox
            name: biopsies
            isTarget: true
      - type: TargetLayoutBox
        label: Spatial Region ID (Optional)
        children:
          - type: VariablesListBox
            name: spatial_id
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Analysis Configuration
    children:
      - type: ComboBox
        name: analysis_type
        label: Analysis focus
      - type: ComboBox
        name: sampling_strategy
        label: Sampling strategy
      - type: CheckBox
        name: compareCompartments
        label: Spatial compartment comparison
        enable: (spatial_id)
      - type: CheckBox
        name: compartmentTests
        label: Compartment comparison tests
        enable: (spatial_id)
  - type: CollapseBox
    label: Clinical Thresholds
    children:
      - type: TextBox
        name: cv_threshold
        format: number
        label: CV threshold (%)
      - type: TextBox
        name: correlation_threshold
        format: number
        label: Correlation threshold
  - type: CollapseBox
    label: Additional Analyses
    children:
      - type: Label
        label: The Comprehensive focus always includes plots, variance components and power analysis; the Variance focus includes plots and variance components. Use these toggles to add them under other focuses.
      - type: CheckBox
        name: show_variability_plots
        label: Variability plots
      - type: CheckBox
        name: variance_components
        label: Variance components analysis
      - type: CheckBox
        name: power_analysis
        label: Power analysis
      - type: CheckBox
        name: generate_recommendations
        label: Clinical recommendations
  - type: CollapseBox
    label: Output Options
    collapsed: true
    children:
      - type: CheckBox
        name: showSummary
        label: Plain-language summary
      - type: CheckBox
        name: showGlossary
        label: Statistical glossary
      - type: CheckBox
        name: showReportSentences
        label: Copy-ready report sentences
      - type: CheckBox
        name: showAssumptions
        label: Methodology & assumptions
