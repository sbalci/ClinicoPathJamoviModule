---
name: pathsampling
title: Pathology Sampling Adequacy Analysis
menuGroup: OncoPathP
menuSubgroup: ClinicoPath Descriptives
version: '2.1.0'
jas: '1.2'

description:
    main: >
        Describe sampling detection among cases in which a lesion was eventually observed.
        Empirical curves and geometric approximations do not identify missed disease,
        correct finite sampling-window bias, or validate clinical rule-out sensitivity.
        Independent planning, hypergeometric and beta-binomial models, and examined-node
        summaries can run using their own inputs without first-detection data.
        Positive-sample probabilities are not probabilities of distinct lesions.
        The single-versus-summed classification uses total foci across slides, not
        positive cassettes. The examined-node summary reports a proportion and Wilson
        interval, not comparative effect sizes. Model applicability is described without
        automatically ranking models with different estimands.

options:
    - name: data
      type: Data

    - name: analysisContext
      title: Analysis Context
      type: List
      options:
        - name: lymphnode
          title: Lymph Node Dissection
        - name: omentum
          title: Omentum Sampling
        - name: tumor
          title: Tumor Sampling (VI/EMVI/PNI/Budding)
        - name: margin
          title: Margin Assessment
        - name: general
          title: General Sampling Adequacy
      default: general
      description: >
        Select the type of pathology sampling analysis:
        - Lymph Node: Adequacy of lymph node dissection
        - Omentum: Omentum sampling in ovarian/gastric cancer
        - Tumor: Tumor block sampling for VI, EMVI, PNI, or budding detection
        - Margin: Margin sampling adequacy
        - General: Custom sampling adequacy analysis

    - name: totalSamples
      title: Total Samples
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description: >
        Total number of samples examined per case.
        Examples: total tumor blocks examined, total lymph nodes dissected, total omentum sections.

    - name: firstDetection
      title: First Detection
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description: >
        Sample number where outcome was first detected (e.g., which block first showed VI).
        Leave as NA for negative cases. For positive cases, enter the sequential sample number (1, 2, 3, etc.).

    - name: positiveCount
      title: Positive Samples Count (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: positiveSamplesList
      title: Positive Samples List (Optional)
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
        - numeric
      default: NULL

    - name: sampleType
      title: Compare Sample Type/Subtype (Optional)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: NULL

    - name: targetConfidence
      title: Target detection probability
      type: Number
      min: 0.5
      max: 0.99
      default: 0.95

    - name: maxSamples
      title: Maximum Samples
      type: Integer
      min: 1
      max: 50
      default: 10

    - name: bootstrapIterations
      title: Bootstrap Iterations
      type: Integer
      min: 100
      max: 100000
      default: 10000

    - name: showBinomialModel
      title: Binomial model
      type: Bool
      default: true

    - name: showBootstrap
      title: Bootstrap analysis
      type: Bool
      default: false

    - name: showDetectionCurve
      title: Diagnostic yield curve
      type: Bool
      default: false

    - name: showSensitivityCI
      title: Observed-positive detection confidence intervals
      type: Bool
      default: false

    - name: setSeed
      title: Fixed random seed
      type: Bool
      default: false

    - name: seedValue
      title: Seed Value
      type: Integer
      default: 42
      min: 1

    - name: positiveCassettes
      title: Positive Cassettes (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: totalFoci
      title: Total foci across slides
      type: Variable
      suggested: [continuous]
      permitted: [numeric]
      default: NULL
      description: >
        Total number of foci summed across slides, not the number of positive cassettes.
        Used only for the single-versus-summed foci classification.

    - name: adequacyThreshold
      title: Examined-node count threshold
      type: Integer
      min: 1
      max: 1000
      default: 12
      description: >
        User-selected threshold for the descriptive examined-node summary.
        The threshold alone does not establish adequate clinical staging.

    - name: maxPositiveSingle
      title: Maximum foci on one slide (optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: showTumorBurden
      title: Tumour burden (sample positivity ratio)
      type: Bool
      default: false

    - name: showStageMigration
      title: Stage migration analysis
      type: Bool
      default: false

    - name: showCorrelation
      title: Examined vs positive correlation
      type: Bool
      default: false

    - name: showDistributionPattern
      title: Distribution pattern (single vs summed)
      type: Bool
      default: false

    - name: distributionThreshold
      title: Distribution Threshold
      type: Integer
      min: 1
      max: 20
      default: 5

    - name: totalPopulation
      title: Total population or binomial trials
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: successStates
      title: Positive counts for probability models
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: targetDetections
      title: Target Detections
      type: Integer
      min: 1
      max: 20
      default: 1

    - name: showHypergeometric
      title: Hypergeometric model
      type: Bool
      default: false

    - name: showBetaBinomial
      title: Beta-binomial model
      type: Bool
      default: false

    - name: totalLymphNodes
      title: Total Lymph Nodes
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: positiveLymphNodes
      title: Positive Lymph Nodes
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL

    - name: showLNAnalysis
      title: Lymph node ratio and staging (pancreatic criteria)
      type: Bool
      default: false

    - name: lnrThreshold1
      title: LNR Threshold 1
      type: Number
      min: 0.01
      max: 1.00
      default: 0.1

    - name: lnrThreshold2
      title: LNR Threshold 2
      type: Number
      min: 0.01
      max: 1.00
      default: 0.3

    - name: showEffectSizes
      title: Examined-node count summary
      type: Bool
      default: false

    - name: showOmentumAnalysis
      title: Omentum sampling literature comparison
      type: Bool
      default: false

    - name: showClinicalSummary
      title: Plain-language clinical summary
      type: Bool
      default: false

    - name: showGuidedInstructions
      title: Guided instructions (detailed checklist)
      type: Bool
      default: false
      description: >
        Display detailed step-by-step checklist with examples and common use cases.
        Best for first-time users and training.

    - name: showConciseInstructions
      title: Concise instructions (brief overview)
      type: Bool
      default: false
      description: >
        Display brief analysis overview with required variables and methods.
        Best for experienced users.

    - name: showEmpiricalCumulative
      title: Empirical cumulative detection
      type: Bool
      default: false

    - name: showSpatialClustering
      title: Spatial clustering of positive samples
      type: Bool
      default: false

    - name: showStratifiedAnalysis
      title: Stratification by sample type
      type: Bool
      default: false

    - name: showPopulationDetection
      title: Population-level detection rates
      type: Bool
      default: false

    - name: showIncrementalYield
      title: Incremental diagnostic yield
      type: Bool
      default: false

    - name: fociGapThreshold
      title: Gap between positive samples that starts a new focus
      type: Integer
      min: 1
      max: 20
      default: 2
      description: >
        Two consecutive positive samples separated by more than this many sample positions are
        counted as belonging to separate foci. The default of 2 is a heuristic, not a validated
        cut-off; set it to match the block-sampling interval used in your laboratory.

    - name: showMultifocalAnalysis
      title: Positive-sample counts and heuristic foci
      type: Bool
      default: false

    - name: showProbabilityExplanation
      title: Probability explanation
      type: Bool
      default: false
      description: >
        Show detailed explanation distinguishing conditional vs population-level detection probabilities.

    - name: showKeyResults
      title: Key results summary
      type: Bool
      default: true
      description: >
        Display a concise summary of key findings at the top of results.

    - name: showRecommendText
      title: Clinical recommendations
      type: Bool
      default: false
      description: >
        Display context-specific clinical recommendations based on analysis results.

    - name: showInterpretText
      title: Statistical interpretation
      type: Bool
      default: false
      description: >
        Show statistical interpretation and guidance for result interpretation.

    - name: showReferencesText
      title: References and methods
      type: Bool
      default: false
      description: >
        Display statistical methods documentation and literature references.

    - name: estimationMethod
      title: q Estimation Method
      type: List
      options:
        - name: auto
          title: Auto (counts in general, lymph-node and omentum contexts)
        - name: geometric
          title: Detected-case geometric approximation
        - name: empirical
          title: Empirical Proportion (requires positive count)
      default: auto

    - name: showHeterogeneityTest
      title: Heterogeneity test
      type: Bool
      default: false
      description: >
        Test the geometric approximation across sample types among eventually detected cases.
        Only available when Sample Type variable is specified. Uses likelihood ratio test.

    - name: showModelFit
      title: Model fit assessment
      type: Bool
      default: false
      description: >
        Approximate chi-square fit test for the detected-case geometric estimator only.
        No p-value is reported for empirical-count estimation. This tests an untruncated
        geometric working model, not disease ascertainment or clinical sensitivity.

    - name: showObsPred
      title: Observed vs predicted detection
      type: Bool
      default: false
      description: >
        Compare observed detection rates with model predictions at each sample number.
        Visual model validation tool.

    - name: showSampleSizePlanning
      title: Sample size for a target detection probability
      type: Bool
      default: false

    - name: planningTargetProb
      title: Target cumulative detection probability
      type: Number
      min: 0.5
      max: 0.99
      default: 0.8

    - name: planningAssumedQ
      title: Assumed per-sample detection probability
      type: Number
      min: 0.000001
      max: 1.0
      default: 0.1

    - name: autoSelectModel
      title: Model applicability guide
      type: Bool
      default: false

    - name: autoDetectHeterogeneity
      title: Automatic heterogeneity detection
      type: Bool
      default: true
      description: >
        Report a heuristic warning when the CV of sample-type geometric first-detection
        estimates exceeds 30 percent. Requires Sample Type, at least 10 detected cases
        overall, and at least two groups with three detected cases each. This screen
        always uses inverse mean first-detection positions, independently of the selected
        prediction estimator; it is not a formal significance test.
