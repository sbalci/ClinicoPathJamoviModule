---
name:  agreement
title: Interrater Reliability
menuGroup: meddecideT
menuSubgroup: Agreement
version: '1.0.83'
jas: '1.2'

description:
    main: >
        Agreement between two or more raters who scored the same cases. Cohen's
        kappa for two raters (unweighted, or linear or quadratic weighted for ordinal
        grades) with a confidence interval, and Fleiss' or Conger's exact kappa for
        three or more; optional Krippendorff's alpha, Gwet's AC, PABAK, ICC, Lin's
        concordance, Bland-Altman limits, marginal homogeneity tests, per-rater and
        per-subgroup agreement, rater and case clustering, consensus and
        agreement-level variables, and sample size for an agreement study.
    R:
        dontrun: true
        usage: |
            # Two raters scoring the same 250 cases as 0 or 1
            agreement(
                data = histopathology,
                vars = c("Rater 1", "Rater 2"),
                sft = TRUE)


options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame in WIDE format: one row per case and one column per
            rater or method, holding that rater's score for that case. (Not long format -
            do not stack the raters into a single column.)

    - name: vars
      title: Raters
      type: Variables
      default: NULL
      description:
          R: >
            The variables in `data` holding the ratings, one per rater or method.
            Each selected variable is one rater's column of scores across the cases.



    - name: baConfidenceLevel
      title: 'Coverage for limits of agreement'
      type: Number
      default: 0.95
      min: 0.50
      max: 0.99
      description:
          R: >
            Proportion of differences the Bland-Altman limits of agreement are meant to
            contain, conventionally 0.95, giving mean difference +/- 1.96 SD. This is a
            coverage proportion for future differences, NOT a confidence level for the
            limits: raising it moves the limits outward rather than widening an interval
            around fixed limits.

    - name: confLevel
      title: 'Confidence level for CIs'
      type: Number
      default: 0.95
      min: 0.80
      max: 0.99
      description:
          R: >
            Confidence level for confidence intervals in ICC, CCC, bootstrap CIs,
            and other agreement statistics. Default is 0.95 (95 percent CI).

    - name: kappaCIMethod
      title: 'Kappa interval method'
      type: List
      options:
        - title: Wald (symmetric, matches psych::cohen.kappa)
          name: wald
        - title: Fisher z (asymmetric, better small-sample coverage)
          name: fisherz
      default: wald
      description:
          R: >
            Scale on which the confidence interval for Cohen's kappa is built.
            Wald is kappa plus or minus z times the non-null asymptotic standard error,
            clamped to the range minus one to one; it is symmetric and reproduces the
            limits printed by psych::cohen.kappa. Fisher z applies the arc-tangent
            transform, builds the interval on that scale with the delta-method standard
            error, and transforms back; the limits are asymmetric and cannot fall outside
            the range minus one to one. In simulation the Wald interval covered the true
            kappa about 85 to 95 percent of the time between 20 and 100 cases, while the
            Fisher z interval held close to its nominal level at every sample size when
            kappa was moderate and the categories balanced, but under-covered when one
            category was rare (about 88 percent at 20 to 30 cases with a 10 percent
            positive rate) and when kappa was very high (88 to 93 percent up to 50
            cases). The setting
            applies to every table that builds a Cohen's kappa interval from the
            asymptotic standard error: the main table with two raters, All-Pairs
            Kappa, Agreement by Subgroup and the inter/intra-rater tables. Bootstrap
            intervals are not affected.

    - name: proportionalBias
      title: "Difference-mean trend (exploratory)"
      type: Bool
      default: false
      description:
          R: >
            Fit an exploratory ordinary least-squares trend of the paired difference
            against the pair mean. The p-value tests whether that slope is zero; it is
            not, by itself, a valid general test of proportional bias because unequal
            method precision can create a slope even when neither method has
            magnitude-dependent bias. Confirm an apparent trend with replicated
            measurements or an errors-in-variables model before calling it proportional bias.

    - name: showBlandAltmanGuide
      title: "When to use Bland-Altman analysis"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining Bland-Altman limits of agreement for method comparison studies.

    - name: blandAltmanPlot
      title: "Bland-Altman plot"
      type: Bool
      default: false
      description:
          R: >
            Generate Bland-Altman plot for continuous agreement analysis.
            Displays mean difference and limits of agreement between the first two raters.
            Only applicable when raters provide continuous measurements (e.g., tumor size in mm).

    - name: agreementHeatmap
      title: "Agreement heatmap (confusion matrix)"
      type: Bool
      default: false
      description:
          R: >
            Generate heatmap visualization of agreement patterns for categorical data.
            Creates confusion matrices showing how each rater pair's classifications correspond.
            Color-coded cells reveal agreement (diagonal) and specific disagreement patterns
            (off-diagonal). Essential for identifying systematic biases, problematic categories,
            and training needs. Shows where raters agree strongly, where they consistently disagree,
            and which category confusions are most common. Particularly valuable for multi-category
            classifications with complex disagreement patterns.

    - name: heatmapColorScheme
      title: "Heatmap colour scheme"
      type: List
      options:
        - title: 'Blue-Red Diverging (Agreement Focus)'
          name: bluered
        - title: 'Green-Yellow-Red (Traffic Light)'
          name: traffic
        - title: 'Viridis (Colorblind-Friendly)'
          name: viridis
        - title: 'Gray Scale (Print-Friendly)'
          name: grayscale
      default: bluered
      description:
          R: >
            Color palette for heatmap visualization. Blue-Red highlights diagonal agreement
            with strong contrast. Traffic light uses intuitive color coding. Viridis is
            perceptually uniform and colorblind-safe. Grayscale for black-and-white printing.

    - name: heatmapShowPercentages
      title: "Percentages in cells"
      type: Bool
      default: true
      description:
          R: >
            Display percentage values within heatmap cells (percentage of total cases).
            Helps interpret relative frequency of each rater combination. Essential
            when comparing heatmaps with different sample sizes.

    - name: heatmapShowCounts
      title: "Counts in cells"
      type: Bool
      default: true
      description:
          R: >
            Display absolute counts within heatmap cells (number of cases).
            Shows actual sample sizes for each cell. Useful for identifying
            cells with insufficient data and assessing statistical reliability.

    - name: heatmapAnnotationSize
      title: "Cell annotation size"
      type: Number
      default: 3.5
      min: 2
      max: 6
      description:
          R: >
            Text size for cell annotations (counts and percentages).
            Adjust for readability with different numbers of categories.
            Larger for few categories, smaller for many categories.

    - name: showAgreementHeatmapGuide
      title: "When to use agreement heatmap"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Agreement Heatmap before running analysis.



    - name: sft
      title: Frequency tables
      type: Bool
      default: false
      description:
          R: >
            Display frequency tables showing the distribution of ratings for each rater.
            Useful for understanding rating patterns and identifying potential biases.


    - name: wght
      title: Weighted kappa (ordinal data only)
      type: List
      options:
        - title: Unweighted (Standard)
          name: unweighted
        - title: Linear Weights (Equal Steps)
          name: equal
        - title: Squared Weights (Severity Weighted)
          name: squared
      default: unweighted
      description:
          R: >
            For ordinal variables (e.g., tumor grade G1/G2/G3), weighted kappa accounts for degree of disagreement.
            Linear weights: Adjacent disagreements (G1 vs G2) receive partial credit.
            Squared weights: Larger disagreements (G1 vs G3) are penalized more heavily.
            Use 'Unweighted' for nominal categories with no inherent order.

    - name: exct
      title: Exact kappa (3+ raters)
      type: Bool
      default: false
      description:
          R: >
            Report Conger's (1980) exact kappa instead of Fleiss' kappa for 3 or more
            raters. Its chance-agreement term uses each rater's own category
            proportions, so the coefficient differs from Fleiss' kappa, and no z
            statistic or p-value is available for it. Not applicable with 2 raters.

    - name: showLevelInfo
      title: "Level ordering information"
      type: Bool
      default: false
      description:
          R: >
            Display information about how categorical levels are currently ordered in your variables.
            Essential for weighted kappa analysis to ensure ordinal levels are properly ordered
            (e.g., G1 → G2 → G3 for tumor grades).

    # Pathologist Grading Analysis (model-based ordinal agreement)
    - name: gradingDesign
      title: "Study design and category distribution"
      type: Bool
      default: false
      description:
          R: >
            Show the reading design (cases, pathologists, ratings per case and per
            pathologist, whether every pathologist is linked through shared cases) and
            the distribution of categories used by each pathologist. Every observed
            rating is used; incomplete cases are not dropped.

    - name: perPathologist
      title: "Per-pathologist agreement"
      type: Bool
      default: false
      description:
          R: >
            For each pathologist, the exact agreement with colleagues who read the same
            cases, the mean pairwise Cohen kappa, and the boundary table showing how much
            more often this pathologist calls a case at or above each grade than the
            colleagues who read the same cases.

    - name: severityModel
      title: "Grading tendency per pathologist (mixed model)"
      type: Bool
      default: false
      description:
          R: >
            Cumulative-probit mixed model with a random case effect and one fixed effect
            per pathologist (ordinal package). Each pathologist's grading tendency is
            shown relative to the panel average, with a Holm-adjusted p-value and a plot.
            Ordinal ratings only.

    - name: latentModel
      title: "Model-based agreement (latent ICC and model-based kappa)"
      type: Bool
      default: false
      description:
          R: >
            Cumulative-probit mixed model with crossed random effects for case and
            pathologist (Nelson and Edwards 2015). Reports the case, pathologist and
            (when a cluster variable is set) institution variances, the latent ICC(2,1)
            and the Nelson-Edwards model-based kappa. Ordinal ratings only; the table
            refuses designs too small for the estimates to be trusted.

    - name: showGradingGuide
      title: "Explanations for pathologist grading analysis"
      type: Bool
      default: false
      description:
          R: >
            Show a plain-language guide to the pathologist grading tables: what each
            one answers, when to use which, and the design limits.

    - name: kripp
      title: "Krippendorff's alpha"
      type: Bool
      default: false
      description:
          R: >
            Alternative reliability measure that handles missing data and supports various data types.
            Useful when raters didn't rate all cases or when comparing different measurement levels.

    - name: krippMethod
      title: "Data type for Krippendorff's alpha"
      type: List
      options:
        - title: Nominal
          name: nominal
        - title: Ordinal
          name: ordinal
        - title: Interval
          name: interval
        - title: Ratio
          name: ratio
      default: nominal
      description:
          R: >
            Specifies the measurement level for Krippendorff's alpha calculation.

    - name: bootstrap
      title: "Bootstrap confidence intervals"
      type: Bool
      default: false
      description:
          R: >
            Calculate bootstrap confidence intervals for Krippendorff's alpha.

    - name: showKrippGuide
      title: "When to use Krippendorff's alpha"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining when to use Krippendorff's Alpha including handling missing data and data type selection.

    - name: gwet
      title: "Gwet's AC1/AC2"
      type: Bool
      default: false
      description:
          R: >
            Alternative agreement coefficient that is more stable than Cohen's kappa when dealing with
            high agreement rates or unbalanced marginal distributions (e.g., rare tumor subtypes).
            Gwet's AC corrects for the paradoxical behavior of kappa in extreme cases.

    - name: gwetWeights
      title: "Weights for Gwet's AC"
      type: List
      options:
        - title: Unweighted (AC1 for nominal)
          name: unweighted
        - title: Linear Weights (ordinal)
          name: linear
        - title: Quadratic Weights (ordinal)
          name: quadratic
      default: unweighted
      description:
          R: >
            Unweighted (AC1) for nominal categories. Linear or Quadratic weights (AC2) for ordinal data.

    - name: showGwetGuide
      title: "When to use Gwet's AC"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining when Gwet's AC is preferred over Cohen's kappa, especially for high agreement rates.

    - name: pabak
      title: "PABAK & prevalence/bias indices"
      type: Bool
      default: false
      description:
          R: >
            Prevalence-Adjusted Bias-Adjusted Kappa (PABAK) corrects Cohen's kappa for the effects
            of prevalence and bias. Also reports the prevalence index (PI) and bias index (BI).
            Useful when kappa is paradoxically low despite high agreement (Byrt et al. 1993).
            Requires exactly 2 raters with categorical data.

    - name: showPABAKGuide
      title: "When to use PABAK"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining PABAK, the kappa paradox, and when prevalence/bias adjustment is needed.

    - name: icc
      title: "ICC (continuous data)"
      type: Bool
      default: false
      description:
          R: >
            Intraclass Correlation Coefficient for continuous measurements (e.g., tumor size in mm,
            biomarker concentrations). Standard measure for assessing agreement with numeric data.
            Complements Bland-Altman analysis.

    - name: showICCGuide
      title: "When to use ICC"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining when and how to use the Intraclass Correlation
            Coefficient, including ICC model selection, interpretation thresholds, and clinical examples.

    - name: iccType
      title: "ICC model"
      type: List
      options:
        - title: 'ICC(1,1) - One-way random, single rater'
          name: icc11
        - title: 'ICC(2,1) - Two-way random, single rater'
          name: icc21
        - title: 'ICC(3,1) - Two-way mixed, single rater'
          name: icc31
        - title: 'ICC(1,k) - One-way random, average raters'
          name: icc1k
        - title: 'ICC(2,k) - Two-way random, average raters'
          name: icc2k
        - title: 'ICC(3,k) - Two-way mixed, average raters'
          name: icc3k
      default: icc21
      description:
          R: >
            ICC model selection. One-way: each subject rated by different raters.
            Two-way: all subjects rated by same raters. Random: raters are random sample.
            Mixed: raters are fixed. Single: reliability of individual rater. Average (k): reliability of mean rating.

    - name: meanPearson
      title: "Mean Pearson correlation (linear association)"
      type: Bool
      default: false
      description:
          R: >
            Mean Pearson Correlation calculates the average linear correlation coefficient across all
            rater pairs for continuous measurements. Pearson's r measures linear association between
            variables, ranging from -1 (perfect negative) to +1 (perfect positive correlation).
            For interrater agreement, high positive correlations indicate raters' measurements vary
            together linearly. Particularly useful for continuous scales (tumor size, biomarker levels,
            quantitative scores), assumes linear relationship and normality. Complements ICC by
            focusing on correlation rather than absolute agreement. Simple, interpretable measure
            for assessing whether raters rank and scale measurements similarly.

    - name: showMeanPearsonGuide
      title: "When to use mean Pearson correlation"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Mean Pearson Correlation before running analysis.

    - name: linCCC
      title: "Lin's concordance correlation coefficient (CCC)"
      type: Bool
      default: false
      description:
          R: >
            Lin's Concordance Correlation Coefficient (CCC) measures both precision and accuracy for continuous
            data, making it superior to Pearson's r for method comparison and agreement studies. CCC ranges from
            -1 to +1 (perfect concordance) and equals the product of Pearson's r (precision) and a bias correction
            factor (accuracy). Unlike Pearson's r which only measures linear association, CCC penalizes systematic
            bias. Essential for method comparison (manual vs. automated), instrument validation, and assessing
            measurement agreement. Requires 2 raters/methods for pairwise comparison; calculates all pairwise CCCs
            for 3+ raters.

    - name: showLinCCCGuide
      title: "When to use Lin's CCC"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Lin's Concordance Correlation Coefficient before running analysis.

    - name: tdi
      title: "Total deviation index (TDI)"
      type: Bool
      default: false
      description:
          R: >
            Total Deviation Index (TDI): the boundary within which the requested proportion of
            absolute differences between two measurement methods fall. Computed here as the
            empirical quantile of the absolute differences, with a case-resampling bootstrap
            interval. It is a single number summarising how far apart the two methods get, and
            it is useful alongside Bland-Altman when the differences are not normal. Note the
            scope: this estimator is unconditional, so it does NOT model variability as a
            function of magnitude and does not adjust for the case mix of the sample - a
            different spread of values gives a different TDI for the same two methods. Use it as
            a descriptive summary of the observed comparison, not on its own as a demonstration
            of equivalence or of regulatory acceptability, which require a prespecified design
            and acceptance criterion. Requires 2 raters/methods.

    - name: tdiCoverage
      title: "Empirical coverage target (percent)"
      type: Number
      default: 90
      min: 50
      max: 99
      description:
          R: >
            Quantile of the observed absolute differences to report (default: 90 percent).
            Common descriptive targets are 90 or 95 percent. This is an unconditional
            empirical target for the sampled case mix, not a prediction guarantee for future
            measurements.

    - name: tdiLimit
      title: "Acceptable limit"
      type: Number
      default: 10
      min: 0.1
      max: 1000
      description:
          R: >
            Maximum acceptable difference between methods in original units.
            Example: For tumor size, 5mm might be clinically acceptable.
            Compare the empirical TDI and its bootstrap interval with this prespecified
            descriptive limit. Passing it does not, by itself, establish method equivalence.

    - name: showTDIGuide
      title: "When to use TDI"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Total Deviation Index before running analysis.

    - name: iota
      title: "Iota coefficient (single variable)"
      type: Bool
      default: false
      description:
          R: >
            Iota coefficient (Janson & Olsson, 2001) for the selected rater columns, computed as ONE
            variable rated by all of them. Supports quantitative (continuous) and nominal (categorical)
            ratings. For nominal ratings it is numerically identical to Conger's exact kappa, which the
            'Exact kappa (3+ raters)' option also reports. The multivariate form of iota - several
            variables scored by the same raters, summarised in one coefficient - is NOT computed by this
            analysis, because no option here can say which columns belong to which variable; enter the
            rater columns of one variable at a time.

    - name: iotaStandardize
      title: "Standardize quantitative ratings (no effect on a single variable)"
      type: Bool
      default: true
      description:
          R: >
            Z-standardize the quantitative ratings before computing Iota. Standardization exists to
            equalise the contribution of several variables to a multivariate iota. This analysis computes
            iota for a single variable, where standardizing is an affine rescaling that leaves the
            coefficient unchanged, so this setting has no effect on the reported value.

    - name: showIotaGuide
      title: "When to use iota coefficient"
      type: Bool
      default: false
      description:
          R: >
            Show the educational guide explaining the Iota coefficient, what this analysis computes with
            it, and when to prefer kappa or ICC instead.

    - name: finn
      title: "Finn coefficient (variance-based agreement)"
      type: Bool
      default: false
      description:
          R: >
            Finn coefficient for interrater reliability of categorical data. Variance-based agreement measure
            especially useful when variance between raters is low (i.e., agreement is high). Alternative to
            traditional kappa-based measures. Works with ordered categorical ratings.

    - name: finnLevels
      title: "Number of rating categories (Finn)"
      type: Integer
      min: 2
      max: 20
      default: 3
      description:
          R: >
            The number of categories on the rating scale, used by the Finn coefficient as its
            chance baseline (the variance of a uniform rating on an s-point scale), so it changes
            the value and can change its sign. When the rater variables are nominal or ordinal
            this is read from their declared levels instead and a note reports any disagreement;
            this option is only consulted for numeric ratings, where the scale cannot be
            recovered from the data. Count every category on the scale, including any that no
            case happened to receive.

    - name: finnModel
      title: "Finn model type"
      type: List
      options:
        - title: 'One-way (subjects random)'
          name: oneway
        - title: 'Two-way (subjects and raters random)'
          name: twoway
      default: oneway
      description:
          R: >
            Model specification for Finn coefficient. One-way: only subjects are random effects (each subject
            may be rated by different raters). Two-way: both subjects and raters are random (subjects and raters
            randomly chosen from larger populations).

    - name: showFinnGuide
      title: "When to use Finn coefficient"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining the Finn coefficient and variance-based agreement measurement.

    - name: lightKappa
      title: "Light's kappa (3+ raters)"
      type: Bool
      default: false
      description:
          R: >
            Alternative agreement measure for 3 or more raters. Calculates the average of all pairwise
            kappas between raters. More robust than Fleiss' kappa when raters have different marginal
            distributions or when assumptions of Fleiss' kappa are questionable.

    - name: showLightKappaGuide
      title: "When to use Light's kappa"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining when Light's Kappa is preferred for 3+ rater studies.

    - name: kendallW
      title: "Kendall's W (concordance for rankings)"
      type: Bool
      default: false
      description:
          R: >
            Kendall's coefficient of concordance (W) measures agreement among raters when rating or
            ranking ordinal data. W ranges from 0 (no agreement) to 1 (perfect agreement). Particularly
            useful for ranked data, severity scores, and ordinal grading systems where you want to know
            if raters rank cases in similar order.

    - name: showKendallWGuide
      title: "When to use Kendall's W"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide explaining Kendall's W for ordinal concordance and ranking agreement.

    - name: robinsonA
      title: "Robinson's A (ordinal agreement index)"
      type: Bool
      default: false
      description:
          R: >
            Robinson's A (1957) is an agreement coefficient for ordinal or numeric ratings: 1 minus
            the within-case variance divided by the total variance. It ranges from 0 to 1 (perfect agreement),
            with 0 indicating agreement no better than chance. Alternative to weighted kappa that
            directly measures the degree of ordinal association between raters. Particularly useful
            when ordinal categories have meaningful rank order (e.g., disease severity stages, tumor
            grades). Less affected by marginal distribution imbalances than kappa-based measures.

    - name: showRobinsonAGuide
      title: "When to use Robinson's A"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Robinson's A before running analysis.

    - name: meanSpearman
      title: "Mean Spearman rho (average rank correlation)"
      type: Bool
      default: false
      description:
          R: >
            Mean Spearman Rho calculates the average rank correlation across all rater pairs.
            Spearman's rho is a nonparametric measure of monotonic association for ordinal data.
            It ranges from -1 (perfect negative association) to +1 (perfect positive association),
            with 0 indicating no association. When used for interrater agreement, high positive
            values indicate raters rank cases similarly. Particularly useful for ordinal scales,
            rankings, and severity ratings. Robust to outliers and does not assume linear
            relationship. Complements other ordinal measures (Robinson's A, Kendall's W) by
            focusing on rank-order correlation rather than exact concordance.

    - name: showMeanSpearmanGuide
      title: "When to use mean Spearman rho"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Mean Spearman Rho before running analysis.

    - name: raterBias
      title: "Directional discordance test (ordinal, 2 raters)"
      type: Bool
      default: false
      description:
          R: >
            Tests whether the disagreements between two raters run in one direction more often
            than the other, i.e. whether one rater is consistently the higher scorer on the cases
            where they differ. A single chi-square on 1 degree of freedom comparing the total
            counts above and below the diagonal of the two-rater table (`irr::rater.bias`).
            Requires exactly 2 raters and both variables must be declared Ordinal, because
            "higher" is otherwise undefined. This is NOT a test of marginal homogeneity: opposing
            shifts in different categories cancel out and it returns p = 1 even when the two
            raters use the categories at quite different rates. Use `bhapkar` or `stuartMaxwell`
            for that hypothesis.

    - name: showRaterBiasGuide
      title: "When to use directional discordance test"
      type: Bool
      default: false
      description:
          R: >
            Show an educational guide to the two-rater ordinal directional discordance test,
            including its distinction from marginal homogeneity.

    - name: bhapkar
      title: "Bhapkar test (marginal homogeneity for 2 raters)"
      type: Bool
      default: false
      description:
          R: >
            Bhapkar test for marginal homogeneity between two raters with multiple categories. More powerful
            alternative to Stuart-Maxwell test. Like McNemar's test but for >2 categories. Tests if two raters
            use rating categories with equal frequency. Essential for paired comparisons (e.g., pre-post training,
            novice vs. expert, pathologist vs. AI algorithm) to detect systematic differences in category usage.

    - name: showBhapkarGuide
      title: "When to use Bhapkar test"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for the Bhapkar test of marginal homogeneity.

    - name: stuartMaxwell
      title: "Stuart-Maxwell test (marginal homogeneity for 2 raters)"
      type: Bool
      default: false
      description:
          R: >
            Stuart-Maxwell test for marginal homogeneity between two raters with multiple categories. Classic test
            for matched data analysis. Like McNemar's test but for >2 categories. Tests if two raters use rating
            categories with equal frequency. Note: Bhapkar test is more powerful for large samples, but Stuart-Maxwell
            is the traditional choice. Use for paired/matched comparisons to detect systematic category usage differences.

    - name: showStuartMaxwellGuide
      title: "When to use Stuart-Maxwell test"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for the Stuart-Maxwell test of marginal homogeneity.

    - name: maxwellRE
      title: "Rater variance decomposition (systematic vs random)"
      type: Bool
      default: false
      description:
          R: >
            A two-way (case + rater) variance decomposition splits rater disagreement into a systematic
            (rater offset) and a random (residual) component; the between-case variance is reported separately.
            The random share is the proportion of disagreement attributable
            to random measurement error rather than systematic differences between raters or methods.
            Values range from 0 (all error is systematic) to 1 (all error is random). Essential for
            understanding error sources in method comparison studies, diagnostic test validation, and
            measurement reliability assessment. Typically used with continuous or ordinal data requiring
            2+ raters/methods.

    - name: showMaxwellREGuide
      title: "When to use the variance decomposition"
      type: Bool
      default: false
      description:
          R: >
            Show the guide to the rater variance decomposition before running analysis.

    - name: interIntraRater
      title: "Inter/intra-rater reliability (test-retest)"
      type: Bool
      default: false
      description:
          R: >
            Simultaneous assessment of inter-rater and intra-rater reliability for test-retest studies.
            Calculates intra-rater reliability (same rater consistency across time) and inter-rater
            reliability (agreement between different raters). Requires paired columns representing
            the same rater at different time points (e.g., Rater1_Time1, Rater1_Time2). Essential
            for training evaluation, fatigue studies, and long-term reliability assessment. Reports
            both within-rater consistency and between-rater agreement.

    - name: interIntraSeparator
      title: "Column name separator (inter/intra)"
      type: String
      default: "_"
      description:
          R: >
            Character separating rater ID from time point in column names (default: underscore).
            Example: With separator "_", columns named "Rater1_T1" and "Rater1_T2" are recognized
            as the same rater at two time points. Common patterns: underscore (_), dot (.), dash (-).

    - name: showInterIntraRaterGuide
      title: "When to use inter/intra-rater reliability"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Inter/Intra-Rater Reliability before running analysis.

    - name: pairwiseKappa
      title: "Pairwise kappa (vs reference)"
      type: Bool
      default: false
      description:
          R: >
            Compare each rater individually against a reference rater (e.g., gold standard, consensus score,
            senior pathologist). Produces individual kappa values for each rater-vs-reference comparison.
            Essential for training assessment, rater certification, and performance monitoring.

    - name: referenceRater
      title: "Reference rater variable"
      type: Variable
      suggested: [ordinal, nominal]
      permitted: [factor, numeric]
      default: NULL
      description:
          R: >
            Select the reference rater variable (e.g., consensus score, gold standard diagnosis, senior
            pathologist ratings). Each rater in the main variable list will be compared pairwise with
            this reference using Cohen's kappa.

    - name: rankRaters
      title: "Rater performance ranking"
      type: Bool
      default: false
      description:
          R: >
            Rank raters from highest to lowest kappa (relative to reference). Shows best and worst
            performing raters for quality control and training needs. Useful for identifying raters
            who need additional training or those ready for certification.

    - name: showPairwiseKappaGuide
      title: "When to use pairwise kappa"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for pairwise kappa analysis against a reference rater.

    # ============================================================
    # ALL-PAIRS COHEN'S KAPPA TABLE (every rater pair, no reference)
    # ============================================================

    - name: allPairsKappa
      title: "All-pairs Cohen's kappa (every rater pair)"
      type: Bool
      default: false
      description:
          R: >
            For studies with 3+ raters, compute Cohen's kappa, observed agreement,
            standard error, a confidence interval at the chosen confidence level, z,
            and p-value for every rater pair
            (C(k,2) rows). Reproduces the conventional pairwise agreement table
            reported in interobserver reliability studies. Honors the 'wght'
            (weights) and 'multipleTestCorrection' options.

    - name: allPairsCI
      title: "Confidence interval for each pair"
      type: Bool
      default: true
      description:
          R: >
            Show the confidence interval columns of the All-Pairs Kappa table. Each
            interval is built at the chosen confidence level from the non-null
            asymptotic standard error (vcd::Kappa), on the scale set by 'Kappa
            interval method'. When vcd::Kappa cannot return a finite standard error
            for a pair, that row falls back to the irr::kappa2 null-hypothesis
            standard error and a footnote says so.

    - name: showAllPairsKappaGuide
      title: "When to use all-pairs kappa"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for all-pairs kappa: when to report the full
            pairwise table versus average (Light's) or overall (Fleiss') kappa.

    # ============================================================
    # PER-CATEGORY ITEM-MODAL AGREEMENT
    # ============================================================

    - name: itemModalCategoryAgreement
      title: "Per-category item-modal agreement"
      type: Bool
      default: false
      description:
          R: >
            For each rating category, compute the mean within-case agreement rate
            across raters on cases whose modal rating equals that category.
            Identifies which categories drive disagreement (e.g., YSRB Category
            IV "suspicious" is a known agreement bottleneck in breast cytology).
            Cases with no unique mode (ties) are excluded.

    - name: showItemModalGuide
      title: "When to use per-category item-modal agreement"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for per-category item-modal agreement.

    # Hierarchical/Multilevel Agreement Analysis
    - name: hierarchicalKappa
      title: "Hierarchical/multilevel kappa"
      type: Bool
      default: false
      description:
          R: >
            Agreement for multi-centre designs in which every case belongs to one cluster
            (institution, centre or scanner) and the same raters score the cases. Categorical
            ratings get cluster-specific kappa and a stratified kappa (the cluster kappas
            weighted by cluster size, Barlow, Lai and Azen 1991) shown beside the pooled kappa.
            Continuous ratings get the within-cluster ICC(2,1) and ICC(2,k) from a linear mixed
            model. For categorical ratings the case, pathologist and institution variances come
            from the model-based agreement of the pathologist grading analysis (an ordinal
            mixed model), not from this section.

    - name: clusterVariable
      title: "Cluster/institution variable"
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor, numeric]
      default: NULL
      description:
          R: >
            Variable giving the cluster (for example hospital, institution or scanner ID) that
            each case belongs to. Each case must belong to exactly one cluster; the same raters
            may score cases from every cluster. Used by the hierarchical kappa and, when set,
            by the model-based agreement of the pathologist grading analysis, which then adds
            an institution variance to the latent model.

    - name: iccHierarchical
      title: "Hierarchical ICC decomposition"
      type: Bool
      default: false
      description:
          R: >
            Intraclass correlations for the hierarchical design, estimated within cluster:
            ICC(2,1), the absolute-agreement reliability of a single rater, and ICC(2,k), that
            of the mean of the raters, from a linear mixed model. Continuous ratings only; for
            categorical ratings the latent ICC is reported by the model-based agreement of the
            pathologist grading analysis.

    - name: clusterSpecificKappa
      title: "Cluster-specific kappa estimates"
      type: Bool
      default: true
      description:
          R: >
            Agreement within each cluster separately, to see whether it is similar across
            sites: Cohen's or Fleiss' kappa for categorical ratings, the ICC for continuous
            ratings. Useful for quality control in multi-centre studies.

    - name: varianceDecomposition
      title: "Variance component decomposition"
      type: Bool
      default: true
      description:
          R: >
            Share of the rating variance due to cases, raters, clusters and residual error,
            from a linear mixed model. Continuous ratings only; for categorical ratings the
            variances are estimated by the model-based agreement of the pathologist grading
            analysis.

    - name: testClusterHomogeneity
      title: "Cluster homogeneity test"
      type: Bool
      default: true
      description:
          R: >
            Likelihood ratio test for the institution (cluster) random effect: the linear
            mixed model for continuous ratings fitted with and without an institution term.
            It tests whether the cases' mean scores differ between institutions (case mix or
            site-level scoring, which this design cannot separate), not whether agreement
            (kappa or ICC) differs between them; read the cluster-specific estimates for
            that. The p-value is boundary-corrected, half the usual chi-square value,
            because a variance cannot be negative (Stram and Lee, 1994).

    - name: clusterRankings
      title: "Cluster performance rankings"
      type: Bool
      default: false
      description:
          R: >
            Rank clusters by their cluster-specific agreement. Read each rank beside that
            cluster's confidence interval: with small clusters, neighbouring ranks are rarely
            distinguishable, and ranking sites of very different size invites unfair
            comparison.

    - name: showHierarchicalGuide
      title: "When to use hierarchical kappa"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for hierarchical/multilevel kappa in multi-center studies.

    # Mixed-Effects Condition Comparison
    - name: conditionVariable
      title: "Condition/method variable"
      type: Variable
      suggested: [nominal, ordinal]
      permitted: [factor]
      default: NULL
      description:
          R: >
            Variable distinguishing measurement conditions (e.g., AI-assisted vs. conventional,
            pre-training vs. post-training). Enables mixed-effects comparison that accounts for
            rater and case random effects. Each case-rater pair should have one observation
            per condition level.

    - name: mixedEffectsComparison
      title: "Mixed-effects condition comparison"
      type: Bool
      default: false
      description:
          R: >
            Fit a linear mixed model to compare measurement conditions while accounting
            for rater and case random effects. Model: score ~ condition + (1|rater) + (1|case).
            Provides condition effect estimate with CI, variance components, and ICC.
            More powerful than paired t-tests or Wilcoxon tests when data has a crossed
            rater x case x condition design (e.g., Dy et al. 2024 Ki-67 AI study).

    - name: multipleTestCorrection
      title: "Multiple testing correction"
      type: List
      options:
        - title: "None"
          name: none
        - title: "Bonferroni"
          name: bonferroni
        - title: "Benjamini-Hochberg (FDR)"
          name: bh
        - title: "Holm"
          name: holm
      default: none
      description:
          R: >
            Correction for multiple comparisons, applied to the pairwise p-values of the
            All-Pairs Kappa table and to the fixed-effect p-values of the Mixed-Effects
            Condition Comparison.

    - name: showMixedEffectsGuide
      title: "When to use mixed-effects comparison"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for mixed-effects condition comparison in AI validation studies.

    # Multi-Class Confusion Matrix
    - name: confusionMatrix
      title: "Confusion matrix table"
      type: Bool
      default: false
      description:
          R: >
            Display a formal N×N confusion matrix comparing first two raters
            (or reference vs predicted). Includes row/column normalization options
            and per-class precision, recall, and F1 scores. Essential for
            multi-category classification studies (e.g., HER2 0/1+/2+/3+ scoring).

    - name: confusionNormalize
      title: "Normalization"
      type: List
      options:
        - title: "None (counts)"
          name: none
        - title: "Row-normalized (recall)"
          name: row
        - title: "Column-normalized (precision)"
          name: column
      default: none
      description:
          R: >
            How to normalize the confusion matrix. None shows raw counts.
            Row-normalized shows proportions within each reference category
            (equivalent to recall/sensitivity per class). Column-normalized
            shows proportions within each predicted category (equivalent to
            precision/PPV per class).

    - name: showConfusionMatrixGuide
      title: "When to use confusion matrix"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for multi-class confusion matrix interpretation and per-class metrics.

    # Bootstrap Confidence Intervals
    - name: bootstrapCI
      title: "Bootstrap confidence intervals"
      type: Bool
      default: false
      description:
          R: >
            Calculate bootstrap confidence intervals for agreement metrics
            (kappa, Fleiss kappa, Krippendorff alpha, ICC, percent agreement).
            Uses case resampling with BCa (bias-corrected and accelerated) method.
            Recommended when analytical CIs are unavailable or when distributions
            may be non-normal (e.g., skewed kappa distributions with few categories).

    - name: nBoot
      title: "Number of bootstrap samples"
      type: Integer
      default: 1000
      min: 100
      max: 10000
      description:
          R: >
            Number of bootstrap resamples for confidence interval estimation.
            1000 is adequate for 95 percent CIs. Use 5000-10000 for publication-quality
            99 percent CIs or when metrics are near boundary values (0 or 1).

    - name: showBootstrapCIGuide
      title: "When to use bootstrap CIs"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for bootstrap confidence intervals and when they are preferred over analytical CIs.

    # Multi-Annotator Concordance F1
    - name: multiAnnotatorConcordance
      title: "Multi-annotator concordance"
      type: Bool
      default: false
      description:
          R: >
            Compute concordance metrics where a prediction is considered correct
            if it matches ANY of the reference annotators. Useful for AI validation
            studies where multiple pathologists annotate the same cases and no single
            ground truth exists (e.g., Ottl et al. 2025 HER2 scoring). Reports
            concordance accuracy, per-class concordance F1, and comparison to
            strict consensus-based evaluation.

    - name: predictionColumn
      title: "Prediction column (first rater)"
      type: Integer
      default: 1
      min: 1
      max: 100
      description:
          R: >
            Which rater column contains the predictions to evaluate. Default is
            column 1 (first rater). Remaining columns are treated as reference
            annotators. For AI validation, set this to the column containing AI
            predictions.

    - name: showConcordanceF1Guide
      title: "When to use multi-annotator concordance"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for concordance metrics in AI validation with multiple reference annotators.

    - name: specificAgreement
      title: "Specific agreement indices (category-focused)"
      type: Bool
      default: false
      description:
          R: >
            Calculate category-specific agreement indices for binary or multi-category data.
            For binary data: Positive Specific Agreement (PSA) and Negative Specific Agreement (NSA).
            For multi-category data: Agreement indices for each category separately.
            Essential when some categories are more clinically important than others (e.g., cancer
            diagnosis, adverse events, critical findings). Unlike overall kappa which treats all
            disagreements equally, specific agreement focuses on agreement within each category,
            revealing which categories have reliable agreement and which need attention.

    - name: specificPositiveCategory
      title: "Positive category (binary analysis)"
      type: String
      default: ""
      description:
          R: >
            For binary specific agreement: Specify which category should be treated as "positive"
            (e.g., "Cancer", "Malignant", "Present", "Yes", "1"). Leave blank to calculate
            specific agreement for all categories. Required for PSA/NSA interpretation.
            Example: If categories are "Benign" and "Malignant", enter "Malignant".

    - name: specificAllCategories
      title: "All-category estimates"
      type: Bool
      default: true
      description:
          R: >
            Calculate specific agreement for each category separately (recommended).
            When enabled, provides agreement indices for every category in your data,
            identifying which specific diagnoses/classifications have strong agreement
            and which may need improved training or criteria clarification.

    - name: specificConfidenceIntervals
      title: "Confidence intervals"
      type: Bool
      default: true
      description:
          R: >
            Calculate confidence intervals at the chosen confidence level for specific
            agreement indices, using the Wilson score method. Recommended for publication and when sample sizes vary
            across categories. Helps distinguish true differences in category-specific
            agreement from random variation.

    - name: showSpecificAgreementGuide
      title: "When to use specific agreement indices"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide and clinical use cases for Specific Agreement Indices before running analysis.

    - name: showSummary
      title: "Plain-language summary"
      type: Bool
      default: false
      description:
          R: >
            Display a natural-language interpretation of results with the Landis and Koch
            agreement level and clinical guidance. Recommended for reports and presentations.

    - name: showAbout
      title: "About this analysis"
      type: Bool
      default: false
      description:
          R: >
            Display an explanatory panel describing what this analysis does, when to use it, and how to interpret results.

    - name: consensusName
      title: "Consensus variable name"
      type: String
      default: "consensus_rating"
      description:
          R: >
            Name of the new computed variable containing consensus ratings.
            Will be added to the dataset and available for downstream analyses.

    # Create Consensus Variable
    - name: consensusVar
      title: "Consensus variable"
      type: Output
      description:
          R: >
            Calculate consensus (modal) rating across raters and add as new computed column.
            Essential for creating reference standards from multi-rater panels.
            Adds new variable to dataset with most common rating for each case.

    - name: consensusRule
      title: "Consensus rule"
      type: List
      options:
        - title: 'Simple Majority (>50 percent)'
          name: majority
        - title: 'Supermajority (>=75 percent)'
          name: supermajority
        - title: 'Unanimous (100 percent)'
          name: unanimous
      default: majority
      description:
          R: >
            Rule for defining consensus. Simple majority = modal category with >50 percent of votes.
            Supermajority requires >=75 percent agreement. Unanimous requires 100 percent agreement.
            Cases not meeting threshold are set to NA in consensus variable.

    - name: tieBreaker
      title: "Tie handling"
      type: List
      options:
        - title: 'Set to NA (exclude case)'
          name: exclude
        - title: 'Use first occurring mode'
          name: first
        - title: 'Use lowest category'
          name: lowest
        - title: 'Use highest category'
          name: highest
      default: exclude
      description:
          R: >
            How to handle ties when no single category meets the consensus threshold
            (e.g., 2-2 split with 4 raters). Exclude = set consensus to NA for tied cases.
            First = use first category that appears. Lowest/Highest = use min/max of tied categories.


    # Case Agreement Categorization (Consolidated Feature)
    - name: loaVariable
      title: "Case agreement categorization"
      type: Bool
      default: false
      description:
          R: >
            Calculate the agreement level for each case. Choose between Simple
            (3 categories) or Detailed (5 categories) classification. Useful for
            identifying difficult cases and quality control. To also add the result
            to the dataset as a new column, enable the separate output variable
            'Add case agreement categorization to data'.

    - name: detailLevel
      title: "Detail level"
      type: List
      options:
        - title: Simple (3 categories)
          name: simple
        - title: Detailed (5 categories)
          name: detailed
      default: detailed
      description:
          R: >
            Simple mode: All Agreed (100 percent), Majority Agreed (>=threshold percent), No Agreement (<threshold percent).
            Detailed mode: Absolute (100 percent), High, Moderate, Low, Poor (based on custom/data-driven thresholds).
            Simple mode replicates the former "Agreement Status" feature.

    - name: simpleThreshold
      title: "Majority threshold (percent) - simple mode"
      type: Number
      default: 50
      min: 50
      max: 100
      description:
          R: >
            For Simple mode only: Minimum  percent for "Majority Agreed" status.
            50 percent = simple majority, 75 percent = supermajority, 100 percent = unanimous.

    - name: loaThresholds
      title: "Categorization method (detailed mode)"
      type: List
      options:
        - title: Custom Thresholds
          name: custom
        - title: Quartiles (Data-Driven)
          name: quartiles
        - title: Tertiles (Data-Driven)
          name: tertiles
      default: custom
      description:
          R: >
            For Detailed mode only: How to define 5 LoA categories.
            Custom = user-defined cutpoints. Quartiles/Tertiles = data-driven splits.

    - name: loaHighThreshold
      title: "High threshold (percent) - detailed mode"
      type: Number
      default: 75
      min: 50
      max: 99
      description:
          R: >
            For Detailed mode with Custom thresholds only:
            Minimum  percent for "High" classification (e.g., 75 percent = >=12/16 raters).
            Cases >= this threshold are "High Agreement".

    - name: loaLowThreshold
      title: "Low threshold (percent) - detailed mode"
      type: Number
      default: 56
      min: 30
      max: 75
      description:
          R: >
            For Detailed mode with Custom thresholds only:
            Minimum  percent for "Low" classification (e.g., 56 percent = >=9/16 raters).
            Below = "Poor", between Low and High = "Moderate".

    - name: loaVariableName
      title: "Variable name for LoA"
      type: String
      default: 'agreement_level'
      description:
          R: >
            Name for the computed Level of Agreement variable added to the dataset.
            Default: 'agreement_level'. Will contain categories like 'Absolute', 'High', 'Moderate', 'Low', 'Poor'.

    - name: showLoaTable
      title: "LoA distribution table"
      type: Bool
      default: true
      description:
          R: >
            Display summary table showing distribution of cases across LoA categories
            with counts and percentages. Useful for quality control reporting.

    # type: Output, not Bool. jmvcore's Output result item resolves its gating
    # option by the RESULT ITEM'S OWN NAME (Output$enabled reads
    # options$get(private$.name)), and Output$asProtoBuf() emits nothing when that
    # is FALSE. `loaVariable` gates the COMPUTATION (and loaTable/loaDetailTable);
    # this option gates DELIVERY of the column, exactly like consensusVar above.
    # The name must stay equal to the .r.yaml item name. No `default:` -- the
    # compiler's optionify() emits only the bare name for an Output option.
    - name: loaOutput
      title: "Case agreement categorization column"
      type: Output
      description:
          R: >
            Adds the per-case agreement category as a new computed column in the dataset.
            Requires 'Case agreement categorization' to be enabled, which performs the
            calculation. This is a jamovi output variable driven by the Output control in
            the analysis panel; it is not an argument of the R function.

    # ---- Rater Profile Plots ----

    - name: raterProfiles
      title: "Rater profile plots (distribution comparison)"
      type: Bool
      default: false
      description:
          R: >
            Generate box plots or violin plots showing the distribution of ratings for each rater.
            For categorical data: bar plots showing category distribution per rater.
            For continuous data: box plots/violin plots showing rating distribution per rater.
            Essential for identifying raters with systematically different rating patterns (e.g.,
            consistently higher/lower scores, restricted range use, bimodal distributions).
            Reveals rating style differences, scale use patterns, and potential training needs.
            Particularly valuable when agreement is low - helps determine if disagreement stems
            from systematic differences in rating distributions or random variation.

    - name: raterProfileType
      title: "Profile plot type"
      type: List
      options:
        - title: 'Box Plot (Median + IQR)'
          name: boxplot
        - title: 'Violin Plot (Full Distribution)'
          name: violin
        - title: 'Bar Plot (Category Frequencies)'
          name: barplot
      default: boxplot
      description:
          R: >
            For continuous data: Choose between box plots (shows median, quartiles, outliers)
            or violin plots (shows full distribution shape including multimodality).
            For categorical data: Automatically uses bar plots showing category frequencies.

    - name: raterProfileShowPoints
      title: "Individual data points"
      type: Bool
      default: false
      description:
          R: >
            Overlay individual rating observations on box/violin plots.
            Useful for smaller datasets (N < 100) to show actual data distribution.
            Not recommended for large datasets due to overplotting.

    - name: showRaterProfileGuide
      title: "When to use rater profile plots"
      type: Bool
      default: false
      description:
          R: >
            Show the educational guide explaining what a rater profile plot shows,
            how to read a systematic shift between raters, and when to prefer a
            coefficient instead.

    # ---- Agreement by Subgroup ----

    - name: agreementBySubgroup
      title: "Agreement by subgroup (stratified analysis)"
      type: Bool
      default: false
      description:
          R: >
            Calculate agreement statistics separately for each level of a subgroup variable
            (e.g., tumor type, disease stage, specimen type, difficulty level).
            Generates forest plot showing kappa/ICC values with confidence intervals across subgroups.
            Essential for determining whether agreement is consistent across different contexts or
            varies by case characteristics. Common use cases: comparing agreement for benign vs.
            malignant cases, early vs. advanced stage, different anatomical sites, or
            easy vs. difficult cases. Reveals whether rater training is adequate for all case types
            or whether specific subgroups need targeted attention.

    - name: subgroupVariable
      title: "Subgroup variable"
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      default: NULL
      description:
          R: >
            Categorical variable defining subgroups for stratified analysis.
            Examples: tumor_type, disease_stage, specimen_site, difficulty_level.
            Agreement will be calculated separately for each level of this variable.

    - name: subgroupForestPlot
      title: "Forest plot"
      type: Bool
      default: true
      description:
          R: >
            Create forest plot showing agreement estimates (kappa/ICC) with confidence intervals
            for each subgroup. Facilitates visual comparison of agreement across subgroups.

    - name: subgroupMinCases
      title: "Minimum cases per subgroup"
      type: Integer
      default: 10
      min: 5
      max: 100
      description:
          R: >
            Minimum number of cases required in a subgroup to calculate agreement statistics.
            Subgroups with fewer cases will be excluded with a warning message.
            Default: 10 cases (reasonable for kappa estimation).

    - name: showSubgroupGuide
      title: "When to use agreement by subgroup"
      type: Bool
      default: false
      description:
          R: >
            Show the educational guide listing when stratified agreement is useful
            (tumor type, stage or grade, case difficulty, anatomical site). The
            table's own note explains that kappa depends on each subgroup's case mix
            and that subgroups are not compared with each other.

    # ---- Rater Clustering ----

    - name: raterClustering
      title: "Rater clustering (identify rating pattern groups)"
      type: Bool
      default: false
      description:
          R: >
            Cluster raters based on their rating patterns to identify groups of raters with similar
            rating behavior. For continuous data: clustering based on correlation or Euclidean distance
            of ratings. For categorical data: clustering based on agreement patterns or confusion matrices.
            Essential for identifying subgroups of raters who rate similarly, detecting outlier raters,
            understanding rater training backgrounds, and optimizing panel composition. Reveals whether
            raters form natural groups (e.g., experienced vs. novice, different training backgrounds)
            or rate independently. Useful for targeted training interventions and understanding sources
            of disagreement.

    - name: clusterMethod
      title: "Clustering method"
      type: List
      options:
        - title: 'Hierarchical (Dendrogram)'
          name: hierarchical
        - title: 'K-means (Requires K)'
          name: kmeans
      default: hierarchical
      description:
          R: >
            Hierarchical clustering: Creates dendrogram showing nested rater groupings at all similarity levels.
            Best for exploring natural groupings without pre-specifying number of clusters.
            K-means: Partitions raters into K distinct clusters. Requires specifying number of clusters.
            Best when number of groups is known a priori (e.g., 2 training cohorts, 3 experience levels).

    - name: clusterDistance
      title: "Distance metric"
      type: List
      options:
        - title: "Concordance (1 - Lin's CCC)"
          name: ccc
        - title: "Correlation (1 - r), pattern only"
          name: correlation
        - title: 'Euclidean Distance'
          name: euclidean
        - title: 'Manhattan Distance'
          name: manhattan
        - title: 'Exact Agreement (categorical)'
          name: agreement
      default: ccc
      description:
          R: >
            Distance used to compare raters. Concordance (1 - Lin's CCC) is the default: Lin's
            concordance correlation coefficient is the correlation multiplied by a bias factor,
            so it falls both when two raters scatter around each other and when one reads
            consistently higher or on a wider scale. Two raters are close only when their
            numbers are interchangeable, which is what agreement means. The similarity column is
            then the concordance coefficient itself, on -1 to 1. Correlation (1 - r), pattern
            only: groups raters whose case-to-case ranking agrees. It removes systematic
            offsets, so two raters can share a cluster while one reads consistently higher than
            the other; it measures association, not absolute agreement. Choose it when the
            question is about ranking rather than about interchangeable values. Euclidean and
            Manhattan: raw distance between the two raters' readings. Both see a systematic
            offset, but their size grows with the number of cases, so the similarity column is
            rescaled by the largest distance in the analysis and ranks raters within this
            dataset only. Manhattan is less affected by a single extreme case. Exact Agreement:
            1 minus the proportion of cases scored identically. This is the distance used for
            categorical ratings whatever is selected here; on continuous measurements it counts
            exact equality only.

    - name: clusterLinkage
      title: "Linkage method (hierarchical)"
      type: List
      options:
        - title: 'Average Linkage (UPGMA)'
          name: average
        - title: 'Complete Linkage (Furthest Neighbor)'
          name: complete
        - title: 'Single Linkage (Nearest Neighbor)'
          name: single
        - title: 'Ward Linkage (Minimum Variance)'
          name: ward
      default: average
      description:
          R: >
            How to measure distance between clusters:
            - Average: Distance between cluster means (balanced, recommended for most cases)
            - Complete: Maximum distance between any two points (compact clusters)
            - Single: Minimum distance between any two points (can create chain-like clusters)
            - Ward: Minimizes within-cluster variance (tends to create equal-sized clusters)

    - name: nClusters
      title: "Number of clusters"
      type: Integer
      default: 3
      min: 2
      max: 10
      description:
          R: >
            Number of clusters to form. K-means partitions the raters into this many clusters;
            hierarchical clustering cuts the dendrogram into this many branches.
            Consider the number of training cohorts, experience levels or institutions.
            A value larger than one less than the number of raters is reduced, and the table
            says so.

    - name: showDendrogram
      title: "Dendrogram"
      type: Bool
      default: true
      description:
          R: >
            Display hierarchical clustering dendrogram showing rater groupings at all similarity levels.
            Height of joins indicates dissimilarity. Raters joined at lower heights are more similar.
            Useful for identifying natural number of clusters and understanding rater relationships.

    - name: showClusterHeatmap
      title: "Cluster heatmap"
      type: Bool
      default: true
      description:
          R: >
            Display heatmap of pairwise rater similarities with cluster memberships annotated.
            Helps visualize which raters are most similar and validates cluster assignments.
            For continuous data: correlation matrix. For categorical data: agreement matrix.

    - name: showRaterClusterGuide
      title: "When to use rater clustering"
      type: Bool
      default: false
      description:
          R: >
            Show the educational guide explaining how raters are grouped and how to
            read the dendrogram and similarity heatmap.

    # ---- Case Clustering ----

    - name: caseClustering
      title: "Case clustering (identify rating pattern groups)"
      type: Bool
      default: false
      description:
          R: >
            Perform clustering of cases based on rating patterns across raters.
            Identifies groups of cases that received similar ratings.

    - name: caseClusterMethod
      title: "Clustering method"
      type: List
      options:
        - title: 'Hierarchical (Dendrogram)'
          name: hierarchical
        - title: 'K-means (Requires K)'
          name: kmeans
      default: hierarchical
      description:
          R: >
            Hierarchical: Creates a dendrogram showing nested groupings at all similarity levels.
            K-means: Partitions cases into K distinct clusters (continuous data only).

    - name: caseClusterDistance
      title: "Distance metric"
      type: List
      options:
        - title: 'Euclidean Distance'
          name: euclidean
        - title: 'Manhattan Distance'
          name: manhattan
        - title: "Correlation (1 - r), profile shape only"
          name: correlation
        - title: 'Exact Agreement (categorical)'
          name: agreement
      default: euclidean
      description:
          R: >
            Distance used to compare cases. Euclidean is the default: straight-line distance
            between two cases' rating vectors, which sees the level of the ratings, so cases are
            grouped when the raters gave them similar numbers. The similarity column is the
            distance rescaled by the largest distance in the analysis and ranks cases within
            this dataset only. Manhattan: the same, from absolute differences, and less affected
            by one extreme rater. Correlation (1 - r), profile shape only: groups cases whose
            rating profile across raters has the same shape. It ignores the level of the
            ratings, so cases of very different magnitude are grouped together. A case's profile
            has only as many points as there are raters, so this needs at least three raters;
            with two, the correlation between any two cases is exactly +1 or -1 and the analysis
            stops with a message. Exact Agreement: 1 minus the proportion of raters who gave two
            cases the same value. This is the distance used for categorical ratings whatever is
            selected here. Lin's concordance coefficient is deliberately not offered for cases:
            it would be estimated from as many points as there are raters, typically three to
            six, which is too few.

    - name: caseClusterLinkage
      title: "Linkage method (hierarchical)"
      type: List
      options:
        - title: 'Average Linkage (UPGMA)'
          name: average
        - title: 'Complete Linkage (Furthest Neighbor)'
          name: complete
        - title: 'Single Linkage (Nearest Neighbor)'
          name: single
        - title: 'Ward Linkage (Minimum Variance)'
          name: ward
      default: average
      description:
          R: >
            Average: Uses average distance between all pairs.
            Complete: Uses maximum distance between pairs.
            Single: Uses minimum distance between pairs.
            Ward: Minimizes within-cluster variance.

    - name: nCaseClusters
      title: "Number of clusters"
      type: Integer
      default: 3
      min: 2
      max: 20
      description:
          R: >
            Number of clusters to form. K-means partitions the cases into this many clusters;
            hierarchical clustering cuts the dendrogram into this many branches.
            A value larger than one less than the number of cases is reduced, and the table
            says so.

    - name: showCaseDendrogram
      title: "Dendrogram"
      type: Bool
      default: true
      description:
          R: Display hierarchical clustering dendrogram for cases.

    - name: showCaseClusterHeatmap
      title: "Cluster heatmap"
      type: Bool
      default: true
      description:
          R: Display similarity matrix heatmap with cluster boundaries.

    - name: showCaseClusterGuide
      title: "When to use case clustering"
      type: Bool
      default: false
      description:
          R: Show educational guide about case clustering analysis.

    # ============================================================
    # PAIRED AGREEMENT COMPARISON (Gap from Krishnamurthy 2024)
    # ============================================================

    - name: pairedAgreementTest
      title: "Paired agreement comparison"
      type: Bool
      default: false
      description:
          R: >
            Perform a bootstrap test comparing interobserver agreement
            (kappa and percent agreement) between two conditions
            (e.g., manual vs AI-assisted scoring of the same cases).

    - name: conditionBVars
      title: Condition B raters
      type: Variables
      default: NULL
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
      description:
          R: >
            Rater columns for the second condition (e.g., AI-assisted).
            The main rater variables serve as Condition A.
            Give Condition B the same number of rater columns as Condition A;
            otherwise only percent agreement is comparable and no kappa row is
            shown.

    - name: pairedBootN
      title: Bootstrap replications
      type: Integer
      min: 500
      max: 10000
      default: 2000
      description:
          R: Number of bootstrap replications for paired comparison test.

    - name: showPairedAgreementGuide
      title: "When to use paired agreement comparison"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for comparing agreement between two conditions.

    # ============================================================
    # SAMPLE SIZE FOR AGREEMENT STUDIES (Gap from Krishnamurthy 2024)
    # ============================================================

    - name: agreementSampleSize
      title: Agreement study sample size
      type: Bool
      default: false
      description:
          R: >
            Compute the required sample size (number of subjects)
            for a prospective agreement study based on kappa or ICC.

    - name: ssMetric
      title: Agreement metric
      type: List
      options:
        - title: "Cohen's Kappa (2 raters)"
          name: kappa
        - title: "Fleiss' Kappa (3+ raters)"
          name: fleiss
        - title: ICC
          name: icc
      default: kappa
      description:
          R: The agreement metric to power the study for.

    - name: ssKappaNull
      title: Null kappa (H0)
      type: Number
      min: 0
      max: 0.99
      default: 0.4
      description:
          R: >
            The kappa (or ICC) value under the null hypothesis.
            Common choices - 0.4 (moderate), 0.6 (substantial).

    - name: ssKappaAlt
      title: Expected kappa (H1)
      type: Number
      min: 0.01
      max: 1
      default: 0.7
      description:
          R: >
            The kappa (or ICC) value under the alternative hypothesis.
            This is the minimum clinically meaningful agreement.

    - name: ssNRaters
      title: "Number of raters"
      type: Integer
      min: 2
      max: 100
      default: 2
      description:
          R: >
            Planned number of raters in the study.
            Kappa calculations support 2 to 6 raters; the ICC calculation has no upper limit.

    - name: ssNCategories
      title: "Number of categories"
      type: Integer
      min: 2
      max: 20
      default: 4
      description:
          R: Number of rating categories (e.g., 4 for HER2 0/1+/2+/3+).

    - name: ssAlpha
      title: Significance level
      type: Number
      min: 0.001
      max: 0.2
      default: 0.05
      description:
          R: Type I error rate (two-sided).

    - name: ssPower
      title: Desired power
      type: Number
      min: 0.5
      max: 0.999
      default: 0.80
      description:
          R: Target power (1 - Type II error rate).

    - name: showSampleSizeGuide
      title: "When to use sample size calculator"
      type: Bool
      default: false
      description:
          R: >
            Show educational guide for planning agreement study sample size.

    - name: seed
      title: "Random seed"
      type: Integer
      default: 42
      description:
          R: >
            Random seed for the reproducible bootstrap resampling used in the
            agreement analyses. Change this value to obtain a different bootstrap
            draw; the default (42) reproduces the previous fixed behaviour.



