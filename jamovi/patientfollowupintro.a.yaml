description:
    main: >
        An interactive guide to the patient follow-up and tumour response analyses in
        ClinicoPath. The choice between them is decided almost entirely by the SHAPE of
        your data - one value per patient, one per visit, or one per lesion per visit -
        so this guide starts there, shows a worked layout for each, and states plainly
        what each analysis can and cannot do. No data or variables required.

