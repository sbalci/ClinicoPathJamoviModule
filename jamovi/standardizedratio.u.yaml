title: Standardized Incidence / Mortality Ratio (SIR / SMR)
name: standardizedratio
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Observed Events
        children:
          - type: VariablesListBox
            name: observed
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Person-Time
        children:
          - type: VariablesListBox
            name: personTime
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Reference Rate
        children:
          - type: VariablesListBox
            name: refRate
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Expected Events (alternative to rate)
        children:
          - type: VariablesListBox
            name: expected
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Stratum Label (optional)
        children:
          - type: VariablesListBox
            name: stratum
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: inputMode
      - type: ComboBox
        name: ratioType
      - type: TextBox
        name: conf_level
        format: number
  - type: CollapseBox
    label: Output Options
    collapsed: false
    stretchFactor: 0
    children:
      - type: CheckBox
        name: perStratum
      - type: CheckBox
        name: showPlot
      - type: CheckBox
        name: showSummary
      - type: CheckBox
        name: showExplanation
