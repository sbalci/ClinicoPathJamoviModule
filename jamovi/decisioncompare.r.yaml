    # Concordance Heatmap
    - name: plotHeatmap
      title: 'Concordance Heatmap'
      type: Image
      width: 800
      height: 400
      renderFun: .plotHeatmap
      requiresData: true
      visible: (heatmap)
      clearWith:
          - heatmap
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
