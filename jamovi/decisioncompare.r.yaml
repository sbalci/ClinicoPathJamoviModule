      type: Html
      visible: (showExplanations)
      clearWith: [showExplanations]

    # Clinical Report
    - name: clinicalReport
      title: 'Descriptive Summary & Report Templates'
      type: Html
      visible: (showDescriptiveReport)
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, test2, test2Positive, test2Negative, test3, test3Positive, test3Negative, excludeIndeterminate, pp, pprob, statComp, showDescriptiveReport]

    # About This Analysis
    - name: aboutAnalysis
      title: 'About This Analysis'
      type: Html
      visible: (showExplanations)
      clearWith: [showExplanations]

    # Notice outputs converted to HTML to avoid serialization errors
    - name: notices
      title: 'Important Information'
      type: Html
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - pp
          - pprob
          - ci
          - excludeIndeterminate
          - statComp
          - opa
          - useOpaCriterion
          - niMargin
          - ciMethod
          - stratify

refs:
