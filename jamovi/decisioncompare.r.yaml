---
name: decisioncompare
title: Compare Medical Decision Tests
jrs: '1.1'

items:
    - name: text1
      title: Original Data
      type: Preformatted
      visible: (od)
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, test2, test2Positive, test2Negative, test3, test3Positive, test3Negative, excludeIndeterminate, od]

    - name: text2
      title: Original Data
      type: Html
      visible: (od)
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, test2, test2Positive, test2Negative, test3, test3Positive, test3Negative, excludeIndeterminate, od]

    # Tables for Test 1
    - name: cTable1
      title: 'Test 1 - Recoded Data'
      type: Table
      visible: (length(test1) > 0)
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, excludeIndeterminate]
      columns:
        - name: newtest
          title: ''
          type: text
        - name: GP
          title: 'Gold Positive'
          type: number
        - name: GN
          title: 'Gold Negative'
          type: number
        - name: Total
          title: 'Total'
          type: number

    - name: epirTable1
      title: 'Test 1 - Confidence Intervals'
      type: Table
      visible: (ci && !is.null(test1) && test1 != "")
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, excludeIndeterminate, ci]
      columns:
        - name: statsnames
          title: "Decision Statistics"
          type: text
        - name: est
          title: "Estimate"
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc

    # Tables for Test 2
    - name: cTable2
      title: 'Test 2 - Recoded Data'
      type: Table
      visible: (length(test2) > 0)
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test2, test2Positive, test2Negative, excludeIndeterminate]
      columns:
        - name: newtest
          title: ''
          type: text
        - name: GP
          title: 'Gold Positive'
          type: number
        - name: GN
          title: 'Gold Negative'
          type: number
        - name: Total
          title: 'Total'
          type: number

    - name: epirTable2
      title: 'Test 2 - Confidence Intervals'
      type: Table
      visible: (ci && !is.null(test2) && test2 != "")
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test2, test2Positive, test2Negative, excludeIndeterminate, ci]
      columns:
        - name: statsnames
          title: "Decision Statistics"
          type: text
        - name: est
          title: "Estimate"
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc

    # Tables for Test 3
    - name: cTable3
      title: 'Test 3 - Recoded Data'
      type: Table
      visible: (length(test3) > 0)
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test3, test3Positive, test3Negative, excludeIndeterminate]
      columns:
        - name: newtest
          title: ''
          type: text
        - name: GP
          title: 'Gold Positive'
          type: number
        - name: GN
          title: 'Gold Negative'
          type: number
        - name: Total
          title: 'Total'
          type: number

    - name: epirTable3
      title: 'Test 3 - Confidence Intervals'
      type: Table
      visible: (ci && !is.null(test3) && test3 != "")
      rows: 0
      clearWith: [gold, goldPositive, goldNegative, test3, test3Positive, test3Negative, excludeIndeterminate, ci]
      columns:
        - name: statsnames
          title: "Decision Statistics"
          type: text
        - name: est
          title: "Estimate"
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc

    # Comparison table
    - name: comparisonTable
      title: 'Decision Test Comparison'
      type: Table
      rows: 0
      columns:
        - name: test
          title: 'Test'
          type: text
        - name: 'n'
          title: 'Analyzed N'
          type: integer
        - name: excluded
          title: 'Excluded'
          type: integer
        - name: excludedRate
          title: 'Excluded Rate'
          type: number
          format: pc
        - name: Sens
          title: 'Sensitivity'
          type: number
          format: pc
        - name: Spec
          title: 'Specificity'
          type: number
          format: pc
        - name: AccurT
          title: 'Accuracy'
          type: number
          format: pc
        - name: PPV
          title: 'Positive Predictive Value'
          type: number
          format: pc
        - name: NPV
          title: 'Negative Predictive Value'
          type: number
          format: pc
        - name: LRP
          title: 'Positive Likelihood Ratio'
          type: number
        - name: LRN
          title: 'Negative Likelihood Ratio'
          type: number
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - pp
          - pprob

    # Overall Percent Agreement Table
    - name: opaTable
      title: 'Overall Percent Agreement (Descriptive)'
      type: Table
      visible: (opa)
      rows: 0
      notes:
        note: >
          OPA = (TP + TN) / Total.
          OPA does not correct for chance agreement; consider Cohen's kappa for chance-corrected concordance.
          The criterion is met when the lower CI bound exceeds the user-specified minimum OPA.
          The criterion is optional and descriptive. It is not a noninferiority comparison,
          regulatory guidance, or clinical guidance.
      columns:
        - name: test
          title: 'Test'
          type: text
        - name: concordant
          title: 'Concordant'
          type: integer
        - name: total
          title: 'Analyzed N'
          type: integer
        - name: excluded
          title: 'Excluded'
          type: integer
        - name: opa
          title: 'OPA'
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% CI'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% CI'
          type: number
          format: pc
        - name: niMargin
          title: 'OPA Criterion'
          type: number
          format: pc
        - name: niResult
          title: 'Criterion Met?'
          type: text
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - useOpaCriterion
          - niMargin
          - ciMethod

    # Stratified Comparison Table
    - name: stratifiedTable
      title: 'Stratified Diagnostic Accuracy'
      type: Table
      visible: (length(stratify) > 0)
      rows: 0
      columns:
        - name: stratum
          title: 'Subgroup'
          type: text
        - name: 'n'
          title: 'Analyzed N'
          type: integer
        - name: excluded
          title: 'Excluded'
          type: integer
        - name: excludedRate
          title: 'Excluded Rate'
          type: number
          format: pc
        - name: test
          title: 'Test'
          type: text
        - name: Sens
          title: 'Sensitivity'
          type: number
          format: pc
        - name: Spec
          title: 'Specificity'
          type: number
          format: pc
        - name: AccurT
          title: 'Accuracy'
          type: number
          format: pc
        - name: PPV
          title: 'PPV'
          type: number
          format: pc
        - name: NPV
          title: 'NPV'
          type: number
          format: pc
        - name: opa
          title: 'OPA'
          type: number
          format: pc
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - stratify
          - excludeIndeterminate
          - pp
          - pprob

    # Statistical Comparison Tables
    - name: mcnemarTable
      title: "Statistical Comparison of Test Accuracy"
      type: Table
      visible: (statComp)
      rows: 0
      notes:
        note: >
          For 2 tests: McNemar's test compares diagnostic CORRECTNESS (agreement with gold standard) between paired tests.
          For 3+ tests: Cochran's Q test provides an overall test, followed by pairwise McNemar's tests with Holm-Bonferroni correction for multiple comparisons.
          Tests examine discordant pairs (cases where one test is correct and the other is wrong relative to the gold standard) to determine if differences in accuracy are statistically significant.
      columns:
        - name: comparison
          title: 'Comparison'
          type: text
        - name: 'n'
          title: 'Paired N'
          type: integer
        - name: method
          title: 'Method'
          type: text
        - name: stat
          title: "Chi-squared"
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Statistical Interpretation'
          type: text
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - statComp

    - name: diffTable
      title: 'Differences with 95% Confidence Intervals'
      type: Table
      visible: (statComp)
      rows: 0
      columns:
        - name: comparison
          title: 'Comparison'
          type: text
        - name: metric
          title: 'Metric'
          type: text
        - name: 'n'
          title: 'Paired N'
          type: integer
        - name: diff
          title: 'Difference'
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% Confidence Interval'
          type: number
          format: pc
      clearWith:
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - statComp

    # Plot
    - name: plot1
      title: 'Test Comparison'
      type: Image
      width: 600
      height: 450
      renderFun: .plot1
      requiresData: true
      visible: (plot)
      clearWith:
          - plot
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - pp
          - pprob
      refs:
          - ggplot2

    # Radar Plot
    - name: plotRadar
      title: 'Radar Plot Comparison'
      type: Image
      width: 600
      height: 600
      renderFun: .plotRadar
      requiresData: true
      visible: (radarplot)
      clearWith:
          - radarplot
          - gold
          - goldPositive
          - goldNegative
          - test1
          - test1Positive
          - test1Negative
          - test2
          - test2Positive
          - test2Negative
          - test3
          - test3Positive
          - test3Negative
          - excludeIndeterminate
          - pp
          - pprob
