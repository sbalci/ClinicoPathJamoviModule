    # Summary Report
    - name: summaryReport
      title: 'Summary'
      type: Html
      visible: (statComp && showSummary)
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, test2, test2Positive, test2Negative, test3, test3Positive, test3Negative, excludeIndeterminate, pp, pprob, statComp, showSummary]

    # Report Sentence
    - name: reportSentence
      title: 'Manuscript-Ready Report'
      type: Html
      visible: (statComp && showReportSentence)
      clearWith: [gold, goldPositive, goldNegative, test1, test1Positive, test1Negative, test2, test2Positive, test2Negative, test3, test3Positive, test3Negative, excludeIndeterminate, pp, pprob, statComp, showReportSentence]

    # Explanations and Glossary
    - name: explanationsContent
