---
name:  checkdata
title: Single Variable Quality Check
menuGroup: Exploration
menuSubgroup: ClinicoPath Data Quality
version: '1.0.52'
jas: '1.2'

options:
    - name: data
      type: Data
      
    - name: var
      title: Variable to check
      type: Variable
      # .run() handles an unselected variable with the instructions panel, so NULL
      # is a supported state; without an explicit default the compiler makes `var`
      # a REQUIRED argument of the public wrapper.
      default: NULL

    - name: showOutliers
      title: Outlier analysis
      type: Bool
      default: true
      description:
          R: >
            Detect potential outliers using three methods - z-score (|z| > 3), the IQR
            fence (1.5 x IQR), and the modified Z-score (|M| > 3.5, MAD-based) - and report
            points flagged by at least two of them. Below n = 10 single-method flags are
            shown and labelled informative-only.

    - name: showDistribution
      title: Distribution analysis
      type: Bool
      default: false
      description:
          R: >
            Display descriptive statistics and distribution characteristics.

    - name: showDuplicates
      title: Duplicate analysis
      type: Bool
      default: false
      description:
          R: >
            Identify and count duplicate values in the dataset.

    - name: showPatterns
      title: Data patterns
      type: Bool
      default: false
      description:
          R: >
            Analyze patterns in missing data and value distributions.

    - name: rareCategoryThreshold
      title: Rare category threshold (%)
      type: Number
      min: 0.1
      max: 20
      default: 5
      description:
          R: >
            Percentage threshold for flagging rare categories (important for chi-squared assumptions and modeling).

    - name: clinicalValidation
      title: Clinical plausibility checks
      type: Bool
      default: true
      description:
          R: >
            Perform context-specific validation for clinical variables (age, lab values, etc.). Heuristic ranges may need adjustment.

    - name: unitSystem
      title: Unit system for clinical checks
      type: List
      options:
        - name: auto
          title: Auto-detect
        - name: metric
          title: Metric (SI units)
        - name: imperial
          title: Imperial/US units
      default: auto
      description:
          R: >
            Unit system for clinical plausibility checks. Auto-detect attempts to infer from data ranges.

    - name: outlierTransform
      title: Outlier-detection transformation
      type: List
      options:
        - name: none
          title: None (use raw data)
        - name: log
          title: Log transform (for right-skewed)
        - name: sqrt
          title: Square root transform
      default: none
      description:
          R: >
            Apply transformation before outlier detection to handle skewed distributions (especially right-skewed lab values).

    - name: mcarTest
      title: Explain MCAR testability
      type: Bool
      default: false
      description:
          R: >
            Explain whether the missingness mechanism can be tested formally for this
            variable. Little's MCAR test is multivariate and cannot be computed from a
            single variable, so this analysis reports heuristics about where the missing
            values sit rather than a test of the mechanism; enable this to state that
            limitation explicitly in the output.

    - name: cvMinMean
      title: Minimum mean for CV calculation
      type: Number
      min: 0
      max: 10
      default: 0.01
      description:
          R: >
            Suppress coefficient of variation when absolute mean is below this threshold (avoids instability).

    - name: showSummary
      title: Natural-language summary
      type: Bool
      default: false
      description:
          R: >
            Display a plain-language summary of data quality suitable for copying to reports.

    - name: showAbout
      title: About this analysis
      type: Bool
      default: false
      description:
          R: >
            Display information about data quality assessment methodology.

    - name: showCaveats
      title: Caveats & assumptions
      type: Bool
      default: false
      description:
          R: >
            Display important limitations and assumptions of the quality assessment.
...
