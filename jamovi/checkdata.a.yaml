---
name:  checkdata
title: Single Variable Quality Check
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Data Quality
version: '1.0.7'
jas: '1.2'

description:
    main: >
        Screens a single variable for data-quality problems before it is used in
        analysis: completeness and the shape of its missingness, consensus outlier
        detection (at n = 10 or more a point is flagged only when at least 2 methods
        agree; below n = 10 single-method flags are shown, labelled informative-only
        and excluded from the grade; the MAD-based method is unavailable when there
        are 3 or fewer complete values or the MAD is zero, leaving 2 methods),
        distribution summaries, duplicate or repeated values, and optional
        plausibility checks for common clinical measurements. Reports a heuristic
        letter grade with a transparent component-by-component penalty breakdown.
        The grade uses rule-of-thumb thresholds and is not an externally validated
        quality metric; treat it as a screening aid, not a verdict.
    R:
        dontrun: true
        usage: |
            # Quality check of a numeric variable
            checkdata(
                data = histopathology,
                var = Age,
                showDistribution = TRUE)

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: var
      title: Variable to check
      type: Variable
      # .run() handles an unselected variable with the instructions panel, so NULL
      # is a supported state; without an explicit default the compiler makes `var`
      # a REQUIRED argument of the public wrapper.
      default: NULL
      description:
          R: >
            The single variable to assess. Any type is accepted; numeric variables
            additionally receive outlier detection and the numeric distribution
            summary, while factor and character variables receive the categorical
            summary instead.

    - name: showOutliers
      title: Outlier analysis
      type: Bool
      default: true
      description:
          R: >
            Detect potential outliers using three methods - z-score (|z| > 3), the IQR
            fence (1.5 x IQR), and the modified Z-score (|M| > 3.5, MAD-based) - and report
            points flagged by at least two of them. Below n = 10 single-method flags are
            shown and labelled informative-only.

    - name: showDistribution
      title: Distribution analysis
      type: Bool
      default: false
      description:
          R: >
            Display descriptive statistics and distribution characteristics.

    - name: showDuplicates
      title: Duplicate analysis
      type: Bool
      default: false
      description:
          R: >
            For a numeric variable, list the values that occur more than once. For a
            factor or character variable, list the frequency of every category (the
            table is retitled "Value Frequencies" in that case, since categories
            occurring once are shown too).

    - name: showPatterns
      title: Data patterns
      type: Bool
      default: false
      description:
          R: >
            Analyze patterns in missing data and value distributions.

    - name: rareCategoryThreshold
      title: Rare category threshold (%)
      type: Number
      min: 0.1
      max: 20
      default: 5
      description:
          R: >
            Percentage threshold for flagging rare categories (important for chi-squared assumptions and modeling).

    - name: clinicalValidation
      title: Clinical plausibility checks
      type: Bool
      default: true
      description:
          R: >
            Perform context-specific validation for clinical variables (age, lab values, etc.). Heuristic ranges may need adjustment.

    - name: unitSystem
      title: Unit system for clinical checks
      type: List
      options:
        - name: auto
          title: Auto-detect
        - name: metric
          title: Metric (SI units)
        - name: imperial
          title: Imperial/US units
      default: auto
      description:
          R: >
            Unit system for clinical plausibility checks. Auto-detect attempts to infer from data ranges.

    - name: outlierTransform
      title: Outlier-detection transformation
      type: List
      options:
        - name: none
          title: None (use raw data)
        - name: log
          title: Log transform (for right-skewed)
        - name: sqrt
          title: Square root transform
      default: none
      description:
          R: >
            Apply transformation before outlier detection to handle skewed distributions (especially right-skewed lab values).

    - name: mcarTest
      title: Explain MCAR testability
      type: Bool
      default: false
      description:
          R: >
            Explain whether the missingness mechanism can be tested formally for this
            variable. Little's MCAR test is multivariate and cannot be computed from a
            single variable, so this analysis reports heuristics about where the missing
            values sit rather than a test of the mechanism; enable this to state that
            limitation explicitly in the Quality Assessment Summary (and, when Data
            patterns is also enabled, as a row of that table). No formal MCAR test is
            performed by this analysis.

    - name: cvMinMean
      title: Minimum mean for CV calculation
      type: Number
      min: 0
      max: 10
      default: 0.01
      description:
          R: >
            Suppress coefficient of variation when absolute mean is below this threshold (avoids instability).

    - name: showSummary
      title: Natural-language summary
      type: Bool
      default: false
      description:
          R: >
            Display a plain-language summary of data quality suitable for copying to reports.

    - name: showAbout
      title: About this analysis
      type: Bool
      default: false
      description:
          R: >
            Display information about data quality assessment methodology.

    - name: showCaveats
      title: Caveats & assumptions
      type: Bool
      default: false
      description:
          R: >
            Display important limitations and assumptions of the quality assessment.
...
