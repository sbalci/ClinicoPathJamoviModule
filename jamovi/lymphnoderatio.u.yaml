title: Lymph Node Ratio
name: lymphnoderatio
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Nodal Counts
        children:
          - type: VariablesListBox
            name: positiveNodes
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: examinedNodes
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Survival (optional)
        children:
          - type: VariablesListBox
            name: survivalTime
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: survivalStatus
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: LevelSelector
        name: eventLevel
        label: Event Level
      - type: TextBox
        name: minYield
        format: number
      - type: ComboBox
        name: stratMethod
      - type: TextBox
        name: thresholds
        format: string
        width: largest
      - type: TextBox
        name: conf_level
        format: number
  - type: CollapseBox
    label: Output Options
    collapsed: false
    stretchFactor: 0
    children:
      - type: CheckBox
        name: showRatioSummary
      - type: CheckBox
        name: showStrata
      - type: CheckBox
        name: showPlot
      - type: CheckBox
        name: showSummary
      - type: CheckBox
        name: showExplanation
      - type: Output
        name: addRatioToData
      - type: Output
        name: addStratumToData
