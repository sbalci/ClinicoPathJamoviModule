title: Adverse Events Butterfly Plot
name: aeplot
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: inputMode
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Subject ID (patient mode)
        children:
          - type: VariablesListBox
            name: subjectID
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Adverse Event Term (patient mode)
        children:
          - type: VariablesListBox
            name: aeTerm
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Treatment Arm (optional)
        children:
          - type: VariablesListBox
            name: armVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Severity Grade (optional)
        children:
          - type: VariablesListBox
            name: gradeVar
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: gradeThreshold
        format: number
  - type: CollapseBox
    label: Summary-Mode Inputs
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: AE Term
            children:
              - type: VariablesListBox
                name: aeTermS
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Test All-Grade (%)
            children:
              - type: VariablesListBox
                name: testAll
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Test High-Grade (%)
            children:
              - type: VariablesListBox
                name: testHigh
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Control All-Grade (%)
            children:
              - type: VariablesListBox
                name: controlAll
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Control High-Grade (%)
            children:
              - type: VariablesListBox
                name: controlHigh
                maxItemCount: 1
                isTarget: true
  - type: CollapseBox
    label: Display Options
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: barShape
          - type: ComboBox
            name: colorScheme
          - type: CheckBox
            name: showValues
          - type: TextBox
            name: topN
            format: number
