title: Box-Violin Plots to Compare Between Groups
name: jjbetweenstats
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variables
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Split By (Optional)
        children:
          - type: VariablesListBox
            name: grvar
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Statistical Analysis
    collapsed: true
    children:
      - type: Label
        label: Test Method
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: typestatistics
              - type: CheckBox
                name: varequal
                enable: (typestatistics:parametric)
              - type: TextBox
                name: conflevel
                format: number
              - type: TextBox
                name: k
                format: number
              - type: TextBox
                name: seed
                format: number
      - type: Label
        label: Effect Size and Bayes Factor
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: effsizetype
                enable: (typestatistics:parametric)
              - type: CheckBox
                name: bfmessage
                enable: (typestatistics:parametric && resultssubtitle)
      - type: Label
        label: Pairwise Comparisons
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: pairwisecomparisons
                children:
                  - type: ComboBox
                    name: pairwisedisplay
                    enable: (pairwisecomparisons)
                  - type: ComboBox
                    name: padjustmethod
                    enable: (pairwisecomparisons)
      - type: Label
        label: Multiple Endpoint Guidance
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: multiEndpointCorrection
  - type: CollapseBox
    label: Plot Display and Appearance
    collapsed: true
    children:
      - type: Label
        label: Annotations and Guides
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: resultssubtitle
              - type: CheckBox
                name: centralityplotting
                children:
                  - type: ComboBox
                    name: centralitytype
                    enable: (centralityplotting)
              - type: CheckBox
                name: showexplanations
      - type: Label
        label: Theme and Accessibility
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: originaltheme
              - type: CheckBox
                name: colorblindSafe
      - type: Label
        label: Plot Labels
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: mytitle
                format: string
                width: large
              - type: TextBox
                name: xtitle
                format: string
                width: large
              - type: TextBox
                name: ytitle
                format: string
                width: large
      - type: Label
        label: Plot Dimensions
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: plotwidth
                format: number
              - type: TextBox
                name: plotheight
                format: number
  - type: CollapseBox
    label: Publication-Ready Companion Plot
    collapsed: true
    children:
      - type: CheckBox
        name: addGGPubrPlot
      - type: Label
        label: Companion Plot Options
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: ggpubrPlotType
                enable: (addGGPubrPlot)
              - type: ComboBox
                name: ggpubrPalette
                enable: (addGGPubrPlot && !colorblindSafe)
              - type: CheckBox
                name: ggpubrAddStats
                enable: (addGGPubrPlot)
              - type: CheckBox
                name: ggpubrAddPoints
                enable: (addGGPubrPlot)
