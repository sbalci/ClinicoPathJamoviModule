---
name:  jjcorrmat
title: Correlation Matrix
jrs:   '1.1'

clearWith:
    - dep
    - grvar
    - typestatistics
    - matrixtype
    - matrixmethod
    - siglevel
    - conflevel
    - padjustmethod
    - k
    - partial
    - naHandling
    # - clinicalpreset
    - lowcolor
    - midcolor
    - highcolor
    - title
    - subtitle
    - caption
    - plotwidth
    - plotheight
    - bayesseed
    - originaltheme


items:

    - name:  todo
      title: Analysis Guide
      type:  Html

    - name: warnings
      title: Warnings and Notices
      type: Html
      visible: true

    - name: interpretation
      title: Clinical Interpretation
      type: Html
      visible: (showexplanations)

    - name:  about
      title: About
      type:  Html
      visible: (showexplanations)

    - name:  summary
      title: Analysis Summary
      type:  Html
      visible: (showexplanations)

    - name:  assumptions
      title: Statistical Assumptions
      type:  Html
      visible: (showexplanations)

    - name: plot2
      title: Chart
      type: Image
      width:  600
      height: 450
      renderFun: .plot2
      requiresData: true
      visible: (grvar)

    - name: plot
      title: Chart
      type: Image
      width:  600
      height: 450
      renderFun: .plot
      requiresData: true
      visible: true

    - name: table
      title: Correlation Table
      type: Table
      rows: 0
      visible: true
      columns:
          - name: var1
            title: Variable 1
            type: text
          - name: var2
            title: Variable 2
            type: text
          - name: n
            title: N
            type: integer
          - name: r
            title: Coefficient
            type: number
          - name: conf_low
            title: Lower
            type: number
            superTitle: Confidence interval
            visible: (typestatistics:parametric || typestatistics:nonparametric || typestatistics:robust)
          - name: conf_high
            title: Upper
            type: number
            superTitle: Confidence interval
            visible: (typestatistics:parametric || typestatistics:nonparametric || typestatistics:robust)
          - name: cred_low
            title: Lower
            type: number
            superTitle: Credible interval
            visible: (typestatistics:bayes)
          - name: cred_high
            title: Upper
            type: number
            superTitle: Credible interval
            visible: (typestatistics:bayes)
          - name: p
            title: p
            type: number
            format: zto,pvalue
            visible: (typestatistics:parametric || typestatistics:nonparametric || typestatistics:robust)
          - name: p_adj
            title: p (adjusted)
            type: number
            format: zto,pvalue
            visible: (typestatistics:parametric || typestatistics:nonparametric || typestatistics:robust)
          - name: bf
            title: BF10
            type: number
            visible: (typestatistics:bayes)
          - name: method
            title: Method
            type: text
          - name: group
            title: Group
            type: text
            visible: (grvar)



refs:
    - ggplot2
    - ggstatsplot
    - statsExpressions
    - correlation
    - ClinicoPathJamoviModule


...
