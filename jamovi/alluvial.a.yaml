---
name:  alluvial
title: Alluvial Diagrams
menuGroup: Exploration
menuSubgroup: ClinicoPath Descriptive Plots
version: '1.0.81'
jas: '1.2'

description:
    main: >
        Draws an alluvial diagram: a flow picture of how cases move between the
        categories of several categorical variables. Ribbon width is the number of
        cases taking that path; with the GG Alluvial engine and a weight variable it
        is the total of that weight over those cases, while the Easy Alluvial engine
        always counts cases. Every axis variable is drawn with its own recorded
        values as the strata.
    R:
        dontrun: true
        usage: |
            # Flow of lymphovascular invasion, perineural invasion and treatment group
            alluvial(
                data = histopathology,
                vars = vars(LVI, PNI, Group))

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: vars
      title: Variables
      type: Variables
      default: NULL
      description:
          R: >
            a string naming the variables from `data` that contains the
            values used for the Alluvial Diagram.
          jamovi: >
            a string naming the variables from `data` that contains the
            values used for the Alluvial Diagram.

    - name: condensationvar
      title: Condensation variable
      type: Variable
      default: NULL
      description:
          R: >
            The primary variable to be used for condensation.
          jamovi: >
            The primary variable to be used for condensation.

    - name: excl
      title: Missing-value exclusion (NA)
      type: Bool
      default: false
      description:
          R: >
            Exclude missing values from the analysis.
          jamovi: >
            Exclude missing values from the analysis.

    - name: marg
      title: Marginal plots
      type: Bool
      default: false
      description:
          R: >
            Include marginal plots.
          jamovi: >
            Include marginal plots.

    - name: fill
      title: Fill by
      type: List
      options:
        - title: First variable
          name: first_variable
        - title: Last variable
          name: last_variable
        - title: All flows
          name: all_flows
        - title: Values
          name: values
      default: first_variable
      description:
          R: >
            A list for the argument fill for selecting the variable to be
            represented by color. Default is 'first_variable'.
          jamovi: >
            A list for the argument fill for selecting the variable to be
            represented by color. Default is 'first_variable'.

    - name: fillGgalluvial
      title: Fill by (ggalluvial)
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            A string naming the categorical variable from `data` that will be
            used to color the flows in the ggalluvial plot.
          jamovi: >
            A string naming the categorical variable from `data` that will be
            used to color the flows in the ggalluvial plot.

    - name: orient
      title: Plot orientation
      type: List
      options:
        - title: Horizontal
          name: horr
        - title: Vertical
          name: vert
      default: vert
      description:
          R: >
            Orientation of the plot. One of 'horr' (horizontal) or 'vert'
            (vertical). Superseded by flowDirection, which offers the same choices
            and more, so this setting is applied only while flowDirection is
            'left_right'.
          jamovi: >
            Orientation of the plot. Superseded by Flow direction, which offers the
            same choices and more, so this setting applies only while Flow direction
            is Left to Right.

    - name: usetitle
      title: Custom title
      type: Bool
      default: false
      description:
          R: >
            Use a custom title for the plot.
          jamovi: >
            Use a custom title for the plot.

    - name: mytitle
      title: Title
      type: String
      default: 'Alluvial Plot'
      description:
          R: >
            Title for the plot.
          jamovi: >
            Title for the plot.

    - name: maxvars
      title: Maximum variables
      type: Integer
      min: 2
      max: 20
      default: 8
      description:
          R: >
            Maximum number of variables to include in the alluvial plot.
          jamovi: >
            Maximum number of variables to include in the alluvial plot.

    # === Phase 1: Easy Additions ===

    - name: showFlowTable
      title: Flow table
      type: Bool
      default: false
      description:
          R: >
            Add a table of every path through the plotted variables with the number of
            cases on it and its percentage of all cases; with a weight variable under the
            GG Alluvial engine the weight total is listed as well. Rows are ordered by
            frequency, so the first row is the commonest path.
          jamovi: >
            Table of every path through the plotted variables with its number of cases,
            percentage and, when weighted, weight total, commonest first.

    - name: colorPalette
      title: Color palette
      type: List
      options:
        - title: Default
          name: default
        - title: Viridis
          name: viridis
        - title: Plasma
          name: plasma
        - title: Set3
          name: set3
        - title: Pastel1
          name: pastel1
        - title: Dark2
          name: dark2
      default: default
      description:
          R: >
            Color palette for the diagram flows.
          jamovi: >
            Color palette for the diagram flows.

    - name: showCounts
      title: Counts on nodes
      type: Bool
      default: false
      description:
          R: >
            Display count values on nodes.
          jamovi: >
            Display count values on nodes.

    - name: themeStyle
      title: Theme style
      type: List
      options:
        - title: Default (easyalluvial)
          name: default
        - title: Minimal
          name: minimal
        - title: Classic
          name: classic
        - title: Grey
          name: grey
        - title: Black & White
          name: bw
      default: default
      description:
          R: >
            Theme style for the plot background and elements.
          jamovi: >
            Theme style for the plot background and elements.

    - name: enhancedGradients
      title: Enhanced edge gradients
      type: Bool
      default: false
      description:
          R: >
            Apply sophisticated color gradients to flow edges for better visual appeal.
          jamovi: >
            Apply sophisticated color gradients to flow edges for better visual appeal.

    - name: plotSubtitle
      title: Plot subtitle
      type: String
      default: ''
      description:
          R: >
            Subtitle for the plot (shown below the title).
          jamovi: >
            Subtitle for the plot (shown below the title).

    # === Phase 2: Medium Additions ===

    - name: weight
      title: Weight variable
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            Optional weight variable for flow thickness. If not provided, counts are used.
          jamovi: >
            Optional weight variable for flow thickness. If not provided, counts are used.

    - name: sankeyStyle
      title: Sankey styling
      type: Bool
      default: false
      description:
          R: >
            Apply Sankey diagram styling (narrow nodes, sigmoid curves).
          jamovi: >
            Apply Sankey diagram styling (narrow nodes, sigmoid curves).

    - name: curveType
      title: Curve type
      type: List
      options:
        - title: Cubic (smooth)
          name: cubic
        - title: Linear
          name: linear
        - title: Quintic (very smooth)
          name: quintic
        - title: Sine
          name: sine
        - title: Arctangent
          name: arctangent
        - title: Sigmoid (S-shaped)
          name: sigmoid
      default: cubic
      description:
          R: >
            Curve style for flows. Requires ggalluvial engine.
          jamovi: >
            Curve style for flows. Requires ggalluvial engine.

    - name: flowDirection
      title: Flow direction
      type: List
      options:
        - title: Left to Right
          name: left_right
        - title: Top to Bottom
          name: top_bottom
        - title: Right to Left
          name: right_left
        - title: Bottom to Top
          name: bottom_top
      default: left_right
      description:
          R: >
            Direction of flow in the diagram.
          jamovi: >
            Direction of flow in the diagram.

    - name: engine
      title: Plot engine
      type: List
      options:
        - title: Easy Alluvial (automatic)
          name: easyalluvial
        - title: GG Alluvial (manual control)
          name: ggalluvial
      default: easyalluvial
      description:
          R: >
            Choose plotting engine: easyalluvial for automatic plots,
            ggalluvial for manual control with curve types and Sankey styling.
          jamovi: >
            Choose plotting engine: easyalluvial for automatic plots,
            ggalluvial for manual control with curve types and Sankey styling.

    - name: labelNodes
      title: Node labels
      type: Bool
      default: false
      description:
          R: >
            Show node labels (for ggalluvial engine).
          jamovi: >
            Show node labels (for ggalluvial engine).

...
