---
name:  venn
title: Venn Diagram
jrs:   '1.1'

clearWith:
    # Plot-engine switches: the ggvenn fallback assigns visibility imperatively,
    # so these have to invalidate the results or a retained plot state can outlive
    # the checkbox that produced it.
    - show_ggvenn
    - show_ggVennDiagram
    - show_upsetR
    - show_complexUpset
    - var1
    - var2
    - var3
    - var4
    - var5
    - var6
    - var7
    - var1true
    - var2true
    - var3true
    - var4true
    - var5true
    - var6true
    - var7true
    # UpSet plot options (so plots re-render on style-only changes)
    - sortBy
    - minSize
    - showAnnotations
    # ggVennDiagram styling options
    - shapeType
    - regionLabels
    - labelGeometry
    - labelPrecisionDigits
    - setNameSize
    - labelSize
    - edgeSize
    - edgeColor
    - edgeLineType
    - edgeAlpha
    - fillAlpha
    - showSetLabels
    - setLabelColor
    - fillColorMapping
    - colorPalette

items:

    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
        - var1
        - var1true
        - var2
        - var2true
        - var3
        - var3true
        - var4
        - var4true
        - var5
        - var5true
        - var6
        - var6true
        - var7
        - var7true

    - name: welcome
      title: "Welcome"
      type: Html

    - title: Summary of True Counts
      name: summary
      type: Table
      rows: 0
      columns:
        - name: variable
          title: Variable
          type: text
        - name: trueCount
          title: True Count
          type: integer
        - name: falseCount
          title: False Count
          type: integer
        - name: totalCount
          title: Total Count
          type: integer
        - name: truePercentage
          title: True %
          type: number
          format: pc

    - name: validationErrors
      title: "Validation Errors"
      type: Html
      visible: false

    - name: validationWarnings
      title: "Important Warnings"
      type: Html
      visible: false

    - title: ggvenn Plot
      name: plotGgvenn
      type: Image
      width:  700
      height: 450
      renderFun: .plotGgvenn
      requiresData: true
      visible: (show_ggvenn)
      refs:
        - ggvenn

    - title: ggVennDiagram Plot
      name: plotGgVennDiagram
      type: Image
      width:  700
      height: 450
      renderFun: .plotGgVennDiagram
      requiresData: true
      visible: (show_ggVennDiagram)
      refs:
        - ggVennDiagram
        - viridis
        - RColorBrewer

    - title: UpSetR Plot
      name: plotUpsetR
      type: Image
      width:  700
      height: 450
      renderFun: .plotUpsetR
      requiresData: true
      visible: (show_upsetR)
      refs:
        - UpSetR

    - title: ComplexUpset Plot
      name: plotComplexUpset
      type: Image
      width:  700
      height: 450
      renderFun: .plotComplexUpset
      requiresData: true
      visible: (show_complexUpset)
      refs:
        - ComplexUpset


    - name: aboutAnalysis
      title: "About This Analysis"
      type: Html
      visible: (aboutAnalysis || explanatory)

    - name: clinicalSummary
      title: "Clinical Summary"
      type: Html
      visible: (clinicalSummary || explanatory)

    - name: reportSentences
      title: "Copy-Ready Clinical Summary"
      type: Html
      visible: (reportSentences || explanatory)

    - name: assumptions
      title: "Interpretation Guide & Assumptions"
      type: Html
      visible: (assumptions || explanatory)

    - name: setCalculations
      title: "Set Calculations"
      type: Html
      visible: (showSetCalculations)

    - name: membershipTable
      title: "Membership Table"
      type: Table
      visible: (showMembershipTable)
      rows: 0
      columns: []

    - name: membershipGroups
      title: "Add Membership Groups to Data"
      type: Output
      varTitle: '`Venn Membership Groups - ${var1}`'
      varDescription: 'Combination of selected Venn sets satisfied by each case'
      measureType: nominal
      clearWith:
        - var1
        - var2
        - var3
        - var4
        - var5
        - var6
        - var7
        - var1true
        - var2true
        - var3true
        - var4true
        - var5true
        - var6true
        - var7true
        - showSetCalculations
        - showMembershipTable
        - membershipGroups

    - name: glossary
      title: "Statistical Glossary"
      type: Html
      visible: (showGlossary)

    # INFO-level confirmation: bottom of the results, below everything it describes.
    - name: analysisInfo
      title: "Analysis Information"
      type: Html
      visible: false

refs:
    - ClinicoPathJamoviModule

...
