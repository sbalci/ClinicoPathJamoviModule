title: Advanced Ridge Plot
name: jjridges
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: X Variable (Distribution)
        children:
          - type: VariablesListBox
            name: x_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Y Variable (Groups)
        children:
          - type: VariablesListBox
            name: y_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Fill Variable (Optional)
        children:
          - type: VariablesListBox
            name: fill_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Facet Variable (Optional)
        children:
          - type: VariablesListBox
            name: facet_var
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Plot Style
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: plot_type
            label: Plot type
          - type: TextBox
            name: scale
            label: Ridge height scale
            format: number
          - type: ComboBox
            name: bandwidth
            label: Bandwidth method
            enable: (plot_type != 'histogram_ridges')
          - type: TextBox
            name: bandwidth_value
            label: Custom bandwidth
            format: number
            enable: (bandwidth == 'custom' && plot_type != 'histogram_ridges')
          - type: TextBox
            name: binwidth
            label: Histogram bin width
            format: number
            enable: (plot_type == 'histogram_ridges')
  - type: CollapseBox
    label: Advanced Features
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: add_boxplot
            label: Boxplot inside
          - type: CheckBox
            name: add_points
            label: Data points
          - type: TextBox
            name: point_alpha
            label: Point transparency
            format: number
            enable: (add_points)
          - type: CheckBox
            name: add_quantiles
            label: Quantile lines
          - type: TextBox
            name: quantiles
            label: Quantile values
            format: string
            enable: (add_quantiles)
          - type: CheckBox
            name: add_mean
            label: Mean line
          - type: CheckBox
            name: add_median
            label: Median line
  - type: CollapseBox
    label: Statistical Analysis
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: show_stats
            label: Statistics
          - type: ComboBox
            name: test_type
            label: Statistical test
            enable: (show_stats)
          - type: ComboBox
            name: p_adjust_method
            label: P-value adjustment
            enable: (show_stats)
          - type: ComboBox
            name: effsize_type
            label: Effect size type
            enable: (show_stats)
  - type: CollapseBox
    label: Visual Appearance
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: alpha
            label: Ridge transparency
            format: number
            enable: (fill_ridges || plot_type == 'violin_ridges')
          - type: CheckBox
            name: fill_ridges
            label: Fill ridges
          - type: ComboBox
            name: color_palette
            label: Color palette
          - type: TextBox
            name: custom_colors
            label: Custom colors
            format: string
            enable: (color_palette == 'custom')
          - type: TextBox
            name: gradient_low
            label: Gradient low color
            format: string
            enable: (plot_type == 'density_ridges_gradient')
          - type: TextBox
            name: gradient_high
            label: Gradient high color
            format: string
            enable: (plot_type == 'density_ridges_gradient')
          - type: CheckBox
            name: reverse_order
            label: Reverse Y order
          - type: CheckBox
            name: show_fill_legend
            label: Fill legend
            enable: (fill_var)
          - type: CheckBox
            name: show_facet_legend
            label: Facet legend
            enable: (facet_var)
  - type: CollapseBox
    label: Theme & Labels
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: theme_style
            label: Theme style
          - type: CheckBox
            name: grid_lines
            label: Grid lines
          - type: CheckBox
            name: expand_panels
            label: Expand panels
          - type: ComboBox
            name: legend_position
            label: Legend position
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: plot_title
            label: Plot title
            format: string
            width: largest
          - type: TextBox
            name: plot_subtitle
            label: Plot subtitle
            format: string
            width: largest
          - type: TextBox
            name: plot_caption
            label: Plot caption
            format: string
            width: largest
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: x_label
            label: X axis label
            format: string
          - type: TextBox
            name: y_label
            label: Y axis label
            format: string
  - type: CollapseBox
    label: Annotations
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: add_sample_size
            label: Sample sizes
          - type: CheckBox
            name: add_density_values
            label: Density values
          - type: TextBox
            name: custom_annotations
            label: Custom annotations
            format: string
            width: largest
  - type: CollapseBox
    label: Export Options
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: width
            label: Plot width
            format: number
          - type: TextBox
            name: height
            label: Plot height
            format: number
          - type: TextBox
            name: dpi
            label: Plot DPI
            format: number
  - type: CollapseBox
    label: Help & Guidance
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showAboutPanel
            label: About panel
          - type: CheckBox
            name: showAssumptions
            label: Statistical assumptions
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: clinicalPreset
