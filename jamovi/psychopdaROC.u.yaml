title: Advanced ROC Analysis
name: psychopdaROC
jus: '3.0'
stage: 0
compilerMode: tame
children:
  # ==============================================
  # 1. VARIABLE SELECTION (always visible, top)
  # ==============================================
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Test variables
        children:
          - type: VariablesListBox
            name: dependentVars
            isTarget: true
      - type: TargetLayoutBox
        label: Class variable (gold standard)
        children:
          - type: VariablesListBox
            name: classVar
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: positiveClass
            label: Positive class
            enable: (classVar)
          - type: LevelSelector
            name: negativeClass
            label: Negative class
            enable: (classVar)
      - type: TargetLayoutBox
        label: Group variable (optional)
        children:
          - type: VariablesListBox
            name: subGroup
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Patient ID
        children:
          - type: VariablesListBox
            name: patientID
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Reference test for IDI/NRI (optional)
        children:
          - type: VariablesListBox
            name: refVar
            maxItemCount: 1
            isTarget: true

  # ==============================================
  # 1b. MANUAL RUN GATE (defer heavy recompute)
  # ==============================================
  - type: CheckBox
    name: manualRun
  - type: ActionButton
    name: run

  # ==============================================
  # 2. ANALYSIS CONFIGURATION (always visible)
  # ==============================================
  - type: LayoutBox
    margin: normal
    children:
      - type: Label
        label: Analysis Configuration
      - type: ComboBox
        name: clinicalMode
        label: Guidance level
        enable: (showExplanations)
      - type: CheckBox
        name: showExplanations
      - type: ComboBox
        name: direction
        label: Classification direction
      - type: ComboBox
        name: analysisUnit
      - type: ComboBox
        name: aucInference

  # ==============================================
  # 3. CLINICAL PARAMETERS
  # ==============================================
  - type: CollapseBox
    label: Clinical Parameters
    margin: normal
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: usePriorPrev
            label: Population prevalence adjustment
          - type: TextBox
            name: priorPrev
            format: number
            label: Prior prevalence value (0-1)
            enable: (usePriorPrev)
          - type: TextBox
            name: costratioFP
            format: number
            label: "Cost Ratio (False Positive : False Negative)"
            enable: (method:oc_cost_ratio)

  # ==============================================
  # 4. CUTPOINT OPTIMIZATION
  # ==============================================
  - type: CollapseBox
    label: Cutpoint Optimization
    margin: normal
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: method
            label: Cutpoint method
          - type: ComboBox
            name: metric
            label: Optimization metric
            enable: >-
              (!method:oc_manual && !method:oc_cost_ratio &&
              !method:oc_equal_sens_spec && !method:oc_closest_01)
          - type: TextBox
            name: specifyCutScore
            format: string
            enable: (method:oc_manual)
            label: Manual cut score
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Advanced Cutpoint Settings
          - type: TextBox
            name: tol_metric
            format: number
            label: Metric tolerance
            enable: >-
              (method:maximize_metric || method:minimize_metric ||
              method:maximize_loess_metric || method:minimize_loess_metric ||
              method:maximize_boot_metric || method:minimize_boot_metric)
          - type: ComboBox
            name: break_ties
            label: Tie breaking method
          - type: TextBox
            name: boot_runs
            format: number
            label: Bootstrap iterations
            enable: (method:maximize_boot_metric || method:minimize_boot_metric)
          - type: TextBox
            name: seed
            format: number
            label: Random seed
            enable: >-
              (method:maximize_boot_metric || method:minimize_boot_metric ||
              bootstrapCI || calculateIDI || calculateNRI || bayesianAnalysis)
          - type: CheckBox
            name: allObserved
            label: All observed cutpoints

  # ==============================================
  # 5. FIXED SENSITIVITY / SPECIFICITY ANALYSIS
  # ==============================================
  - type: CollapseBox
    label: Fixed Sensitivity / Specificity Analysis
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: fixedSensSpecAnalysis
            label: Fixed sensitivity/specificity analysis
          - type: ComboBox
            name: fixedAnalysisType
            label: Analysis type
            enable: (fixedSensSpecAnalysis)
          - type: TextBox
            name: fixedSensitivityValue
            format: number
            label: Target sensitivity
            enable: (fixedSensSpecAnalysis && fixedAnalysisType:sensitivity)
          - type: TextBox
            name: fixedSpecificityValue
            format: number
            label: Target specificity
            enable: (fixedSensSpecAnalysis && fixedAnalysisType:specificity)
          - type: ComboBox
            name: fixedInterpolation
            label: Interpolation method
            enable: (fixedSensSpecAnalysis)
          - type: CheckBox
            name: showFixedROC
            label: Fixed point ROC curve
            enable: (fixedSensSpecAnalysis)
          - type: CheckBox
            name: showFixedExplanation
            label: Analysis guide
            enable: (fixedSensSpecAnalysis)

  # ==============================================
  # 6. OUTPUT OPTIONS
  # ==============================================
  - type: CollapseBox
    label: Output Options
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: sensSpecTable
            label: Confusion matrices
          - type: CheckBox
            name: showThresholdTable
            label: Threshold table
          - type: TextBox
            name: maxThresholds
            format: number
            label: Maximum thresholds to display
            enable: (showThresholdTable)
          - type: CheckBox
            name: delongTest
            label: AUC comparison (DeLong's test)

  # ==============================================
  # 7. VISUALIZATION - ROC Curve Plots
  # ==============================================
  - type: CollapseBox
    label: Visualization
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell: { column: 0, row: 0 }
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: Label
                    label: ROC Curve Settings
                  - type: CheckBox
                    name: plotROC
                    label: ROC curves
                  - type: CheckBox
                    name: combinePlots
                    label: Combined ROC curves
                    enable: (plotROC)
                  - type: CheckBox
                    name: showOptimalPoint
                    label: Selected cutpoint
                    enable: (plotROC)
                  - type: CheckBox
                    name: directLabel
                    label: Direct curve labels
                    enable: (plotROC && combinePlots)
              - type: LayoutBox
                margin: large
                children:
                  - type: Label
                    label: Plot Style
                  - type: CheckBox
                    name: cleanPlot
                    label: Publication-quality plot
                    enable: (plotROC)
                  - type: ComboBox
                    name: legendPosition
                    label: Legend position
                    enable: (plotROC && combinePlots && !directLabel)
                  - type: CheckBox
                    name: smoothing
                    label: LOESS smoothing
                    enable: (plotROC)
                  - type: CheckBox
                    name: displaySE
                    label: Smoothed-curve confidence band (95%)
                    enable: (plotROC && smoothing && !cleanPlot)
                  - type: CheckBox
                    name: interactiveROC
                    label: Additional static ROC plot
                    enable: (plotROC)
          - type: LayoutBox
            cell: { column: 1, row: 0 }
            stretchFactor: 1
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: Label
                    label: Confidence Intervals on Plot
                  - type: CheckBox
                    name: showConfidenceBands
                    label: Confidence bands
                    enable: (plotROC && !cleanPlot)
                  - type: CheckBox
                    name: quantileCIs
                    label: CIs at quantiles
                    enable: (plotROC && !cleanPlot)
                  - type: TextBox
                    name: quantiles
                    format: string
                    label: Quantile positions
                    enable: (quantileCIs)
              - type: LayoutBox
                margin: large
                children:
                  - type: Label
                    label: Diagnostic Plots
                  - type: CheckBox
                    name: showCriterionPlot
                    label: Sensitivity/specificity vs. threshold
                  - type: CheckBox
                    name: showPrevalencePlot
                    label: Predictive values vs. prevalence
                  - type: CheckBox
                    name: showDotPlot
                    label: Test values distribution
                  - type: CheckBox
                    name: precisionRecallCurve
                    label: Precision-recall curve

  # ==============================================
  # 8. ADVANCED ROC ANALYSIS
  # ==============================================
  - type: CollapseBox
    label: Advanced ROC Analysis
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Partial AUC
          - type: CheckBox
            name: partialAUC
            label: Partial AUC
          - type: TextBox
            name: partialAUCfrom
            format: number
            label: From specificity
            enable: (partialAUC)
          - type: TextBox
            name: partialAUCto
            format: number
            label: To specificity
            enable: (partialAUC)
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: ROC Smoothing
          - type: ComboBox
            name: rocSmoothingMethod
            label: Smoothing method
          - type: CheckBox
            name: bootstrapCI
            label: Bootstrap confidence intervals
          - type: TextBox
            name: bootstrapReps
            format: number
            label: Bootstrap replications
            enable: (bootstrapCI)

  # ==============================================
  # 9. MODEL COMPARISON
  # ==============================================
  - type: CollapseBox
    label: Model Comparison
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: compareClassifiers
            label: Classifier performance comparison
          - type: CheckBox
            name: effectSizeAnalysis
            label: Effect size analysis
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Discrimination and Reclassification
          - type: CheckBox
            name: calculateIDI
            label: IDI (integrated discrimination improvement)
          - type: CheckBox
            name: calculateNRI
            label: NRI (net reclassification index)
          - type: TextBox
            name: nriThresholds
            format: string
            label: NRI thresholds (comma-separated)
            enable: (calculateNRI)
          - type: TextBox
            name: idiNriBootRuns
            format: number
            label: Bootstrap iterations for IDI/NRI
            enable: (calculateIDI || calculateNRI)

  # ==============================================
  # 10. POWER AND SAMPLE SIZE ANALYSIS
  # ==============================================
  - type: CollapseBox
    label: Power and Sample Size Analysis
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: powerAnalysis
            label: Statistical power (AUC vs. 0.5)
          - type: ComboBox
            name: powerAnalysisType
            label: Power analysis type
            enable: (powerAnalysis)
          - type: TextBox
            name: expectedAUCDifference
            format: number
            label: Target AUC minus 0.5
            enable: (powerAnalysis)
          - type: TextBox
            name: targetPower
            format: number
            label: Target power
            enable: (powerAnalysis)
          - type: TextBox
            name: significanceLevel
            format: number
            label: Significance level
            enable: (powerAnalysis)

  # ==============================================
  # 11. BOOTSTRAP ROC WITH PRIOR WEIGHTING
  # ==============================================
  - type: CollapseBox
    label: Bootstrap ROC with Prior Weighting
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: bayesianAnalysis
            label: Bootstrap ROC analysis (with optional prior)
          - type: TextBox
            name: priorAUC
            format: number
            label: Prior AUC
            enable: (bayesianAnalysis)
          - type: TextBox
            name: priorPrecision
            format: number
            label: Prior precision
            enable: (bayesianAnalysis)

  # ==============================================
  # 12. CLINICAL UTILITY ANALYSIS
  # ==============================================
  - type: CollapseBox
    label: Clinical Utility Analysis
    margin: normal
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: clinicalUtilityAnalysis
            label: Clinical utility analysis
          - type: TextBox
            name: treatmentThresholdMin
            format: number
            enable: (clinicalUtilityAnalysis)
          - type: TextBox
            name: treatmentThresholdMax
            format: number
            enable: (clinicalUtilityAnalysis)
          - type: TextBox
            name: treatmentThresholdStep
            format: number
            enable: (clinicalUtilityAnalysis)
          - type: TextBox
            name: harmBenefitRatio
            format: number
            label: Harm-benefit ratio
            enable: (clinicalUtilityAnalysis)
          - type: CheckBox
            name: interventionCost
            label: Intervention cost analysis
            enable: (clinicalUtilityAnalysis)

  - type: CheckBox
    name: metaAnalysis
    label: Explain why within-cohort meta-analysis is unavailable
