---
name: hullplot
title: Hull Plot
menuGroup: JJStatsPlot
menuSubgroup: Continuous vs Continuous
version: '1.0.8'
jas: '1.2'

description:
  main: |
    Creates Hull plots to visualize clusters and groups in scatter plots using ggforce.
    Hull plots draw polygonal boundaries around data points grouped by categorical variables,
    making it easy to identify customer segments, group membership, and data clusters.
    Based on the geom_mark_hull() function from ggforce package.
  R:
    dontrun: true
    usage: |
      # Basic hull plot: two continuous axes plus a grouping variable.
      # data(hullplot_clusters)
      # hullplot(
      #     data = hullplot_clusters,
      #     x_var = "x",
      #     y_var = "y",
      #     group_var = "cluster"
      # )

      # Colour points by a second categorical variable and size them by a
      # continuous one. Both are optional.
      # hullplot(
      #     data = hullplot_clusters,
      #     x_var = "x",
      #     y_var = "y",
      #     group_var = "cluster",
      #     color_var = "response",
      #     size_var = "biomarker"
      # )

      # Clinical example with the optional explanatory panels turned on.
      # hull_concavity ranges from 1 (most concave) upwards toward a convex hull.
      # data(hullplot_clinical)
      # hullplot(
      #     data = hullplot_clinical,
      #     x_var = "tumor_volume",
      #     y_var = "ki67_index",
      #     group_var = "treatment_arm",
      #     hull_concavity = 2,
      #     color_palette = "clinical",
      #     plot_theme = "clinical",
      #     show_statistics = TRUE,
      #     outlier_detection = TRUE,
      #     show_summary = TRUE
      # )

options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: x_var
      title: X-Axis Variable
      type: Variable
      default: NULL
      suggested:
        - continuous
      permitted:
        - numeric
      description:
        R: >
          Continuous variable for the X-axis of the scatter plot.

    - name: y_var
      title: Y-Axis Variable
      type: Variable
      default: NULL
      suggested:
        - continuous
      permitted:
        - numeric
      description:
        R: >
          Continuous variable for the Y-axis of the scatter plot.

    - name: group_var
      title: Grouping Variable
      type: Variable
      default: NULL
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      description:
        R: >
          Categorical variable that defines the groups for hull boundaries.
          Each group will have its own hull polygon.

    - name: color_var
      title: Color Variable (Optional)
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor
        - numeric
      default: NULL
      description:
        R: >
          Optional variable for coloring points. If not specified, uses the grouping variable.

    - name: size_var
      title: Size Variable (Optional)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: NULL
      description:
        R: >
          Optional continuous variable for sizing points based on values.

    - name: hull_concavity
      title: Hull Concavity
      type: Number
      min: 1
      max: 20
      default: 2
      description:
        R: >
          Controls the concavity of hull polygons. A value of 1 gives the most
          concave hull, which follows the point cloud closely; the hull
          approaches the convex hull as the value grows. The default of 2
          matches ggforce. Values below 1 are clamped by concaveman and are not
          permitted, and the upper bound of 20 is close enough to a convex hull
          for practical purposes. Ignored when V8/concaveman are unavailable.

    - name: hull_alpha
      title: Hull Transparency
      type: Number
      min: 0
      max: 1
      default: 0.3
      description:
        R: >
          Transparency level for hull polygons. 0 = completely transparent, 1 = opaque.

    - name: show_labels
      title: Group labels
      type: Bool
      default: true
      description:
        R: >
          If TRUE, displays group labels inside hull regions.

    - name: point_size
      title: Point Size
      type: Number
      min: 0.5
      max: 10
      default: 2
      description:
        R: >
          Size of scatter plot points. Ignored when a Size Variable is selected,
          because point size is then mapped to that variable's values.

    - name: point_alpha
      title: Point Transparency
      type: Number
      min: 0
      max: 1
      default: 0.7
      description:
        R: >
          Transparency level for scatter plot points.

    - name: color_palette
      title: Color Palette
      type: List
      options:
        - title: "Default"
          name: default
        - title: "Viridis"
          name: viridis
        - title: "Set1"
          name: set1
        - title: "Set2"
          name: set2
        - title: "Dark2"
          name: dark2
        - title: "Clinical (Custom)"
          name: clinical
      default: default
      description:
        R: >
          Color palette for hulls and points.

    - name: plot_theme
      title: Plot Theme
      type: List
      options:
        - title: "Default (theme_minimal)"
          name: minimal
        - title: "Classic"
          name: classic
        - title: "Light"
          name: light
        - title: "Dark"
          name: dark
        - title: "Clinical"
          name: clinical
      default: minimal
      description:
        R: >
          Overall visual theme for the plot.

    - name: plot_title
      title: Plot Title
      type: String
      default: "Hull Plot - Group Visualization"
      description:
        R: >
          Custom title for the hull plot.

    - name: x_label
      title: X-Axis Label
      type: String
      default: ""
      description:
        R: >
          Custom label for X-axis. If empty, uses variable name.

    - name: y_label
      title: Y-Axis Label
      type: String
      default: ""
      description:
        R: >
          Custom label for Y-axis. If empty, uses variable name.

    - name: hull_expand
      title: Hull Boundary Expansion
      type: Number
      min: 0
      max: 1
      default: 0.05
      description:
        R: >
          Padding added around each hull, as a fraction of the plot area
          (0 = hull touches the outermost points, 1 = the whole panel).
          Ignored when V8/concaveman are unavailable and convex hulls are drawn.

    - name: show_statistics
      title: Group statistics
      type: Bool
      default: false
      description:
        R: >
          If TRUE, displays summary statistics for each group in the output.

    - name: outlier_detection
      title: Outlier detection
      type: Bool
      default: false
      description:
        R: >
          If TRUE, reports the number of potential outliers in each group using
          the 1.5 x IQR rule applied separately to the X and Y variables. Groups
          with fewer than 5 observations are reported as too small rather than
          given a count. Outliers are counted, not marked on the plot.

    - name: confidence_ellipses
      title: 95% data ellipses
      type: Bool
      default: false
      description:
        R: >
          If TRUE, adds model-based 95 percent data ellipses, assuming a
          multivariate t distribution. These describe data dispersion, not
          uncertainty in group means. Spelled out rather than written with a
          per-cent sign: jmvtools writes the sign into the .h.R roxygen as an
          escaped backslash-per-cent, roxygen2 escapes the backslash again, and
          the resulting live per-cent sign starts an Rd comment that silently
          eats the rest of that line of help text.

    - name: show_summary
      title: Natural language summary
      type: Bool
      default: false
      description:
        R: >
          If TRUE, displays a plain-language summary of the results with copy-ready text.

    - name: show_assumptions
      title: Assumptions & guidelines
      type: Bool
      default: false
      description:
        R: >
          If TRUE, displays data requirements, assumptions, and usage guidelines.

...
