title: DateTime Converter
name: datetimeconverter
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: DateTime Variable
        children:
          - type: VariablesListBox
            name: datetime_var
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Format Selection
        children:
          - type: ComboBox
            name: datetime_format
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Preview Options
        children:
          - type: TextBox
            name: preview_rows
            format: number
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Two-digit years
        children:
          - type: ComboBox
            name: two_digit_year

      - type: Label
        label: Timezone
        children:
          - type: TextBox
            name: timezone
            format: string
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Corrected datetime
        children:
          - type: Output
            name: corrected_datetime_char
          - type: Output
            name: corrected_datetime_numeric
  - type: CollapseBox
    label: Date Components
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Preview
                fitToGrid: true
                children:
                  - type: CheckBox
                    name: extract_year
                    label: Year (4-digit)
                  - type: CheckBox
                    name: extract_month
                    label: Month (number)
                  - type: CheckBox
                    name: extract_monthname
                    label: Month (name)
                  - type: CheckBox
                    name: extract_day
                    label: Day of month
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Add to data
                children:
                  - type: Output
                    name: year_out
                    enable: (extract_year)
                    label: Year
                  - type: Output
                    name: month_out
                    enable: (extract_month)
                    label: Month (number)
                  - type: Output
                    name: monthname_out
                    enable: (extract_monthname)
                    label: Month (name)
                  - type: Output
                    name: day_out
                    enable: (extract_day)
                    label: Day of month
  - type: CollapseBox
    label: Time Components
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Preview
                children:
                  - type: CheckBox
                    name: extract_hour
                    label: Hour (0-23)
                  - type: CheckBox
                    name: extract_minute
                    label: Minute (0-59)
                  - type: CheckBox
                    name: extract_second
                    label: Second (0-59)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Add to data
                children:
                  - type: Output
                    name: hour_out
                    enable: (extract_hour)
                    label: Hour
                  - type: Output
                    name: minute_out
                    enable: (extract_minute)
                    label: Minute
                  - type: Output
                    name: second_out
                    enable: (extract_second)
                    label: Second

  - type: CollapseBox
    label: Other Components
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Preview
                children:
                  - type: CheckBox
                    name: extract_dayname
                    label: Day name (e.g., Monday)
                  - type: CheckBox
                    name: extract_weeknum
                    label: Week number (Jan-1 blocks, not ISO)
                  - type: CheckBox
                    name: extract_quarter
                    label: Quarter (1-4)
                  - type: CheckBox
                    name: extract_dayofyear
                    label: Day of year (1-366)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Add to data
                children:
                  - type: Output
                    name: dayname_out
                    enable: (extract_dayname)
                    label: Day name
                  - type: Output
                    name: weeknum_out
                    enable: (extract_weeknum)
                    label: Week number
                  - type: Output
                    name: quarter_out
                    enable: (extract_quarter)
                    label: Quarter
                  - type: Output
                    name: dayofyear_out
                    enable: (extract_dayofyear)
                    label: Day of year

  - type: CollapseBox
    label: Output Options
    collapsed: true
    children:
      - type: CheckBox
        name: show_quality_metrics
      - type: CheckBox
        name: show_summary
      - type: CheckBox
        name: show_explanations
      - type: CheckBox
        name: show_glossary
