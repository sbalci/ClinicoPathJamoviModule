---
name:  kappaSizePower
title: Power Approach for the Number of Subjects Required
menuGroup: Power #meddecide
menuSubgroup:  Power Analysis by meddecide
menuSubtitle: Find sample size based on power
version: '1.0.7'
jas: '1.2'

description:
    main: >
        Sample size for an interobserver agreement study sized to reject a null kappa
        (kappa0) in favour of an alternative kappa (kappa1) at a given two-sided
        significance level and power - the power approach of the kappaSize package.
        Use kappaSizeCI for a target confidence-interval width, and kappaSizeFixedN when
        the number of subjects is already fixed.
    R:
        dontrun: true
        usage: |
            # kappaSize::PowerBinary example: test kappa0 = 0.4 against kappa1 = 0.6
            # with a trait prevalence of 0.30, two raters, alpha 0.05 and power 0.80
            kappaSizePower(
                outcome = "2",
                kappa0 = 0.4,
                kappa1 = 0.6,
                props = "0.30",
                raters = "2",
                alpha = 0.05,
                power = 0.80)

options:
    - name: outcome
      title: Number of outcome levels
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      default: "2"
      description:
          ui: >
            Number of outcome levels (categories) of the rated variable.
          R: >
            Number of outcome levels (categories) of the rated variable.


    - name: kappa0
      title: kappa0
      type: Number
      default: 0.40
      min: 0.01
      max: 0.99
      description:
          ui: >
            The null hypothesis value of kappa - the level of agreement the study tests
            against. kappaSize documents this as "the null hypothesis for the kappa
            hypothesis test"; it is NOT the value you expect to observe.
          R: >
            The null hypothesis value of kappa - the level of agreement the study tests
            against, versus the alternative kappa1. kappaSize documents this argument as
            "the null hypothesis for the kappa hypothesis test". It is NOT the anticipated
            value; kappaSizeCI and kappaSizeFixedN use kappa0 for the anticipated value,
            which is a different quantity.

    - name: kappa1
      title: kappa1
      type: Number
      default: 0.60
      min: 0.01
      max: 0.99
      description:
          ui: >
            The alternative hypothesis value of kappa - the level of agreement the study
            should be able to detect against kappa0.
          R: >
            The alternative hypothesis value of kappa - the level of agreement the study
            should be able to detect against kappa0 (kappaSize: "the alternate hypothesis
            for the kappa hypothesis test").

    - name: props
      title: Expected proportion of cases in each category
      type: String
      default: '0.20, 0.80'
      description:
          ui: >
            Anticipated share of subjects in each outcome category, separated by commas,
            semicolons or spaces, using a decimal point, and summing to 1 (for example
            0.20, 0.80 for a finding present in one case in five). For a binary outcome a single
            prevalence is enough. Enter exactly one value per outcome level otherwise.
          R: >
            Anticipated share of subjects in each outcome category as a single string,
            separated by commas, semicolons or spaces, using a decimal point, and summing
            to 1 (for example "0.20, 0.80" for a finding present in one case in five). For a
            binary outcome a single prevalence is enough. Enter exactly one value per
            outcome level otherwise.


    - name: raters
      title: raters
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "2"
      description:
          ui: >
            Number of raters who will each rate every subject (2 to 6).
          R: >
            Number of raters who will each rate every subject (2 to 6).

    - name: alpha
      title: alpha
      type: Number
      default: 0.05
      min: 0.001
      max: 0.20
      description:
          ui: >
            Two-sided significance level (capped at 0.20; must be below the power).
          R: >
            Two-sided significance level (capped at 0.20; must be below the power).

    - name: power
      title: power
      type: Number
      default: 0.80
      min: 0.01
      max: 0.99
      description:
          ui: >
            Probability of rejecting kappa0 when the true agreement is kappa1 (1 - type II
            error). Conventional values are 0.80 or 0.90; must exceed alpha.
          R: >
            Probability of rejecting kappa0 when the true agreement is kappa1 (1 - type II
            error). Conventional values are 0.80 or 0.90; must exceed alpha.

...
