---
name:  statsplot2
title: Automatic Plot Selection
menuGroup: JJStatsPlot
menuSubgroup: All-In-One
menuSubtitle: Automatic Plot Selection Based on Variable Types
version: '1.0.8'
jas: '1.2'

description:
    main: 'Automatically selects and generates the most appropriate statistical visualization based on variable data types. Features enhanced error messages with contextual guidance, robust data validation, and comprehensive fallback options. Supports both independent and repeated measures designs with various plot types including violin plots, scatter plots, bar charts, and alluvial diagrams.'
    R:
        dontrun: true
        usage: |
            # Continuous outcome across groups: Grade is stored as the numbers
            # 1-3, so it is read as categorical (a notice says so) and a violin
            # plot with a nonparametric comparison is drawn.
            statsplot2(
                data = histopathology,
                dep = "Age",
                group = "Grade",
                distribution = "np",
                showSummary = TRUE
            )

            # One panel per level of a third variable
            statsplot2(
                data = histopathology,
                dep = "Age",
                group = "Grade",
                grvar = "Sex"
            )

            # Long-format repeated continuous outcomes need a Subject ID:
            # statsplot2(data = long, dep = "score", group = "visit",
            #            subjectID = "patient_id", direction = "repeated")


options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.


    - name: dep
      title: 'Outcome - Dependent Variable (y-axis)'
      type: Variable
      default: NULL
      description:
          ui: Select the main outcome you want to analyze (e.g., tumor size, survival time, biomarker level, treatment response)
          R: >-
            The dependent variable (y-axis, 1st measurement). Can be continuous or categorical.
            
    - name: group
      title: 'Comparison Groups (x-axis)'
      type: Variable
      default: NULL
      description:
          ui: Select the groups to compare (e.g., treatment vs control, tumor grade G1/G2/G3, positive vs negative)
          R: >-
            The grouping variable (x-axis, 2nd measurement). Can be continuous or categorical.
            
    - name: grvar
      title: 'Split By (Optional)'
      type: Variable
      default: NULL
      description:
          ui: Optional, Split analysis by another variable (e.g., gender, age group, tumor stage) to create separate plots
          R: >-
            Optional grouping variable for creating grouped plots across multiple panels.


    - name: subjectID
      title: Subject ID (Repeated Continuous Outcomes)
      type: Variable
      default: NULL
      description:
          ui: Subject identifier for long-format repeated continuous outcomes (one row per subject and condition). Not needed for wide-format alluvial data.
          R: >-
            Subject identifier for long-format repeated continuous outcomes. Each
            subject must have one row per condition; incomplete subjects are excluded.
            Sampling retains whole subjects. Not used for wide-format alluvial data.

    - name: direction
      title: Study Design
      type: List
      options:
        - title: Independent (Between-Subjects)
          name: independent
        - title: Repeated Measures (Within-Subjects)
          name: repeated
      default: independent
      description:
          ui: Select whether data represents independent groups or repeated measurements
          R: >-
            Measurement design type. "independent" for between-subjects comparisons, 
            "repeated" for within-subjects/repeated measures comparisons.


    - name: distribution
      title: Statistical Approach
      type: List
      options:
        - title: Parametric (normal data, t-tests, ANOVA)
          name: p
        - title: Nonparametric (skewed data, Mann-Whitney, Wilcoxon)
          name: np
        - title: Robust (outlier-resistant, trimmed means)
          name: r
        - title: Bayesian (Bayes Factor)
          name: bf
      default: p
      description:
          ui: 'Parametric: Use for normally distributed continuous data. Nonparametric: Best for skewed data or ordinal scales. Robust: Good when outliers are present. Bayesian: Provides strength of evidence'
          R: >-
            Statistical approach: "p" = parametric, "np" = nonparametric, 
            "r" = robust, "bf" = Bayes factor.

    - name: forceContinuous
      title: Treat all numeric variables as continuous
      type: Bool
      default: false
      description:
          ui: >
            By default a numeric variable with 15 or fewer distinct whole-number
            values (scores, counts, grades) is analysed as categorical. Enable to
            analyse every numeric variable as continuous.
          R: >
            If TRUE, every numeric variable is treated as continuous. By default a
            numeric variable with 15 or fewer distinct whole-number values is
            treated as categorical (a notice reports this), which changes the
            plot type and the test used.

    - name: alluvsty
      title: Alluvial Plot Style
      type: List
      options:
        - title: ggalluvial (detailed flow diagram)
          name: t1
        - title: easyalluvial (simplified flow)
          name: t2
      default: t1
      description:
          ui: Style for alluvial diagrams when comparing two categorical variables in repeated measures
          R: >-
            Style for alluvial diagrams: "t1" = ggalluvial with stratum labels, 
            "t2" = easyalluvial with automatic variable selection.


    - name: showSummary
      title: Result sentence
      type: Bool
      default: false
      description:
          ui: >
            A copy-ready sentence with the test name, statistic, p-value, effect
            size with its interval and the sample size (one per panel when a
            split variable is used).
          R: >
            If TRUE, a plain-language result sentence with the test statistic,
            p-value, effect size and sample size is added to the output.

    - name: showExplanations
      title: Explanation and interpretation
      type: Bool
      default: false
      description:
          ui: >
            Plot-selection summary, clinical interpretation and notes on the
            statistical approach.
          R: >
            If TRUE, an explanation panel describing the selected plot, its
            clinical interpretation and the assumptions of the statistical
            approach is shown.

    - name: excl
      title: Exclude missing values
      type: Bool
      default: false
      description:
          ui: Remove rows with missing values before analysis
          R: >-
            If TRUE, excludes rows with missing values before analysis.

    - name: sampleLarge
      title: Sample large datasets
      type: Bool
      default: false
      description:
          ui: Randomly sample for faster plots. Tests use the sampled data and may lose precision; repeated continuous outcomes retain whole subjects.
          R: >-
            If TRUE, randomly samples large datasets for plotting speed (by default
            those above 10,000 rows are reduced to 5,000; see sampleThreshold and
            sampleSize). Statistics are computed on the retained rows only.

    # The threshold and the sample size were hard-coded at 10,000 and 5,000, so a
    # user who wanted to keep 20,000 rows had only the all-or-nothing switch. Both
    # are exposed now; the defaults reproduce the previous fixed behaviour.
    - name: sampleThreshold
      title: 'Sample above (rows)'
      type: Integer
      default: 10000
      min: 1000
      max: 1000000
      description:
          ui: Datasets with more rows than this are randomly subsampled when sampling is enabled.
          R: >
            Row count above which sampling is applied, when 'Sample large datasets'
            is enabled. Datasets at or below this size are always analysed in full.

    - name: sampleSize
      title: 'Rows to keep'
      type: Integer
      default: 5000
      min: 100
      max: 1000000
      description:
          ui: Rows kept when a large dataset is subsampled; the statistics use only these rows.
          R: >
            Number of rows to retain when sampling. Larger values keep more
            statistical power at the cost of plotting speed. Statistics are
            computed on the retained rows only.

    - name: seed
      title: Random seed
      type: Integer
      default: 42
      description:
          ui: Seed for the random subsample and for any resampling in robust or Bayesian statistics; the same seed reproduces the same result.
          R: >
            Random seed used for the sampling of large datasets (when 'Sample large
            datasets' is enabled) and for any resampling inside the plot statistics
            (robust and Bayesian approaches). Change it to draw a different sample;
            the default (42) reproduces the previous fixed behaviour.
            



    - name: originaltheme
      title: Original ggstatsplot theme
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme rather than jamovi's default.

...

