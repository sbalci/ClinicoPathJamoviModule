jus: '3.0'
title: Clinical ROC Analysis
name: enhancedROC

stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome Variable
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
            itemDropBehaviour: overwrite
          - type: LevelSelector
            name: positiveClass
            enable: (outcome)
      - type: TargetLayoutBox
        label: Predictor Variables
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
            itemDropBehaviour: emptyspace
      - type: TargetLayoutBox
        label: Patient identifier
        children:
        - type: VariablesListBox
          name: patientID
          maxItemCount: 1
          isTarget: true
      - type: TargetLayoutBox
        label: Site identifier
        children:
        - type: VariablesListBox
          name: siteID
          maxItemCount: 1
          isTarget: true
      - type: TargetLayoutBox
        label: Partition identifier
        children:
        - type: VariablesListBox
          name: partitionID
          maxItemCount: 1
          isTarget: true
  - type: CollapseBox
    label: Analysis Options
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Analysis Settings
            children:
              - type: ComboBox
                name: analysisType
              - type: ComboBox
                name: direction
              - type: ComboBox
                name: predictionScale
              - type: CheckBox
                name: youdenOptimization
              - type: ComboBox
                name: clinicalContext
              - type: ComboBox
                name: clinicalPresets
          - type: Label
            label: Thresholds & Cutoffs
            children:
              - type: TextBox
                name: sensitivityThreshold
                format: number
              - type: TextBox
                name: specificityThreshold
                format: number
              - type: TextBox
                name: customCutoffs
                format: string
  - type: CollapseBox
    label: Output Options
    collapsed: false
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            children:
              - type: Label
                label: Tables
                children:
                  - type: CheckBox
                    name: aucTable
                  - type: CheckBox
                    name: cutoffTable
                  - type: CheckBox
                    name: optimalCutoffs
                  - type: CheckBox
                    name: diagnosticMetrics
                  - type: CheckBox
                    name: clinicalMetrics
                  - type: CheckBox
                    name: showTableNotes
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            children:
              - type: Label
                label: Plots
                children:
                  - type: CheckBox
                    name: rocCurve
                  - type: CheckBox
                    name: showCutoffPoints
                    enable: (rocCurve)
                  - type: CheckBox
                    name: showConfidenceBands
                    enable: (rocCurve)
                  - type: ComboBox
                    name: plotTheme
                  - type: CheckBox
                    name: showMetricsDiff
                  - type: CheckBox
                    name: statisticalComparison
  - type: CollapseBox
    label: Clinical Context & Prevalence
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            children:
              - type: Label
                label: Disease Prevalence
                children:
                  - type: TextBox
                    name: prevalence
                    format: number
                    enable: (!useObservedPrevalence)
                  - type: CheckBox
                    name: useObservedPrevalence
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            children:
              - type: Label
                label: Reporting Options
                children:
                  - type: CheckBox
                    name: comprehensive_output
                  - type: CheckBox
                    name: clinical_interpretation
                  - type: CheckBox
                    name: showAnalysisSummary
                  - type: CheckBox
                    name: showClinicalReport
  - type: CollapseBox
    label: Statistical Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Confidence Intervals
            children:
              - type: TextBox
                name: confidenceLevel
                suffix: '%'
                format: number
              - type: CheckBox
                name: useBootstrap
              # Bootstrap samples and stratification also drive the confidence bands, the
              # bootstrap and Venkatraman comparison tests and the partial-AUC bootstrap, so they
              # stay live with Bootstrap confidence intervals off; the interval type serves only the
              # bootstrap intervals.
              - type: TextBox
                name: bootstrapSamples
                format: number
              - type: ComboBox
                name: bootstrapMethod
                enable: (useBootstrap || (partialAuc && bootstrapPartialAUC))
              - type: CheckBox
                name: stratifiedBootstrap
              - type: TextBox
                name: seed
                format: number
          - type: Label
            label: ROC Curve Comparisons
            children:
              - type: CheckBox
                name: pairwiseComparisons
              - type: ComboBox
                name: comparisonMethod
                enable: (pairwiseComparisons || showMetricsDiff || statisticalComparison)
          # NOT IMPLEMENTED - bootstrapCutoffCI is commented out in enhancedROC.a.yaml,
          # so its LayoutBox held no children at all and `children:` parsed as NULL --
          # the only null children node in this module's .u.yaml files. The box is removed
          # rather than left empty; restore it together with the option.
          # - type: CheckBox
          #   name: bootstrapCutoffCI
  - type: CollapseBox
    label: Advanced ROC Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Smoothing & Partial AUC
            children:
              - type: ComboBox
                name: smoothMethod
              - type: CheckBox
                name: partialAuc
              - type: ComboBox
                name: partialAucType
                enable: (partialAuc)
              - type: TextBox
                name: partialRange
                format: string
                enable: (partialAuc)
              # Moved here from 'Statistical Options': it drives the partial-AUC interval and
              # did nothing at all unless partialAuc was also ticked, with no notice.
              - type: CheckBox
                name: bootstrapPartialAUC
                enable: (partialAuc)
          - type: Label
            label: Curve Analysis
            children:
              - type: CheckBox
                name: convexHull
              - type: CheckBox
                name: crocAnalysis
              - type: TextBox
                name: crocAlpha
                format: number
                enable: (crocAnalysis)
  - type: CollapseBox
    label: Class Imbalance Detection
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: detectImbalance
          - type: TextBox
            name: imbalanceThreshold
            format: number
          - type: CheckBox
            name: showImbalanceWarning
          - type: CheckBox
            name: recommendPRC
  - type: CollapseBox
    label: Calibration Analysis
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            children:
              - type: Label
                label: Calibration Assessment
                children:
                  - type: CheckBox
                    name: calibrationAnalysis
                  - type: CheckBox
                    name: calibrationPlot
                    enable: (calibrationAnalysis)
                  - type: CheckBox
                    name: brierScore
                    enable: (calibrationAnalysis)
                  - type: CheckBox
                    name: calibrationMetrics
                    enable: (calibrationAnalysis)
              - type: LayoutBox
                margin: large
                children:
                  - type: CheckBox
                    name: splineCalibration
                    enable: (calibrationAnalysis)
                  - type: TextBox
                    name: splineKnots
                    format: number
                    enable: (calibrationAnalysis && splineCalibration)
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            children:
              - type: Label
                label: Goodness-of-Fit
                children:
                  - type: CheckBox
                    name: hosmerLemeshow
                    enable: (calibrationAnalysis)
                  - type: TextBox
                    name: hlGroups
                    format: number
                    enable: (calibrationAnalysis)
                  - type: CheckBox
                    name: eoRatio
                    enable: (calibrationAnalysis)
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: namDagostino
                  #   enable: (calibrationAnalysis)
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: greenwoodNam
                  #   enable: (calibrationAnalysis)
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: calibrationBelt
                  #   enable: (calibrationAnalysis)
                  - type: CheckBox
                    name: calibrationDensity
                    enable: (calibrationAnalysis)
  - type: CollapseBox
    label: Multi-Class ROC
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: multiClassROC
          - type: ComboBox
            name: multiClassStrategy
            enable: (multiClassROC)
          - type: ComboBox
            name: multiClassAveraging
            enable: (multiClassROC)
  - type: CollapseBox
    label: Clinical Impact
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: clinicalImpact
          - type: CheckBox
            name: clinicalUtilityCurve
            enable: (clinicalImpact)
          - type: CheckBox
            name: nntCalculation
            enable: (clinicalImpact)
          - type: CheckBox
            name: decisionImpactTable
            enable: (clinicalImpact)
          # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
          # - type: CheckBox
          #   name: harrellCIndex
          # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
          # - type: CheckBox
          #   name: unoCStatistic
          # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
          # - type: CheckBox
          #   name: incidentDynamic
          # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
          # - type: CheckBox
          #   name: cumulativeDynamic
          # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
          # - type: CheckBox
          #   name: competingRisksConcordance
  - type: CollapseBox
    label: Plot Settings
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: plotWidth
            format: number
          - type: TextBox
            name: plotHeight
            format: number
  - type: CollapseBox
    label: Validation & Model Performance
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            children:
              - type: Label
                label: Internal Validation
                children:
                  - type: CheckBox
                    name: internalValidation
                  - type: ComboBox
                    name: validationMethod
                    enable: (internalValidation)
              - type: LayoutBox
                margin: large
                children:
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: optimismCorrection
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: externalValidation
                  - type: CheckBox
                    name: decisionImpactCurves
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: netBenefitRegression
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: modelUpdating
                  # NOT IMPLEMENTED - option commented out in enhancedROC.a.yaml.
                  # - type: CheckBox
                  #   name: transportability

  - type: CollapseBox
    label: Deployment Prevalence and Workload
    collapsed: true
    children:
    - type: TextBox
      name: impactCutoffs
      format: string
    - type: TextBox
      name: utilityThreshold
      format: number
    - type: TextBox
      name: workloadPopulationSize
      format: number
    - type: TextBox
      name: analysisUnit
      format: string
    - type: TextBox
      name: prevalenceScenarios
      format: string

  - type: CollapseBox
    label: Frozen-Model Validation
    collapsed: true
    children:
    - type: CheckBox
      name: validationPanel
    - type: TextBox
      name: validationNegative
      format: string
    - type: TextBox
      name: referenceDescription
      format: string
    - type: TextBox
      name: modelVersion
      format: string
    - type: ComboBox
      name: cohortRole
    - type: ComboBox
      name: samplingDesign
    - type: ComboBox
      name: thresholdSource
    - type: CheckBox
      name: validationBootstrap
    - type: TextBox
      name: validationDraws
      format: number
