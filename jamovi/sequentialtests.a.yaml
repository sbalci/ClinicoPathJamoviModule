---
name: sequentialtests
title: Sequential Testing Analysis
menuGroup: meddecide
menuSubgroup: Decision Calculators
menuSubtitle: Sequential Test Analysis
version: '1.0.7'
jas: '1.2'

description:
    main: |
        Analyzes how diagnostic accuracy changes when applying two tests in sequence,
        comparing three different testing strategies: serial positive (confirmation),
        serial negative (exclusion), and parallel testing. Provides comprehensive
        analysis including population flow, cost implications, and diagnostic plots.

        The named scenarios and their values are teaching examples only, not clinical
        guidance or validated diagnostic pathways. Replace all example parameters with
        estimates applicable to the intended population before interpreting results.

        This analysis is particularly useful for:
        • Exploring how diagnostic strategies behave under explicit assumptions
        • Comparing hypothetical test sequences for teaching or planning
        • Understanding trade-offs between sensitivity and specificity
        • Illustrating expected testing volume and cost under user-supplied assumptions
        • Teaching sequential testing concepts and Bayesian probability

options:
    # Teaching examples
    - name: preset
      title: Teaching Example
      type: List
      options:
        - name: custom
          title: Custom Values
        - name: covid_screening_confirmation
          title: Respiratory Testing (Illustrative)
        - name: breast_cancer_screening
          title: Breast Imaging + Tissue Sampling (Illustrative)
        - name: mi_emergency_parallel
          title: Biomarker + ECG (Illustrative)
        - name: tb_screening_confirmation
          title: Chest Imaging + Culture (Illustrative)
        - name: prostate_screening_exclusion
          title: PSA + MRI (Illustrative)
        - name: hiv_screening_confirmation
          title: HIV Ag/Ab + Differentiation Assay (Illustrative)
        - name: stroke_emergency_parallel
          title: Clinical Assessment + CT (Illustrative)
      default: custom
      description:
          R: |
            Select a teaching example or use custom values. Examples load rounded,
            hypothetical parameters chosen only to demonstrate how each strategy behaves.
            They are not clinical guidance, validated diagnostic pathways, or estimates from
            a specific study, and their prevalence will not match your population. Replace
            every value with estimates from the intended setting before interpretation.

    # First Test (Screening Test) Parameters
    - name: test1_name
      title: Screening Test Name
      type: String
      default: 'Screening Test'
      description:
          R: Display name for the first test.
      
    - name: test1_sens
      title: Sensitivity
      type: Number
      default: 0.95
      min: 0.01
      max: 0.99
      description:
          R: Assumed sensitivity of the first test, entered as a proportion from 0.01 to 0.99.
      
    - name: test1_spec
      title: Specificity 
      type: Number
      default: 0.70
      min: 0.01
      max: 0.99
      description:
          R: Assumed specificity of the first test, entered as a proportion from 0.01 to 0.99.

    - name: test1_cost
      title: Illustrative Unit Cost
      type: Number
      default: 0
      min: 0
      description:
          R: Assumed unit cost of the first test in user-defined currency or cost units.
    
    # Second Test (Confirmatory Test) Parameters  
    - name: test2_name
      title: Confirmatory Test Name
      type: String
      default: 'Confirmatory Test'
      description:
          R: Display name for the second test.
      
    - name: test2_sens
      title: Sensitivity
      type: Number
      default: 0.80
      min: 0.01
      max: 0.99
      description:
          R: Assumed sensitivity of the second test, entered as a proportion from 0.01 to 0.99.
      
    - name: test2_spec
      title: Specificity
      type: Number
      default: 0.98
      min: 0.01
      max: 0.99
      description:
          R: Assumed specificity of the second test, entered as a proportion from 0.01 to 0.99.

    - name: test2_cost
      title: Illustrative Unit Cost
      type: Number
      default: 0
      min: 0
      description:
          R: Assumed unit cost of the second test in user-defined currency or cost units.
    
    # Testing Strategy
    - name: strategy
      title: Testing Strategy
      type: List
      options:
        - title: Test all positives from first test
          name: serial_positive
        - title: Test all negatives from first test
          name: serial_negative 
        - title: Test all subjects with both tests (parallel)
          name: parallel
      default: serial_positive
      description:
          R: |
            Rule for combining results: test first-test positives, test first-test
            negatives, or apply both tests to everyone. Combined accuracy assumes
            conditional independence between tests.
      
    # Disease Prevalence
    - name: prevalence
      title: Disease Prevalence
      type: Number
      default: 0.10
      min: 0.001
      max: 0.999
      description:
          R: Assumed pre-test disease probability, entered as a proportion from 0.001 to 0.999.

    - name: population_size
      title: Illustrative Population Size
      type: Integer
      default: 1000
      min: 100
      max: 100000
      description:
        R: >
          Population size used to illustrate population flow counts. Does not affect probabilities.
    
    # Display Options
    - name: show_explanation
      title: Explanations
      type: Bool
      default: false
      description:
          R: Show a plain-language summary and explanation of the selected strategy.
      
    - name: show_formulas
      title: Calculation formulas
      type: Bool
      default: false
      description:
          R: Show the formulas used for individual and combined test metrics.
      
    - name: show_cost_analysis
      title: Cost analysis
      type: Bool
      default: false
      description:
          R: Show expected testing volume and cost using the illustrative population size.
      
    - name: show_plots
      title: Diagnostic plots
      type: Bool
      default: false
      description:
          R: Show the five diagnostic-performance and population-flow plots.

...
