title: Delayed-Entry Cox Regression
name: delayedentrycox
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: 'Entry Time'
        children:
          - type: VariablesListBox
            name: entrytime
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: 'Event or Censoring Time'
        children:
          - type: VariablesListBox
            name: exittime
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: 'Event (0 = censored, 1 = event)'
        children:
          - type: VariablesListBox
            name: event
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: 'Baseline Covariates'
        children:
          - type: VariablesListBox
            name: predictors
            isTarget: true
