---
name: timeinterval
title: Comprehensive Time Interval Calculator
menuGroup: SurvivalT
menuSubgroup: Data Preparation
menuSubtitle: Advanced time interval analysis with quality assessment
version: '1.0.8'
jas: '1.2'

description:
    main: >-
        Advanced time interval calculator designed for survival analysis, epidemiological studies, 
        and person-time analysis. Features intelligent date parsing, comprehensive data quality 
        assessment, landmark analysis, and robust statistical summaries. Time intervals form the 
        foundation of person-time follow-up calculations, capturing both participant counts and 
        observation duration for accurate incidence rate calculations.

    # R:
    #     dontrun: true
    #     usage: |
    #         # Basic time interval calculation:
    #         timeinterval(
    #           data = histopathology,
    #           dx_date = "SurgeryDate",
    #           fu_date = "LastFollowUpDate",
    #           time_format = "ymdhms",
    #           output_unit = "months"
    #         )
            
    #         # With landmark analysis:
    #         timeinterval(
    #           data = histopathology,
    #           dx_date = "SurgeryDate",
    #           fu_date = "LastFollowUpDate",
    #           time_format = "ymdhms",
    #           use_landmark = TRUE,
    #           landmark_time = 6,
    #           output_unit = "months"
    #         )

options:
    # === CORE DATA INPUT ===
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame containing date columns for interval calculation.

    # === DATE VARIABLES ===
    - name: dx_date
      title: Start Date Variable
      type: Variable
      default: null
      suggested:
        - continuous
        - nominal
      permitted:
        - factor
        - numeric
      description:
          R: >
            Column containing start dates (e.g., diagnosis date, study entry, treatment start).
            Accepts text dates and numeric packed dates (YYYYMMDD, YYMMDD). Spreadsheet
            day-count serial numbers (Excel day counts such as 42370) are not dates and are
            rejected, because parsing them gives follow-up times wrong by decades; re-export
            that column as text in YYYY-MM-DD form.

    - name: fu_date
      title: End Date Variable  
      type: Variable
      default: null
      suggested:
        - continuous
        - nominal
      permitted:
        - factor
        - numeric
      description:
          R: >
            Column containing end dates (e.g., follow-up date, event date, study exit).
            Must be in the same format as the start date variable. Spreadsheet day-count
            serial numbers are rejected for the same reason as the start date column.

    # === DATE FORMAT CONFIGURATION ===
    - name: time_format
      title: Date Format
      type: List
      options:
        - name: auto
          title: Auto-detect Format
        - name: ymdhms
          title: YYYY-MM-DD HH:MM:SS
        - name: ymd
          title: YYYY-MM-DD
        - name: dmy
          title: DD-MM-YYYY (or DD/MM/YYYY)
        - name: mdy
          title: MM-DD-YYYY (or MM/DD/YYYY)
        - name: ydm
          title: YYYY-DD-MM
        - name: myd
          title: MM-YYYY-DD
        - name: dym
          title: DD-YYYY-MM
      default: auto
      description:
          R: >
            Date format specification. 'Auto-detect' attempts to identify the format automatically.
            Manual selection ensures accurate parsing for specific date formats.

    - name: output_unit
      title: Time Unit for Results
      type: List
      options:
        - name: days
          title: Days
        - name: weeks
          title: Weeks  
        - name: months
          title: Months
        - name: years
          title: Years
      default: months
      description:
          R: >
            Unit for calculated time intervals. Affects person-time calculations and 
            statistical summaries. Choose based on study duration and event frequency.

    - name: time_basis
      title: Time Basis
      type: List
      options:
        - name: standardized
          title: Standardized (30.4375-day months, 365.25-day years)
        - name: calendar
          title: Calendar-aware (actual month lengths)
      default: standardized
      description:
          R: >
            Controls how months/years are computed. Standardized uses fixed lengths (30.4375 days per
            month, 365.25 days per year) suited for person-time denominators. Calendar-aware respects
            actual month lengths (28 - 31 days) when converting intervals to months/years.

    # === LANDMARK ANALYSIS ===
    - name: use_landmark
      title: Landmark analysis
      type: Bool
      default: false
      description:
          R: >
            Enables conditional analysis from a specific time point. Useful for 
            studying outcomes after a landmark time (e.g., 6-month survivors only).

    - name: landmark_time
      title: Landmark Time Point
      type: Number
      default: 6
      min: 0
      description:
          R: >
            Time point for landmark analysis in the specified output units. 
            Only participants surviving past this time are included in analysis.

    # === DATA QUALITY OPTIONS ===
    - name: remove_negative
      title: Remove negative intervals
      type: Bool
      default: false
      description:
          R: >
            Automatically exclude negative time intervals (end date before start date).
            Recommended for data quality assurance.

    - name: remove_extreme
      title: Remove extreme values
      type: Bool
      default: false
      description:
          R: >
            Exclude time intervals above (multiplier x 99th percentile) from the analysis.
            These rows are dropped from every statistic, including the mean and the total
            person-time, not merely flagged. The Data Quality Assessment panel reports how
            many were removed. Leave off to keep all intervals and only see the count.

    - name: extreme_multiplier
      title: Extreme Threshold Multiplier
      type: Number
      default: 2.0
      min: 1.5
      max: 5.0
      description:
          R: >
            Multiplier for 99th percentile to define extreme values.
            Default 2.0 means intervals longer than 2x the 99th percentile are removed
            when 'Remove extreme values' is on. Higher values are more conservative
            (fewer intervals removed). Has no effect when the 99th percentile is zero.

    # === OUTPUT OPTIONS ===
    - name: add_times
      title: Add calculated times to dataset
      type: Bool
      default: false
      description:
          R: >
            Appends calculated time intervals as a new variable for downstream analysis.
            Useful for subsequent survival analysis or person-time calculations.

    - name: include_quality_metrics
      title: Include data quality assessment
      type: Bool
      default: false
      description:
          R: >
            Provides comprehensive data quality assessment including missing values,
            negative intervals, and distribution statistics.

    - name: confidence_level
      title: Confidence Level ( percent)
      type: Number
      default: 95
      min: 90
      max: 99
      description:
          R: >
            Confidence level for statistical intervals (mean confidence intervals).
            Standard epidemiological practice uses 95 percent confidence intervals.

    - name: show_summary
      title: Natural-language summary
      type: Bool
      default: false
      description:
          R: >
            Generate a plain-language interpretation of results suitable for
            copying into reports or clinical notes.

    - name: show_glossary
      title: Glossary of terms
      type: Bool
      default: false
      description:
          R: >
            Display definitions of key terms (person-time, incidence rate, landmark analysis, etc.)
            to help interpret results.

    # === TIMEZONE CONFIGURATION ===
    - name: timezone
      title: Timezone
      type: List
      options:
        - name: system
          title: System Default
        - name: utc
          title: UTC
      default: system
      description:
          R: >
            Timezone for datetime parsing. 'System Default' uses your computer's timezone.
            'UTC' interprets datetimes as Coordinated Universal Time. This applies only to the
            'YYYY-MM-DD HH:MM:SS' format, the only one that carries a time of day; date-only
            formats produce calendar dates that have no timezone, so the setting has no effect
            on them.


...
