title: Mixed-Effects Cox Regression
name: mixedcox
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time Elapsed
        children:
          - type: VariablesListBox
            name: elapsedtime
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: outcomeLevel
            enable: (outcome)
      - type: TargetLayoutBox
        label: Clustering Variable
        children:
          - type: VariablesListBox
            name: cluster_var
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Fixed Effects (Categorical)
        children:
          - type: VariablesListBox
            name: fixed_effects
            isTarget: true
      - type: TargetLayoutBox
        label: Fixed Effects (Continuous)
        children:
          - type: VariablesListBox
            name: continuous_effects
            isTarget: true
  - type: CollapseBox
    label: Random Effects Specification
    collapsed: false
    stretchFactor: 1
    children:
      - type: Label
        label: Random Effects Type
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: random_effects
      - type: Label
        label: Random Slope Variable
        children:
          - type: VariableSupplier
            persistentItems: false
            stretchFactor: 1
            children:
              - type: TargetLayoutBox
                label: Variable for Random Slopes
                children:
                  - type: VariablesListBox
                    name: random_slope_var
                    maxItemCount: 1
                    isTarget: true
                    enable: (random_effects:slope || random_effects:both)
      - type: Label
        label: Nested Clustering
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: nested_clustering
                enable: (random_effects:intercept)
              - type: VariableSupplier
                persistentItems: false
                stretchFactor: 1
                children:
                  - type: TargetLayoutBox
                    label: Higher-Level Cluster
                    children:
                      - type: VariablesListBox
                        name: nested_cluster_var
                        maxItemCount: 1
                        isTarget: true
                        enable: (random_effects:intercept && nested_clustering)
  - type: CollapseBox
    label: Model Options
    collapsed: true
    children:
      - type: CheckBox
        name: sparse_matrix
  - type: CollapseBox
    label: Advanced Elapsed Time Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: Label
        label: Time Interval
        fitToGrid: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: tint
                fitToGrid: true
              - type: Label
                label: Date Variables
                fitToGrid: true
                stretchFactor: 1
                children:
                  - type: VariableSupplier
                    persistentItems: false
                    stretchFactor: 1
                    children:
                      - type: TargetLayoutBox
                        label: Diagnosis Date
                        children:
                          - type: VariablesListBox
                            name: dxdate
                            maxItemCount: 1
                            isTarget: true
                            fitToGrid: true
                            stretchFactor: 1
                      - type: TargetLayoutBox
                        label: Follow-up Date
                        children:
                          - type: VariablesListBox
                            name: fudate
                            maxItemCount: 1
                            isTarget: true
                            fitToGrid: true
                            stretchFactor: 1
              - type: Label
                label: Time Type
                fitToGrid: true
                stretchFactor: 1
                children:
                  - type: LayoutBox
                    margin: large
                    fitToGrid: true
                    children:
                      - type: ComboBox
                        name: timetypedata
                        enable: (tint)
                      - type: ComboBox
                        name: timetypeoutput
  - type: CollapseBox
    label: Model Assessment
    collapsed: true
    children:
      - type: CheckBox
        name: icc_calculation
        enable: (!random_effects:slope)
  - type: CollapseBox
    label: Output Options
    collapsed: true
    children:
      - type: CheckBox
        name: show_fixed_effects
      - type: CheckBox
        name: show_random_effects
      - type: CheckBox
        name: show_model_comparison
