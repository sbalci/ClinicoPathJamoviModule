---
name:  benford
title: Benford Analysis
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Data Quality
# Analysis version, NOT the package version (DESCRIPTION is at 1.0.8.05).
# Bumped from 1.0.7 because the user-visible output changed materially: every
# translated result string moved to jmvcore::format placeholders, the Mantissa
# Arc Test row gained a "not used by the Assessment" qualifier, the bin listing
# gained the analysis-row-numbering caveat, and the duplicated small-sample
# warning was removed. The umbrella copy and the shipped ClinicoPathDescriptives
# copy must not both claim 1.0.7 while behaving differently.
version: '1.0.8'
jas: '1.2'

description:
    main: >
        Compares the leading digits of a positive numeric variable against
        Benford's Law, using a chi-square goodness-of-fit test, the Mantissa
        Arc Test and Nigrini's MAD conformity classification. The MAD
        classification is reported only when the sample is large enough for its
        cut-offs to exceed sampling noise; otherwise the chi-square test carries
        the finding. Benford's Law applies to data spanning at least two orders
        of magnitude. The analysis reports whether a departure from the expected
        leading-digit frequencies was detected; it does not identify a cause.
    R:
        dontrun: true
        usage: |
            # Leading-digit screen on cardiac troponin: 400 patients,
            # 0.005 to 8.96 ng/mL, spanning 3.3 orders of magnitude. At the
            # default 2-digit setting Nigrini's MAD cut-off is not usable
            # below n = 5204, so the chi-square goodness-of-fit test carries
            # the finding here (p = 0.70; no departure detected).
            benford(
                data = timeroc_cardiovascular_risk,
                var = "troponin_level")

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: var
      title: Variable
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      # .run() has an `is.null(self$options$var)` branch showing the welcome
      # panel, so NULL is a supported state. Without an explicit default the
      # compiler makes `var` a REQUIRED argument of the public wrapper.
      default: NULL
      description:
          R: >
            a string naming the variable from `data` that contains the
            continuous values used for the report
          jamovi: >
            a string naming the variable from `data` that contains the
            continuous values used for the report

    - name: digits
      title: Number of digits
      type: Integer
      default: 2
      min: 1
      max: 3
      description:
          R: >
            Number of first digits to analyze (default: 2). Limited to 1-3
            digits; the benford.analysis package does not provide a MAD
            conformity classification beyond 3 digits.
          jamovi: >
            Number of first digits to analyze (1-3)

...
