---
name:  benford
title: Benford Analysis
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Data Quality
version: '1.0.7'
jas: '1.2'

description:
    main: >
        Tests whether the leading digits of a numeric variable follow Benford's
        Law, using the MAD conformity classification, a chi-square
        goodness-of-fit test and the Mantissa Arc Test. Intended as a screen for
        systematic recording artefacts such as rounding or preferred values.
    R:
        dontrun: true
        usage: |
            # Leading-digit screen on follow-up times. These span only 1.3
            # orders of magnitude, so the analysis reports a narrow-range
            # warning: Benford's Law needs at least two decades.
            benford(
                data = histopathology,
                var = "OverallTime")

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: var
      title: Variable
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      # .run() has an `is.null(self$options$var)` branch showing the welcome
      # panel, so NULL is a supported state. Without an explicit default the
      # compiler makes `var` a REQUIRED argument of the public wrapper.
      default: NULL
      description:
          R: >
            a string naming the variable from `data` that contains the
            continuous values used for the report
          jamovi: >
            a string naming the variable from `data` that contains the
            continuous values used for the report

    - name: digits
      title: Number of digits
      type: Integer
      default: 2
      min: 1
      max: 3
      description:
          R: >
            Number of first digits to analyze (default: 2). Limited to 1-3
            digits; the benford.analysis package does not provide a MAD
            conformity classification beyond 3 digits.
          jamovi: >
            Number of first digits to analyze (1-3)

...
