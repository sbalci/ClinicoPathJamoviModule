---
name:  pathagreement
title: Pathology Interrater Reliability
jrs:   '1.1'

items:
    - name: todo
      visible: (readerWorkflow:off)
      title: Getting Started
      type: Html


      clearWith:
        - vars
    - name: warnings
      title: Analysis Messages
      type: Html
      visible: (readerWorkflow:off)

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - multiraterMethod
        - wght
        - pathologyContext
        - outlierAnalysis
        - gwetAC
        - pabak
    - name: overviewTable
      visible: (readerWorkflow:off)
      title: Agreement Analysis Summary
      type: Table
      rows: 1
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - multiraterMethod
        - exct
      columns:
        - name: cases
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: categories
          title: 'Categories'
          type: integer
        - name: overall_agreement
          title: 'Complete Agreement %'
          type: number
          format: zto
        - name: primary_method
          title: 'Primary Method'
          type: text

    - name: kappaTable
      visible: (readerWorkflow:off)
      title: 'Kappa Statistics'
      type: Table
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - multiraterMethod
        - wght
        - exct
        - fleissCI
        - krippMethod
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: kappa
          title: 'Kappa'
          type: number
          format: zto
        - name: se
          title: 'Standard Error'
          type: number
          format: zto
        - name: ci_lower
          title: 'CI Lower'
          type: number
          format: zto
        - name: ci_upper
          title: 'CI Upper'
          type: number
          format: zto
        - name: z
          title: 'z-value'
          type: number
          format: zto
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: iccTable
      title: 'Intraclass Correlation Coefficients'
      type: Table
      visible: (readerWorkflow:off && (icc))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - icc
      columns:
        - name: type
          title: 'ICC Type'
          type: text
        - name: icc_value
          title: 'ICC'
          type: number
          format: zto
        - name: ci_lower
          title: 'CI Lower'
          type: number
          format: zto
        - name: ci_upper
          title: 'CI Upper'
          type: number
          format: zto
        - name: f_value
          title: 'F-value'
          type: number
          format: zto
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: pairwiseTable
      title: 'Pairwise Rater Agreements'
      type: Table
      visible: (readerWorkflow:off && (pairwiseAnalysis))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - pairwiseAnalysis
        - wght
      columns:
        - name: rater_pair
          title: 'Rater Pair'
          type: text
        - name: agreement_percent
          title: 'Agreement %'
          type: number
          format: zto
        - name: kappa
          title: 'Kappa'
          type: number
          format: zto
        - name: ci_lower
          title: 'CI Lower'
          type: number
          format: zto
        - name: ci_upper
          title: 'CI Upper'
          type: number
          format: zto
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Agreement Level'
          type: text

    - name: categoryTable
      title: 'Category-Specific Agreement'
      type: Table
      visible: (readerWorkflow:off && (categoryAnalysis))
      clearWith:
        - referenceType
        - vars
        - caseID
        - useMetadataRows
        - categoryAnalysis
        - referenceStandard
      columns:
        - name: category
          title: 'Category'
          type: text
        - name: frequency
          title: 'Frequency'
          type: integer
        - name: agreement_percent
          title: 'Agreement %'
          type: number
          format: zto
        - name: kappa
          title: 'Category Kappa'
          type: number
          format: zto
        - name: sensitivity
          title: 'Sensitivity'
          type: number
          format: zto
          visible: (pathologyContext || !is.null(referenceStandard))
        - name: specificity
          title: 'Specificity'
          type: number
          format: zto
          visible: (pathologyContext || !is.null(referenceStandard))

    - name: outlierTable
      title: 'Cases with Poor Agreement'
      type: Table
      visible: (readerWorkflow:off && (outlierAnalysis))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - outlierAnalysis
      columns:
        - name: case_id
          title: 'Case ID'
          type: text
        - name: disagreement_count
          title: 'Disagreements'
          type: integer
        - name: agreement_score
          title: 'Agreement Score'
          type: number
          format: zto
        - name: rater_assignments
          title: 'Rater Assignments'
          type: text
        - name: consensus_diagnosis
          title: 'Consensus'
          type: text
          visible: (pathologyContext)

    - name: diagnosticAccuracyTable
      title: 'Reference Comparison by Rater (Macro-Averaged Across Categories)'
      type: Table
      visible: (readerWorkflow:off && (pathologyContext))
      clearWith:
        - referenceType
        - vars
        - caseID
        - useMetadataRows
        - pathologyContext
        - referenceStandard
      columns:
        - name: rater
          title: 'Rater'
          type: text
        - name: accuracy
          title: 'Accuracy %'
          type: number
          format: zto
        - name: sensitivity
          title: 'Macro sensitivity %'
          type: number
          format: zto
        - name: specificity
          title: 'Macro specificity %'
          type: number
          format: zto
        - name: ppv
          title: 'Macro PPV %'
          type: number
          format: zto
        - name: npv
          title: 'Macro NPV %'
          type: number
          format: zto
        - name: kappa_vs_gold
          title: 'Kappa vs Gold Standard'
          type: number
          format: zto

    - name: diagnosticStyleTable
      title: 'Diagnostic Style Clustering Results'
      type: Table
      visible: (readerWorkflow:off && (performClustering))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
      columns:
        - name: rater
          title: 'Rater'
          type: text
        - name: style_group
          title: 'Style Group'
          type: text
        - name: within_group_agreement
          title: 'Within-Group Agreement %'
          type: number
          format: zto
        - name: experience
          title: 'Experience'
          type: text
          visible: (raterCharacteristics)
        - name: training
          title: 'Training Institution'
          type: text
          visible: (raterCharacteristics)
        - name: institution
          title: 'Current Institution'
          type: text
          visible: (raterCharacteristics)
        - name: specialty
          title: 'Specialty'
          type: text
          visible: (raterCharacteristics)

    - name: styleSummaryTable
      title: 'Diagnostic Style Group Summary'
      type: Table
      visible: (readerWorkflow:off && (performClustering))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
      columns:
        - name: style_group
          title: 'Style Group'
          type: text
        - name: n_members
          title: 'Members'
          type: integer
        - name: members
          title: 'Member Names'
          type: text
        - name: avg_within_agreement
          title: 'Avg Within-Group Agreement %'
          type: number
          format: zto
        - name: predominant_experience
          title: 'Predominant Experience'
          type: text
          visible: (raterCharacteristics)
        - name: predominant_training
          title: 'Predominant Training'
          type: text
          visible: (raterCharacteristics)
        - name: predominant_institution
          title: 'Predominant Institution'
          type: text
          visible: (raterCharacteristics)

    - name: discordantCasesTable
      title: 'Cases Distinguishing Diagnostic Styles'
      type: Table
      visible: (readerWorkflow:off && (identifyDiscordantCases))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - identifyDiscordantCases
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
      columns:
        - name: case_id
          title: 'Case ID'
          type: text
        - name: discord_score
          title: 'Discord Score'
          type: number
          format: zto
        - name: style_group_diagnoses
          title: 'Style Group Diagnoses'
          type: text
        - name: case_interpretation
          title: 'Interpretation'
          type: text

    - name: krippTable
      title: "Krippendorff's Alpha Results"
      type: Table
      visible: (readerWorkflow:off && (kripp))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - kripp
        - krippMethod
        - bootstrap
        - bootstrapCIType
        - bootstrapSamples
        - seed
      columns:
        - name: data_type
          title: 'Data Type'
          type: text
        - name: alpha
          title: 'Alpha'
          type: number
          format: zto
        - name: ci_lower
          title: 'CI Lower'
          type: number
          format: zto
          visible: (bootstrap)
        - name: ci_upper
          title: 'CI Upper'
          type: number
          format: zto
          visible: (bootstrap)
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: consensusTable
      title: 'Consensus Scoring Results'
      type: Table
      visible: (readerWorkflow:off && (consensus && show_consensus_table))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - consensus
        - consensus_method
        - tie_breaking
        - show_consensus_table
      columns:
        - name: case_id
          title: 'Case ID'
          type: text
        - name: consensus_score
          title: 'Consensus Score'
          type: text
        - name: agreement_level
          title: 'Agreement Level'
          type: text
        - name: n_agreeing
          title: 'Raters Agreeing'
          type: integer
        - name: rater_scores
          title: 'Individual Scores'
          type: text

    - name: consensusSummary
      title: 'Consensus Summary Statistics'
      type: Table
      visible: (readerWorkflow:off && (consensus))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - consensus
        - consensus_method
        - tie_breaking
      columns:
        - name: metric
          title: 'Metric'
          type: text
        - name: value
          title: 'Value'
          type: integer
        - name: percentage
          title: 'Percentage'
          type: number
          format: zto

    - name: heatmapPlot
      title: 'Agreement Heatmap'
      type: Image
      width: 800
      height: 600
      renderFun: .heatmapPlot
      visible: (readerWorkflow:off && (heatmap))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - heatmap
        - heatmapDetails
        - heatmapTheme
        - wght
    - name: pairwisePlot
      title: 'Pairwise Agreement Plot'
      type: Image
      width: 700
      height: 500
      renderFun: .pairwisePlot
      visible: (readerWorkflow:off && (pairwiseAnalysis))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - pairwiseAnalysis
        - wght
    - name: categoryPlot
      title: 'Category Agreement Plot'
      type: Image
      width: 700
      height: 500
      renderFun: .categoryPlot
      visible: (readerWorkflow:off && (categoryAnalysis))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - categoryAnalysis
        - referenceStandard
    - name: confusionMatrixPlot
      title: 'Confusion Matrix'
      type: Image
      width: 600
      height: 600
      renderFun: .confusionMatrixPlot
      visible: (readerWorkflow:off && (pathologyContext))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - pathologyContext
        - referenceStandard
    - name: diagnosticStyleDendrogram
      title: 'Diagnostic Style Dendrogram'
      type: Image
      width: 800
      height: 600
      renderFun: .diagnosticStyleDendrogram
      visible: (readerWorkflow:off && (performClustering))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
    - name: diagnosticStyleHeatmap
      title: 'Diagnostic Style Heatmap'
      type: Image
      width: 800
      height: 600
      renderFun: .diagnosticStyleHeatmap
      visible: (readerWorkflow:off && (performClustering && showClusteringHeatmap))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
        - showClusteringHeatmap
        - heatmapColorScheme
    - name: diagnosticStyleCombined
      title: 'Combined Dendrogram + Heatmap (Usubutun Style)'
      type: Image
      width: 1000
      height: 1000
      renderFun: .diagnosticStyleCombined
      visible: (readerWorkflow:off && (performClustering))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
    - name: raterFrequencyTables
      title: 'Individual Rater Frequencies'
      type: Group
      visible: (readerWorkflow:off && (sft))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - sft
      items:
        - name: frequencyTable
          title: 'Frequency Distribution'
          type: Table
          clearWith:
            - vars
            - caseID
            - useMetadataRows
            - sft
          columns:
            - name: rater
              title: 'Rater'
              type: text
            - name: category
              title: 'Category'
              type: text
            - name: frequency
              title: 'Frequency'
              type: integer
            - name: percentage
              title: 'Percentage'
              type: number
              format: zto

    - name: crosstabTable
      title: 'Cross-tabulation Matrix'
      type: Table
      visible: (readerWorkflow:off && (sft && length(vars) == 2))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - sft
      columns:
        - name: rater1_category
          title: 'Category'
          type: text
        - name: frequencies
          title: 'Frequencies by Rater 2'
          type: text



    - name: clinicalSummary
      title: Clinical Summary
      type: Html
      visible: (readerWorkflow:off && (showClinicalSummary))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - showClinicalSummary
        - multiraterMethod
        - wght
        - exct
        - fleissCI
        - krippMethod
    - name: reportTemplate
      title: Copy-Ready Report
      type: Html
      visible: (readerWorkflow:off && (showClinicalSummary))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - showClinicalSummary
        - multiraterMethod
        - wght
        - exct
        - fleissCI
        - krippMethod
    - name: aboutAnalysis
      title: About This Analysis
      type: Html
      visible: (readerWorkflow:off && (showAboutAnalysis))

      clearWith:
        - showAboutAnalysis
    - name: assumptions
      title: Assumptions & Caveats
      type: Html
      visible: (readerWorkflow:off && (showAssumptions))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - showAssumptions
    - name: weightedKappaGuide
      title: Weighted Kappa Guide
      type: Html
      visible: (readerWorkflow:off && (showWeightedKappaGuide && wght != 'unweighted'))

      clearWith:
        - showWeightedKappaGuide
        - wght
    - name: statisticalGlossary
      title: Statistical Terms Glossary
      type: Html
      visible: (readerWorkflow:off && (showStatisticalGlossary))











      clearWith:
        - showStatisticalGlossary
    # Enhanced Analysis Results
    - name: gwetACTable
      title: "Gwet's Agreement Coefficients"
      type: Table
      visible: (readerWorkflow:off && (gwetAC))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - gwetAC
      columns:
        - name: coefficient
          title: 'Coefficient'
          type: text
        - name: value
          title: 'Value'
          type: number
          format: zto
        - name: se
          title: 'Standard Error'
          type: number
          format: zto
        - name: ci_lower
          title: 'CI Lower'
          type: number
          format: zto
        - name: ci_upper
          title: 'CI Upper'
          type: number
          format: zto
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: pabakTable
      title: 'PABAK Analysis Results'
      type: Table
      visible: (readerWorkflow:off && (pabak))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - pabak
      columns:
        - name: measure
          title: 'Measure'
          type: text
        - name: value
          title: 'Value'
          type: number
          format: zto
        - name: standard_kappa
          title: 'Standard Kappa'
          type: number
          format: zto
        - name: adjusted_kappa
          title: 'PABAK'
          type: number
          format: zto
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: sampleSizeTable
      title: 'Sample Size Planning Results'
      type: Table
      visible: (readerWorkflow:off && (sampleSizePlanning))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - sampleSizePlanning
        - targetKappa
        - targetPrecision
      columns:
        - name: parameter
          title: 'Raters'
          type: text
        - name: value
          title: 'Required Cases'
          type: text
        - name: recommendation
          title: 'Assumptions'
          type: text

    - name: raterBiasTable
      title: 'Rater Disagreement with Consensus'
      type: Table
      visible: (readerWorkflow:off && (raterBiasAnalysis))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - raterBiasAnalysis
      columns:
        - name: rater
          title: 'Rater'
          type: text
        - name: bias_score
          title: 'Disagreement'
          type: number
          format: zto
        - name: tendency
          title: 'Systematic Tendency'
          type: text
        - name: severity
          title: 'Disagreement Level'
          type: text
        - name: recommendation
          title: 'Recommendation'
          type: text

    - name: agreementTrendTable
      title: 'Agreement Trend Analysis'
      type: Table
      visible: (readerWorkflow:off && (agreementTrendAnalysis))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - agreementTrendAnalysis
        - sequenceVariable
      columns:
        - name: sequence_group
          title: 'Sequence Group'
          type: text
        - name: agreement_percent
          title: 'Agreement %'
          type: number
          format: zto
        - name: kappa
          title: 'Kappa'
          type: number
          format: zto
        - name: trend_direction
          title: 'Trend'
          type: text
        - name: significance
          title: 'Significance'
          type: text

    - name: caseDifficultyTable
      title: 'Case Difficulty Analysis'
      type: Table
      visible: (readerWorkflow:off && (caseDifficultyScoring))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - caseDifficultyScoring
      columns:
        - name: case_id
          title: 'Case ID'
          type: text
        - name: difficulty_score
          title: 'Difficulty (1 - Modal Share)'
          type: number
          format: zto
        - name: disagreement_pattern
          title: 'Disagreement Pattern'
          type: text
        - name: difficulty_level
          title: 'Difficulty Level'
          type: text
        - name: rater_variability
          title: 'Normalized Entropy'
          type: number
          format: zto

    - name: stabilityTable
      title: 'Agreement Stability Analysis'
      type: Table
      visible: (readerWorkflow:off && (agreementStabilityAnalysis))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - agreementStabilityAnalysis
        - bootstrapCIType
        - bootstrapSamples
        - seed
      columns:
        - name: statistic
          title: 'Statistic'
          type: text
        - name: original_value
          title: 'Original Value'
          type: number
          format: zto
        - name: bootstrap_mean
          title: 'Bootstrap Mean'
          type: number
          format: zto
        - name: bootstrap_se
          title: 'Bootstrap SE'
          type: number
          format: zto
        - name: stability_index
          title: 'Stability Index'
          type: number
          format: zto
        - name: interpretation
          title: 'Stability'
          type: text

    - name: trendPlot
      title: 'Agreement Trend Plot'
      type: Image
      width: 700
      height: 500
      renderFun: .trendPlot
      visible: (readerWorkflow:off && (agreementTrendAnalysis))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - agreementTrendAnalysis
        - sequenceVariable
    - name: biasPlot
      title: 'Rater Disagreement with Consensus'
      type: Image
      width: 700
      height: 500
      renderFun: .biasPlot
      visible: (readerWorkflow:off && (raterBiasAnalysis))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - raterBiasAnalysis
    - name: difficultyPlot
      title: 'Case Difficulty Distribution'
      type: Image
      width: 700
      height: 500
      renderFun: .difficultyPlot
      visible: (readerWorkflow:off && (caseDifficultyScoring))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - caseDifficultyScoring
    - name: inlineComments
      title: Statistical Commentary
      type: Html
      visible: (readerWorkflow:off && (showInlineComments))

      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - showInlineComments
        - gwetAC
        - pabak
        - raterBiasAnalysis
        - caseDifficultyScoring
        - agreementStabilityAnalysis
        - agreementTrendAnalysis
        - sampleSizePlanning
    # ========================================================================
    # Clustering Analysis Results (Usubutun et al. 2012)
    # ========================================================================

    - name: styleGroupSummary
      title: 'Diagnostic Style Groups Summary'
      type: Table
      visible: (readerWorkflow:off && (performClustering))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
      columns:
        - name: style_group
          title: 'Style Group'
          type: text
        - name: n_raters
          title: 'Number of Raters'
          type: integer
        - name: rater_names
          title: 'Raters'
          type: text
        - name: within_agreement
          title: 'Within-Group Agreement %'
          type: number
          format: zto
        - name: between_agreement
          title: 'Between-Group Agreement %'
          type: number
          format: zto
        - name: silhouette_score
          title: 'Silhouette Score'
          type: number
          format: zto
        - name: interpretation
          title: 'Style Interpretation'
          type: text

    - name: styleGroupProfiles
      title: 'Diagnostic Patterns by Style Group'
      type: Table
      visible: (readerWorkflow:off && (performClustering))
      clearWith:
        - vars
        - caseID
        - useMetadataRows
        - performClustering
        - clusteringMethod
        - styleDistanceMetric
        - nStyleGroups
        - autoSelectGroups
        - referenceStandard
        - identifyDiscordant
        - discordantThreshold
        - raterCharacteristics
      columns:
        - name: style_group
          title: 'Style Group'
          type: text
        - name: category
          title: 'Diagnostic Category'
          type: text
        - name: frequency
          title: 'Frequency'
          type: integer
        - name: percentage
          title: 'Percentage'
          type: number
          format: zto
        - name: relative_frequency
          title: 'Relative to Other Groups'
          type: text

    - name: discordantCasesCluster
      title: 'High-Disagreement Cases Between Style Groups'
      type: Table
