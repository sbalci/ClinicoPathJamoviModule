---
name: jjsegmentedtotalbar
title: Segmented Total Bar Charts
jrs: '1.1'

items:
    - name: instructions
      title: 'Instructions'
      type: Html
      visible: false

    - name: warnings
      title: 'Analysis Notices'
      type: Html
      visible: false
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - analysis_preset
        - exclude_missing
        - y_is_count
        - show_statistical_tests
        - fisher_exact
        - confidence_level

    - name: plot
      title: Segmented Total Bar Chart
      type: Image
      width: 650
      height: 450
      visible: (show_plot)
      requiresData: false
      renderFun: .plot
      clearWith:
        # analysis_preset now fills in palette/style/percentage controls the user
        # has left at their defaults, so the plot must be redrawn when it changes.
        - analysis_preset
        - show_plot
        - x_var
        - y_var
        - fill_var
        - facet_var
        - y_is_count
        - exclude_missing
        - plot_type
        - chart_style
        - color_palette
        - orientation
        - sort_categories
        - bar_width
        - plot_width
        - plot_height
        - plot_title
        - x_title
        - y_title
        - legend_title
        - legend_position
        - show_percentages
        - percentage_format
        - show_counts
        - label_threshold
        - add_outline
        - outline_color
        - export_ready
        - flerlage_show_labels
        - flerlage_label_size
        - flerlage_label_color
        - flerlage_alpha
        - flerlage_box_color

    - name: summary
      title: 'Chart Summary'
      type: Table
      rows: 1
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - plot_type
        - y_is_count
        - exclude_missing
      columns:
        - name: categories
          title: 'Categories'
          type: integer
        - name: segments
          title: 'Segments'
          type: integer
        - name: rows_analysed
          title: 'Rows Analyzed'
          type: integer
        - name: total_observations
          title: 'Summed Value'
          type: number
        - name: chart_type
          title: 'Chart Type'
          type: text

    - name: composition_table
      title: 'Composition Analysis'
      type: Table
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - sort_categories
        - y_is_count
        - exclude_missing
      columns:
        - name: category
          title: 'Category'
          type: text
        - name: segment
          title: 'Segment'
          type: text
        - name: count
          title: 'Count'
          type: number
        - name: percentage
          title: 'Group Percentage'
          type: number
          format: pc
        - name: overall_percentage
          title: 'Overall Percentage'
          type: number
          format: pc
        - name: total_in_category
          title: 'Category Total'
          type: number

    - name: detailed_stats
      title: 'Detailed Statistics'
      type: Table
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - sort_categories
        - y_is_count
        - exclude_missing
      columns:
        - name: measure
          title: 'Measure'
          type: text
        - name: value
          title: 'Value'
          type: text

    - name: interpretation
      title: 'Chart Interpretation'
      type: Html
      visible: (showInterpretation)
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - sort_categories
        - y_is_count
        - exclude_missing
        - showInterpretation

    - name: clinical_summary
      title: 'Clinical Summary'
      type: Html
      visible: (showSummary)
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - sort_categories
        - y_is_count
        - exclude_missing
        - showSummary

    - name: statistical_tests
      title: 'Statistical Tests'
      type: Table
      visible: (show_statistical_tests)
      clearWith:
        - x_var
        - y_var
        - fill_var
        - facet_var
        - analysis_preset
        - show_statistical_tests
        - fisher_exact
        # the affirmation gates whether the test runs at all
        - y_is_count
        # the significance verdict is written against 1 - confidence_level, so the
        # table has to be rebuilt when that changes
        - confidence_level
        - exclude_missing
      columns:
        - name: test_name
          title: 'Test'
          type: text
        - name: statistic
          title: 'Statistic'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p_value
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: cramers_v
          title: "Cramer's V"
          type: number
          format: zto
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: preset_guidance
      title: 'Template Guidance'
      type: Html
      visible: (analysis_preset:treatment_response || analysis_preset:demographics || analysis_preset:biomarker || analysis_preset:quality || analysis_preset:temporal)
      clearWith:
        - analysis_preset

    - name: explanations
      title: 'Explanations'
      type: Html
      visible: (showExplanations)
      clearWith:
        - showExplanations

refs:
    - ClinicoPathJamoviModule
    - ggsegmentedtotalbar
...
