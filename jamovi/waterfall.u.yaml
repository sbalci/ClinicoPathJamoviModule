title: 'Treatment Response: Patient-Level Burden'
name: waterfall
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Patient ID
        children:
          - type: VariablesListBox
            name: patientID
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Response measurement
        children:
          - type: VariablesListBox
            name: responseVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Time variable (if used)
        children:
          - type: VariablesListBox
            name: timeVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Group variable
        children:
          - type: VariablesListBox
            name: groupVar
            maxItemCount: 1
            isTarget: true
            events:
              change: './waterfall.events::onChange_groupVar'
      - type: TargetLayoutBox
        label: Confirmation status (optional)
        children:
          - type: VariablesListBox
            name: confirmationVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Ongoing status (optional)
        children:
          - type: VariablesListBox
            name: ongoingVar
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Category override (optional)
        children:
          - type: VariablesListBox
            name: responseCategoryVar
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Input Settings
        children:
          - type: ComboBox
            name: inputType
            label: Input type
            events:
              change: './waterfall.events::onChange_inputType'
          - type: ComboBox
            name: measurementUnit
            label: Raw measurement unit
            enable: (inputType:raw)
          - type: ComboBox
            name: timeUnitLabel
            label: Time unit
      - type: CheckBox
        name: enableGuidedMode
      - type: CheckBox
        name: showExplanations
  - type: CollapseBox
    label: Waterfall Plot Options
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showWaterfallPlot
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Annotation tracks
            children:
              - type: VariablesListBox
                name: annotationVars
                isTarget: true
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Visualization
            children:
              - type: ComboBox
                name: sortBy
                enable: (showWaterfallPlot)
              - type: ComboBox
                name: sortDirection
                enable: (showWaterfallPlot)
              - type: ComboBox
                name: colorBy
                enable: (showWaterfallPlot)
                events:
                  change: './waterfall.events::onChange_colorBy'
              - type: ComboBox
                name: colorScheme
                enable: (showWaterfallPlot)
          - type: Label
            label: Annotations
            children:
              - type: CheckBox
                name: showCategoryLabels
                enable: (showWaterfallPlot)
              - type: CheckBox
                name: showThresholds
                enable: (showWaterfallPlot || showSpiderPlot)
              - type: CheckBox
                name: labelOutliers
                enable: (showWaterfallPlot)
              - type: CheckBox
                name: showMedian
                enable: (showWaterfallPlot)
              - type: CheckBox
                name: showCI
                enable: (showWaterfallPlot)
              - type: TextBox
                name: seed
                format: number
                label: Random seed
                enable: (showCI)
              - type: CheckBox
                name: showBaseline
                enable: (showWaterfallPlot)
          - type: Label
            label: Plot Customization
            children:
              - type: TextBox
                name: minResponseForLabel
                format: number
                enable: (showWaterfallPlot)
              - type: TextBox
                name: barAlpha
                format: number
                enable: (showWaterfallPlot)
              - type: TextBox
                name: barWidth
                format: number
                enable: (showWaterfallPlot)
          - type: LayoutBox
            margin: large
            children:
              - type: Label
                label: Update Data
                children:
                  # No enable gate: the export runs regardless of whether the
                  # waterfall plot is shown, so a gate here would lie.
                  - type: Output
                    name: addResponseCategory
  - type: CollapseBox
    label: Spider Plot Options
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showSpiderPlot
      - type: LayoutBox
        margin: large
        children:
          - type: Label
            label: Spider Plot Visualization
            children:
              - type: CheckBox
                name: showSpiderLabels
                enable: (showSpiderPlot)
              - type: ComboBox
                name: spiderColorBy
                enable: (showSpiderPlot)
              - type: ComboBox
                name: spiderColorScheme
                enable: (showSpiderPlot)
  - type: CollapseBox
    label: Clinical Reporting Options
    collapsed: false
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showClinicalSummary
          - type: CheckBox
            name: showAboutAnalysis
          - type: CheckBox
            name: generateCopyReadyReport
          - type: CheckBox
            name: showClinicalSignificance
          - type: CheckBox
            name: showConfidenceIntervals
          - type: CheckBox
            name: showResponseDuration
