---
name: checkdata
title: Single Variable Quality Check
jrs: '1.1'

items:
    - name: notices
      title: Important Information
      type: Html
      clearWith:
        - var
        - showOutliers
        - outlierTransform
        - clinicalValidation
        - cvMinMean

    - name: todo
      title: Getting Started
      type: Html

    - name: qualityText
      title: Quality Assessment Summary
      type: Preformatted
      clearWith:
        - var
        - showOutliers
        - outlierTransform
        - showDistribution
        - showPatterns
        - mcarTest
        - clinicalValidation
        - cvMinMean

    - name: missingVals
      title: Missing Data Analysis
      type: Table
      clearWith:
        - var
      rows: 0
      columns:
        - name: metric
          title: "Metric"
          type: text
        - name: value
          title: "Value"
          type: text
        - name: interpretation
          title: "Interpretation"
          type: text

    - name: noOutliers
      title: "Outlier Detection (Consensus: >=2 methods)"
      type: Html
      visible: (showOutliers)
      clearWith:
        - var
        - showOutliers
        - outlierTransform

    - name: outliers
      title: "Outlier Detection (Consensus: >=2 methods)"
      type: Table
      description: "Shows outliers detected by at least 2 of the methods that ran: Z-score (|z|>3), IQR (1.5x IQR rule), Modified Z-score (MAD-based |z|>3.5, unavailable when there are 3 or fewer complete values or the MAD is zero). Points flagged by only 1 method are not shown, except below n = 10 where single-method flags are shown, labelled informative-only in the table title and excluded from the quality grade."
      visible: (showOutliers)
      clearWith:
        - var
        - showOutliers
        - outlierTransform
      rows: 0
      columns:
        - name: rowNumber
          title: "Row"
          type: integer
        - name: value
          title: "Value"
          type: number
        - name: zscore
          title: "Z-Score"
          type: number
        - name: zscoreFlag
          title: "Z-score"
          type: text
        - name: iqrFlag
          title: "IQR"
          type: text
        - name: madFlag
          title: "MAD"
          type: text
        - name: severity
          title: "Severity"
          type: text

    - name: outlierMethodSummary
      title: "Outlier Detection Method Summary (Heuristic)"
      type: Table
      description: "Summary of each outlier detection method. These are heuristic approaches; consider skewness and sample size when interpreting."
      visible: (showOutliers)
      clearWith:
        - var
        - showOutliers
        - outlierTransform
      rows: 0
      columns:
        - name: method
          title: "Method"
          type: text
        - name: threshold
          title: "Threshold"
          type: text
        - name: outliers_detected
          title: "Outliers Found"
          type: integer
        - name: note
          title: "Note"
          type: text

    - name: distribution
      title: Distribution Analysis
      type: Table
      visible: (showDistribution)
      clearWith:
        - var
        - showDistribution
        - cvMinMean
        - rareCategoryThreshold
      rows: 0
      columns:
        - name: metric
          title: "Metric"
          type: text  
        - name: value
          title: "Value"
          type: number
        - name: interpretation
          title: "Interpretation"
          type: text

    - name: duplicates
      title: Duplicate Values
      type: Table
      visible: (showDuplicates)
      clearWith:
        - var
        - showDuplicates
      rows: 0
      columns:
        - name: value
          title: "Value"  
          type: text
        - name: count
          title: "Count"
          type: integer
        - name: percentage
          title: "% of Data"
          type: number

    - name: patterns
      title: Data Patterns
      type: Table
      visible: (showPatterns)
      clearWith:
        - var
        - showPatterns
        - rareCategoryThreshold
        - mcarTest
        - clinicalValidation
      rows: 0
      columns:
        - name: pattern
          title: "Pattern"
          type: text
        - name: description
          title: "Description"
          type: text
        - name: recommendation
          title: "Recommendation"
          type: text

    - name: naturalSummary
      title: Natural-Language Summary
      type: Html
      visible: (showSummary)
      clearWith:
        - var
        - showOutliers
        - outlierTransform
        - clinicalValidation

    - name: aboutAnalysis
      title: About This Analysis
      type: Html
      visible: (showAbout)
      clearWith:
        - var

    - name: caveatsAssumptions
      title: Caveats & Assumptions
      type: Html
      visible: (showCaveats)
      clearWith:
        - var

refs:
    - ClinicoPathJamoviModule
    - leys2013
    - tukey1977
    - waldwolfowitz1940
    - wilson1927

...
