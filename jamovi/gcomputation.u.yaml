title: G-computation (Parametric G-formula)
name: gcomputation
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Treatment
        children:
          - type: VariablesListBox
            name: treatment
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates (confounders)
        children:
          - type: VariablesListBox
            name: covariates
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: outcomeType
      - type: LevelSelector
        name: outcomeEvent
        label: Outcome Event Level
      - type: LevelSelector
        name: treatmentLevel
        label: Treated Level
      - type: CheckBox
        name: interactions
  - type: CollapseBox
    label: Bootstrap
    collapsed: false
    stretchFactor: 0
    children:
      - type: TextBox
        name: bootstrap_n
        format: number
      - type: TextBox
        name: conf_level
        format: number
  - type: CollapseBox
    label: Output Options
    collapsed: false
    stretchFactor: 0
    children:
      - type: CheckBox
        name: showCounterfactual
      - type: CheckBox
        name: showPlot
      - type: CheckBox
        name: showSummary
      - type: CheckBox
        name: showExplanation
