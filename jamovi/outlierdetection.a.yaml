---
name: outlierdetection
title: Outlier Detection
menuGroup: Exploration
menuSubgroup: ClinicoPath Data Quality
version: '1.0.6'
jas: '1.2'

description:
  main: |
    Outlier detection using multiple statistical methods from the easystats performance package.
    This module provides comprehensive outlier detection through univariate methods (Z-scores, IQR, confidence intervals),
    multivariate methods (Mahalanobis distance, MCD, OPTICS, LOF), and composite scoring across multiple algorithms.
    Complements existing data quality assessment modules with state-of-the-art outlier detection capabilities.
    Perfect for clinical research data quality control and preprocessing.
  # R:
  #   dontrun: true
  #   usage: |
  #     # Example:
  #     # 1. Select variables for outlier detection analysis.
  #     # 2. Choose detection methods (univariate, multivariate, or composite).
  #     # 3. Configure thresholds and visualization options.
  #     # 4. Review outlier results and exclusion recommendations.

options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: vars
      title: Variables for analysis
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      # .run() shows the instructions panel when nothing is selected, so NULL is a
      # supported state; without an explicit default the compiler makes `vars` a
      # REQUIRED argument of the public wrapper.
      default: NULL
      description:
          R: >
            Continuous variables to analyze for outliers. The module will detect outliers
            based on the selected variables using the chosen detection methods.

    - name: method_category
      title: Detection method category
      type: List
      options:
        - title: "Univariate methods"
          name: univariate
        - title: "Multivariate methods"
          name: multivariate
        - title: "Composite (multiple methods)"
          name: composite
        - title: "All methods"
          name: all
      default: composite
      description:
          R: >
            Category of outlier detection methods to use. CLINICAL GUIDANCE: Univariate methods
            analyze each variable separately (ideal for lab values, vital signs). Multivariate
            methods consider relationships between variables (useful for correlated biomarkers).
            Composite combines multiple approaches for robust detection (recommended for most
            clinical data). Examples: Use univariate for hemoglobin levels, multivariate for
            complete blood count panels.

    - name: univariate_methods
      title: Univariate method
      type: List
      options:
        - title: "Robust Z-score (MAD-based)"
          name: zscore_robust
        - title: "Standard Z-score"
          name: zscore
        - title: "Interquartile range (IQR)"
          name: iqr
        - title: "Equal-tailed interval"
          name: eti
        - title: "Highest density interval"
          name: hdi
      default: zscore_robust
      description:
          R: >
            Specific univariate method for outlier detection when univariate category is selected.

    - name: multivariate_methods
      title: Multivariate method
      type: List
      options:
        - title: "Mahalanobis distance"
          name: mahalanobis
        - title: "Robust Mahalanobis distance"
          name: mahalanobis_robust
        - title: "Minimum covariance determinant (MCD)"
          name: mcd
        - title: "OPTICS clustering"
          name: optics
        - title: "Local outlier factor (LOF)"
          name: lof
      default: mahalanobis
      description:
          R: >
            Specific multivariate method for outlier detection when multivariate category is selected.
            NOTE: "mahalanobis_robust" is computed through the bigutilsr package; where bigutilsr
            is not available the analysis says so and that choice produces no result. "mcd" gives a
            robust multivariate distance through robustbase, which ships with the module.

    - name: composite_threshold
      title: Composite score threshold
      type: Number
      min: 0.1
      max: 1.0
      default: 0.5
      description:
          R: >
            Threshold for composite outlier score (0.1-1.0). Default 0.5 means observations 
            classified as outliers by at least half of the methods are considered outliers.
            Applies to the composite and all-methods categories.

    - name: zscore_threshold
      title: Z-score threshold
      type: Number
      min: 1.0
      max: 5.0
      default: 3.29
      description:
          R: >
            Threshold for Z-score based methods. CLINICAL EXAMPLES: 3.0 = 99.7 percent confidence
            (standard screening for most lab values), 3.29 = 99.9 percent confidence (stringent,
            for critical values like cardiac enzymes), 2.5 = 98.8 percent confidence (sensitive
            detection for research). Recommended: 3.29 for clinical quality control.
            Applies to the univariate Z-score methods and to the Z-score component of the
            composite and all-methods categories.

    - name: iqr_multiplier
      title: IQR multiplier
      type: Number
      min: 1.0
      max: 3.0
      default: 1.7
      description:
          R: >
            Multiplier for IQR-based outlier detection. CLINICAL EXAMPLES: 1.5 = Tukey's
            standard (sensitive, may flag ~0.7 percent of normal data), 1.7 = conservative
            (recommended for clinical screening), 2.0 = very conservative (for critical
            biomarkers). Useful for non-normal distributions common in clinical data.
            Applies to the univariate IQR method and to the IQR component of the composite
            and all-methods categories.

    - name: confidence_level
      title: Confidence level for intervals
      type: Number
      min: 0.90
      max: 0.999
      default: 0.999
      description:
          R: >
            Confidence level for interval-based methods (ETI, HDI). Default 99.9 percent identifies
            the most extreme observations. The highest density interval needs at least
            1 / (1 - level) observations to be estimable, so the 0.999 default requires at least
            1000 complete cases; below that, lower the level or use the equal-tailed interval.
            Does not apply to the composite category, which uses no interval method.

    - name: show_outlier_table
      title: Outlier summary table
      type: Bool
      default: true
      description:
          R: >
            Display a comprehensive table of outlier detection results including
            outlier scores, distances, and classification for each observation.

    - name: show_method_comparison
      title: Method comparison
      type: Bool
      default: false
      description:
          R: >
            Compare results across different detection methods when using composite approach.

    - name: show_exclusion_summary
      title: Exclusion recommendations
      type: Bool
      default: false
      description:
          R: >
            Provide summary of observations recommended for exclusion and impact analysis.

    - name: show_visualization
      title: Outlier visualization
      type: Bool
      default: false
      description:
          R: >
            Generate plots showing outlier detection results and distribution of outlier scores.

    - name: show_interpretation
      title: Analysis interpretation
      type: Bool
      default: false
      description:
          R: >
            Display detailed interpretation of outlier detection results and methodological notes.

    # The subsample threshold and size were hard-coded at 10000 and 5000, so a
    # user who needed a complete outlier list on a large file had no way to get
    # one. Both are exposed now; the defaults reproduce the previous behaviour.
    # Sampling costs more here than for most statistics: a random subset can only
    # reveal the outliers it happens to contain.
    - name: sampleThreshold
      title: 'Subsample above (rows)'
      type: Integer
      default: 10000
      min: 1000
      max: 1000000
      description:
          R: >
            Row count above which a random subsample is analysed instead of the full
            dataset. Datasets at or below this size are always analysed in full. Raise
            it to analyse a large dataset completely at the cost of speed.

    - name: sampleSize
      title: 'Rows to analyse when subsampling'
      type: Integer
      default: 5000
      min: 100
      max: 1000000
      description:
          R: >
            Number of rows retained when subsampling. Outliers among the rows that are
            not sampled cannot be detected, so the reported count is a lower bound;
            larger values recover more of them at the cost of speed.

    - name: seed
      title: Random seed
      type: Integer
      default: 123
      description:
          R: >
            Random seed used for the reproducible random subsample that is drawn when
            the dataset exceeds the subsampling threshold. Change this value to draw a
            different sample; the default of 123 reproduces the previous fixed behaviour.
