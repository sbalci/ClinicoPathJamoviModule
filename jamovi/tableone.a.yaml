---
name: tableone
title: "Table One"
menuGroup: Exploration
menuSubgroup: "ClinicoPath Descriptives"
version: '1.0.9'
jas: '1.2'

description:
  main: >
    Generate an overall-cohort descriptive Table One for clinicopathological research.
    Four output styles are available. This analysis does not stratify by group or
    compute p-values, confidence intervals or standardized mean differences.
    Each row is treated as one case; check for repeated records before interpreting counts as patients.
  R:
    dontrun: true
    usage: |
      data(histopathology)

      # Standard Table One: mean (SD) for the numeric Age,
      # N (percent) for the categorical Sex and Grade_Level
      tableone(
        data = histopathology,
        vars = vars(Sex, Grade_Level, Age),
        sty = "t1")

      # Right-skewed measurements such as follow-up time are better
      # summarised as median (Q1, Q3)
      tableone(
        data = histopathology,
        vars = vars(Sex, Grade_Level, OverallTime),
        sty = "t1",
        nonnormal = TRUE)
      
options:
  - name: data
    type: Data
    description:
      R: >
        The input data as a data frame with scalar columns. Selected matrix, array and list columns are rejected before data selection. Frequency weights, when supplied by jamovi, represent replicated rows rather than unique patients or a complex survey design.
      jamovi: >
        The dataset for analysis.
        
  - name: vars
    title: "Variables"
    type: Variables
    # The backend has a dedicated "no variables selected" branch that shows the
    # welcome panel, so NULL is a supported state. Without an explicit
    # `default: NULL` the compiler makes `vars` a REQUIRED argument of the public
    # wrapper, and an R caller writing tableone(data = df) gets
    # `argument "vars" is missing, with no default` instead of that panel. The
    # GUI is unaffected either way (it never calls the wrapper positionally).
    default: NULL
    description:
      R: >
        A set of variable names from `data` to include in the Table One. Supports numeric and integer measurements, factors (including ordered factors), character and logical variables. Date, date-time, duration and other custom storage classes are omitted with an explanation before missing-value exclusion. Convert these to explicitly defined numeric measurements or factors first. An empty selection displays instructions.
        Actual NA factor levels are normalized to missing values before exclusion and tabulation; literal text categories such as NA or Unknown remain unchanged.
      jamovi: >
        Select numeric, ordinal, categorical, text or logical variables. Unsupported storage types and all-missing variables are omitted before missing-value exclusion.
        
  - name: sty
    title: "Table style"
    type: List
    options:
      - title: "tableone (Standard medical format)"
        name: t1
      - title: "gtsummary (Publication-ready descriptives)"
        name: t2
      - title: "arsenal (Comprehensive descriptive table)"
        name: t3
      - title: "janitor (Simple frequency tables)"
        name: t4
    default: t1
    description:
      R: >
        Specify the descriptive table style. 'tableone' reports mean (SD), or median (Q1, Q3) when nonnormal is TRUE, and categorical N (percent); only the second level of binary factors is displayed. 'gtsummary' reports median (Q1, Q3) for continuous variables and may treat numeric variables with fewer than 10 distinct values as categorical. 'arsenal' reports mean (SD) and range. 'janitor' tabulates factors, characters and logicals with at most 20 recorded categories; numeric measurements are skipped. Convert numeric category codes with factor() before using janitor. Omitted variables do not enter listwise exclusion or supplementary summaries.
        Dichotomous gtsummary rows explicitly name the counted level. Janitor does not display unused factor levels.
      jamovi: >
        Choose the descriptive format. 'tableone' shows mean (SD), or median (Q1, Q3) when requested; 'gtsummary' shows median (Q1, Q3); 'arsenal' shows mean (SD) and range. 'janitor' tabulates categorical variables with at most 20 recorded categories and skips numeric measurements. Set numeric category codes to Nominal or Ordinal first.
        Unused factor levels are hidden in janitor; dichotomous gtsummary labels name the counted level.
        
  - name: excl
    title: "Missing-value exclusion (NA)"
    type: Bool
    default: false
    description:
      R: >
        Exclude every case missing any variable included in the selected table style (listwise deletion). All retained variables then use the same complete-case denominator. All-missing and otherwise omitted variables do not cause case exclusion. No imputation is performed.
      jamovi: >
        Exclude cases missing any included variable. This is listwise deletion, not imputation; all retained variables use the same complete-case denominator.

  - name: showSummary
    title: "Analysis summary"
    type: Bool
    default: false
    description:
      R: >
        Show detailed summary including sample size, missing data patterns, and data quality metrics.
      jamovi: >
        Display analysis summary with sample size and missing data information.

  - name: showAbout
    title: "About this analysis"
    type: Bool
    default: false
    description:
      R: >
        Show educational content explaining Table One, when to use it, and how to interpret results.
      jamovi: >
        Display educational information about Table One analysis.

  - name: showReportSentence
    title: "Copy-ready report text"
    type: Bool
    default: false
    description:
      R: >
        Generate a copy-ready sentence summarizing the table for manuscript reporting.
      jamovi: >
        Display ready-to-copy text for your manuscript.

  # Declared last on purpose: the generated wrapper takes its argument order from
  # this list, so inserting a new option higher up would silently change the
  # meaning of any existing positional tableone(df, vars, "t1", TRUE) call.
  - name: nonnormal
    title: "Report continuous variables as median (Q1, Q3)"
    type: Bool
    default: false
    description:
      R: >
        Applies only to the 'tableone' style. When TRUE, continuous variables are summarised as median (Q1, Q3) instead of mean (SD), which is the appropriate summary for right-skewed measurements such as Ki-67 index, tumour size or marker concentrations. Categorical variables are unaffected.
      jamovi: >
        Summarise continuous variables as median (Q1, Q3) rather than mean (SD). Use for skewed measurements. Applies to the 'tableone' style only.
...
