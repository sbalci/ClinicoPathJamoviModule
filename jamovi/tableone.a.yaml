---
name: tableone
title: "Table One"
menuGroup: Exploration
menuSubgroup: "ClinicoPath Descriptives"
version: '1.0.6'
jas: '1.2'

description:
  main: >
    This function generates a "Table One", a descriptive summary table frequently used in 
    clinicopathological research manuscripts. It supports multiple output styles for flexible formatting.
  R:
    dontrun: true
    usage: |
      data(histopathology)

      # Standard Table One: mean (SD) for the numeric Age,
      # N (percent) for the categorical Sex and Grade_Level
      tableone(
        data = histopathology,
        vars = vars(Sex, Grade_Level, Age),
        sty = "t1")

      # Right-skewed measurements such as follow-up time are better
      # summarised as median (Q1, Q3)
      tableone(
        data = histopathology,
        vars = vars(Sex, Grade_Level, OverallTime),
        sty = "t1",
        nonnormal = TRUE)
      
options:
  - name: data
    type: Data
    description:
      R: >
        The input data as a data frame.
      jamovi: >
        The dataset for analysis.
        
  - name: vars
    title: "Variables"
    type: Variables
    # The backend has a dedicated "no variables selected" branch that shows the
    # welcome panel, so NULL is a supported state. Without an explicit
    # `default: NULL` the compiler makes `vars` a REQUIRED argument of the public
    # wrapper, and an R caller writing tableone(data = df) gets
    # `argument "vars" is missing, with no default` instead of that panel. The
    # GUI is unaffected either way (it never calls the wrapper positionally).
    default: NULL
    description:
      R: >
        A set of variable names from `data` to include in the Table One. Supports numeric, ordinal, and categorical variables.
      jamovi: >
        Select the variables to include in the table.
        
  - name: sty
    title: "Table style"
    type: List
    options:
      - title: "tableone (Standard medical format)"
        name: t1
      - title: "gtsummary (Publication-ready descriptives)"
        name: t2
      - title: "arsenal (Comprehensive descriptive table)"
        name: t3
      - title: "janitor (Simple frequency tables)"
        name: t4
    default: t1
    description:
      R: >
        Specify the output style for the descriptive table. 'tableone' reports continuous variables as mean (SD) - or as median (Q1, Q3) when nonnormal is TRUE - and categorical variables as N (percent). 'gtsummary' reports continuous variables as median (Q1, Q3). 'arsenal' reports mean (SD) together with the range. 'janitor' produces one frequency table of counts and percentages per variable, for variables with a limited number of categories.
      jamovi: >
        Choose the descriptive table format. 'tableone' shows mean (SD) for continuous variables - or median (Q1, Q3) if you tick that option - and N (percent) for categories; 'gtsummary' shows median (Q1, Q3) with publication-ready formatting; 'arsenal' shows mean (SD) with the range; 'janitor' shows frequency counts and percentages only.
        
  - name: excl
    title: "Missing-value exclusion (NA)"
    type: Bool
    default: false
    description:
      R: >
        Boolean option to exclude missing values (NA) from the analysis. Note: Exclusion may remove entire cases.
      jamovi: >
        Check to exclude missing values.

  - name: showSummary
    title: "Analysis summary"
    type: Bool
    default: false
    description:
      R: >
        Show detailed summary including sample size, missing data patterns, and data quality metrics.
      jamovi: >
        Display analysis summary with sample size and missing data information.

  - name: showAbout
    title: "About this analysis"
    type: Bool
    default: false
    description:
      R: >
        Show educational content explaining Table One, when to use it, and how to interpret results.
      jamovi: >
        Display educational information about Table One analysis.

  - name: showReportSentence
    title: "Copy-ready report text"
    type: Bool
    default: false
    description:
      R: >
        Generate a copy-ready sentence summarizing the table for manuscript reporting.
      jamovi: >
        Display ready-to-copy text for your manuscript.

  # Declared last on purpose: the generated wrapper takes its argument order from
  # this list, so inserting a new option higher up would silently change the
  # meaning of any existing positional tableone(df, vars, "t1", TRUE) call.
  - name: nonnormal
    title: "Report continuous variables as median (Q1, Q3)"
    type: Bool
    default: false
    description:
      R: >
        Applies only to the 'tableone' style. When TRUE, continuous variables are summarised as median (Q1, Q3) instead of mean (SD), which is the appropriate summary for right-skewed measurements such as Ki-67 index, tumour size or marker concentrations. Categorical variables are unaffected.
      jamovi: >
        Summarise continuous variables as median (Q1, Q3) rather than mean (SD). Use for skewed measurements. Applies to the 'tableone' style only.
...
