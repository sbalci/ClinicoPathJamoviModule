---
name: pathsampling
title: Pathology Sampling Adequacy Analysis
jrs: '1.1'

items:
    - name: notices
      title: Important Information
      type: Preformatted
      clearWith: &pathsamplingInputs
        - analysisContext
        - totalSamples
        - firstDetection
        - positiveCount
        - positiveSamplesList
        - sampleType
        - targetConfidence
        - maxSamples
        - bootstrapIterations
        - showBinomialModel
        - showBootstrap
        - showDetectionCurve
        - showSensitivityCI
        - setSeed
        - seedValue
        - positiveCassettes
        - totalFoci
        - adequacyThreshold
        - maxPositiveSingle
        - showTumorBurden
        - showStageMigration
        - showCorrelation
        - showDistributionPattern
        - distributionThreshold
        - totalPopulation
        - successStates
        - targetDetections
        - showHypergeometric
        - showBetaBinomial
        - totalLymphNodes
        - positiveLymphNodes
        - showLNAnalysis
        - lnrThreshold1
        - lnrThreshold2
        - showEffectSizes
        - showOmentumAnalysis
        - showClinicalSummary
        - showGuidedInstructions
        - showConciseInstructions
        - showEmpiricalCumulative
        - showSpatialClustering
        - showStratifiedAnalysis
        - showPopulationDetection
        - showIncrementalYield
        - fociGapThreshold
        - showMultifocalAnalysis
        - showProbabilityExplanation
        - showKeyResults
        - showRecommendText
        - showInterpretText
        - showReferencesText
        - estimationMethod
        - showHeterogeneityTest
        - showModelFit
        - showObsPred
        - showSampleSizePlanning
        - planningTargetProb
        - planningAssumedQ
        - autoSelectModel
        - autoDetectHeterogeneity

    # === WELCOME & DATA SUMMARY (Always First) ===
    - name: welcome
      title: ''
      type: Html
      clearWith: *pathsamplingInputs
      visible: (is.null(totalSamples) || is.null(firstDetection))

    # === DISPLAY OPTIONS: INSTRUCTIONS ===
    - name: guidedInstructions
      title: Quick Start Checklist
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showGuidedInstructions)

    - name: conciseInstructions
      title: Analysis Overview
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showConciseInstructions)



    - name: dataInfo
      title: Data Summary
      type: Table
      clearWith: *pathsamplingInputs
      columns:
        - name: measure
          title: Measure
          type: text
        - name: value
          title: Value
          type: text





    # === DISPLAY OPTIONS: SPECIFIC TEXT OUTPUTS ===
    - name: probabilityExplanation
      title: Understanding Detection Probabilities
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showProbabilityExplanation)

    - name: keyResults
      title: Key Results Summary
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showKeyResults)

    # === CORE ANALYSES: CLINICAL SUMMARY ===
    - name: clinicalSummary
      title: Descriptive summary
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showClinicalSummary)

    # === CORE ANALYSES: BINOMIAL MODEL ===
    - name: binomialText
      title: Binomial Probability Model
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showBinomialModel)

    - name: binomialTable
      title: Binomial Model Predictions
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showBinomialModel)
      columns:
        - name: nSamples
          title: 'Number of Samples'
          type: integer
        - name: cumProb
          title: 'Detection among observed-positive cases (P(detect by n | eventually detected))'
          type: number
          format: 'pc'
        - name: marginalGain
          title: 'Marginal Gain'
          type: number
          format: 'pc'

    - name: recommendTable
      title: Samples for target detection probability
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showBinomialModel)
      columns:
        - name: confidence
          title: 'Target detection probability'
          type: number
          format: 'pc'
        - name: minSamples
          title: 'Samples to reach target'
          type: integer

    # === CORE ANALYSES: BOOTSTRAP ===
    - name: bootstrapText
      title: Bootstrap Resampling Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showBootstrap)

    - name: bootstrapTable
      title: Bootstrap Detection among observed-positive cases Estimates (Conditional)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showBootstrap)
      columns:
        - name: nSamples
          title: 'Number of Samples'
          type: integer
        - name: meanSens
          title: 'Mean Detection among observed-positive cases (eventually detected)'
          type: number
          format: 'pc'
        - name: ciLower
          title: '95% CI Lower'
          type: number
          format: 'pc'
        - name: ciUpper
          title: '95% CI Upper'
          type: number
          format: 'pc'

    # === CORE ANALYSES: DETECTION CURVE ===
    - name: detectionCurve
      title: Diagnostic Yield Curve
      type: Image
      clearWith: *pathsamplingInputs
      width: 600
      height: 450
      renderFun: .detectionCurve
      visible: (showDetectionCurve)

    # === CORE ANALYSES: SENSITIVITY CI ===
    - name: sensitivityPlot
      title: Detection among observed-positive cases with Confidence Intervals
      type: Image
      clearWith: *pathsamplingInputs
      width: 600
      height: 450
      renderFun: .sensitivityPlot
      visible: (showSensitivityCI && showBootstrap)

    # === MODEL VALIDATION & ENHANCEMENTS ===
    - name: heterogeneityText
      title: Heterogeneity Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showHeterogeneityTest)

    - name: heterogeneityTest
      title: Heterogeneity Test Results
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showHeterogeneityTest)
      columns:
        - name: test
          title: 'Test'
          type: text
        - name: statistic
          title: 'χ² Statistic'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: pValue
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Interpretation'
          type: text

    - name: modelFitText
      title: Model Fit Assessment
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showModelFit)

    - name: modelFitTable
      title: Goodness of Fit Test
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showModelFit)
      columns:
        - name: test
          title: 'Test'
          type: text
        - name: chiSquare
          title: 'χ²'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: pValue
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: fitQuality
          title: 'Model Fit'
          type: text

    - name: obsPredText
      title: Observed vs Predicted Detection
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showObsPred)

    - name: obsPredTable
      title: Observed vs Predicted Comparison
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showObsPred)
      columns:
        - name: nSamples
          title: 'Samples'
          type: integer
        - name: observed
          title: 'Observed'
          type: number
          format: 'pc'
        - name: predicted
          title: 'Predicted'
          type: number
          format: 'pc'
        - name: difference
          title: 'Difference'
          type: number
          format: 'pc'
        - name: assessment
          title: 'Assessment'
          type: text

    # === ENHANCED DETECTION: EMPIRICAL CUMULATIVE ===
    - name: empiricalCumulativeText
      title: Empirical Cumulative Detection Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showEmpiricalCumulative)

    - name: empiricalCumulativeTable
      title: Empirical Detection Rates by Sample Threshold
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showEmpiricalCumulative)
      columns:
        - name: nSamples
          title: 'Samples Examined'
          type: integer
        - name: cumDetection
          title: 'Cumulative Detection'
          type: number
          format: 'pc'
        - name: ciLower
          title: '95% CI Lower'
          type: number
          format: 'pc'
        - name: ciUpper
          title: '95% CI Upper'
          type: number
          format: 'pc'
        - name: incrementalYield
          title: 'Incremental Yield'
          type: number
          format: 'pc'

    - name: empiricalCumulativePlot
      title: Empirical Cumulative Detection Curve
      type: Image
      clearWith: *pathsamplingInputs
      width: 600
      height: 450
      renderFun: .empiricalCumulativePlot
      visible: (showEmpiricalCumulative)

    # === ENHANCED DETECTION: INCREMENTAL YIELD ===
    - name: incrementalYieldText
      title: Incremental Diagnostic Yield Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showIncrementalYield)

    - name: incrementalYieldTable
      title: Marginal Benefit per Additional Sample
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showIncrementalYield)
      columns:
        - name: fromSamples
          title: 'From N Samples'
          type: integer
        - name: toSamples
          title: 'To N+1 Samples'
          type: integer
        - name: incrementalDetection
          title: 'Additional Detection Rate'
          type: number
          format: 'pc'
        - name: casesDetected
          title: 'Additional Cases per 100'
          type: number
        - name: costBenefit
          title: Descriptive yield band
          type: text

    # === ENHANCED DETECTION: POPULATION DETECTION ===
    - name: populationDetectionText
      title: Population-Level Detection Rates
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showPopulationDetection)

    - name: populationDetectionTable
      title: Conditional vs Population Detection
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showPopulationDetection)
      columns:
        - name: nSamples
          title: 'Samples'
          type: integer
        - name: prevalence
          title: Observed-positive fraction
          type: number
          format: 'pc'
        - name: conditional
          title: 'Detection among observed-positive cases (eventually detected)'
          type: number
          format: 'pc'
        - name: population
          title: 'Detection Rate (overall)'
          type: number
          format: 'pc'

    # === SPATIAL & MULTIFOCAL: SPATIAL CLUSTERING ===
    - name: spatialClusteringText
      title: Spatial Clustering Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showSpatialClustering)

    - name: clusteringTable
      title: Spatial Distribution Patterns
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showSpatialClustering)
      columns:
        - name: pattern
          title: 'Pattern'
          type: text
        - name: count
          title: 'Cases'
          type: integer
        - name: percent
          title: 'Percentage'
          type: number
          format: 'pc'
        - name: meanClusterIndex
          title: 'Mean Clustering Index'
          type: number

    # === SPATIAL & MULTIFOCAL: MULTIFOCAL ANALYSIS ===
    - name: multifocalText
      title: Sample-position groups (heuristic)
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showMultifocalAnalysis)

    - name: multifocalTable
      title: Sample-position group counts
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showMultifocalAnalysis)
      columns:
        - name: fociCount
          title: 'Heuristic groups'
          type: text
        - name: cases
          title: 'Cases'
          type: integer
        - name: percent
          title: 'Percentage'
          type: number
          format: 'pc'
        - name: meanFirstDetection
          title: 'Mean First Detection'
          type: number

    # === STRATIFIED ANALYSES: BY SAMPLE TYPE ===
    - name: stratifiedText
      title: Stratified Analysis by Sample Type
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showStratifiedAnalysis)

    - name: prevalenceTable
      title: Observed-positive fraction by sample type
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showStratifiedAnalysis)
      columns:
        - name: sampleType
          title: 'Sample Type'
          type: text
        - name: totalCases
          title: 'Total Cases'
          type: integer
        - name: positiveCases
          title: 'Positive Cases'
          type: integer
        - name: prevalence
          title: Observed-positive fraction
          type: number
          format: 'pc'
        - name: qEstimate
          title: 'q (per-sample prob)'
          type: number

    - name: stratifiedDetectionTable
      title: Detection Probability by Sample Type and Threshold
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showStratifiedAnalysis)
      columns:
        - name: sampleType
          title: 'Sample Type'
          type: text
        - name: nSamples
          title: 'Samples'
          type: integer
        - name: conditionalDetection
          title: 'P(detect by n | eventually detected)'
          type: number
          format: 'pc'
        - name: populationDetection
          title: 'Modelled detected fraction of recorded cases'
          type: number
          format: 'pc'

    # === TUMOR BURDEN & STAGE MIGRATION: TUMOR BURDEN ===
    - name: tumorBurdenText
      title: Tumor Burden Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showTumorBurden)

    - name: tumorBurdenInfo
      title: Cassette Positivity Statistics
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showTumorBurden)
      columns:
        - name: measure
          title: Measure
          type: text
        - name: value
          title: Value
          type: text

    - name: cassetteDistribution
      title: Tumor Distribution Pattern
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showTumorBurden)
      columns:
        - name: pattern
          title: Pattern
          type: text
        - name: count
          title: Cases
          type: integer
        - name: percent
          title: Percentage
          type: number
          format: 'pc'

    # === TUMOR BURDEN & STAGE MIGRATION: STAGE MIGRATION ===
    - name: stageMigrationText
      title: Stage Migration Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showStageMigration)

    - name: stageMigrationTable
      title: Detection Rates by Cassette Groups
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showStageMigration)
      columns:
        - name: cassettes
          title: 'Cassettes Examined'
          type: text
        - name: nCases
          title: 'Cases'
          type: integer
        - name: nPositive
          title: 'Positive Cases'
          type: integer
        - name: positivityRate
          title: 'Positivity Rate'
          type: number
          format: 'pc'

    # === TUMOR BURDEN & STAGE MIGRATION: CORRELATION ===
    - name: correlationText
      title: Examined vs Positive Correlation
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showCorrelation)

    - name: correlationStats
      title: Correlation Statistics
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showCorrelation)
      columns:
        - name: statistic
          title: Statistic
          type: text
        - name: value
          title: Value
          type: text

    - name: correlationPlot
      title: Examined vs Positive Cassettes
      type: Image
      clearWith: *pathsamplingInputs
      width: 600
      height: 450
      renderFun: .correlationPlot
      visible: (showCorrelation)

    # === TUMOR BURDEN & STAGE MIGRATION: DISTRIBUTION PATTERN ===
    - name: distributionPatternText
      title: Distribution Pattern Analysis (Single vs Summed)
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showDistributionPattern)
      refs:
        - ates2025

    - name: distributionPatternTable
      title: Distribution Pattern Classification
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showDistributionPattern)
      columns:
        - name: pattern
          title: Distribution Pattern
          type: text
        - name: count
          title: Cases
          type: integer
        - name: percent
          title: Percentage
          type: number
          format: 'pc'

    - name: distributionComparisonTable
      title: Single vs Summed Comparison
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showDistributionPattern)
      columns:
        - name: measure
          title: Measure
          type: text
        - name: value
          title: Value
          type: text

    # === SPECIALIZED MODELS: HYPERGEOMETRIC ===
    - name: hypergeometricText
      title: Hypergeometric Probability Model
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showHypergeometric)

    - name: hypergeometricTable
      title: Hypergeometric Model Predictions (Finite Population)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showHypergeometric)
      columns:
        - name: nSamples
          title: 'Number of Samples'
          type: integer
        - name: cumProb
          title: 'P(detect >=k | present in finite population)'
          type: number
          format: 'pc'
        - name: marginalGain
          title: 'Marginal Gain'
          type: number
          format: 'pc'

    - name: hyperRecommendTable
      title: Samples for target detection probability (Hypergeometric)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showHypergeometric)
      columns:
        - name: confidence
          title: 'Target detection probability'
          type: number
          format: 'pc'
        - name: minSamples
          title: 'Samples to reach target'
          type: integer
        - name: expectedYield
          title: 'Expected Detections'
          type: number

    # === SPECIALIZED MODELS: BETA-BINOMIAL ===
    - name: betaBinomialText
      title: Beta-Binomial Probability Model
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showBetaBinomial)
      refs:
        - VGAM

    - name: betaBinomialTable
      title: Beta-Binomial Model Predictions (Overdispersed)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showBetaBinomial)
      columns:
        - name: nSamples
          title: 'Number of Samples'
          type: integer
        - name: cumProb
          title: 'P(detect >=k | heterogeneous population)'
          type: number
          format: 'pc'
        - name: marginalGain
          title: 'Marginal Gain'
          type: number
          format: 'pc'
      refs:
        - VGAM

    - name: betaBinomialRecommendTable
      title: Samples for target detection probability (Beta-Binomial)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showBetaBinomial)
      columns:
        - name: confidence
          title: 'Target detection probability'
          type: number
          format: 'pc'
        - name: minSamples
          title: 'Samples to reach target'
          type: integer
        - name: expectedYield
          title: 'Expected Detections'
          type: number

    # === POWER ANALYSIS RESULTS ===
    - name: sampleSizePlanningText
      title: Sample Size for a Target Detection Probability
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showSampleSizePlanning)

    - name: sampleSizePlanningTable
      title: Required Samples by Scenario
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showSampleSizePlanning)
      columns:
        - name: scenario
          title: 'Scenario'
          type: text
        - name: planningTargetProb
          title: 'Target cumulative probability'
          type: number
          format: 'pc'
        - name: assumedQ
          title: 'Assumed per-sample probability (q)'
          type: number
          format: 'pc'
        - name: nSamples
          title: 'Required Samples'
          type: integer
        - name: achievedProb
          title: 'Achieved cumulative probability'
          type: number
          format: 'pc'

    # === MULTIFOCAL ANALYSIS RESULTS ===
    - name: multifocalAnalysisText
      title: Independent Positive-sample Count Model
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showMultifocalAnalysis)

    - name: multifocalProbTable
      title: Probability of Multiple Positive Samples
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showMultifocalAnalysis)
      columns:
        - name: nSamples
          title: 'Samples'
          type: integer
        - name: detectOne
          title: 'P(>=1 positive sample)'
          type: number
          format: 'pc'
        - name: detectTwo
          title: 'P(>=2 positive samples)'
          type: number
          format: 'pc'
        - name: detectThree
          title: 'P(>=3 positive samples)'
          type: number
          format: 'pc'

    # === AUTOMATED MODEL SELECTION ===
    - name: modelSelectionText
      title: Model Applicability Guide
      type: Html
      clearWith: *pathsamplingInputs
      visible: (autoSelectModel)

    - name: lnAnalysisText
      title: Lymph Node Ratio and Staging Analysis
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showLNAnalysis)
      refs:
        - tomlinson2007
        - yoon2025

    - name: lnrClassification
      title: Lymph Node Ratio Classification
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showLNAnalysis)
      columns:
        - name: lnrStage
          title: 'LNR Stage'
          type: text
        - name: lnrRange
          title: 'LNR Range'
          type: text
        - name: cases
          title: 'Cases'
          type: integer
        - name: percent
          title: 'Percentage'
          type: number
          format: 'pc'
        - name: medianELN
          title: 'Median ELN'
          type: number
      refs:
        - tomlinson2007
        - yoon2025

    - name: ajccNStage
      title: AJCC N Stage Distribution (8th ed., pancreatic adenocarcinoma)
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showLNAnalysis)
      columns:
        - name: nStage
          title: 'N Stage'
          type: text
        - name: criteria
          title: 'Criteria'
          type: text
        - name: cases
          title: 'Cases'
          type: integer
        - name: percent
          title: 'Percentage'
          type: number
          format: 'pc'
        - name: medianELN
          title: 'Median ELN'
          type: number

    - name: adequacyByELN
      title: Adequacy Assessment by ELN Thresholds
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showLNAnalysis)
      columns:
        - name: elnGroup
          title: 'ELN Group'
          type: text
        - name: cases
          title: 'Cases'
          type: integer
        - name: percent
          title: 'Percentage'
          type: number
          format: 'pc'
        - name: nPositive
          title: 'N+ Cases'
          type: integer
        - name: comment
          title: 'Adequacy Comment'
          type: text

    # === SPECIALIZED MODELS: EFFECT SIZES ===
    - name: effectSizesText
      title: Examined-node Count Summary
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showEffectSizes)
      refs:
        - tomlinson2007
        - yoon2025

    - name: effectSizesTable
      title: Examined-node Count Statistics
      type: Table
      clearWith: *pathsamplingInputs
      visible: (showEffectSizes)
      columns:
        - name: measure
          title: 'Measure'
          type: text
        - name: value
          title: 'Value'
          type: text
        - name: interpretation
          title: 'Interpretation'
          type: text

    # === SPECIALIZED MODELS: OMENTUM ANALYSIS ===
    - name: omentumText
      title: Omentum Sampling Literature
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showOmentumAnalysis)
      refs:
        - maglalang2025
        - malpica2019
        - skala2015

    # === DISPLAY OPTIONS: INTERPRETATION & RECOMMENDATIONS ===
    - name: recommendText
      title: Descriptive sampling targets
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showRecommendText)

    - name: interpretText
      title: Statistical Interpretation
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showInterpretText)

    - name: referencesText
      title: Statistical Methods & References
      type: Html
      clearWith: *pathsamplingInputs
      visible: (showReferencesText)
      refs:
        - gonen2009
        - Buderer1996
        - tomlinson2007
        - yoon2025

refs:
    - ClinicoPathJamoviModule
    - VGAM
    - scales
