# Stratify Variables ----



    - name: use_stratify
      title: Use variable stratification
      type: Bool
      default: false
      description:
        R: >
          If true, uses stratification to handle variables that violate the proportional hazards assumption.
          Stratification creates separate baseline hazard functions for different groups.


    - name: stratvar
      title: Stratification Variables
      type: Variables
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      default: null
      description:
        R: >
          Variables used for stratification. When proportional hazards are not met,
          stratification can adjust the model to better fit the data by allowing different baseline hazards.

  # - type: CollapseBox
  #   label: Stratification Variables
  #   collapsed: true
  #   children:
  #     - type: Label
  #       label: Stratification Variables
  #       children:
  #         - type: CheckBox
  #           name: use_stratify
  #           fitToGrid: true
  #         - type: Label
  #           label: Select Stratification Variables
  #           fitToGrid: true
  #           stretchFactor: 1
  #           children:
  #             - type: VariableSupplier
  #               persistentItems: false
  #               stretchFactor: 1
  #               children:
  #                 - type: TargetLayoutBox
  #                   label: Stratification Variables
  #                   children:
  #                     - type: VariablesListBox
  #                       name: stratvar
  #                       isTarget: true
  #                       fitToGrid: true
  #                       stretchFactor: 1

    - name: person_time
      title: "Calculate person-time metrics"
      type: Bool
      default: false
      description: >-
        Enable this option to calculate and display person-time metrics, including
        total follow-up time and incidence rates. These metrics help quantify the
        rate of events per unit of time in your study population.

    - name: time_intervals
      title: "Time Interval Stratification"
      type: String
      default: '12, 36, 60'
      description: >-
        Specify time intervals for stratified person-time analysis. Enter a 
        comma-separated list of time points to create intervals. For example, 
        "12, 36, 60" will create intervals 0-12, 12-36, 36-60, and 60+.

    - name: rate_multiplier
      title: "Rate Multiplier"
      type: Integer
      default: 100
      min: 1
      description: >-
        Specify the multiplier for incidence rates (for example, 100 for rates
        per 100 person-time units). The person-time unit is the unit selected
        in `timetypeoutput`; choose years there before interpreting a rate as
        events per person-year.

# SurvMetrics - Enhanced Model Performance Metrics ----
# COMMENTED OUT - Corresponding UI elements commented out in multisurvival.u.yaml

    - name: show_survmetrics
      title: "Model performance metrics"
      type: Bool
      default: false
      description:
        R: >
          Report model performance metrics for the Cox model: Harrell's
          concordance (C-index), inverse-probability-of-censoring-weighted (IPCW)
          Brier score and time-dependent AUC at the chosen timepoints, and the
          Integrated Brier Score. Computed with the riskRegression package.

    - name: survmetrics_timepoints
      title: "Timepoints for Brier / AUC"
      type: String
      default: '12, 24, 36, 60'
      description:
        R: >
          Comma-separated timepoints at which to report the Brier score and
          time-dependent AUC. Timepoints beyond the observed follow-up are
          ignored. Should correspond to clinically meaningful follow-up times.

    # survmetrics_ibs_points intentionally not exposed: the Integrated Brier
    # Score is computed by riskRegression over the requested timepoint range,
    # so no separate grid-size option is needed.

    - name: survmetrics_show_plots
      title: "Brier score over time plot"
      type: Bool
      default: false
      description:
        R: >
          Display a plot of the IPCW Brier score across follow-up time.

    - name: showExplanations
      title: "Analysis explanations"
      type: Bool
      default: false
      description: >-
        Display detailed explanations for each analysis component to help
        interpret the statistical methods and results.

    - name: showSummaries
      title: "Natural language summaries"
      type: Bool
      default: true
      description: >-
        Display natural language summaries alongside tables and plots. These
        summaries provide plain-language interpretations of the statistical
        results. Recommended for clinical users. Turn off to reduce visual
        clutter when summaries are not needed.




