---
name: dataquality
title: Multi-Variable Visual Quality
menuGroup: Exploration
menuSubgroup: ClinicoPath Data Quality
version: '1.0.8'
jas: '1.2'

description:
  main: |
    This module provides data quality assessment including duplicate detection,
    missing value analysis, and data completeness summary (similar to sumvar's dup() function).
  R:
    dontrun: false
    usage: |
      data('histopathology', package = 'ClinicoPath')

      dataquality(
          data = histopathology,
          vars = c('Age', 'Sex', 'Grade'),
          check_missing = TRUE,
          check_duplicates = TRUE,
          # NOTE: despite its name this does NOT restrict to complete cases; it
          # switches duplicate detection from value-level to row-level.
          complete_cases_only = TRUE
      )

options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: vars
      title: Variables
      type: Variables
      # .run() shows the welcome panel when nothing is selected, so NULL is a
      # supported state; without an explicit default the compiler makes `vars` a
      # REQUIRED argument of the public wrapper.
      default: NULL
      description:
          R: >
            Variables to assess for data quality. At least one variable must be
            selected; the analysis does not fall back to the whole dataset.

    - name: check_duplicates
      title: "Duplicate values"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, analyzes duplicate values within each variable or across
          the entire dataset.

    - name: check_missing
      title: "Missing value analysis"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, provides detailed missing value statistics and patterns.

    # NOTE (naming): this option does NOT perform any complete-case restriction -
    # the name is historical and misleading. It selects the GRANULARITY of the
    # duplicate check only. Renaming it is a breaking change to the public wrapper
    # signature and to saved .omv files, so it is left for a maintainer decision;
    # the description below states the real behaviour up front.
    - name: complete_cases_only
      title: "Duplicate rows"
      type: Bool
      default: false
      description:
        R: >
          Granularity of the duplicate check; this option does NOT restrict the
          analysis to complete cases despite its name. If TRUE, checks for
          duplicate rows across all selected variables (requires at least two
          variables). If FALSE, checks for duplicate values within each variable
          separately. Has no effect unless check_duplicates is TRUE.

    - name: plot_data_overview
      title: "Data overview plot (vis_dat)"
      type: Bool
      default: false
      description:
        R: >
          Show data overview visualization displaying variable types and missing values.

    - name: plot_missing_patterns
      title: "Missing patterns plot (vis_miss)"
      type: Bool
      default: false
      description:
        R: >
          Show missing value patterns visualization.

    - name: plot_data_types
      title: "Data types plot (vis_guess)"
      type: Bool
      default: false
      description:
        R: >
          Show data type detection and validation visualization.

    # NOTE: vis_expect disabled - requires expectation formula specification
    # - name: plot_value_expectations
    #   title: "Value Expectations Plot (vis_expect)"
    #   type: Bool
    #   default: false
    #   description:
    #     R: >
    #       Show value expectations analysis visualization.

    - name: missing_threshold_visual
      title: "Missing-data highlight threshold (percent)"
      type: Number
      min: 0
      max: 100
      default: 10
      description:
        R: >
          Threshold percentage for highlighting variables with missing values in visual analysis.

    - name: showSummary
      title: "Plain-language summary"
      type: Bool
      default: true
      description:
        R: >
          If TRUE, displays a concise plain-language summary of quality issues and overall assessment.

    - name: showRecommendations
      title: "Action recommendations"
      type: Bool
      default: true
      description:
        R: >
          If TRUE, provides specific recommendations for addressing identified quality issues.

    - name: showExplanations
      title: "Educational explanations"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, includes explanations of quality metrics and statistical tests used in the analysis.


...
