title: Hematologic Prognostic Indices
name: hematologicindices
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Blood Counts (10^9/L)
        children:
          - type: VariablesListBox
            name: neutrophils
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: lymphocytes
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: platelets
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: monocytes
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Biochemistry
        children:
          - type: VariablesListBox
            name: albumin
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: crp
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Survival (optional)
        children:
          - type: VariablesListBox
            name: survivalTime
            maxItemCount: 1
            isTarget: true
          - type: VariablesListBox
            name: survivalStatus
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: albuminUnit
      - type: LevelSelector
        name: eventLevel
        label: Event Level
  - type: LayoutBox
    margin: large
    children:
      - type: Label
        label: Indices
        children:
          - type: CheckBox
            name: indices_nlr
            optionName: indices
            optionPart: nlr
          - type: CheckBox
            name: indices_plr
            optionName: indices
            optionPart: plr
          - type: CheckBox
            name: indices_lmr
            optionName: indices
            optionPart: lmr
          - type: CheckBox
            name: indices_sii
            optionName: indices
            optionPart: sii
          - type: CheckBox
            name: indices_pni
            optionName: indices
            optionPart: pni
          - type: CheckBox
            name: indices_car
            optionName: indices
            optionPart: car
          - type: CheckBox
            name: indices_gps
            optionName: indices
            optionPart: gps
      - type: ComboBox
        name: gpsType
  - type: CollapseBox
    label: Survival Split
    collapsed: false
    stretchFactor: 0
    children:
      - type: CheckBox
        name: showSurvival
      - type: ComboBox
        name: survivalIndex
      - type: ComboBox
        name: splitMethod
  - type: CollapseBox
    label: Output Options
    collapsed: false
    stretchFactor: 0
    children:
      - type: CheckBox
        name: showIndicesTable
      - type: CheckBox
        name: showPlot
      - type: CheckBox
        name: showSummary
      - type: CheckBox
        name: showExplanation
      - type: Output
        name: addIndexToData
