---
name: decisioncombine
title: Combine Medical Decision Tests
jrs: '1.1'

items:
    - name: combinationTable
      title: 'Test Combination Performance'
      type: Table
      rows: 0
      clearWith: &analysisInputs
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
      columns:
        - name: pattern
          title: 'Pattern'
          type: text
        - name: rowType
          title: 'Row type'
          type: text
        - name: tp
          title: 'TP'
          type: integer
        - name: fp
          title: 'FP'
          type: integer
        - name: fn
          title: 'FN'
          type: integer
        - name: tn
          title: 'TN'
          type: integer
        - name: prevalence
          title: 'Prevalence'
          type: number
          format: pc
        - name: sens
          title: 'Sensitivity'
          type: number
          format: pc
        - name: spec
          title: 'Specificity'
          type: number
          format: pc
        - name: ppv
          title: 'PPV'
          type: number
          format: pc
        - name: npv
          title: 'NPV'
          type: number
          format: pc
        - name: acc
          title: 'Accuracy'
          type: number
          format: pc
        - name: balancedAccuracy
          title: 'Balanced Accuracy'
          type: number
          format: pc
        - name: youden
          title: "Youden's J"
          type: number
          format: zto
        - name: lrPos
          title: 'LR+'
          type: number
        - name: lrNeg
          title: 'LR-'
          type: number
        - name: dor
          title: 'Diagnostic OR'
          type: number
      description: "Counts and diagnostic performance metrics for each test combination pattern and clinical strategy, including prevalence, balanced accuracy, Youden's J, likelihood ratios, and diagnostic odds ratios"

    - name: combinationTableCI
      title: 'Proportions with 95% Confidence Intervals'
      type: Table
      rows: 0
      clearWith: *analysisInputs
      columns:
        - name: pattern
          title: 'Pattern'
          type: text
        - name: statistic
          title: 'Statistic'
          type: text
        - name: estimate
          title: 'Estimate'
          type: number
          format: pc
        - name: lower
          title: 'Lower'
          superTitle: '95% CI'
          type: number
          format: pc
        - name: upper
          title: 'Upper'
          superTitle: '95% CI'
          type: number
          format: pc
      description: 'Wilson score 95 percent confidence intervals for sensitivity, specificity, PPV, NPV and accuracy, shown as percentages to match the combination table above. Likelihood ratios and the diagnostic odds ratio are unbounded ratios rather than proportions, so they appear in their own table below.'

    - name: combinationTableCIRatios
      title: 'Likelihood Ratios with 95% Confidence Intervals'
      type: Table
      rows: 0
      clearWith: *analysisInputs
      columns:
        - name: pattern
          title: 'Pattern'
          type: text
        - name: statistic
          title: 'Statistic'
          type: text
        - name: estimate
          title: 'Estimate'
          type: number
        - name: lower
          title: 'Lower'
          superTitle: '95% CI'
          type: number
        - name: upper
          title: 'Upper'
          superTitle: '95% CI'
          type: number
      description: 'Log-scale 95 percent confidence intervals for LR+, LR- and the diagnostic odds ratio. These are ratios on an unbounded scale, so they are reported separately from the proportions above rather than sharing a column with them.'

    - name: goldFreqTable
      title: 'Gold Standard Frequency Distribution'
      type: Table
      rows: 0
      visible: (showFrequency)
      clearWith: *analysisInputs
      columns:
        - name: level
          title: 'Level'
          type: text
        - name: count
          title: 'Count'
          type: integer
        - name: percent
          title: 'Percent'
          type: number
          format: pc
      description: 'Frequency distribution of the gold standard (reference) test showing counts and percentages for each level'

    - name: crossTabTable
      title: 'Test Results Cross-Tabulation'
      type: Table
      rows: 0
      visible: (showFrequency)
      clearWith: *analysisInputs
      columns:
        - name: testCombo
          title: 'Test Pattern'
          type: text
        - name: goldPos
          title: 'Gold Positive'
          type: integer
        - name: goldNeg
          title: 'Gold Negative'
          type: integer
        - name: total
          title: 'Total'
          type: integer
      description: 'Cross-tabulation showing how test combination patterns align with gold standard results'

    - name: individualTest1
      title: 'Test 1 Performance'
      type: Group
      visible: (showIndividual)
      clearWith: *analysisInputs
      items:
        - name: test1Contingency
          title: 'Contingency Table'
          type: Table
          rows: 0
          columns:
            - name: testResult
              title: ''
              type: text
            - name: goldPos
              title: 'Gold Positive'
              type: integer
            - name: goldNeg
              title: 'Gold Negative'
              type: integer
            - name: total
              title: 'Total'
              type: integer
        - name: test1Stats
          title: 'Diagnostic Statistics'
          type: Table
          rows: 0
          columns:
            - name: statistic
              title: 'Statistic'
              type: text
            - name: estimate
              title: 'Estimate'
              type: number
              format: pc

    - name: individualTest2
      title: 'Test 2 Performance'
      type: Group
      visible: (showIndividual)
      clearWith: *analysisInputs
      items:
        - name: test2Contingency
          title: 'Contingency Table'
          type: Table
          rows: 0
          columns:
            - name: testResult
              title: ''
              type: text
            - name: goldPos
              title: 'Gold Positive'
              type: integer
            - name: goldNeg
              title: 'Gold Negative'
              type: integer
            - name: total
              title: 'Total'
              type: integer
        - name: test2Stats
          title: 'Diagnostic Statistics'
          type: Table
          rows: 0
          columns:
            - name: statistic
              title: 'Statistic'
              type: text
            - name: estimate
              title: 'Estimate'
              type: number
              format: pc

    - name: individualTest3
      title: 'Test 3 Performance'
      type: Group
      visible: (showIndividual)
      clearWith: *analysisInputs
      items:
        - name: test3Contingency
          title: 'Contingency Table'
          type: Table
          rows: 0
          columns:
            - name: testResult
              title: ''
              type: text
            - name: goldPos
              title: 'Gold Positive'
              type: integer
            - name: goldNeg
              title: 'Gold Negative'
              type: integer
            - name: total
              title: 'Total'
              type: integer
        - name: test3Stats
          title: 'Diagnostic Statistics'
          type: Table
          rows: 0
          columns:
            - name: statistic
              title: 'Statistic'
              type: text
            - name: estimate
              title: 'Estimate'
              type: number
              format: pc

    - name: barPlot
      title: 'Bar Chart - Performance Comparison'
      type: Image
      width: 800
      height: 500
      visible: (showBarPlot)
      renderFun: .plotBarChart
      clearWith:
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - filterStatistic
        - filterPattern
      description: 'Grouped bar chart comparing sensitivity, specificity, PPV, NPV, and accuracy across test combinations'

    - name: heatmapPlot
      title: 'Heatmap - All Metrics by Pattern'
      type: Image
      width: 900
      height: 600
      visible: (showHeatmap)
      renderFun: .plotHeatmap
      clearWith:
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - filterStatistic
        - filterPattern
      description: 'Color-coded heatmap showing all diagnostic metrics for each test pattern'

    - name: forestPlot
      title: 'Forest Plot - Confidence Intervals'
      type: Image
      width: 800
      height: 600
      visible: (showForest)
      renderFun: .plotForest
      clearWith:
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - filterStatistic
        - filterPattern
      description: 'Forest plot displaying 95 percent confidence intervals for key diagnostic metrics'

    - name: decisionTreePlot
      title: 'Decision Space: Sensitivity vs Specificity'
      type: Image
      width: 900
      height: 700
      visible: (showDecisionTree)
      renderFun: .plotDecisionTree
      # The decision space plots every row at once so patterns can be compared against
      # one another; its axes are fixed to sensitivity and specificity with point size
      # scaled by Youden's J. Neither filter applies: filterStatistic has nowhere to go,
      # and a pattern filter would reduce the scatter to a single point. Listing them
      # here only forced an identical redraw, so they are deliberately omitted.
      clearWith:
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
      description: 'Decision-space scatter plot positioning each test pattern by its sensitivity and specificity, with point size scaled by Youden''s J'

    - name: recommendationTable
      title: 'Descriptive Candidate-Rule Ranking'
      type: Table
      rows: 1
      visible: (showRecommendation)
      clearWith: *analysisInputs
      columns:
        - name: pattern
          title: 'Highest-Ranked Rule'
          type: text
        - name: method
          title: 'Selection Method'
          type: text
        - name: youden
          title: "Youden's J"
          type: number
          format: zto
        - name: sens
          title: 'Sensitivity'
          type: number
          format: pc
        - name: spec
          title: 'Specificity'
          type: number
          format: pc
        - name: acc
          title: 'Accuracy'
          type: number
          format: pc
        - name: rationale
          title: 'Interpretation'
          type: text
      description: 'Sample-dependent descriptive ranking of eligible exact-pattern rules and named testing strategies by observed Youden index; this is not a clinical guide or validated recommendation'

    - name: addedPattern
      title: 'Test Pattern Column'
      type: Output
      varTitle: 'Combined Test Pattern'
      varDescription: 'Positive/negative result pattern across the selected diagnostic tests'
      measureType: nominal
      clearWith:
        - addedPattern
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive

    - name: about
      title: 'About This Analysis'
      type: Html
      visible: (showAbout)
      clearWith: [showAbout]

    - name: assumptions
      title: 'Assumptions and Caveats'
      type: Html
      visible: (showAbout)
      clearWith:
        - showAbout
        - gold
        - goldPositive
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive

    - name: notices
      title: Notices
      type: Html
      visible: true

refs:
    - ClinicoPathJamoviModule
    - DiagnosticTests
    - wilson1927
    - youden1950
    - haldane1956


...
