title: Lowest Expected Value for a fixed sample size
name: kappaSizeFixedN
jus: '3.0'
stage: 0
compilerMode: tame
children:

  - type: LayoutBox
    margin: large
    children:
      - type: LayoutBox
        margin: large
        cell:
          row: 1
          column: 1
        children:
          - type: Label
            label: Number of Outcome Levels
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: outcome
                    label: Outcome levels
                    events:
                      change: ./kappaSizeFixedN.events::onChange_outcome
      - type: LayoutBox
        margin: large
        cell:
          row: 1
          column: 2
        children:
          - type: Label
            label: Number of Raters
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: ComboBox
                    name: raters
                    label: Raters

      - type: LayoutBox
        margin: large
        cell:
          row: 1
          column: 3
        children:
          - type: Label
            label: Number of Subjects
            children:
              - type: LayoutBox
                margin: large
                children:
                  - type: TextBox
                    name: 'n'
                    format: number




  - type: Label
    label: "Anticipated Agreement"
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: kappa0
            label: 'Anticipated kappa (kappa0)'
            format: number



  - type: Label
    label: "Expected Proportion of Cases in Each Category"
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 2
        fitToGrid: true
        children:
          - type: TextBox
            name: props
            label: ''
            format: string
            stretchFactor: 2
            fitToGrid: true



  - type: Label
    label: "Alpha"
    children:
        - type: LayoutBox
          margin: large
          children:
            - type: LayoutBox
              margin: large
              children:
                - type: TextBox
                  name: alpha
                  label: 'Alpha'
                  format: number



