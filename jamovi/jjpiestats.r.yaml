---
name:  jjpiestats
title: Pie Charts
jrs:   '1.1'

clearWith:
    - dep
    - group
    - grvar
    - counts
    - ratio
    - paired
    - typestatistics
    - label
    - digits
    - conflevel
    - proportiontest
    - bfmessage
    - messages
    - originaltheme
    - resultssubtitle
    - clinicalpreset
    - showexplanations
    - showSummary
    - showAssumptions
    - showInterpretation
    - addGGPubrDonut
    - ggpubrDonutPalette

items:

    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
        - dep
        - group
        - grvar
        - counts
        - typestatistics
        - paired

    - name: about
      title: About This Analysis
      type: Html
      visible: true

    - name: summary
      title: Analysis Summary
      type: Html
      visible: (showSummary || showexplanations)

    - name: assumptions
      title: Statistical Assumptions & Warnings
      type: Html
      visible: (showAssumptions || showexplanations)

    - name: interpretation
      title: Results Interpretation
      type: Html
      visible: (showInterpretation || showexplanations)

    - name: report
      title: Copy-Ready Report
      type: Html
      visible: (dep)

    - name:  todo
      title: Analysis Setup
      type:  Html

    - name: plot4
      title: '`${group} - {dep} by {grvar}`'
      type: Image
      width:  800
      height: 300
      renderFun: .plot4
      requiresData: true
      visible: (length(dep) > 0 && length(group) > 0 && length(grvar) > 0)

    - name: plot2
      title: '`${group} - {dep}`'
      type: Image
      width:  400
      height: 300
      renderFun: .plot2
      requiresData: true
      visible: (length(dep) > 0 && length(group) > 0)

    - name: plot1
      title: '`${dep}`'
      type: Image
      width:  400
      height: 300
      renderFun: .plot1
      requiresData: true
      visible: (dep)

    - name: donutPlot
      title: 'Donut Chart'
      type: Image
      width: 500
      height: 400
      renderFun: .plotDonut
      requiresData: true
      visible: (addGGPubrDonut && length(dep) > 0)
      refs:
        - ggpubr


refs:
    - ggplot2
    - ggstatsplot
    - statsExpressions
    - ClinicoPathJamoviModule

...
