---
name:  crosstable
title: Cross Tables
menuGroup: Exploration
menuSubgroup: ClinicoPath Comparisons
version: '1.0.81'
jas: '1.2'

description:
    main: |
        Function for making Cross Tables with multiple table styles.

        Currently implemented features:
        - Multiple table styles (arsenal, finalfit, gtsummary, NEJM, Lancet, hmisc)
        - Test selection (chi-square, Fisher's exact, ANOVA, Kruskal-Wallis; which one
          applies depends on the table style and on whether means or medians are shown)
        - Multiple testing correction (Bonferroni, Holm, Benjamini-Hochberg, Benjamini-Yekutieli)
        - Variable name safety (special characters, spaces)
        - Data quality validation warnings

        Note: Advanced features (pairwise comparisons, effect sizes, residual analysis,
        correspondence analysis) are planned but not yet available.
    R:
        dontrun: true
        usage: |
            # Age and Sex compared across treatment groups
            crosstable(
                data = histopathology,
                vars = vars(Age, Sex),
                group = "Group",
                sty = "gtsummary")

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
    - name: vars
      title: Dependent variables
      type: Variables
      default: NULL
      description: >
            The variable(s) that will appear as rows in the cross table.
    - name: group
      title: Grouping variable
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description: >
            The variable that will appear as columns (groups) in the table.
    - name: sty
      title: Table style
      type: List
      options:
        - title: arsenal
          name: arsenal
        - title: finalfit
          name: finalfit
        - title: gtsummary
          name: gtsummary
        - title: NEJM
          name: nejm
        - title: Lancet
          name: lancet
        - title: hmisc
          name: hmisc
      default: gtsummary
      description:
          R: >
            Table style. "arsenal", "finalfit" and "gtsummary" honour the test and
            statistic options below; "nejm", "lancet" and "hmisc" are tangram layouts
            that apply their own built-in tests. P-value adjustment is available in
            "gtsummary" only.
          jamovi: >
            Layout of the table. arsenal, finalfit and gtsummary apply the test and
            statistic settings below; NEJM, Lancet and hmisc use their own built-in
            tests. P-value adjustment is available with gtsummary only.
    - name: excl
      title: Missing-value exclusion (NA)
      type: Bool
      default: false
      description:
          R: >
            Exclude rows with missing values.
    - name: cont
      title: Mean vs median
      type: List
      options:
        - title: mean
          name: mean
        - title: median
          name: median
      default: mean
      description:
          R: >
            Summary shown for continuous variables. In the arsenal and finalfit styles
            this also selects the test (ANOVA for "mean", Kruskal-Wallis for "median").
            In the gtsummary style it changes the displayed statistic only, because
            gtsummary always tests continuous variables with a rank-based test.
          jamovi: >
            Whether continuous variables are summarised as mean (SD) or median (Q1, Q3).
            In the arsenal and finalfit styles this also selects the test (ANOVA vs
            Kruskal-Wallis); in gtsummary it changes the displayed statistic only.
    - name: pcat
      title: Chi-square vs Fisher's exact test
      type: List
      options:
        - title: chisq
          name: chisq
        - title: fisher
          name: fisher
      default: chisq
      description:
          R: >
            Test used for categorical variables. Applied by the arsenal, finalfit and
            gtsummary styles; the nejm, lancet and hmisc styles use their own built-in
            tests. With "chisq" the gtsummary style still switches to Fisher's exact
            test automatically when an expected cell count falls below 5. On 2x2
            tables "chisq" means Yates' continuity-corrected chi-square in the
            finalfit style and the uncorrected Pearson chi-square in the arsenal and
            gtsummary styles, so those p-values differ between styles.
          jamovi: >
            Test used for categorical variables. Applied by the arsenal, finalfit and
            gtsummary styles only. With chi-square selected, gtsummary still switches to
            Fisher's exact test automatically when an expected cell count falls below 5.
            On 2x2 tables, finalfit applies Yates' continuity correction while arsenal
            and gtsummary report the uncorrected Pearson chi-square.

    - name: p_adjust
      title: P-value adjustment method
      type: List
      options:
        - title: None
          name: none
        - title: Bonferroni
          name: bonferroni
        - title: Holm
          name: holm
        - title: Benjamini-Hochberg (FDR)
          name: BH
        - title: Benjamini-Yekutieli
          name: BY
      default: none
      description: >
            Method for adjusting p-values for multiple comparisons across variables.
            Only available with gtsummary table style.

    - name: showSMD
      title: Standardized mean differences (balance)
      type: Bool
      default: false
      description:
          R: >
            Add a standardized mean difference (SMD) column comparing the groups for each
            variable - the standard balance diagnostic for matched, weighted, or propensity
            cohorts. Requires exactly two groups. |SMD| < 0.1 conventionally indicates
            negligible imbalance.
          jamovi: >
            Show a standardized mean difference (SMD) table quantifying between-group balance
            for each variable (continuous and categorical). Requires a two-level grouping
            variable. |SMD| below 0.1 indicates good balance.

    - name: showSummary
      title: Plain-language summary
      type: Bool
      default: false
      description:
          R: >
            Add a copy-ready paragraph below the table naming the sample size, the groups,
            the tests the chosen style applied and the variables that differed at p < 0.05
            (q < 0.05 when a p-value adjustment is applied in the gtsummary style).
          jamovi: >
            A copy-ready paragraph below the table: sample size, groups, the tests the
            chosen style applied, and which variables differed at p < 0.05.

...
