---
name: enhancedROC
title: Clinical ROC Analysis
menuGroup: meddecide
menuSubgroup: ROC
menuSubtitle: "Clinical ROC analysis with diagnostic metrics and optimal cutoffs"
version: '1.1.2'
jas: '1.2'

description:
    main: >
        Clinical ROC analysis toolkit for comprehensive diagnostic performance
        evaluation. Includes ROC curve analysis, Youden Index optimization,
        sensitivity/specificity analysis, optimal cutoff determination, and
        comparative ROC analysis. Essential for biomarker validation, diagnostic
        test evaluation, and clinical decision support in medical research.
    R:
        dontrun: true
        usage: |
            # pROC::aSAH ships with pROC, an Import, so the example runs in every module that
            # carries this analysis. positiveClass and validationNegative are Level options: always
            # required arguments (validationNegative = NULL unless the frozen-model report is used).
            enhancedROC(
                data = pROC::aSAH,
                outcome = "outcome",
                positiveClass = "Poor",
                validationNegative = NULL,
                predictors = c("s100b", "ndka"))

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: outcome
      title: 'Outcome variable'
      type: Variable
      suggested:
          - nominal
          - ordinal
      permitted:
          - factor
          - numeric
      description: >
          Outcome variable (disease status). A factor with two levels, or with more than two
          (choose one as Positive class and the others are pooled as negative, or use Multi-class
          ROC). A numeric outcome must have exactly two values; 0/1 reads 1 as positive. Each row
          must be a different patient: every interval and test assumes independent rows.

    # allowNone: without it the jamovi client pre-selects levels[0] - usually the NEGATIVE
    # level - and the whole analysis runs reversed. The positive class is never inferred.
    - name: positiveClass
      title: 'Positive class'
      type: Level
      variable: (outcome)
      allowNone: true
      description:
          ui: >
            Choose the outcome level that means the condition is present (for example
            Malignant). Required for a nominal or ordinal outcome: levels are never chosen
            from their order. A numeric outcome coded 0/1 is read as 1 = positive without a
            choice; for any other numeric coding, set the outcome's measure type to Nominal in
            Data > Setup so its values are listed here. Every other level is analyzed as
            negative. The Outcome coding table shows which level was used and how.
          R: >
            Level of outcome treated as the positive class (condition present), matched
            exactly. Pass NULL to leave it unset: a numeric outcome coded 0/1 then reads 1 as
            positive, and any other outcome leaves the analysis waiting for a choice, because
            levels are never chosen from their order. Every other level is analyzed as
            negative (pooled when there are more than two). A numeric outcome must have
            exactly two values; to choose among more, make it a factor.

    - name: predictors
      title: 'Predictor variables'
      type: Variables
      suggested:
          - continuous
      permitted:
          - numeric
      description: >
          Numeric predictor variables for ROC analysis, one value per patient (row).

    - name: analysisType
      title: 'Analysis type'
      type: List
      options:
          - title: 'Single ROC Analysis'
            name: single
          - title: 'Comparative ROC Analysis'
            name: comparative
          - title: 'Comprehensive Diagnostic Performance'
            name: comprehensive
      default: single
      description: >
          Single analyses each predictor on its own; Comparative adds the pairwise comparison
          tables and the comparative ROC plot. Comprehensive Diagnostic Performance currently
          gives the same output as Single.

    - name: direction
      title: 'Direction'
      type: List
      options:
          - title: 'Auto (determine automatically)'
            name: auto
          - title: 'Higher values indicate positive outcome'
            name: higher
          - title: 'Lower values indicate positive outcome'
            name: lower
      default: higher
      description: >
        Direction of the predictor-outcome relationship. The default is "Higher values indicate
        positive outcome" because it is a stated hypothesis rather than an estimate. "Auto" reads
        the orientation off the same data that supply the AUC - pROC compares the two groups'
        median values - so the direction is fitted rather than assumed, and every AUC is biased
        upward (for n = 20 the AUC expected under no association is about 0.60, not 0.50, and
        exceeds 0.60 in roughly 45 of every 100 markers carrying no information at all). It is
        not floored at 0.5 either: a median split can disagree with the ranks, so about 12 of
        those 100 null markers are still reported below 0.5. "Auto" can also silently invert a
        marker and report 0.825 where the un-inverted reading is 0.175. Use "Auto" only for
        exploratory screening of markers whose direction is genuinely unknown, and say so.

    # Youden Index Options
    - name: youdenOptimization
      title: "Youden index optimization"
      type: Bool
      default: true
      description: >
          Find the optimal cutoff by maximizing the Youden index (sensitivity + specificity - 1),
          subject to the minimum sensitivity/specificity below. When off, the cutoff closest to
          the top-left corner of the ROC curve is reported instead. The minimum sensitivity and
          specificity are used only by the Youden search; with this off they are not applied and a
          warning says so.

    - name: customCutoffs
      title: 'Custom cutoffs'
      type: String
      default: ''
      description: 'Comma-separated list of custom cutoffs to evaluate (e.g., 0.1, 0.5, 0.9)'

    - name: sensitivityThreshold
      title: 'Minimum sensitivity'
      type: Number
      default: 0.0
      min: 0.0
      max: 1.0
      description: >
          Minimum sensitivity a cutoff must achieve to be considered. 0 (the default) searches for
          the overall Youden optimum with no constraint. Raising it restricts the search, which is
          what you want for a screening test, but the reported cutoff is then the best one meeting
          your minimum rather than the Youden maximum - a notice says so when the two differ. Used
          only when Youden index optimization is on.

    - name: specificityThreshold
      title: 'Minimum specificity'
      type: Number
      default: 0.0
      min: 0.0
      max: 1.0
      description: >
          Minimum specificity a cutoff must achieve to be considered. 0 (the default) searches for
          the overall Youden optimum with no constraint. Raising it restricts the search, which is
          what you want for a confirmatory test, but the reported cutoff is then the best one
          meeting your minimum rather than the Youden maximum - a notice says so when the two
          differ. Used only when Youden index optimization is on.

    # Statistical Options
    - name: confidenceLevel
      title: 'Confidence level'
      type: Number
      default: 95
      min: 50
      max: 99.9
      description: 'Confidence level for AUC confidence intervals'

    - name: bootstrapSamples
      title: 'Bootstrap samples'
      type: Integer
      default: 1000
      min: 100
      max: 10000
      description: >
          Number of resamples for every resampling step except the frozen-model report: bootstrap
          confidence intervals (AUC, partial AUC, multi-class), the ROC confidence bands, the
          bootstrap comparison test, and the number of permutations for Venkatraman's test. With
          B permutations no p-value below 1/(B + 1) can be shown, so keep at least 1000 for a test.

    - name: useBootstrap
      title: "Bootstrap confidence intervals"
      type: Bool
      default: false
      description: 'Use bootstrap methods for confidence intervals'

    - name: bootstrapMethod
      title: 'Bootstrap method'
      type: List
      options:
          - title: 'Percentile Method'
            name: percentile
          - title: 'BCa (Bias-Corrected and Accelerated)'
            name: bca
          - title: 'Basic Bootstrap'
            name: basic
      default: bca
      description: >
          Method for calculating bootstrap confidence intervals. BCa corrects for bias and
          skewness and is second-order accurate in large samples; for a single AUC in small
          samples no interval method is uniformly best (Obuchowski and Lieber 1998; Feng et al.
          2017).

    # NOT IMPLEMENTED - commented out so jamovi does not offer a control that produces no output.
#     - name: bootstrapCutoffCI
#       title: "Bootstrap CI for optimal cutoff"
#       type: Bool
#       default: false
#       description: 'NOT YET IMPLEMENTED - selecting this produces no output. Calculate bootstrap confidence intervals for sensitivity and specificity at optimal cutoff'

    - name: bootstrapPartialAUC
      title: "Bootstrap CI for partial AUC"
      type: Bool
      default: false
      description: >
        Bootstrap confidence interval for the partial AUC, using the resample count, interval
        type (BCa/percentile/basic) and stratification set above. The interval is for the raw
        partial AUC on the chosen focus range, not for the McClish-normalized value.

    - name: stratifiedBootstrap
      title: "Stratified bootstrap"
      type: Bool
      default: false
      description: >
          Resample cases and controls separately, keeping the outcome proportions, in every
          bootstrap of this analysis: the AUC and partial-AUC intervals, the bootstrap comparison
          test and the ROC confidence bands (recommended for imbalanced data). Off by default:
          unticked, these bootstraps resample patients without regard to outcome.

    - name: seed
      title: "Random seed"
      type: Integer
      default: 0
      description:
          ui: >
            Seed for every resampling step. Each interval, band and test starts from it, so the
            same data and options always give the same result.
          R: >
            Random seed used for every resampling step - bootstrap confidence intervals,
            bootstrap ROC comparisons, and internal validation resamples or cross-validation
            folds. Each step starts from this seed, so a predictor's result does not depend on
            which predictors or options were resampled before it. Fixing it makes a run reproducible: the same data and options give the
            same intervals every time. Change it to check how sensitive a result is to the
            particular resamples drawn.

    # Comparison Options
    - name: pairwiseComparisons
      title: "Pairwise comparisons"
      type: Bool
      default: false
      description: 'Perform pairwise comparisons between ROC curves'

    - name: comparisonMethod
      title: 'Comparison method'
      type: List
      options:
          - title: 'DeLong et al. (1988)'
            name: delong
          - title: 'Bootstrap'
            name: bootstrap
          - title: 'Venkatraman permutation test (equality of ROC curves)'
            name: venkatraman
      default: delong
      description: >
        Method for comparing ROC curves. DeLong et al. (1988) and Bootstrap test whether the
        two AUCs differ. The Venkatraman permutation test (Venkatraman & Begg 1996, paired
        data) tests whether the two ROC curves are identical over their whole range, not
        whether their AUCs differ.

    # Output Options
    - name: rocCurve
      title: "ROC curve plot"
      type: Bool
      default: true
      description: 'Display ROC curve plot'

    - name: aucTable
      title: "AUC summary table"
      type: Bool
      default: true
      description: 'Display AUC summary table'

    - name: cutoffTable
      title: "Cutoff analysis table"
      type: Bool
      default: false
      description: 'Display detailed cutoff analysis'

    - name: optimalCutoffs
      title: "Optimal cutoffs summary"
      type: Bool
      default: true
      description: 'Display optimal cutoff summary'

    - name: diagnosticMetrics
      title: "Diagnostic metrics"
      type: Bool
      default: true
      description: 'Display comprehensive diagnostic metrics'

    - name: clinicalMetrics
      title: "Clinical metrics"
      type: Bool
      default: false
      description: 'Display clinical application metrics (PPV, NPV, LR+, LR-)'

    # Advanced Options
    - name: smoothMethod
      title: 'ROC curve smoothing'
      type: List
      options:
          - title: 'None'
            name: none
          - title: 'Binormal'
            name: binormal
          - title: 'Kernel'
            name: kernel
      default: none
      description: 'Method for smoothing ROC curves'

    - name: partialAuc
      title: "Partial AUC analysis"
      type: Bool
      default: false
      description: 'Calculate partial AUC for specific sensitivity/specificity ranges'

    - name: partialAucType
      title: 'Partial AUC type'
      type: List
      options:
          - title: 'Specificity Range (for high-specificity applications)'
            name: specificity
          - title: 'Sensitivity Range (for high-sensitivity applications)'
            name: sensitivity
      default: specificity
      description: 'Whether to calculate pAUC over a specificity or sensitivity range'

    # library-audit 2026-10-23 meddecide [MEDIUM] DONE: two Number options, whose boxes check their own
    #   input and carry min/max, not one "min,max" string parsed in R (was partialRange).
    - name: partialAucFrom
      title: 'Partial AUC from'
      type: Number
      default: 0.8
      min: 0
      max: 1
      description: 'Lower end of the partial AUC range, on the specificity or sensitivity scale chosen above, for example 0.8 for high specificity.'

    - name: partialAucTo
      title: 'Partial AUC to'
      type: Number
      default: 1
      min: 0
      max: 1
      description: 'Upper end of the partial AUC range; it must be greater than the lower end.'

    # CROC Options
    - name: crocAnalysis
      title: "CROC analysis"
      type: Bool
      default: false
      description: 'Calculate Concentrated ROC curves for early retrieval analysis'

    - name: crocAlpha
      title: 'CROC alpha parameter'
      type: Number
      default: 7.0
      min: 1.0
      max: 20.0
      description: 'Concentration parameter for CROC exponential magnifier function'

    - name: convexHull
      title: "ROC convex hull"
      type: Bool
      default: false
      description: 'Calculate the ROC convex hull (operating points reachable by randomly mixing two cut-offs; in-sample, so optimistic)'

    # RETIRED - replaced by an automatic tie note under the AUC table (ties always count one half; the note gives the bounds).
#     - name: tiedScoreHandling
#       title: 'Tied score handling'
#       type: List
#       options:
#           - title: 'Average'
#             name: average
#           - title: 'Upper Bound'
#             name: upper
#           - title: 'Lower Bound'
#             name: lower
#       default: average
#       description: 'Method for handling tied predictor scores in ROC calculation'

    # Imbalance Detection Options
    - name: detectImbalance
      title: "Class imbalance detection"
      type: Bool
      default: false
      description: 'Automatically detect class imbalance and recommend PRC when appropriate'

    - name: imbalanceThreshold
      title: 'Imbalance threshold'
      type: Number
      default: 3.0
      min: 1.5
      max: 10.0
      description: 'Ratio threshold for imbalance detection (e.g., 3.0 means 3:1 or 1:3 ratio)'

    - name: showImbalanceWarning
      title: "Explain the imbalance warning in full"
      type: Bool
      default: false
      description: >-
        Add the explanatory detail to the class-imbalance warning. The warning
        itself is always shown when imbalance is detected; this only controls
        how much it explains.

    - name: recommendPRC
      title: "PRC recommendation for imbalanced data"
      type: Bool
      default: false
      description: >
          Recommend adding the Precision-Recall curve alongside the ROC curve when imbalance is
          detected.

    # Clinical Context
    - name: prevalence
      title: 'Disease prevalence'
      type: Number
      default: 0.1
      min: 0.000000001
      max: 0.999999999
      description: 'Disease prevalence to assume when computing predictive values. Used only when "Use observed prevalence" is unticked - set it to the prevalence of the population the test will actually be used in, which for a screening setting is usually far lower than in a case-control sample.'

    - name: useObservedPrevalence
      title: "Observed prevalence"
      type: Bool
      default: true
      description: 'Compute PPV, NPV and the clinical impact metrics at the prevalence observed in these data (the default). Untick it to assume a different prevalence instead - appropriate when the sample is enriched for cases and does not reflect the population the test will be used in. The prevalence actually used is printed in the results.'

    - name: clinicalContext
      title: 'Clinical context'
      type: List
      options:
          - title: 'Screening'
            name: screening
          - title: 'Diagnosis'
            name: diagnosis
          - title: 'Prognosis'
            name: prognosis
          - title: 'Monitoring'
            name: monitoring
          - title: 'General'
            name: general
      default: general
      description: 'Clinical application context for interpretation'

    - name: clinicalPresets
      title: 'Clinical presets'
      type: List
      options:
          - title: 'Custom Configuration'
            name: custom
          - title: 'Biomarker Screening (High Sensitivity)'
            name: biomarker_screening
          - title: 'Diagnostic Test Validation (Balanced)'
            name: diagnostic_validation
          - title: 'Confirmatory Testing (High Specificity)'
            name: confirmatory_testing
          - title: 'Research (Youden with Your Minimums)'
            name: research_comprehensive
      default: custom
      description: >
          Sets how the optimal cutoff is searched for: each preset turns Youden index optimization
          on and sets the minimums (Screening: sensitivity 0.90; Diagnostic validation: 0.80 and
          0.80; Confirmatory: specificity 0.95; Research: keeps the minimums you enter, so it differs
          from Custom only by switching Youden optimization on). No other option changes.

    # Advanced Output Options
    - name: comprehensive_output
      title: "Comprehensive statistical output"
      type: Bool
      default: false
      description: 'Include comprehensive statistical details'

    - name: clinical_interpretation
      title: "Clinical interpretation"
      type: Bool
      default: false
      description: 'Provide clinical context for ROC analysis results'

    - name: showAnalysisSummary
      title: "Analysis summary"
      type: Bool
      default: false
      description: >
          A plain-language summary of the main results: the best AUC with its interval and the
          cutoff with its sensitivity and specificity. Internal validation results appear in the
          same panel whenever Internal validation is ticked.

    - name: showClinicalReport
      title: "Report sentences"
      type: Bool
      default: false
      description: >
          Copy-ready Methods and Results sentences built from these results. Check them against
          the tables before pasting them into a report.

    - name: showTableNotes
      title: "Table notes"
      type: Bool
      default: false
      description: >
          Show explanatory notes and cell footnotes below the results tables, including
          methods, definitions and cautions for reading each table. The random seed of a
          resampled result is always shown.

    # Plotting Options
    - name: plotTheme
      title: 'Plot theme'
      type: List
      options:
          - title: 'Classic'
            name: classic
          - title: 'Modern'
            name: modern
          - title: 'Clinical'
            name: clinical
      default: clinical
      description: 'Visual theme for ROC plots'

    - name: plotWidth
      title: 'Plot width'
      type: Integer
      default: 600
      min: 300
      max: 1200
      description: 'Width of ROC plots'

    - name: plotHeight
      title: 'Plot height'
      type: Integer
      default: 600
      min: 300
      max: 1200
      description: 'Height of ROC plots'

    - name: showCutoffPoints
      title: "Cutoff points"
      type: Bool
      default: false
      description: 'Highlight optimal cutoff points on ROC curve'

    - name: showConfidenceBands
      title: "Confidence bands"
      type: Bool
      default: false
      description: 'Display confidence bands around ROC curve'

    # Model Comparison Enhancements
    - name: showMetricsDiff
      title: "Metrics differences"
      type: Bool
      default: false
      description: 'Display detailed differences between model metrics'

    - name: statisticalComparison
      title: "Statistical model comparison"
      type: Bool
      default: false
      description: 'Perform comprehensive statistical comparison between models'

    # Calibration Analysis Options
    - name: calibrationAnalysis
      title: "Calibration analysis"
      type: Bool
      default: false
      description: 'Assess calibration (agreement between observed and predicted probabilities)'

    - name: calibrationPlot
      title: "Calibration plot"
      type: Bool
      default: false
      description: 'Display the calibration plot: observed proportion against predicted probability in the Hosmer-Lemeshow risk groups, with an optional flexible spline curve (splineCalibration)'

    - name: hosmerLemeshow
      title: "Hosmer-Lemeshow test"
      type: Bool
      default: false
      description: 'Perform Hosmer-Lemeshow goodness-of-fit test'

    - name: hlGroups
      title: 'Risk groups'
      type: Integer
      default: 10
      min: 5
      max: 20
      description: 'Number of equal-sized risk groups used both for the Hosmer-Lemeshow test and for binning the calibration plot'

    - name: brierScore
      title: "Brier score"
      type: Bool
      default: false
      description: 'Calculate Brier score and scaled Brier score'

    - name: calibrationMetrics
      title: "Calibration metrics"
      type: Bool
      default: false
      description: 'Calculate calibration slope, intercept, and calibration-in-the-large'

    # Advanced Calibration Methods
    - name: splineCalibration
      title: "Spline calibration curve"
      type: Bool
      default: false
      description: >
        Fit a flexible calibration curve by logistic regression of the outcome on a natural
        cubic spline of the logit of the predicted probability, a variant of the flexible
        calibration curves of Austin & Steyerberg (2019), who used loess and restricted cubic
        splines on the probability scale. Adds the smooth curve to the calibration plot and
        the integrated calibration index (ICI, the mean absolute difference between the curve
        and the diagonal) with E50, E90 and Emax to the calibration summary. Requires
        calibrationAnalysis.

    - name: splineKnots
      title: 'Number of knots'
      type: Integer
      default: 4
      min: 3
      max: 7
      description: >
        Knots of the spline calibration curve (3 to 7). The spline has knots - 1 degrees of
        freedom; more knots follow the data more closely but need more events per knot. Used
        only when splineCalibration is on.

    - name: eoRatio
      title: "E/O ratio"
      type: Bool
      default: false
      description: >
        Expected/Observed ratio for overall calibration. Reported only when the predictor is
        supplied as a probability in 0 to 1; when a logistic model has to be fitted here to get
        probabilities the ratio is 1 by construction and the cell is left blank.

    # NOT IMPLEMENTED - commented out so jamovi does not offer a control that produces no output.
#     - name: namDagostino
#       title: "Nam-D'Agostino test"
#       type: Bool
#       default: false
#       description: "NOT YET IMPLEMENTED - selecting this produces no output. Perform Nam-D'Agostino calibration test (more powerful than H-L)"

    # NOT IMPLEMENTED - commented out so jamovi does not offer a control that produces no output.
#     - name: greenwoodNam
#       title: "Greenwood-Nam-D'Agostino test"
#       type: Bool
#       default: false
