# Advanced analyses removed - can be added in future versions if needed
    # - name: effectSizeAnalysis
    # - name: powerAnalysis

    - name: impactCutoffs
      title: Fixed score cutoffs (comma separated)
      type: String
      default: '0.5'
      description: >
          Fixed score cutoffs on the marker's own scale, comma separated. The default 0.5 is meant
          for predicted probabilities (Prediction scale = probability); for a raw marker enter
          cutoffs inside its observed range. A warning names any cutoff that classifies every
          analyzed patient the same way.
    - name: utilityThreshold
      title: Utility threshold (harm/benefit)
      type: Number
      default: 0.1
      min: 1.0e-09
      max: 0.999999999
      description: >
          Threshold probability for net benefit: the risk at which a clinician is indifferent between
          acting and not acting, so its odds are the harm of a false positive relative to the benefit
          of a true positive (0.1 means one true positive is worth nine false positives). Used by the
          clinical impact and workload tables; it is not a score cutoff.
    - name: workloadPopulationSize
      title: Target population size
      type: Integer
      default: 1000
      min: 1
      max: 1000000000
      description: >
          Size of the population the projected workload counts are scaled to. Used for every
          projected row: the main prevalence when Observed prevalence is unticked, and every
          additional target prevalence. Observed rows count the analyzed patients instead.
    - name: analysisUnit
      title: Unit of observation
      type: String
      default: slide
      description: >
          What one row is (slide, core, patient...). Printed in the frozen-model report; every
          analyzed row weighs equally in its metrics.
    - name: prevalenceScenarios
      title: Additional target prevalences (proportions)
      type: String
      default: ''
      description: >
          Extra target-population prevalences, as proportions between 0 and 1 separated by commas
          (for example 0.05, 0.2). Each adds projected rows to the workload table at the same fixed
          cutoffs. Leave blank for none; an unreadable entry is ignored with a warning.
    - name: validationPanel
      title: Frozen-model validation report
      type: Bool
      default: false
      description: >
          Evaluates an already-fitted model or score at prespecified fixed cutoffs, without
          refitting or choosing a cutoff from these data, and replaces every other output with the
          validation context, denominator ledger and frozen-model metrics. Needs a positive class, an
          explicit negative level, an explicit Direction and the fixed score cutoffs.
    # library-audit 2026-10-23 meddecide [MEDIUM] DONE: a Level with a LevelSelector, not typed text - a typo
    #   named no level. Level options take no default, so R callers pass validationNegative (NULL when unused).
    - name: validationNegative
      title: Explicit negative reference level
      type: Level
      variable: (outcome)
      allowNone: true
      description: >
          The outcome level that means the condition is absent. Required by the frozen-model report,
          which refuses any outcome level that is neither this nor the positive class instead of
          pooling it as negative.
    - name: referenceDescription
      title: Reference standard and blinding
      type: String
      default: ''
      description: >
          Free text describing the reference standard and whether its readers were blinded to the
          score (for example histology, blinded). Printed in the frozen-model validation context.
    - name: modelVersion
      title: Frozen model version
      type: String
      default: ''
      description: >
          Identifier of the fitted model or score version being evaluated. Required when Cohort role
          is frozen, so the report names exactly which model the metrics belong to.
    - name: cohortRole
      title: Cohort role
      type: List
      default: frozen
      options:
      - name: development
        title: Development / exploratory
      - name: frozen
        title: Frozen external / temporal evaluation
      description: >
          Declared by you and printed in the frozen-model report; the analysis does not check it.
          A value left at its default is printed as (default setting).
    - name: samplingDesign
      title: Sampling design
      type: List
      default: other
      options:
      - name: consecutive
        title: Consecutive
      - name: enriched
        title: Enriched
      - name: positive_only
        title: Positive only
      - name: other
        title: Other / unknown
      description: >
          Declared by you and printed in the frozen-model report; the analysis does not check it.
          A value left at its default is printed as (default setting). The default is Other /
          unknown so that an untouched report does not assert a sampling design; how PPV and NPV
          should be read depends on it.
    - name: thresholdSource
      title: Threshold source
      type: List
      default: prespecified
      options:
      - name: prespecified
        title: Prespecified independently
      - name: development
        title: Selected in development
      - name: exploratory
        title: Selected in evaluation data
      description: >
          Declared by you and printed in the frozen-model report; the analysis does not check it.
          A value left at its default is printed as (default setting).
    - name: predictionScale
      title: Prediction scale
      type: List
      default: score
      options:
      - name: score
        title: Score
      - name: probability
        title: Probability of selected positive class
      description: >
        What the predictor values are. Score (default) is any marker or model score: the
        calibration summary and plot, Brier score, E/O ratio, Hosmer-Lemeshow test and the
        decision and clinical impact curves then use risks from a logistic model of the score
        fitted to these data (in-sample). Probability means the values are predicted
        probabilities of the selected positive class, assessed as supplied; a predictor with a
        value outside 0 to 1 gets none of those outputs, and a probability is never reversed.
        Values between 0 and 1 are not taken as probabilities unless this says so. Frozen-model
        validation uses the same setting.
    - name: patientID
      title: Patient identifier
      type: Variable
      default: null
      suggested:
      - nominal
      permitted:
      - factor
      - numeric
      description: >
          Patient identifier. On the main analysis it is used only to warn when a patient has
          several rows: every panel except the Frozen-model validation report treats each row as
          an independent patient, so their intervals and tests are too narrow then. Only the
          Frozen-model validation report resamples whole patients.
    - name: siteID
      title: Site identifier
      type: Variable
      default: null
      suggested:
      - nominal
      permitted:
      - factor
      - numeric
      description: >
          Optional site or center of each row. The frozen-model report then adds one set of metrics
          per site, conditional on the observed sites, and resamples within sites. Every row needs
          a site, and a patient may not appear at two sites.
    - name: partitionID
      title: Development / validation partition identifier
      type: Variable
      default: null
      suggested:
      - nominal
      permitted:
      - factor
      - numeric
      description: >
          Optional development or validation label of each row, used by the frozen-model report to
          check that no patient appears in more than one partition (leakage). Requires a patient
          identifier.
    - name: validationBootstrap
      title: Bootstrap frozen-model metrics
      type: Bool
      default: false
      description: >
          Adds percentile confidence intervals to the frozen-model metrics, resampling whole patients
          when a patient identifier is given (jointly across models, within sites). Without it the
          report shows point estimates only.
    - name: validationDraws
      title: Bootstrap replicates
      type: Integer
      default: 999
      min: 100
      max: 10000
      description: >
          Number of patient-level bootstrap replicates for the frozen-model intervals. Separate from
          Bootstrap samples, which serves the other panels.
