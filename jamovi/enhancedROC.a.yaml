    # Clinical Prediction Model Validation
    - name: internalValidation
      title: "Internal validation"
      type: Bool
      default: false
      description: 'Perform internal validation using cross-validation or bootstrap'

    - name: validationMethod
      title: 'Validation method'
      type: List
      options:
          - title: 'Bootstrap Validation'
            name: bootstrap
          - title: 'Cross-Validation'
            name: cv
          - title: 'Both Methods'
            name: both
      default: bootstrap
      description: >
          Bootstrap: Harrell's optimism-corrected AUC of a logistic model of the marker (resamples
          holding one outcome group are dropped and counted). Cross-validation: stratified
          10-fold, or one fold per patient of the smaller outcome group when it has fewer than 10,
          reporting the mean fold AUC and the SD across folds, which is not a standard error.

