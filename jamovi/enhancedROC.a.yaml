    # NOT IMPLEMENTED - commented out so jamovi does not offer a control that produces no output.
#     - name: calibrationBelt
#       title: "Calibration belt"
#       type: Bool
#       default: false
#       description: 'NOT YET IMPLEMENTED - selecting this produces no output. Display calibration belt showing uncertainty around calibration curve'

    - name: calibrationDensity
      title: "Calibration density plot"
      type: Bool
      default: false
      description: >
        Overlay the distribution of predicted probabilities along the bottom of the calibration
        plot, so a calibration point backed by two patients is not read like one backed by two
        hundred. Skipped when there are fewer than 10 usable probabilities to smooth.

    # Multi-Class ROC Options
    - name: multiClassROC
      title: "Multi-class ROC analysis"
      type: Bool
      default: false
      description: 'Enable multi-class ROC analysis for outcomes with >2 levels'

    - name: multiClassStrategy
      title: 'Multi-class strategy'
      type: List
      options:
          - title: 'One-vs-Rest (OVR)'
            name: ovr
          - title: 'One-vs-One (OVO)'
            name: ovo
      default: ovr
      description: 'Strategy for multi-class ROC analysis'

    - name: multiClassAveraging
      title: 'Multi-class AUC averaging'
      type: List
      options:
          - title: 'Macro Average (unweighted)'
            name: macro
          - title: 'Weighted Average (by prevalence)'
            name: weighted
      default: macro
      description: >
          Method for averaging AUC across classes. Both averages are reported side by side for the
          One-vs-Rest strategy: Macro weights every class equally, Weighted weights each class by
          how many cases it contains. The One-vs-One strategy reports only its own unweighted
          average over class pairs, which is what that statistic is defined as. Both averages are
          always shown, so this setting changes no displayed value; with One-vs-One, Weighted only
          raises a notice.

