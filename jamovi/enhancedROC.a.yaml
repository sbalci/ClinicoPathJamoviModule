    # Clinical Impact Options
    - name: clinicalImpact
      title: "Clinical impact analysis"
      type: Bool
      default: false
      description: 'Calculate observed or projected workload at independently supplied score cutoffs'

    - name: nntCalculation
      title: "Inverse net benefit and inverse Youden columns"
      type: Bool
      default: false
      description: 'Show inverse net benefit and inverse Youden index; neither is a count of tests or reviews'

    - name: clinicalUtilityCurve
      title: "Clinical utility curve"
      type: Bool
      default: false
      description: 'Display clinical utility curve showing test consequences'

    - name: decisionImpactTable
      title: "Decision impact table"
      type: Bool
      default: false
      description: 'Show decision impact at various thresholds'

