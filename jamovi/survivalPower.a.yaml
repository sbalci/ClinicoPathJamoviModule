---
name: survivalPower
title: Survival Power Analysis
menuGroup: Power
menuSubgroup: Survival Power Analysis
menuTitle: Survival Power Analysis
menuSubtitle: Survival Power analysis
version: '0.4.0'
jas: '1.2'

description:
    main: |
        Power analysis and sample size calculation for survival studies.
        User-friendly interface for survival power calculations with multiple statistical methods.

        This function provides a streamlined approach to survival power analysis. For specialized needs,
        consider the other power analysis functions: Classical, Competing Risks, Advanced, or Comprehensive.
    # R:
    #     dontrun: true
    #     usage: |
    #         survivalPower(
    #             test_type = "log_rank",
    #             effect_size = 0.75,
    #             alpha_level = 0.05,
    #             power_level = 0.80,
    #             allocation_ratio = 1,
    #             accrual_period = 24,
    #             follow_up_period = 36
    #         )

completeWhenFilled: false

options:
    # Clinical Presets
    - name: clinical_preset
      title: Clinical Study Preset
      type: List
      options:
        - title: "Custom Design"
          name: custom
        - title: "Phase III Oncology Trial (HR=0.75, 80 percent power)"
          name: oncology_phase3
        - title: "Cardiovascular Prevention (HR=0.85, 90 percent power)"
          name: cardio_prevention
        - title: "Biomarker Study (HR=0.67, 2:1 allocation)"
          name: biomarker_study
        - title: "Non-inferiority Trial (1.25 margin)"
          name: non_inferiority
        - title: "Pilot/Feasibility Study (relaxed parameters)"
          name: pilot_study
      default: custom
      description:
        R: >
          Pre-configured parameter sets for common clinical trial designs.
          Selecting a preset will automatically populate appropriate values.

    # Analysis Type
    - name: analysis_type
      title: Analysis Type
      type: List
      options:
          - name: "sample_size"
            title: "Calculate Sample Size"
          - name: "power"
            title: "Calculate Power"
          - name: "effect_size"
            title: "Calculate Detectable Effect Size"
          - name: "duration"
            title: "Calculate Study Duration"
      default: "sample_size"
      description:
          R: Type of power analysis to perform

    - name: test_type
      title: Statistical Test
      type: List
      options:
          - name: "log_rank"
            title: "Log-rank Test"
          - name: "cox_regression"
            title: "Cox Regression"
          - name: "competing_risks"
            title: "Competing Risks (not available yet)"
          - name: "rmst_test"
            title: "RMST Comparison (not available yet)"
          - name: "non_inferiority"
            title: "Non-inferiority Trial"
          - name: "snp_survival"
            title: "SNP-based Survival (not available yet)"
          - name: "weighted_log_rank"
            title: "Weighted Log-rank (not available yet)"
      default: "log_rank"
      description:
          R: Type of statistical test for power calculation

    # Study Design Parameters
    - name: study_design
      title: Study Design
      type: List
      options:
          - name: "two_arm_parallel"
            title: "Two-arm Parallel"
          - name: "multi_arm"
            title: "Multi-arm Trial"
          - name: "crossover"
            title: "Crossover Design (not supported)"
          - name: "cluster_randomized"
            title: "Cluster Randomized"
          - name: "stratified"
            title: "Stratified Design"
      default: "two_arm_parallel"
      description:
          R: Overall study design type

    - name: primary_endpoint
      title: Primary Endpoint
      type: List
      options:
          - name: "overall_survival"
            title: "Overall Survival"
          - name: "disease_free_survival"
            title: "Disease-Free Survival"
          - name: "progression_free_survival"
            title: "Progression-Free Survival"
          - name: "time_to_event"
            title: "General Time-to-Event"
          - name: "composite_endpoint"
            title: "Composite Endpoint"
      default: "overall_survival"
      description:
          R: Primary survival endpoint

    # Statistical Parameters
    - name: effect_size_type
      title: Effect Size Type
      type: List
      options:
          - name: "hazard_ratio"
            title: "Hazard Ratio"
          - name: "median_ratio"
            title: "Median Survival Ratio"
          - name: "rmst_difference"
            title: "RMST Difference (months)"
          - name: "survival_difference"
            title: "Survival Probability Difference"
      default: "hazard_ratio"
      description:
          R: Type of effect size specification

    - name: effect_size
      title: Effect Size
      type: Number
      default: 0.75
      min: 0.1
      max: 5.0
      description:
          R: >
            Expected effect size, interpreted according to Effect Size Type: a
            hazard ratio, a median survival ratio (treatment/control), or a
            survival probability difference read at the Additional Follow-up
            time. For RMST Difference the RMST options are used instead.

    - name: alpha_level
      title: Type I Error Rate (Alpha)
      type: Number
      default: 0.05
      min: 0.001
      max: 0.10
      description:
          R: Significance level (two-sided)

    - name: power_level
      title: Power (1-Beta)
      type: Number
      default: 0.80
      min: 0.50
      max: 0.99
      description:
          R: Desired statistical power

    - name: allocation_ratio
      title: Allocation Ratio (Control:Experimental)
      type: Number
      default: 1.0
      min: 0.1
      max: 10.0
      description:
          R: Ratio of control to experimental group sizes

    - name: sample_size_input
      title: Total Sample Size (for Power/Effect/Duration Calculations)
      type: Integer
      default: 200
      min: 10
      max: 100000
      description:
          R: Total sample size to use when calculating power, effect size, or duration

    # Survival Distribution Parameters
    - name: control_median_survival
      title: Control Group Median Survival (months)
      type: Number
      default: 12.0
      min: 1.0
      max: 240.0
      description:
          R: Expected median survival in control group

    - name: survival_distribution
      title: Survival Distribution
      type: List
      options:
          - name: "exponential"
            title: "Exponential"
          - name: "weibull"
            title: "Weibull (not available yet)"
          - name: "log_normal"
            title: "Log-normal (not available yet)"
          - name: "piecewise_exponential"
            title: "Piecewise Exponential (not available yet)"
      default: "exponential"
      description:
          R: >
            Assumed survival distribution. Only the exponential distribution is
            supported in this release; the event-probability and sample-size
            formulas assume a constant hazard. Selecting any other option stops
            the analysis with an explanatory message rather than returning a
            number the formulas cannot justify.

    - name: weibull_shape
      title: Weibull Shape Parameter
      type: Number
      default: 1.0
      min: 0.1
      max: 5.0
      description:
          R: Shape parameter for Weibull distribution

    # Study Timeline Parameters
    - name: accrual_period
      title: Accrual Period (months)
      type: Number
      default: 24.0
      min: 1.0
      max: 120.0
      description:
          R: Patient recruitment period

    - name: follow_up_period
      title: Additional Follow-up (months)
      type: Number
      default: 12.0
      min: 0.0
      max: 120.0
      description:
          R: Additional follow-up after recruitment ends

    - name: accrual_pattern
      title: Accrual Pattern
      type: List
      options:
          - name: "uniform"
            title: "Uniform Accrual"
          - name: "linear_increasing"
            title: "Linear Increasing (not available yet)"
          - name: "exponential"
            title: "Exponential Ramp-up (not available yet)"
          - name: "custom"
            title: "Custom Pattern (not available yet)"
      default: "uniform"
      description:
          R: Pattern of patient accrual over time

    - name: dropout_rate
      title: Annual Dropout Rate
      type: Number
      default: 0.05
      min: 0.0
      max: 0.5
      description:
          R: Annual rate of loss to follow-up

    # Non-inferiority Specific
    - name: ni_margin
      title: Non-inferiority Margin
      type: Number
      default: 1.25
      min: 1.0
      max: 2.0
      description:
          R: Non-inferiority margin (hazard ratio scale)

    - name: ni_type
      title: Non-inferiority Type
      type: List
      options:
          - name: "absolute_margin"
            title: "Absolute Margin (not available yet)"
          - name: "relative_margin"
            title: "Relative Margin"
          - name: "retention_fraction"
            title: "Retention of Effect Fraction (not available yet)"
      default: "relative_margin"
      description:
          R: Type of non-inferiority margin

    # RMST Parameters
    - name: rmst_tau
      title: RMST Restriction Time (months)
      type: Number
      default: 36.0
      min: 6.0
      max: 120.0
      description:
          R: Restriction time for RMST analysis

    - name: rmst_difference
      title: Expected RMST Difference (months)
      type: Number
      default: 3.0
      min: 0.1
      max: 60.0
      description:
          R: Expected difference in restricted mean survival time

    # Multi-arm Parameters
    - name: number_of_arms
      title: Number of Treatment Arms
      type: Integer
      default: 3
      min: 2
      max: 10
      description:
          R: Total number of treatment arms (including control)

    - name: multiple_comparisons
      title: Multiple Comparisons Adjustment
      type: List
      options:
          - name: "none"
            title: "No Adjustment"
          - name: "bonferroni"
            title: "Bonferroni"
          - name: "holm"
            title: "Holm"
          - name: "dunnett"
            title: "Dunnett"
      default: "dunnett"
      description:
          R: Method for multiple comparisons adjustment

    # Advanced Options
    - name: interim_analyses
      title: Number of Interim Analyses
      type: Integer
      default: 0
      min: 0
      max: 5
      description:
          R: Number of planned interim analyses

    - name: alpha_spending
      title: Alpha Spending Function
      type: List
      options:
          - name: "none"
            title: "No Spending Function"
          - name: "obrien_fleming"
            title: "O'Brien-Fleming"
          - name: "pocock"
            title: "Pocock"
      default: "none"
      description:
          R: Alpha spending function for interim analyses

    - name: cluster_size
      title: Average Cluster Size
      type: Number
      default: 50
      min: 5
      max: 1000
      description:
          R: Average cluster size for cluster randomized trials

    - name: icc
      title: Intracluster Correlation Coefficient
      type: Number
      default: 0.05
      min: 0.0
      max: 0.5
      description:
          R: ICC for cluster randomized trials

    # Sensitivity Analysis
    - name: sensitivity_analysis
      title: Sensitivity analysis
      type: Bool
      default: false
      description:
          R: Perform sensitivity analysis across parameter ranges

    - name: run_simulation_validation
      title: Simulation validation
      type: Bool
      default: false
      description:
          R: >
            Validate analytical power calculations using Monte Carlo simulation.
            Available for log-rank and Cox designs under the exponential
            assumption. About 6 seconds at the default 2000 runs.

    - name: simulation_runs
      title: Simulation Runs
      type: Integer
      default: 2000
      min: 1000
      max: 100000
      description:
          R: >
            Number of Monte Carlo runs. The default of 2000 gives a Monte Carlo
            standard error below 0.01 for power near 0.8.

    - name: simulation_seed
      title: Simulation Seed
      type: Integer
      default: 42
      description:
          R: >
            Random seed for the Monte Carlo validation, so the simulated power
            is reproducible across runs. Change it to inspect Monte Carlo
            variability.

    # Clinical-Friendly Output Options
    - name: show_interpretation
      title: Clinical interpretation and report sentence
      type: Bool
      default: false
      description:
          R: >
            Display the study summary, clinical interpretation, and a copy-ready
            report sentence describing the design.

    - name: show_summary
      title: Plain-language summary
      type: Bool
      default: false
      description:
          R: Display plain-language summary of results

    - name: show_explanations
      title: Educational explanations
      type: Bool
      default: false
      description:
          R: Display educational notes and guidance

    - name: show_glossary
      title: Statistical glossary
      type: Bool
      default: false
      description:
          R: Display glossary of statistical terms

    - name: guided_mode
      title: Guided workflow
      type: Bool
      default: false
      description:
          R: Step-by-step guided analysis workflow
...
