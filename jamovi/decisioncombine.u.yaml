title: Combine Medical Decision Tests
name: decisioncombine
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Gold Standard (Reference Test)
        children:
          - type: VariablesListBox
            name: gold
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: goldPositive
            label: Disease Present Level

      - type: TargetLayoutBox
        label: Test 1 (Required)
        children:
          - type: VariablesListBox
            name: test1
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test1Positive
            label: Positive Level

      - type: TargetLayoutBox
        label: Test 2 (Required for Combinations)
        children:
          - type: VariablesListBox
            name: test2
            maxItemCount: 1
            isTarget: true
          - type: LevelSelector
            name: test2Positive
            label: Positive Level

      - type: TargetLayoutBox
        label: Test 3 (Optional)
        children:
          - type: VariablesListBox
            name: test3
            maxItemCount: 1
            isTarget: true
            enable: (test2)
          - type: LevelSelector
            name: test3Positive
            label: Positive Level
            enable: (test3)

  - type: CollapseBox
    label: Display Options
    collapsed: true
    children:
      - type: CheckBox
        name: showIndividual
        label: Individual test statistics
      - type: CheckBox
        name: showFrequency
        label: Frequency tables
      - type: CheckBox
        name: showRecommendation
        label: Descriptive candidate-rule ranking
      - type: CheckBox
        name: showAbout
        label: About this analysis
      - type: Output
        name: addedPattern
      - type: Label
        label: Visualizations
        children:
          - type: CheckBox
            name: showBarPlot
            label: Bar chart
          - type: CheckBox
            name: showHeatmap
            label: Heatmap
          - type: CheckBox
            name: showForest
            label: Forest plot
          - type: CheckBox
            name: showDecisionTree
            label: Decision space (sensitivity vs specificity)

  - type: CollapseBox
    label: Filters
    collapsed: true
    children:
      - type: ComboBox
        name: filterStatistic
        label: Statistic
        enable: (showBarPlot || showHeatmap || showForest)
      - type: ComboBox
        name: filterPattern
        label: Pattern type
        enable: (showBarPlot || showHeatmap || showForest)
