---
name:  datetimeconverter
title: DateTime Converter
jrs:   '1.1'

items:
    # timezone belongs in every clearWith below: it changes the PARSED VALUE,
    # not just the wording (a date with no time is midnight in the selected zone).
    - name: notices
      title: Important Information
      type: Html
      clearWith:
         - datetime_var
         - datetime_format
         - timezone
         - two_digit_year

    - name: welcome
      title: 'Getting Started'
      type: Html

    - name: formatInfo
      title: 'Format Detection'
      type: Html
      clearWith:
         - datetime_var
         - datetime_format
         - timezone
         - two_digit_year

    - name: qualityMetrics
      title: 'Quality Assessment'
      type: Html
      clearWith:
         - datetime_var
         - datetime_format
         - timezone
         - two_digit_year

    - name: previewTable
      title: 'Conversion Preview'
      type: Html
      clearWith:
         - datetime_var
         - datetime_format
         - timezone
         - two_digit_year
         - preview_rows

    # No clearWith on purpose: jmvcore's default is "*" (clear on any option change).
    # This panel's real dependency set is datetime_var, datetime_format, timezone,
    # preview_rows and all 22 extract_*/*_out toggles -- 26 of the 30 options -- so an
    # explicit list would be longer than the default and easy to leave incomplete again.
    - name: componentPreview
      title: 'Extracted Components Preview'
      type: Html

    # qualityAssessment and nlSummary carry no clearWith on purpose: jmvcore defaults to
    # "*", which is already the widest (and therefore safest) setting. Both are derived
    # from the parse plus most of the option set, so narrowing them would only risk
    # reintroducing the staleness the lists above had.

    - name: qualityAssessment
      title: 'Data Quality Assessment'
      type: Html
      visible: (show_quality_metrics)

    - name: nlSummary
      title: 'Summary (Copy-Ready)'
      type: Html
      visible: (show_summary)

    - name: aboutPanel
      title: 'About This Analysis'
      type: Html
      visible: (show_explanations)

    - name: caveatsPanel
      title: 'Caveats & Assumptions'
      type: Html
      visible: (show_explanations)

    - name: glossaryPanel
      title: 'Key Terms & Concepts'
      type: Html
      visible: (show_glossary)

    # varTitle/varDescription below are STATIC. Do NOT reintroduce survival.r.yaml's
    # `${ dxdate }` idiom: jmvcore::format's placeholder regex is
    # \{ *[A-Za-z][A-Za-z0-9]* *\} -- no underscore -- so `${ datetime_var }` would ship
    # to jamovi verbatim as the column name. The source variable is appended at runtime
    # by private$.updateOutputTitles() in R/datetimeconverter.b.R.
    - name: corrected_datetime_char
      title: Corrected DateTime (Text)
      type: Output
      varTitle: 'Corrected DateTime (Text)'
      varDescription: 'DateTime variable converted to standardized format (as character string)'
      measureType: nominal
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: corrected_datetime_numeric
      title: Corrected DateTime (Numeric)
      type: Output
      varTitle: 'Corrected DateTime (Numeric)'
      varDescription: 'DateTime variable converted to Unix epoch seconds for calculations'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: year_out
      title: Year
      type: Output
      varTitle: 'Year'
      varDescription: 'Year component extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: month_out
      title: Month
      type: Output
      varTitle: 'Month'
      varDescription: 'Month component (1-12) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format



    - name: monthname_out
      title: Month Name
      type: Output
      varTitle: 'Month Name'
      varDescription: 'Month name extracted from the datetime variable'
      measureType: nominal
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: day_out
      title: Day
      type: Output
      varTitle: 'Day'
      varDescription: 'Day of month (1-31) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format


    - name: hour_out
      title: Hour
      type: Output
      varTitle: 'Hour'
      varDescription: 'Hour component (0-23) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: minute_out
      title: Minute
      type: Output
      varTitle: 'Minute'
      varDescription: 'Minute component (0-59) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: second_out
      title: Second
      type: Output
      varTitle: 'Second'
      varDescription: 'Second component (0-59) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: dayname_out
      title: Day Name
      type: Output
      varTitle: 'Day Name'
      varDescription: 'Day of week name extracted from the datetime variable'
      measureType: nominal
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: weeknum_out
      title: Week Number
      type: Output
      varTitle: 'Week Number'
      varDescription: 'Week number of year (1-53) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: quarter_out
      title: Quarter
      type: Output
      varTitle: 'Quarter'
      varDescription: 'Quarter (1-4) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

    - name: dayofyear_out
      title: Day of Year
      type: Output
      varTitle: 'Day of Year'
      varDescription: 'Day of year (1-366) extracted from the datetime variable'
      measureType: continuous
      clearWith:
          - datetime_var
          - timezone
          - two_digit_year
          - datetime_format

refs:
    - ClinicoPathJamoviModule
    - lubridate

...
