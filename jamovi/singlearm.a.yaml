---
name:  singlearm
title: Single Arm Survival
menuGroup: Survival
menuSubgroup: ClinicoPath Survival
menuSubtitle: 'Survival for whole group, no explanatory factor'
version: '1.0.7'
jas: '1.2'

description:
    main: >-
      Performs survival analysis for a single cohort without group comparisons.
      Kaplan-Meier estimates use event times and risk sets; in competing-risk mode,
      cumulative incidence retains competing terminal events as separate states. Optional
      person-time rates use the sum of individual observation periods as their denominator.
      This is descriptive analysis of one cohort, not a treatment-effect estimate.
    # R:
    #     dontrun: true
    #     usage: |
    #         # Example analyzing overall survival for a patient cohort:
    #         # singlearm(
    #         #   data = patient_data,
    #         #   elapsedtime = "months_survival",
    #         #   outcome = "death_status",
    #         #   outcomeLevel = "Dead"
    #         # )


options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: elapsedtime
      title: 'Time Elapsed'
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric ]
      description: >-
        The time-to-event or follow-up duration for each patient. The sum is the denominator
        when person-time rates are requested; Kaplan-Meier estimates instead use ordered event
        times and risk sets. Values must be finite and zero or positive, in one consistent unit.


    - name: tint
      title: Using dates to calculate survival time
      type: Bool
      default: false
      description: >-
        Enable this option if you want to calculate survival time from dates in your data.
        This is useful when you have separate columns for diagnosis date and follow-up date
        and want to calculate the time elapsed between them.

    - name: dxdate
      title: 'Diagnosis Date'
      type: Variable
      default: NULL
      suggested: [ continuous, nominal ]
      permitted: [ numeric, factor ]
      description: >-
        The date of diagnosis or study entry. Accepts: (1) Date/datetime text (e.g., "2024-01-15"),
        (2) Numeric values. Each bare numeric date column is classified by its overall
        magnitude: values below 100000 indicate DAYS since 1970-01-01 (the R Date
        encoding), whereas values at or above 100000 indicate Unix epoch SECONDS (the
        DateTime Converter's corrected_datetime_numeric output). Columns with inconsistent
        scales or values on both sides of this boundary are rejected. Time intervals are
        calculated as the difference from the follow-up date.

    - name: fudate
      title: 'Follow-up Date'
      type: Variable
      default: NULL
      suggested: [ continuous, nominal ]
      permitted: [ numeric, factor ]
      description: >-
        The date of last follow-up or event. Accepts: (1) Date/datetime text (e.g., "2024-01-15"),
        (2) Numeric values, classified by column magnitude exactly as for the diagnosis
        date (below 100000 = days since 1970-01-01; at or above 100000 = Unix epoch
        seconds). Mixed values within a column and inconsistent numeric encodings between
        columns are rejected. Must be in the same format as the diagnosis date.


    - name: calculatedtime
      title: Add Calculated Time to Data
      type: Output
      description: >-
        If enabled, the interval between the two dates is added to your data as a new
        variable, so you can verify the date arithmetic. It is the RAW interval, in the
        selected Time Unit, for every row of the dataset: it is not reduced by the
        landmark time and it is present for rows the analysis excluded.


    - name: outcome
      title: 'Outcome'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal, continuous ]
      permitted: [ factor, numeric ]
      description: >-
        The outcome or event of interest for each patient. Should be a factor or numeric
        variable indicating whether the patient experienced the event (e.g., death) or
        censoring (e.g., end of follow-up).

    - name: outcomeLevel
      title: Event Level
      type: Level
      variable: (outcome)
      allowNone: true
      description: >-
        Select the level of the outcome variable that represents the event of interest.
        For example, if the outcome variable is "death_status" with levels "Alive" and
        "Dead", select "Dead" as the event level.

    - name: dod
      title: Dead of Disease
      type: Level
      variable: (outcome)
      allowNone: true
      description: >-
        Select the level of the outcome variable that represents death due to disease.
        This is useful for competing risk analysis when there are multiple event types.

    - name: dooc
      title: Dead of Other
      type: Level
      variable: (outcome)
      allowNone: true
      description: >-
        Select the level of the outcome variable that represents death due to other causes.
        This is useful for competing risk analysis when there are multiple event types.

    - name: awd
      title: Alive w Disease
      type: Level
      variable: (outcome)
      allowNone: true
      description: >-
        Select the level of the outcome variable that represents being alive with disease.
        This is useful for competing risk analysis when there are multiple event types.

    - name: awod
      title: Alive w/o Disease
      type: Level
      variable: (outcome)
      allowNone: true
      description: >-
        Select the level of the outcome variable that represents being alive without disease.
        This is useful for competing risk analysis when there are multiple event types.

    - name: analysistype
      title: 'Survival Type'
      type: List
      options:
        - title: Overall
          name: overall
        - title: Cause Specific
          name: cause
        - title: Disease-Free
          name: dfs
        - title: Competing Risk
          name: compete
      default: overall
      description: >-
        Defines how the four mapped categories are coded. Overall counts both death categories
        as events. Cause Specific counts Dead of Disease as the event and treats other categories
        as censored; its Kaplan-Meier probability is net/cause-specific survival and can overstate
        real-world absolute risk when other-cause death competes. Disease-Free counts death and
        Alive with Disease as events; the supplied time for Alive with Disease must be time to
        recurrence/progression, not last follow-up. Competing Risk estimates cumulative incidence
        of Dead of Disease while retaining Dead of Other Causes as a competing terminal event.


    - name: outcomeredefined
      title: Add Redefined Outcome to Data
      type: Output
      description: >-
        If enabled, the recoded event indicator (0 = censored, 1 = event of interest,
        2 = competing event) is added to your data as a new variable, so you can verify
        how the outcome levels were mapped. It covers every row of the dataset; a row
        whose original outcome was missing or was mapped to no category stays empty.




    - name: cutp
      title: Cutpoints
      type: String
      default: '12, 36, 60'
      description: >-
        Time points at which to report survival probabilities, as a comma-separated list in
        the selected Time Unit. Values are always used exactly as entered. The built-in text
        "12, 36, 60" is written in months, so under a different unit it means 12, 36 and 60
        of that unit; an information notice explains how to enter 1, 3 and 5 years instead.
        Points beyond follow-up are omitted unless every remaining subject has had a terminal
        event, in which case the final KM/CIF state is carried forward. Negative, non-finite,
        and non-numeric entries are ignored with a warning. Time zero is accepted because
        events can occur at the origin.


    - name: timetypedata
      title: 'Time Type in Data (e.g., YYYY-MM-DD)'
      type: List
      options:
        - title: ymdhms
          name: ymdhms
        - title: ymd
          name: ymd
        - title: ydm
          name: ydm
        - title: mdy
          name: mdy
        - title: myd
          name: myd
        - title: dmy
          name: dmy
        - title: dym
          name: dym
      default: ymd
      description:
          R: select the time type in data (e.g., YYYY-MM-DD)


    - name: timetypeoutput
      title: Time Unit
      type: List
      options:
        - title: days
          name: days
        - title: weeks
          name: weeks
        - title: months (recommended for oncology)
          name: months
        - title: years
          name: years
      default: months
      description: >-
        The time unit used throughout the analysis. When survival time is calculated
        from dates, dates are CONVERTED to this unit. When a pre-calculated elapsed-time
        variable is supplied, no conversion is possible (the column carries no unit), so
        this option DECLARES the unit that variable is already recorded in. Either way it
        determines how cutpoints and plausibility checks are interpreted,
        and how axes are labelled - so
        selecting the wrong unit for pre-calculated time changes the reported results,
        not just the labels.


    - name: uselandmark
      title: Use landmark time
      type: Bool
      default: false
      description: >-
        Performs a conditional landmark description: only subjects still event-free and under
        observation after the landmark are retained, and their time scale is reset there.
        This changes the target population and does not by itself remove immortal-time bias,
        estimate a treatment effect, or justify excluding early events.

    - name: landmark
      title: Landmark Time
      type: Number
      default: 3
      min: 0
      description: >-
        The landmark time point, in the selected Time Unit. Must be zero or positive and
        must fall inside the observed follow-up range. Subjects whose follow-up ended at or
        before the landmark are excluded, and time is then measured from the landmark, so
        all estimates are conditional on surviving to it.

    - name: sc
      title: "Survival / cumulative-incidence plot"
      type: Bool
      default: false
      description: >-
        Generate a Kaplan-Meier survival plot in standard analyses or an Aalen-Johansen
        cumulative-incidence plot in competing-risk analyses. Confidence intervals are
        shown only when the separate 95 percent CI option is selected.

    - name: kmunicate
      title: "KMunicate-style plot"
      type: Bool
      default: false
      description: >-
        Enable this option to generate a publication-ready survival plot in the style of
        KMunicate. The 95 percent CI and Risk table options control its pointwise interval
        ribbon and risk/censoring panel. Individual censoring marks and median reference
        lines are not supported on this plot.


    - name: ce
      title: Cumulative event probability
      type: Bool
      default: false
      description: >-
        Plot the cumulative probability of the event over time, 1 - S(t), estimated by
        Kaplan-Meier. This is a probability on a 0-1 scale, not a running count of events:
        a raw count ignores censoring and is not comparable between cohorts of different
        size or follow-up. Read it as "the estimated proportion of the cohort that had had
        the event by time t".


    - name: ch
      title: Cumulative hazard
      type: Bool
      default: false
      description: >-
        Plot cumulative hazard over time. This is an accumulated rate-scale quantity, not an
        event probability, and it is not bounded by 1. Use cumulative event probability for
        the Kaplan-Meier estimate 1 - S(t).


    - name: endplot
      title: Plot End Time
      type: Number
      default: 60
      description: >-
        The maximum time point to include in the survival plots. This is the end time for
        the survival curves and cumulative event/hazard plots, in the selected Time Unit.
        Must be greater than zero; zero or a negative value is rejected rather than drawn.

    - name: ybegin_plot
      title: Start y-axis
      type: Number
      default: 0.00
      description: >-
        The minimum value for the probability y-axis in the Kaplan-Meier,
        cumulative-incidence, and cumulative-event plots. It must be between 0 and 1 and
        below the end value. Cumulative hazard is auto-scaled and the KMunicate-style plot
        manages its own y-axis.

    - name: yend_plot
      title: End y-axis
      type: Number
      default: 1.00
      description: >-
        The maximum value for the probability y-axis in the Kaplan-Meier,
        cumulative-incidence, and cumulative-event plots. It must be between 0 and 1 and
        above the start value. Cumulative hazard is auto-scaled and the KMunicate-style
        plot manages its own y-axis.

    - name: byplot
      title: Time Interval
      type: Number
      default: 12
      description: >-
        The spacing between tick marks on the time axis. Must be greater than zero;
        zero or a negative value is rejected rather than drawn.


    - name: multievent
      title: "Multiple event levels"
      type: Bool
      default: false
      description: >-
        Enable this option to perform survival analysis for datasets with multiple event
        levels. This is useful for competing risk analysis when there are multiple event
        types (e.g., death due to disease, death due to other causes).

    - name: ci95
      title: '95 percent CI'
      type: Bool
      default: false
      description: >-
        Display 95 percent confidence intervals for the plotted estimand: survival in a
        standard analysis or cumulative incidence in a competing-risk analysis.

    - name: risktable
      title: Risktable
      type: Bool
      default: false
      description: >-
        Display the number of subjects still at risk below supported Kaplan-Meier plots.
        This is a count, not a table of probabilities or hazards. A combined risk panel is
        not available for the competing-risk CIF plot; use the cumulative-incidence table
        for counts at selected times.

    - name: censored
      title: Censored
      type: Bool
      default: false
      description: >-
        Enable this option to display censored observations on the survival plots.
        Censored observations have not experienced the modeled event by their last
        observed time; this may reflect administrative censoring, withdrawal, or loss to
        follow-up. They are indicated by ticks on supported Kaplan-Meier curves. This
        display option is not available on the competing-risk CIF plot.

    - name: medianline
      title: Median line
      type: List
      options:
        - title: none
          name: none
        - title: horizontal
          name: h
        - title: vertical
          name: v
        - title: both
          name: hv
      default: none
      description: >-
        Display a horizontal and/or vertical reference line at the Kaplan-Meier median,
        when estimable. On the cumulative-hazard plot the horizontal reference is log(2),
        corresponding to S(t) = 0.5. Median reference lines are not drawn on the
        competing-risk CIF or KMunicate-style plots.


    - name: person_time
      title: "Calculate person-time metrics"
      type: Bool
      default: false
      description: >-
        Enable this option to calculate and display person-time metrics, including
        total follow-up time and crude occurrence/exposure rates. A person-time rate is
        events divided by observed time at risk; it is not an event probability. With
        competing risks it is a crude cause-specific rate for the target event, not the
        cumulative incidence or absolute risk.

    - name: time_intervals
      title: "Time Interval Stratification"
      type: String
      default: '12, 36, 60'
      description: >-
        Time intervals for stratified person-time analysis, as a comma-separated list in
        the selected Time Unit. For example "12, 36, 60" creates the intervals 0-12, 12-36,
        36-60 and 60+. Values are always interpreted in the selected Time Unit; the built-in
        text is 12, 36 and 60 of that unit and is not silently rescaled.
        A zero boundary is silently treated as the origin because the analysis already
        starts at zero. Negative, non-finite, or non-numeric boundaries are ignored with a warning.
        Boundaries at or beyond the longest observed follow-up are also omitted because
        person-time cannot accrue before the start of observation or after the last one.

    - name: rate_multiplier
      title: "Rate Multiplier"
      type: Integer
      default: 100
      description: >-
        Specify the multiplier for incidence rates (e.g., 100 for rates per 100 units of
        person-time in the selected Time Unit, or 1000 for rates per 1000). It is the scale
        the rates are expressed on,
        so it must be greater than zero; a negative or zero value is rejected and the
        person-time analysis is not performed.

    - name: baseline_hazard
      title: "Piecewise hazard-rate analysis"
      type: Bool
      default: false
      description: >-
        Estimate exploratory interval event rates as events divided by exact person-time
        in equal-width intervals. The number of intervals is limited according to the total
        event count to reduce sparsity. These are piecewise occurrence/exposure rates, not exact
        instantaneous hazards or Cox-model coefficients, and should not be used alone to
        choose treatment or surveillance timing. The rate output is not estimated when an
        event occurs at time zero, because such an event is a probability mass at the origin
        rather than a finite continuous hazard.

    - name: hazard_smoothing
      title: "Smoothed hazard function"
      type: Bool
      default: false
      description: >-
        Smooth the equal-width interval rates with a person-time-weighted,
        local-constant LOESS curve. This is an exploratory, bandwidth-dependent trend,
        not an exact instantaneous hazard. At least three usable automatic intervals are
        required; otherwise the plot explains why no curve was estimated. There is no
        proportional-hazards assumption to assess in a single-arm analysis. No curve is
        estimated with zero observed events or an event at time zero.





    - name: showExplanations
      title: "Analysis explanations"
      type: Bool
      default: false
      description: >-
        Display detailed explanations for each analysis component to help
        interpret the statistical methods and results.

    - name: showSummaries
      title: "Natural language summaries"
      type: Bool
      default: false
      description: >-
        Display natural language summaries alongside tables and plots. These
        summaries provide plain-language interpretations of the statistical
        results. Turn off to reduce visual clutter when summaries are not needed.

    - name: advancedDiagnostics
      title: "Descriptive data diagnostics"
      type: Bool
      default: false
      description: >-
        Report cohort size, event count, observed event proportion, follow-up summaries,
        raw-variable completeness, and memory footprint. These are descriptive checks, not
        a validated risk-of-bias assessment; they cannot verify non-informative censoring,
        representativeness, or adequacy for a particular clinical decision.

...
