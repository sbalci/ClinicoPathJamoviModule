---
name:  kappaSizeCI
title: Confidence Interval Approach for the Number of Subjects Required
menuGroup: Power #meddecide
menuSubgroup: Power Analysis by meddecide 
menuSubtitle: Find sample size based on Kappa confidence
version: '1.0.7'
jas: '1.2'


description:
    main: >
        Number of subjects an interobserver agreement study needs for the confidence
        interval around the anticipated kappa (kappa0) to reach the requested precision -
        the confidence-interval approach of the kappaSize package. This is NOT a power
        calculation and tests no hypothesis; use kappaSizePower to size a study for a
        hypothesis test, and kappaSizeFixedN when the number of subjects is already fixed.
    R:
        dontrun: true
        usage: |
            # kappaSize::CIBinary example: anticipated kappa 0.60 to be reported with a
            # 95 percent CI of [0.40, 0.80], 2 raters, trait prevalence 0.20
            kappaSizeCI(
                outcome = "2",
                citype = "two_sided",
                kappa0 = 0.60,
                kappaL = 0.40,
                kappaU = 0.80,
                props = "0.20, 0.80",
                raters = "2",
                alpha = 0.05)

options:
    - name: outcome
      title: Number of outcome level
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
      default: "2"
      description:
          ui: >
              Number of outcome levels (categories) of the rated variable.
          R: >
              Number of outcome levels (categories) of the rated variable.


    # - name: outcome
    #   title: Number of outcome level
    #   type: List
    #   options:
    #   - name: "2"
    #     title: "2"
    #   - name: "3"
    #     title: "3"
    #   - name: "4"
    #     title: "4"
    #   - name: "5"
    #     title: "5"
    #   default: "2"
    #
    #   u.yaml
    #
    # children:
    #   - type: Label
    #     label: Number of outcome level
    #     children:
    #       - type: RadioButton
    #         name: outcome_2
    #         optionName: outcome
    #         optionPart: "2"
    #         label: "2"
    #       - type: RadioButton
    #         name: outcome_3
    #         optionName: outcome
    #         optionPart: "3"
    #         label: "3"
    #       - type: RadioButton
    #         name: outcome_4
    #         optionName: outcome
    #         optionPart: "4"
    #         label: "4"
    #       - type: RadioButton
    #         name: outcome_5
    #         optionName: outcome
    #         optionPart: "5"
    #         label: "5"


    - name: citype
      title: Confidence Interval Type
      type: List
      options:
        - name: two_sided
          title: Two-sided
        - name: one_sided
          title: One-sided (lower bound only)
      default: two_sided
      description:
          ui: >
            Two-sided CI requires both lower and upper limits.
            One-sided CI only requires a lower limit (kappaU is ignored).
          R: >
            Type of confidence interval: 'two_sided' or 'one_sided'.

    - name: kappa0
      title: kappa0
      type: Number
      default: 0.60
      min: 0.01
      max: 0.99
      description:
          ui: >
            The preliminary (anticipated) value of kappa - the agreement you expect,
            around which the confidence interval is planned. It is NOT a null hypothesis
            value; this analysis performs no hypothesis test.
          R: >
            The preliminary (anticipated) value of kappa - the agreement you expect to
            observe, around which the confidence interval is planned. kappaSize documents
            this argument as "the preliminary value of kappa". It is NOT a null hypothesis
            value; contrast kappaSizePower, where kappa0 IS the null being tested.

    - name: kappaL
      title: kappaL
      type: Number
      default: 0.40
      min: 0.01
      max: 0.99
      description:
          ui: >
              Lower confidence limit you want the study to achieve for kappa. It must be
              below kappa0; the sample size is driven by how close it sits to kappa0, not
              by the full interval width.
          R: >
              Lower confidence limit you want the study to achieve for kappa. Must be
              strictly below kappa0. The required sample size grows roughly as one over the
              square of the distance from kappa0 to the nearer limit.

    - name: kappaU
      title: kappaU
      type: Number
      default: 0.80
      min: 0.01
      max: 0.99
      description:
          ui: >
              Upper confidence limit you want the study to achieve for kappa. It must be
              above kappa0, and is ignored for a one-sided interval.
          R: >
              Upper confidence limit you want the study to achieve for kappa. Must be
              strictly above kappa0. Ignored when citype is 'one_sided' (passed to
              kappaSize as NA, which is how that package requests a one-sided bound).

    - name: props
      title: Proportions of outcome level
      type: String
      default: '0.20, 0.80'
      description:
          ui: >
              Anticipated share of subjects in each outcome category, separated by commas,
              semicolons or spaces, using a decimal point, and summing to 1 (for example
              0.20, 0.80 for a finding present in one case in five). For a binary outcome a
              single prevalence is enough. Enter exactly one value per outcome level otherwise.
          R: >
              Anticipated share of subjects in each outcome category as a single string,
              separated by commas, semicolons or spaces, using a decimal point, and summing
              to 1 (for example "0.20, 0.80"). For a binary outcome a single prevalence is
              enough. Enter exactly one value per outcome level otherwise.

    - name: raters
      title: raters
      type: List
      options:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "2"
      description:
              ui: >
                  Number of raters who will each rate every subject (2 to 6).
              R: >
                  Number of raters who will each rate every subject (2 to 6).


    - name: alpha
      title: alpha
      type: Number
      default: 0.05
      min: 0.001
      max: 0.20
      description:
          ui: >
              Significance level of the confidence interval - 0.05 gives a 95 percent interval
              (capped at 0.20).
          R: >
              Significance level of the confidence interval - 0.05 gives a 95 percent interval
              (capped at 0.20). Two-sided intervals use qchisq(1 - alpha, 1); a one-sided
              lower bound uses qchisq(1 - 2*alpha, 1).

...
