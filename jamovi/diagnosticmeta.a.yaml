---
name: diagnosticmeta
title: Diagnostic Test Meta-Analysis for Pathology
menuGroup: OncoPath
menuSubgroup: Meta-Analysis
version: '1.0.8'
jas: '1.2'

description:
    main: |
        Comprehensive meta-analysis of diagnostic test accuracy studies designed for
        pathology research. Performs bivariate random-effects modeling, proportional-hazards SROC analysis,
        meta-regression, and publication bias assessment for AI algorithm validation
        and biomarker diagnostic accuracy synthesis.
    # R:
    #     dontrun: true
    #     usage: |
    #         data('diagnostic_studies')
            
    #         diagnosticmeta(data = diagnostic_studies,
    #                       study = study_name,
    #                       true_positives = tp,
    #                       false_positives = fp,
    #                       false_negatives = fn,
    #                       true_negatives = tn)

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: study
      title: Study identifier
      type: Variable
      default: NULL
      suggested:
          - nominal
      permitted:
          - factor
          - id
      description:
          R: Variable containing unique study identifiers

    - name: true_positives
      title: True Positives (TP)
      type: Variable
      default: NULL
      suggested:
          - continuous
      permitted:
          - numeric
      description:
          R: Number of true positive results in each study

    - name: false_positives
      title: False Positives (FP)
      type: Variable
      default: NULL
      suggested:
          - continuous
      permitted:
          - numeric
      description:
          R: Number of false positive results in each study

    - name: false_negatives
      title: False Negatives (FN)
      type: Variable
      default: NULL
      suggested:
          - continuous
      permitted:
          - numeric
      description:
          R: Number of false negative results in each study

    - name: true_negatives
      title: True Negatives (TN)
      type: Variable
      default: NULL
      suggested:
          - continuous
      permitted:
          - numeric
      description:
          R: Number of true negative results in each study

    - name: covariate
      title: Meta-Regression Covariate
      type: Variable
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor
      default: NULL
      description:
          R: Optional covariate for meta-regression analysis

    - name: bivariate_analysis
      title: Bivariate random-effects model
      type: Bool
      default: true
      description:
          R: Perform bivariate random-effects meta-analysis

    - name: hsroc_analysis
      title: Proportional-hazards SROC analysis
      type: Bool
      default: false
      description:
          R: Perform Holling proportional-hazards summary ROC analysis

    - name: meta_regression
      title: Meta-regression
      type: Bool
      default: false
      description:
          R: Perform meta-regression with specified covariate

    - name: heterogeneity_analysis
      title: Heterogeneity analysis
      type: Bool
      default: false
      description:
          R: Perform heterogeneity analysis including I-squared and Q statistics

    - name: publication_bias
      title: Publication bias assessment
      type: Bool
      default: false
      description:
          R: Assess publication bias using Deeks' funnel plot test

    - name: confidence_level
      title: Confidence level
      type: Integer
      min: 50
      max: 99
      default: 95
      description:
          R: Confidence level for meta-analysis results

    - name: method
      title: Meta-analysis method
      type: List
      options:
          - name: 'reml'
            title: REML (Recommended)
          - name: 'ml'
            title: Maximum likelihood
          - name: 'fixed'
            title: Fixed effects
          - name: 'mm'
            title: Method of Moments
          - name: 'vc'
            title: Variance components
      default: reml
      description:
          R: Method for meta-analysis estimation (Note DerSimonian-Laird is not appropriate for bivariate diagnostic meta-analysis)

    - name: zero_cell_correction
      title: Zero-cell correction method
      type: List
      options:
          - name: 'none'
            title: Default (+0.5 to zero-cell studies at model fit)
          - name: 'constant'
            title: +0.5 to all cells of zero-cell studies
          - name: 'zero_cells'
            title: +0.5 to the zero cells only
          - name: 'reciprocal_n'
            title: +1/N to all cells (N = study size)
      default: none
      description:
          R: |
            Method for handling zero cells in 2x2 tables. 'none' (recommended) applies no correction to the data itself; the normal-approximation models still add 0.5 to studies with a zero cell at fitting time (mada's 'single' correction), which is disclosed in the output. 'constant' adds 0.5 to all four cells of affected studies before any analysis. 'zero_cells' adds 0.5 only to the zero cells themselves. 'reciprocal_n' adds 1/N to all cells of affected studies, where N is the study's total sample size. (The former option keys 'treatment_arm' and 'empirical' were renamed: they did not implement the procedures those names denote in Sweeting et al. 2004.)

    - name: forest_plot
      title: Forest plot
      type: Bool
      default: false
      description:
          R: Generate forest plot for sensitivity and specificity

    - name: sroc_plot
      title: Summary ROC plot
      type: Bool
      default: false
      description:
          R: Generate summary receiver operating characteristic plot

    - name: funnel_plot
      title: Funnel plot
      type: Bool
      default: false
      description:
          R: Generate funnel plot for publication bias assessment

    - name: show_individual_studies
      title: Individual study results
      type: Bool
      default: false
      description:
          R: Display results for individual studies in summary tables

    - name: show_interpretation
      title: Clinical interpretation
      type: Bool
      default: false
      description:
          R: Display clinical interpretation guidelines and recommendations

    - name: show_methodology
      title: Methodology information
      type: Bool
      default: false
      description:
          R: Display detailed methodology and statistical approach information

    - name: show_analysis_summary
      title: Analysis summary
      type: Bool
      default: false
      description:
          R: Display natural language summary of analysis results

    - name: color_palette
      title: Plot color palette
      type: List
      options:
          - name: 'standard'
            title: Standard colors
          - name: 'colorblind_safe'
            title: Color-Blind Safe
          - name: 'high_contrast'
            title: High contrast
          - name: 'viridis'
            title: Viridis (Blue-Purple)
          - name: 'plasma'
            title: Plasma (Purple-Pink)
      default: standard
      description:
          R: Color palette for all plots - choose color-blind safe options for accessibility

    - name: show_plot_explanations
      title: Plot explanations
      type: Bool
      default: false
      description:
          R: Display detailed explanations for all plots including interpretation guidance
