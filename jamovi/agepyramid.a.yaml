---
name:  agepyramid
title: Age Pyramid
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Descriptive Plots
version: '1.0.81'
jas: '1.2'

description:
    main: >
        Generates an age pyramid from an age variable and a gender variable.
    R:
        dontrun: true
        usage: |
            # `female` and `male` are Level options: jamovi forbids a default on
            # them, so they are REQUIRED arguments of this function. They are
            # never read from the level names or order: NULL leaves the analysis
            # waiting (except for a single-gender cohort, see `female`).
            agepyramid(
                data = histopathology,
                age = "Age",
                gender = "Sex",
                female = "Female",
                male = "Male",
                age_groups = "who"
            )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.
          jamovi: >
            The data as a data frame.

    - name: age
      title: Age
      type: Variable
      default: NULL
      suggested: [ continuous ]
      permitted: [ numeric, factor ]
      description:
          R: >
            a string naming the variable from `data` that contains the
            continuous values used for the report
          jamovi: >
            a string naming the variable from `data` that contains the
            continuous values used for the report

    - name: gender
      title: Gender
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            a string naming the variable from `data` that contains the
            categorical values used for the report
          jamovi: >
            a string naming the variable from `data` that contains the
            categorical values used for the report
            
    # allowNone: without it the jamovi client pre-fills a Level option with the
    # variable's first level (levels[0]), so BOTH selectors started on the same
    # level and every new analysis opened on "Female and Male levels must be
    # different". Empty is a waiting state; the levels are never guessed.
    - name: female
      title: Female level
      type: Level
      variable: (gender)
      allowNone: true
      description:
          R: >
            a string naming the level of `gender` that identifies female
            subjects. It must be chosen: it is never read from the level names
            or their order. The argument has no default (jamovi does not allow
            one on a level option), so a call from R must supply it. NULL leaves
            the analysis waiting, with the levels found and their counts listed
            and nothing drawn, unless `male` is set and `gender` has no other
            observed level: that single-gender cohort is drawn on the male side
            only.
          jamovi: >
            The level of the gender variable that identifies female subjects.
            It must be chosen: it is never read from the level names or their
            order. While it is empty the levels found are listed and nothing is
            drawn, unless Male level is set and the data hold no other level,
            in which case the male-only cohort is drawn.

    # allowNone: as `female`.
    - name: male
      title: Male level
      type: Level
      variable: (gender)
      allowNone: true
      description:
          R: >
            a string naming the level of `gender` that identifies male subjects.
            It must be chosen: it is never read from the level names or their
            order. The argument has no default (jamovi does not allow one on a
            level option), so a call from R must supply it. NULL leaves the
            analysis waiting, with the levels found and their counts listed and
            nothing drawn, unless `female` is set and `gender` has no other
            observed level: that single-gender cohort is drawn on the female
            side only.
          jamovi: >
            The level of the gender variable that identifies male subjects.
            It must be chosen: it is never read from the level names or their
            order. While it is empty the levels found are listed and nothing is
            drawn, unless Female level is set and the data hold no other level,
            in which case the female-only cohort is drawn.

    - name: age_groups
      title: Age group preset
      type: List
      options:
        - name: custom
          title: Custom (use bin width)
        - name: who
          title: "WHO/UN standard (0-4, 5-9, ... 85+)"
        - name: who_infant
          title: "WHO abridged (<1, 1-4, 5-9, ... 85+)"
        - name: pediatric
          title: Pediatric (<18)
        - name: reproductive
          title: Reproductive (15-50)
        - name: geriatric
          title: Geriatric (65+)
        - name: lifecourse
          title: Life course
      default: custom
      description:
          R: >
            Predefined age group categories. Choose 'custom' to use bin_width, or select a
            preset. 'who' gives the WHO/UN standard five-year groups (0-4, 5-9, ... 85+) used
            by the WHO World Standard Population and UN population pyramids; 'who_infant' is
            the WHO abridged life-table grouping, which reports infants (<1) separately from
            children aged 1-4. All bands are left-closed, so an age on a boundary starts the
            band named for it.
          jamovi: >
            Predefined age group categories.

    - name: age_interval
      title: Age band boundaries
      type: List
      options:
        - name: left
          title: "Left-closed [0,5) - age 5 starts the next band (WHO/UN standard)"
        - name: right
          title: "Right-closed (0,5] - age 5 closes the band"
      default: left
      description:
          R: >
            Which end of an age band is closed. 'left' gives [lower, upper) bands, the
            WHO/UN and demographic convention: a person aged exactly 65 starts the 65-69
            band, and equal-width bands hold equal numbers of single years. 'right' gives
            (lower, upper] bands, where age 65 closes the band below it; this reproduces
            the behavior of releases before 1.0.52 and makes the lowest band one year
            wider than the others, which inflates the youngest bar of the pyramid.
            Applies to the custom age grouping only: the named presets are defined by
            their sources as left-closed bands, so a right-closed setting is ignored
            for them and a note says so.
          jamovi: >
            Which end of each age band is closed. Left-closed is the WHO/UN standard.
            Applies to the custom age grouping only.

    - name: bin_width
      title: Bin width (years)
      type: Number
      default: 5
      # Only non-positive widths are actually invalid (the backend rejects those
      # with a clear message). Fractional widths are legitimate - 0.25 gives
      # three-month bands for neonatal work - so no upper bound is imposed and
      # the lower bound only keeps obviously-broken entry out of the GUI.
      min: 0.01
      description:
          R: >
            The width of the age bins in years. Adjust this to change the granularity
            of the age groups. Ignored while `custom_breaks` is filled in. A width that
            would produce more than 200 age bands is refused with an explanatory note, and
            more than 25 bands raises a warning about how thin the bars become.
          jamovi: >
            The width of the age bins in years. Ignored when Custom age breaks is filled in.

    - name: custom_breaks
      title: Custom age breaks
      type: String
      default: ""
      description:
          R: >
            Comma-separated age break points (e.g., "0,18,25,50,65,100").
            Only used when age_groups is set to 'custom'. When filled in these override
            bin_width; leave empty to use bin_width. Entries that are not numbers are
            reported in a note and left out, and the top band is always open-ended.
          jamovi: >
            Comma-separated age break points (e.g., 0,18,25,50,65,100).
            When filled in, these override the bin width.

    - name: pct_base
      title: Percentage base
      type: List
      options:
        - name: within_gender
          title: Within each gender (each column sums to 100%)
        - name: total
          title: Of all observations (both columns together sum to 100%)
      default: within_gender
      description:
          R: >
            Denominator of the percentage columns and of the percent axis of the plots.
            'within_gender' divides each band by the number of that gender, so the Female
            and Male columns each sum to 100 and the two sides compare the shape of the
            two age distributions. 'total' divides every band by the number of analyzed
            observations, so both columns together sum to 100 and the sides also reflect
            how many of each gender there are; the Total row then shows each gender's share.
          jamovi: >
            Denominator of the percentages: within each gender (each column sums to 100%)
            or of all analyzed observations (both columns together sum to 100%).

    - name: plot_values
      title: Bar values
      type: List
      options:
        - name: count
          title: Counts
        - name: percent
          title: Percentages (using the percentage base)
      default: count
      description:
          R: >
            Whether the bars of the pyramid show counts or the percentages defined by
            pct_base. Percentages make the two sides comparable when the genders are
            unequal in number. Applies to both the main and the ggcharts pyramid.
          jamovi: >
            Show counts or percentages on the bars of both pyramids.

    - name: plot_title
      title: Plot title
      type: String
      default: "Age Pyramid"
      description:
          R: >
            The title displayed on the age pyramid plot.
          jamovi: >
            The title displayed on the age pyramid plot.

    - name: color_palette
      title: Color palette
      type: List
      options:
        - name: standard
          title: Standard (pink/blue)
        - name: colorblind
          title: Colorblind-friendly
        - name: grayscale
          title: Grayscale
        - name: custom
          title: Custom colors
      default: standard
      description:
          R: >
            Color palette for gender visualization. Choose 'custom' to specify your own colors.
          jamovi: >
            Color palette for gender visualization.

    - name: female_color
      title: Female color
      type: String
      default: "#E91E63"
      description:
          R: >
            Custom color for female bars (hex code). Only used when color_palette is 'custom'.
          jamovi: >
            Custom color for female bars (hex code).

    - name: male_color
      title: Male color
      type: String
      default: "#2196F3"
      description:
          R: >
            Custom color for male bars (hex code). Only used when color_palette is 'custom'.
          jamovi: >
            Custom color for male bars (hex code).

    - name: originaltheme
      title: Original custom theme
      type: Bool
      default: false
      description:
          R: >
            Whether to apply the original custom theme (theme_minimal with custom tweaks)
            instead of jamovi's default theme.
          jamovi: >
            Use original custom theme instead of jamovi's default theme.

    # ---- GGCharts Pyramid Options ----

    - name: enableGGCharts
      title: ggcharts pyramid
      type: Bool
      default: false
      description:
          R: >
            Enable the ggcharts pyramid_chart() visualization as a second plot.
            This provides an alternative visualization style using the ggcharts package.
          jamovi: >
            Show ggcharts pyramid as a second plot option.

    - name: ggcharts_sort
      title: Bar order
      type: List
      options:
        - name: 'no'
          title: No sorting
        - name: ascending
          title: Ascending
        - name: descending
          title: Descending
      default: 'no'
      description:
          R: >
            Sort bars by population count. Options: 'no' (default order),
            'ascending' (smallest to largest), 'descending' (largest to smallest).
          jamovi: >
            Sort bars by population count.

    - name: ggcharts_colors
      title: Bar colors
      type: List
      options:
        - name: default
          title: Default (blue/orange)
        - name: standard
          title: Standard (pink/blue)
        - name: colorblind
          title: Colorblind-friendly
        - name: grayscale
          title: Grayscale
        - name: custom
          title: Custom colors
      default: default
      description:
          R: >
            Color scheme for ggcharts pyramid. 'default' uses ggcharts defaults,
            or select from preset palettes or custom colors.
          jamovi: >
            Color scheme for the ggcharts pyramid.

    - name: ggcharts_color1
      title: First group color
      type: String
      default: "#1F77B4"
      description:
          R: >
            Custom color for first group (hex code). Used when ggcharts_colors is 'custom'.
          jamovi: >
            Custom color for first group (hex code).

    - name: ggcharts_color2
      title: Second group color
      type: String
      default: "#FF7F0E"
      description:
          R: >
            Custom color for second group (hex code). Used when ggcharts_colors is 'custom'.
          jamovi: >
            Custom color for second group (hex code).

    - name: ggcharts_title
      title: ggcharts plot title
      type: String
      default: "Age Pyramid (ggcharts)"
      description:
          R: >
            Title for the ggcharts pyramid plot.
          jamovi: >
            Title for the ggcharts pyramid plot.

    - name: ggcharts_xlab
      title: X-axis label
      type: String
      default: "Population"
      description:
          R: >
            X-axis label for ggcharts pyramid.
          jamovi: >
            X-axis label for ggcharts pyramid.



...
