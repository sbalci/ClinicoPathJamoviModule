title: Single Arm Survival
name: singlearm
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Time Elapsed
        children:
          - type: VariablesListBox
            name: elapsedtime
            maxItemCount: 1
            isTarget: true
            enable: (!tint)
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
            fitToGrid: true
          - type: LevelSelector
            name: outcomeLevel
            enable: (outcome && !multievent)
  - type: CollapseBox
    label: Advanced Elapsed Time Options
    collapsed: true
    stretchFactor: 1
    children:
      - type: Label
        label: Time Interval
        fitToGrid: true
        stretchFactor: 1
        children:
          - type: LayoutBox
            margin: large
            stretchFactor: 1
            children:
              - type: CheckBox
                name: tint
                label: Survival time from dates
                fitToGrid: true
              - type: Label
                label: Date Variables
                fitToGrid: true
                stretchFactor: 1
                children:
                  - type: VariableSupplier
                    persistentItems: false
                    stretchFactor: 1
                    children:
                      - type: TargetLayoutBox
                        children:
                          - type: VariablesListBox
                            name: dxdate
                            maxItemCount: 1
                            isTarget: true
                            enable: (tint)
                            fitToGrid: true
                            stretchFactor: 1
                      - type: TargetLayoutBox
                        children:
                          - type: VariablesListBox
                            name: fudate
                            maxItemCount: 1
                            isTarget: true
                            enable: (tint)
                            fitToGrid: true
                            stretchFactor: 1
              - type: Label
                label: Time Type
                fitToGrid: true
                stretchFactor: 1
                children:
                  - type: LayoutBox
                    margin: large
                    fitToGrid: true
                    children:
                      - type: ComboBox
                        name: timetypedata
                        enable: (tint)
                      # NOT enable: (tint). With pre-calculated elapsed time
                      # this box declares the unit the time column is already
                      # recorded in -- it drives cutpoint scaling, follow-up
                      # thresholds and axis labels. Disabling it pinned every
                      # such analysis to "months", so a column of days was
                      # reported as months with no way to say otherwise.
                      - type: ComboBox
                        name: timetypeoutput
      - type: Label
        label: Landmark time
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: uselandmark
                label: Landmark time
                children:
                  - type: TextBox
                    name: landmark
                    format: number
                    enable: (uselandmark)
      - type: Label
        label: Calculated Time to Data
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Output
                name: calculatedtime
                enable: (tint)
  - type: CollapseBox
    label: Analysis with Multiple Outcomes
    collapsed: true
    children:
      - type: Label
        label: Multiple Event Levels
        fitToGrid: true
        children:
          - type: CheckBox
            name: multievent
            enable: (outcome)
          - type: LayoutBox
            fitToGrid: true
            children:
              - type: LevelSelector
                name: dod
                enable: (outcome && multievent)
              - type: LevelSelector
                name: dooc
                enable: (outcome && multievent)
              - type: LevelSelector
                name: awd
                enable: (outcome && multievent)
              - type: LevelSelector
                name: awod
                enable: (outcome && multievent)
      - type: Label
        label: Analysis Type
        children:
          - type: ComboBox
            name: analysistype
            enable: (outcome && multievent)
      - type: Label
        label: Calculated Outcome to Data
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: Output
                name: outcomeredefined
                enable: (outcome && multievent)
  - type: CollapseBox
    label: Plots
    collapsed: true
    children:
      - type: Label
        label: Plots
        fitToGrid: true
        children:
          - type: LayoutBox
            fitToGrid: true
            children:
              # `sc` is deliberately NOT gated: under competing risks it
              # switches to the Cumulative Incidence Function output
              # (plot_cif in singlearm.r.yaml).
              #
              # The other four assume a single event type. Under competing
              # risks the outcome is coded 0/1/2 and survival::Surv() would
              # silently plot it inverted, so they are disabled here rather
              # than left tickable and answered with a refusal panel.
              # The backend refusals in singlearm.b.R stay in place: a stale
              # .omv or an R-syntax call can still reach the renderers with
              # these options TRUE, and a silent empty panel would be worse
              # than the refusal.
              - type: CheckBox
                name: sc
              - type: CheckBox
                name: kmunicate
                enable: (!multievent || analysistype:overall || analysistype:cause || analysistype:dfs)
              - type: CheckBox
                name: ce
                enable: (!multievent || analysistype:overall || analysistype:cause || analysistype:dfs)
              - type: CheckBox
                name: ch
                enable: (!multievent || analysistype:overall || analysistype:cause || analysistype:dfs)
      - type: Label
        label: Plot Arguments
        children:
          - type: LayoutBox
            fitToGrid: true
            children:
              - type: TextBox
                name: endplot
                format: number
              - type: TextBox
                name: byplot
                format: number
              - type: TextBox
                name: ybegin_plot
                format: number
              - type: TextBox
                name: yend_plot
                format: number
              - type: CheckBox
                name: ci95
              - type: CheckBox
                name: risktable
                label: "Risk table"
              - type: CheckBox
                name: censored
                label: "Censored observations"
              - type: ComboBox
                name: medianline
  - type: CollapseBox
    label: Survival Tables
    collapsed: true
    children:
      - type: Label
        label: Survival table
        children:
          - type: TextBox
            name: cutp
            format: string
            width: large
  - type: CollapseBox
    label: Person-Time Analysis
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: person_time
            label: Person-time metrics
          - type: TextBox
            name: time_intervals
            format: string
            enable: (person_time)
            width: large
          - type: TextBox
            name: rate_multiplier
            format: number
            enable: (person_time)
  - type: CollapseBox
    label: Hazard Analysis
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          # Both hazard estimators assume a single event type; see the note on
          # the plot checkboxes above. Backend refusals kept as the safety net.
          - type: CheckBox
            name: baseline_hazard
            enable: (!multievent || analysistype:overall || analysistype:cause || analysistype:dfs)
          - type: CheckBox
            name: hazard_smoothing
            enable: (!multievent || analysistype:overall || analysistype:cause || analysistype:dfs)
  - type: CollapseBox
    label: Detailed Output
    collapsed: false
    children:
      - type: Label
        label: Display Options
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: showSummaries
                label: Natural language summaries
              - type: CheckBox
                name: showExplanations
                label: Analysis explanations
              - type: CheckBox
                name: advancedDiagnostics
