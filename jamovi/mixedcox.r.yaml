    - name: modelSummary
      title: 'Mixed-Effects Cox Model Summary'
      type: Html
      clearWith:
          - cluster_var
          - random_effects
          - fixed_effects
          - continuous_effects
          - outcome
          - elapsedtime

    - name: fixedEffectsTable
      title: 'Fixed Effects Coefficients'
      type: Table
      visible: (show_fixed_effects)
      rows: 0
      columns:
        - name: variable
          title: "Variable"
          type: text
        - name: coefficient
          title: "Coefficient"
          type: number
        - name: se
          title: "SE"
          type: number
        - name: z_statistic
          title: "Z-statistic"
          type: number
        - name: p_value
          title: "P-value"
          type: number
          format: zto,pvalue
        - name: hazard_ratio
          title: "Hazard Ratio"
          type: number
      clearWith:
        - fixed_effects
        - continuous_effects
        - cluster_var
        - random_effects

    - name: randomEffectsSummary
      title: 'Random Effects Variance Components'
      type: Html
      visible: (show_random_effects)
      clearWith:
          - cluster_var
          - random_effects
          - random_slope_var
          - nested_clustering

    - name: modelComparison
      title: 'Model Comparison: Mixed vs Standard Cox'
      type: Html
      visible: (show_model_comparison)
      clearWith:
          - cluster_var
          - random_effects
          - show_model_comparison

