items:

    - name:  todo
      title: To Do
      type:  Html
      clearWith:
          - outcome
          - outcomeLevel
          - elapsedtime
          - fixed_effects
          - continuous_effects
          - cluster_var
          - random_effects
          - fudate
          - dxdate
