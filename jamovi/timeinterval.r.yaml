---
name:  timeinterval
title: Comprehensive Time Interval Calculator
jrs:   '1.1'

items:
    # === MESSAGES HTML (for errors, warnings, info) ===
    - name: messages
      type: Html

    # === HTML PANELS ===
    - name: todo
      title: 'Getting Started'
      type: Html

    - name: aboutPanel
      title: About This Analysis
      type: Html

    - name: personTimeInfo
      title: Understanding Person-Time Analysis
      type: Html

    - name: qualityAssessment
      title: Data Quality Assessment
      type: Html
      visible: (include_quality_metrics)

    - name: caveatsPanel
      title: Caveats & Assumptions
      type: Html
      visible: (include_quality_metrics)

    - name: summary
      title: Statistical Summary & Person-Time Analysis
      type: Html

    - name: nlSummary
      title: Clinical Summary (Copy-Ready)
      type: Html
      visible: (show_summary)

    - name: glossaryPanel
      title: 'Key Terms & Concepts'
      type: Html
      visible: (show_glossary)

    # varTitle/varDescription are STATIC. Do NOT copy survival.r.yaml's
    # `${ dxdate }` idiom here: jmvcore::format's placeholder regex is
    # \{ *[A-Za-z][A-Za-z0-9]* *\} -- no underscore -- and every option name in this
    # analysis is underscored, so `${ dx_date }` would ship to jamovi verbatim as
    # the column name. The output unit is applied at runtime with setTitle() instead.
    - name: calculated_time
      title: Calculated Time Intervals
      type: Output
      varTitle: Calculated Time Interval
      varDescription: Time interval calculated from the start and end date variables
      measureType: continuous
      clearWith:
          - calculated_time
          - dx_date
          - fu_date
          - time_format
          - output_unit
          - time_basis
          - use_landmark
          - landmark_time
          - remove_negative
          - remove_extreme
          - extreme_multiplier
          - timezone

refs:
    - ClinicoPathJamoviModule
    - lubridate

    

    - glue
...
