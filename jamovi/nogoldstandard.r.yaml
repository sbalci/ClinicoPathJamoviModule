---
name: nogoldstandard
title: Analysis Without Gold Standard
jrs: '1.1'

items:
    - name: notices
      title: Important Information
      type: Preformatted
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed

    - name: instructions
      title: Instructions
      type: Html
      visible: true

    - name: agreement_stats
      title: Agreement Statistics (Cohen's Kappa)
      type: Table
      visible: true
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed
      columns:
        - name: test_pair
          title: Test Pair
          type: text
        - name: kappa
          title: Kappa
          type: number
        - name: p_value
          title: p-value
          type: number
          format: zto,pvalue
        - name: agreement
          title: Agreement
          type: number
          format: pc

    - name: clinical_summary
      title: Clinical Summary
      type: Html
      visible: false

    - name: method_guide
      title: Method Selection Guide
      type: Html
      visible: true

    - name: prevalence
      title: Disease Prevalence
      type: Table
      rows: 1
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed
      columns:
        - name: estimate
          title: Estimate
          type: number
          format: pc
        - name: ci_lower
          title: Lower CI
          type: number
          format: pc
        - name: ci_upper
          title: Upper CI
          type: number
          format: pc

    - name: test_metrics
      title: Test Performance Metrics
      type: Table
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed
      columns:
        - name: test
          title: Test
          type: text
        - name: sensitivity
          title: Sensitivity
          type: number
          format: pc
        - name: sens_ci_lower
          title: Lower CI
          superTitle: Sensitivity
          type: number
          format: pc
        - name: sens_ci_upper
          title: Upper CI
          superTitle: Sensitivity
          type: number
          format: pc
        - name: specificity  
          title: Specificity
          type: number
          format: pc
        - name: spec_ci_lower
          title: Lower CI
          superTitle: Specificity
          type: number
          format: pc
        - name: spec_ci_upper
          title: Upper CI
          superTitle: Specificity
          type: number
          format: pc
        - name: ppv
          title: PPV
          type: number
          format: pc
        - name: npv
          title: NPV
          type: number
          format: pc

    - name: model_fit
      title: Model Fit Statistics
      type: Table
      visible: (method=="latent_class")
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed
      columns:
        - name: statistic
          title: Statistic
          type: text
        - name: value
          title: Value
          type: number

    - name: conditional_dependence
      title: 'Conditional Independence Check (Bivariate Residuals)'
      type: Table
      rows: 0
      visible: (method=="latent_class")
      columns:
        - name: pair
          title: 'Test Pair'
          type: text
        - name: bvr
          title: 'Bivariate Residual'
          type: number
        - name: verdict
          title: 'Interpretation'
          type: text
      description: 'Latent class analysis assumes the tests err independently given true disease status. For each pair this compares the observed two-way table with the one the fitted model implies; a residual above 3.84 (the 5 percent point of chi-squared on 1 degree of freedom) is evidence that the pair shares a source of error, which inflates the estimated accuracy. Requires four or more tests: with three the model is just-identified and reproduces every table exactly, so no residual can reveal dependence.'

    - name: diagnostics
      title: 'Analysis Diagnostics'
      type: Preformatted
      visible: (verbose)
      description: 'Detail of how the estimates were produced: sample size, method, convergence, number of random starts used, and bootstrap failures. Shown only when Verbose output is enabled.'
      clearWith:
        - verbose
        - method
        - bootstrap
        - nboot
        - seed

    - name: crosstab
      title: Test Cross-Tabulation
      type: Table
      visible: true
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed
      columns:
        - name: test_combination
          title: Test Combination
          type: text
        - name: count
          title: Count
          type: integer
        - name: percentage
          title: Percentage
          type: number
          format: pc

    - name: agreement_plot
      title: Test Agreement Plot (Base)
      type: Image
      renderFun: .plot
      width: 500
      height: 400
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed

    - name: agreement_plot2
      title: Test Agreement Plot (ggplot2)
      type: Image
      renderFun: .plot_ggplot
      width: 500
      height: 400
      clearWith:
        - clinicalPreset
        - test1
        - test1Positive
        - test2
        - test2Positive
        - test3
        - test3Positive
        - test4
        - test4Positive
        - test5
        - test5Positive
        - method
        - bootstrap
        - nboot
        - alpha
        - seed




