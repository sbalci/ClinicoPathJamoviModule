---
name: decisioncompare
title: Compare Medical Decision Tests
menuGroup: meddecide
menuSubgroup: Decision
menuSubtitle: Compare sensitivity, specificity, PPV, NPV, ...
version: '1.0.8'
jas: '1.2'

description:
    main: >
        Function for comparing multiple Medical Decision Tests. Compares sensitivity, specificity, positive predictive value,
        negative predictive value, and other metrics between different tests against the same gold standard.
        Includes statistical comparison using McNemar's test and confidence intervals for differences.
    R:
        dontrun: true
        usage: |
            # Level arguments are explicit in the generated R API. Pass NULL for
            # unused negative levels and for the optional third test selectors.
            decisioncompare(
                data = histopathology,
                gold = "Golden Standart",
                goldPositive = "1",
                goldNegative = NULL,
                test1 = "New Test",
                test1Positive = "1",
                test1Negative = NULL,
                test2 = "Rater 1",
                test2Positive = "1",
                test2Negative = NULL,
                test3 = NULL,
                test3Positive = NULL,
                test3Negative = NULL,
                statComp = TRUE
            )

options:

    - name: data
      type: Data
      description:
          R: The data as a data frame.

    - name: gold
      title: Gold Standard (Reference Test)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          ui: >
            Select the most reliable diagnostic method available (e.g., biopsy, final pathology, 
            expert consensus). This is the "truth" against which we compare other tests. 
            The selected positive level is compared with the remaining levels; if
            indeterminate values should be excluded, also select explicit negative levels.
          R: >
            The gold standard reference variable representing true disease status.

    - name: goldPositive
      title: Disease present level
      type: Level
      variable: (gold)
      description:
          ui: >
            Select the level that indicates disease IS PRESENT in your gold standard variable 
            (e.g., "positive", "malignant", "1"). This represents the condition you want to detect.
          R: >
            The level indicating presence of disease in the gold standard variable.

    - name: goldNegative
      title: Disease absent level
      type: Level
      variable: (gold)
      description:
          ui: >
            Optional. Select the level that indicates disease is ABSENT in the gold standard variable. Only needed when the
            variable has more than two levels and you want "Exclude
            indeterminate/Equivocal levels" to drop the remaining (equivocal)
            rows instead of counting them as negative.
          R: >
            The level indicating disease is ABSENT in the gold standard variable. Required for excludeIndeterminate to act on a
            variable with more than two levels; pass NULL when not used.

    # For the first test

    - name: test1
      title: Test 1 (Required)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          ui: >
            Select the first diagnostic test to evaluate (e.g., imaging result, biomarker, 
            clinical assessment). This should be a test you want to validate against the gold standard.
          R: >
            The first diagnostic test variable being evaluated for performance.

    - name: test1Positive
      title: Test 1 Positive Level
      type: Level
      variable: (test1)
      description:
          ui: >
            Select the level that represents a POSITIVE result for Test 1 
            (e.g., "abnormal", "high", "positive"). This should indicate suspected disease presence.
          R: >
            The level representing a positive result for Test 1.

    - name: test1Negative
      title: Test 1 Negative Level
      type: Level
      variable: (test1)
      description:
          ui: >
            Optional. Select the level that indicates a NEGATIVE result for test 1. Only needed when the
            variable has more than two levels and you want "Exclude
            indeterminate/Equivocal levels" to drop the remaining (equivocal)
            rows instead of counting them as negative.
          R: >
            The level indicating a NEGATIVE result for test 1. Required for excludeIndeterminate to act on a
            variable with more than two levels; pass NULL when not used.

    # For the second test

    - name: test2
      title: Test 2 (Required for Comparison)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          ui: >
            Select a second diagnostic test to compare with Test 1. This enables head-to-head 
            comparison analysis (e.g., new method vs standard method, or two different biomarkers).
          R: >
            The second diagnostic test variable for comparison analysis.

    - name: test2Positive
      title: Test 2 Positive Level
      type: Level
      variable: (test2)
      description:
          ui: >
            Select the level that represents a POSITIVE result for Test 2.
          R: >
            The level representing a positive result for Test 2.

    - name: test2Negative
      title: Test 2 Negative Level
      type: Level
      variable: (test2)
      description:
          ui: >
            Optional. Select the level that indicates a NEGATIVE result for test 2. Only needed when the
            variable has more than two levels and you want "Exclude
            indeterminate/Equivocal levels" to drop the remaining (equivocal)
            rows instead of counting them as negative.
          R: >
            The level indicating a NEGATIVE result for test 2. Required for excludeIndeterminate to act on a
            variable with more than two levels; pass NULL when not used.

    # For the third test

    - name: test3
      title: Test 3 (Optional)
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          ui: >
            Optionally select a third diagnostic test for three-way comparison. 
            This allows comprehensive evaluation of multiple testing strategies simultaneously.
          R: >
            Optional third diagnostic test variable for extended comparison analysis.

    - name: test3Positive
      title: Test 3 Positive Level
      type: Level
      variable: (test3)
      description:
          ui: >
            Select the level that represents a POSITIVE result for Test 3.
          R: >
            The level representing a positive result for Test 3.

    # Options

    - name: test3Negative
      title: Test 3 Negative Level
      type: Level
      variable: (test3)
      description:
          ui: >
            Optional. Select the level that indicates a NEGATIVE result for test 3. Only needed when the
            variable has more than two levels and you want "Exclude
            indeterminate/Equivocal levels" to drop the remaining (equivocal)
            rows instead of counting them as negative.
          R: >
            The level indicating a NEGATIVE result for test 3. Required for excludeIndeterminate to act on a
            variable with more than two levels; pass NULL when not used.

    - name: pp
      title: Prior probability (prevalence)
      type: Bool
      default: false
      description:
          ui: >
            Enable custom disease prevalence for calculating PPV and NPV. 
            Use when your study population differs from the dataset prevalence 
            (e.g., screening vs high-risk populations).
          R: >
            Enable custom prior probability (prevalence) for predictive value calculations.

    - name: pprob
      title: Prior probability (prevalence)
      type: Number
      default: 0.300
      min: 0.001
      max: 0.999
      description:
          ui: >
            Prior probability (disease prevalence in the community).
            Requires a value between 0.001 and 0.999, default 0.300.
          R: >
            Prior probability (disease prevalence in the community).
            Requires a value between 0.001 and 0.999, default 0.300.

    - name: od
      title: Original data
      type: Bool
      default: false
      description:
          R: >
            Boolean selection whether to show frequency tables. Default is 'false'.

    - name: fnote
      title: Footnotes
      type: Bool
      default: false
      description:
          ui: Add definitions and prevalence-source notes to the comparison table.
          R: Boolean indicating whether table footnotes should be displayed.

    - name: ci
      title: '95 percent CI'
      type: Bool
      default: false
      description:
          ui: Show 95 percent confidence intervals for per-test diagnostic accuracy estimates.
          R: Boolean indicating whether confidence interval tables should be displayed.

    - name: plot
      title: "Comparison plot"
      type: Bool
      default: false
      description:
          ui: >
            Generate bar chart comparing test performance metrics side-by-side. 
            Useful for visualizing differences in sensitivity, specificity, PPV, NPV, and accuracy.
          R: >
            Generate comparison plot showing test performance metrics.

    - name: excludeIndeterminate
      title: Exclude indeterminate/Equivocal levels
      type: Bool
      default: false
      description:
          ui: >
            When a test or the gold standard has more than two levels (e.g., indeterminate/equivocal), exclude those rows instead of treating them as negative.
          R: >
            If TRUE, drop rows where test/gold values are neither the specified positive level nor a clear negative level to avoid inflating specificity/NPV from equivocal results.

    - name: radarplot
      title: "Radar plot"
      type: Bool
      default: false
      description:
          ui: >
            Generate radar (spider) plot showing all performance metrics on a circular scale.
            Excellent for comprehensive visual comparison and identifying test strengths/weaknesses.
          R: >
            Generate radar plot for comprehensive test comparison visualization.

    - name: heatmap
      title: "Concordance heatmap"
      type: Bool
      default: false
      description:
          ui: >
            Generate a per-case heatmap showing each test's result versus the gold standard
            for every sample. Samples are sorted by gold standard result. Reveals agreement
            patterns and identifies cases where specific tests disagree.
          R: >
            Generate concordance heatmap comparing per-case test results against gold standard.

    - name: opa
      title: "Overall percent agreement with CI"
      type: Bool
      default: false
      description:
          ui: >
            Show overall percent agreement (OPA) between each test and the gold standard
            with 95 percent confidence intervals. OPA is the proportion of cases where
            the test and gold standard agree. Unlike kappa, OPA does not correct for
            chance agreement.
          R: >
            Show overall percent agreement with 95 percent confidence intervals for each test.

    - name: niMargin
      title: Minimum acceptable OPA (percent)
      type: Number
      default: 75
      min: 50
      max: 99
      description:
          ui: >
            User-specified descriptive criterion for overall percent agreement. The
            criterion is met when the lower 95 percent confidence bound exceeds this value.
            This is not a noninferiority comparison against another test and is not
            regulatory or clinical guidance.
          R: >
            Minimum acceptable OPA percentage (default 75). Retains the niMargin option
            name for compatibility with saved analyses.

    - name: useOpaCriterion
      title: Minimum OPA criterion
      type: Bool
      default: false
      description:
          ui: >
            Compare the lower OPA confidence bound with the user-specified descriptive
            criterion. This optional criterion is not a noninferiority comparison,
            regulatory guidance, or clinical guidance.
          R: >
            Whether to apply the descriptive minimum OPA criterion.

    - name: ciMethod
      title: CI Method for Agreement
      type: List
      options:
        - title: Wilson Score
          name: wilson
        - title: Logit
          name: logit
        - title: Clopper-Pearson (Exact)
          name: exact
      default: wilson
      description:
          ui: >
            Method for computing confidence intervals for agreement proportions.
            Wilson score is recommended for most cases. Logit is preferred when
            proportions are near 0 or 1 (common in high-agreement studies).
            Clopper-Pearson (Exact) is the most conservative.
          R: >
            CI method: wilson, logit, or exact (Clopper-Pearson).

    - name: stratify
      title: Stratification Variable
      type: Variable
      default: NULL
      suggested: [ nominal ]
      permitted: [ factor ]
      description:
          ui: >
            Optional variable to stratify comparison metrics by subgroup (e.g.,
            specimen type, histologic type, site). Computes separate sensitivity,
            specificity, accuracy, and OPA within each subgroup level.
          R: >
            Optional stratification variable for subgroup-specific diagnostic accuracy analysis.

    - name: statComp
      title: "Statistical comparison"
      type: Bool
      default: false
      description:
          ui: >
            Perform McNemar's test to statistically compare test performance.
            Use when you need to determine if differences between tests are
            statistically significant (p<0.05 indicates significant difference).
            Also provides confidence intervals for metric differences.
          R: >
            Perform statistical comparison between tests (McNemar's test and confidence intervals for differences).

    - name: showSummary
      title: "Summary"
      type: Bool
      default: false
      description:
          ui: >
            Display a plain-language summary paragraph of comparison results.
            Useful for reading the statistical comparison at a glance without
            needing to interpret every table cell.
          R: >
            Boolean to show natural language summary of statistical comparisons.

    - name: showExplanations
      title: "Explanations"
      type: Bool
      default: false
      description:
          ui: >
            Display educational content including statistical glossary, assumptions,
            and interpretation guidance. Helpful for understanding what each test means
            and how to interpret the results clinically.
          R: >
            Boolean to show explanations, glossary, and educational content.

    - name: showReportSentence
      title: "Report sentence"
      type: Bool
      default: false
      description:
          ui: >
            Generate manuscript-ready sentences describing the statistical comparison results.
            Useful for drafting methods and results sections of research papers.
          R: >
            Boolean to show manuscript-ready report sentence.

    - name: showDescriptiveReport
      title: "Descriptive report templates"
      type: Bool
      default: false
      description:
          ui: >
            Display a longer descriptive performance summary with methods and results
            templates. The text is an editable reporting aid, not clinical guidance.
          R: >
            Boolean to show the longer descriptive report templates.
...
