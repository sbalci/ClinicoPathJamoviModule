---
name:  pathagreement
title: Pathology Interrater Reliability
menuGroup: OncoPathT
menuSubgroup: Agreement
menuSubtitle: Agreement on Categorical and Ordinal Data
version: '1.0.9'
jas: '1.2'

description:
    main: |
        Interrater reliability analysis including Cohen's kappa (2 raters),
        Fleiss' kappa (3+ raters), Krippendorff's alpha, and consensus analysis.
        Provides agreement statistics, visualization, and clinical
        interpretation for categorical rating data. Optional independent-reader
        workflows report disease-positive accuracy and binary, ordinal or numeric
        cutoff disagreement with explicit case populations and exploratory cluster
        intervals. The default retains standard categorical agreement.
    R:
        dontrun: true
        usage: |
            data('ihc_reader_reproducibility', package = 'ClinicoPath')
            pathagreement(ihc_reader_reproducibility,
                readerWorkflow = 'numeric_cutoff',
                readerScores = c('score1', 'score2', 'score3'),
                clinicalCutoff = '50', positiveRule = 'ge', nearCutoffWidth = '5',
                referenceStandard = 'reference', referencePositive = 'Present',
                referenceNegative = 'Absent', caseID = 'case_id',
                readerCluster = 'patient_id', readerBootstrap = TRUE,
                bootstrapSamples = 1000, seed = 42)
    # R:
    #     dontrun: true
    #     usage: |
    #         # Load example data
    #         data('pathology_ratings', package = 'ClinicoPath')

    #         # Basic agreement analysis with 2 raters
    #         pathagreement(pathology_ratings,
    #                   vars = c('rater1', 'rater2'))

    #         # Advanced analysis with 3+ raters including visualization
    #         pathagreement(pathology_ratings,
    #                   vars = c('rater1', 'rater2', 'rater3'),
    #                   multiraterMethod = 'fleiss',
    #                   fleissCI = TRUE,
    #                   heatmap = TRUE,
    #                   heatmapDetails = TRUE,
    #                   sft = TRUE)
            
    #         # Krippendorff's alpha for ordinal data
    #         pathagreement(pathology_ratings,
    #                   vars = c('rater1', 'rater2', 'rater3'),
    #                   multiraterMethod = 'krippendorff',
    #                   kripp = TRUE,
    #                   krippMethod = 'ordinal')
            
    #         # Consensus analysis
    #         pathagreement(pathology_ratings,
    #                   vars = c('rater1', 'rater2', 'rater3'),
    #                   consensus = TRUE,
    #                   consensus_method = 'majority',
    #                   tie_breaking = 'arbitration',
    #                   show_consensus_table = TRUE)


options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame. Each row represents a case/subject, and columns represent different raters/observers.

    - name: vars
      title: Raters/Observers
      type: Variables
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Variables representing different raters/observers. Each variable should contain the ratings/diagnoses 
            given by each observer for the same set of cases.


    - name: sft
      title: Frequency Tables
      type: Bool
      default: false
      description:
          R: >
            Show frequency tables for each rater and cross-tabulation tables for pairwise comparisons.

    - name: heatmap
      title: Agreement Heatmap
      type: Bool
      default: false
      description:
          R: >
            Show agreement heatmap visualization with color-coded agreement levels.

    - name: heatmapDetails
      title: Show Detailed Heatmap
      type: Bool
      default: false
      description:
          R: >
            Show kappa values as text on the agreement heatmap for all rater pairs.

    - name: heatmapTheme
      title: Heatmap Color Theme
      type: List
      options:
        - title: Viridis (colorblind-safe)
          name: viridis
        - title: Plasma (colorblind-safe)
          name: plasma
        - title: Cividis (colorblind-safe)
          name: cividis
        - title: Blue-White-Red
          name: bwr
        - title: Red-Yellow-Green (classic)
          name: ryg
      default: viridis
      description:
          R: >
            Choose color scheme for the agreement heatmap visualization.

    - name: wght
      title: Weighted Kappa (Ordinal Variables only)
      type: List
      options:
        - title: Unweighted
          name: unweighted
        - title: Squared
          name: squared
        - title: Equal/Linear
          name: equal
      default: unweighted
      description:
          R: >
            Weighting scheme for kappa analysis. Use 'squared' or 'equal' only with ordinal variables.
            Weighted kappa accounts for the degree of disagreement.

    - name: exct
      title: Conger's exact kappa (3 or more raters)
      type: Bool
      default: false
      description:
          R: >
            Report Conger's (1980) kappa instead of Fleiss' kappa for 3 or more
            raters. Conger's kappa uses each rater's own category proportions;
            it is a different estimator, not a more precise version of Fleiss' kappa.

    - name: multiraterMethod
      title: Multi-rater Agreement Method
      type: List
      options:
        - title: Automatic (based on number of raters)
          name: auto
        - title: Pairwise Cohen's Kappa (2 raters)
          name: cohen
        - title: Fleiss' Kappa (3+ raters)
          name: fleiss
        - title: Krippendorff's Alpha (any number)
          name: krippendorff
      default: auto
      description:
          R: >
            Choose specific method for multi-rater agreement analysis or use automatic selection.

    - name: fleissCI
      title: Fleiss Kappa Confidence Intervals
      type: Bool
      default: true
      description:
          R: >
            Calculate 95 percent confidence intervals for Fleiss' kappa using asymptotic standard errors.

    - name: kripp
      title: "Krippendorff's Alpha"
      type: Bool
      default: false
      description:
          R: >
            Calculate Krippendorff's alpha for factor ratings using the selected disagreement
            function. Cases with at least two observed ratings are used, including cases
            with missing ratings from one or more other raters.

    - name: krippMethod
      title: "Data Type for Krippendorff's Alpha" 
      type: List
      options:
        - title: Nominal
          name: nominal
        - title: Ordinal
          name: ordinal
        - title: Interval
          name: interval
        - title: Ratio
          name: ratio
      default: nominal
      description:
          R: >
            Measurement level for Krippendorff's alpha calculation. Choose based on your data type.

    - name: consensus
      title: Consensus Analysis
      type: Bool
      default: false
      description:
          R: >
            Perform consensus scoring analysis to determine agreed-upon ratings from multiple raters.

    - name: consensus_method
      title: Consensus Method
      type: List
      options:
        - title: Majority rule (more than 50 percent)
          name: majority
        - title: Super Majority (>=2/3)
          name: super_majority
        - title: Unanimous Only
          name: unanimous
      default: majority
      description:
          R: >
            Method for determining consensus scores from multiple raters.

    - name: tie_breaking
      title: Tie Breaking Method
      type: List
      options:
        - title: Exclude ties from analysis
          name: exclude
        - title: Flag for expert arbitration
          name: arbitration
        - title: Use most frequent category overall
          name: global_mode
      default: exclude
      description:
          R: >
            How to handle cases where no consensus can be reached using the selected method.

    - name: show_consensus_table
      title: Show Consensus Results
      type: Bool
      default: false
      description:
          R: >
            Display detailed consensus scoring results including individual rater scores and consensus outcomes.

    - name: showClinicalSummary
      title: Clinical Summary
      type: Bool
      default: false
      description:
          R: >
            Show clinical summary with plain-language interpretation of agreement statistics and their practical implications.

    - name: showAboutAnalysis
      title: About This Analysis
      type: Bool
      default: false
      description:
          R: >
            Show educational information about inter-rater reliability analysis, when to use it, and what the outputs mean.

    - name: showAssumptions
      title: Assumptions & Caveats
      type: Bool
      default: false
      description:
          R: >
            Show important assumptions, data requirements, common pitfalls, and interpretation guidelines for the analysis.

    - name: showWeightedKappaGuide
      title: Weighted Kappa Guide
      type: Bool
      default: false
      description:
          R: >
            Show explanatory guide for weighted kappa options, including when to use linear vs quadratic weighting schemes.

    - name: showStatisticalGlossary
      title: Statistical Terms Glossary
      type: Bool
      default: false
      description:
          R: >
            Show glossary of statistical terms (kappa, ICC, alpha, etc.) with clinical interpretations and usage guidelines.

    # Diagnostic Style Analysis (Usubutun Method)
    - name: styleDistanceMetric
      title: Style Distance Metric
      type: List
      options:
        - title: Percentage Agreement
          name: agreement
        - title: Spearman correlation (ordinal ratings)
          name: correlation
        - title: Euclidean (equally spaced ordinal ratings)
          name: euclidean
      default: agreement
      description:
          R: >
            Distance metric for measuring diagnostic similarity between raters for style clustering.
            Correlation uses one minus signed Spearman correlation, so reversed rating
            patterns remain dissimilar. Numeric distances require ordered factors with
            identical category order; otherwise percentage disagreement is used.

    - name: raterCharacteristics
      title: Include Rater Characteristics
      type: Bool
      default: false
      description:
          R: >
            Include rater background characteristics (experience, training, institution) in style analysis.

    - name: identifyDiscordantCases
      title: Identify Discordant Cases
      type: Bool
      default: false
      description:
          R: >
            Identify cases that distinguish different diagnostic styles - useful for training and consensus development.

    - name: caseID
      title: Case ID Variable
      type: Variable
      suggested: [id, nominal]
      default: null
      description:
          R: >
            Optional variable containing case identifiers. Case outputs retain these identifiers
            after missing ratings and metadata rows are excluded. Without an identifier,
            original row positions are shown.

    # Advanced Analysis Options
    - name: icc
      title: Intraclass Correlation Coefficient
      type: Bool
      default: false
      description:
          R: >
            Calculate ICC(2,1) from the numeric codes of ordered-factor ratings.
            Nominal and continuous variables are not accepted by this analysis.

    - name: bootstrap
      title: Bootstrap Confidence Intervals
      type: Bool
      default: false
      description:
          R: >
            Calculate bootstrap confidence intervals for Krippendorff's alpha and
            mean rater kappa against a reference standard within each style group.
            Reference-comparison intervals resample whole cases, holding the observed
            raters and style groups fixed.

    - name: bootstrapCIType
      title: Bootstrap Interval Method
      type: List
      options:
        - title: Bias-corrected and accelerated (BCa)
          name: bca
        - title: Percentile
          name: percentile
      default: bca
      description:
          R: >
            Method used for bootstrap confidence intervals. BCa adjusts for bootstrap
            bias and skewness using leave-one-case-out estimates. If BCa cannot be
            estimated, the analysis reports a percentile interval and explains the fallback.

    - name: bootstrapSamples
      title: Bootstrap Samples
      type: Number
      min: 100
      max: 5000
      default: 1000
      description:
          R: >
            Number of bootstrap samples for confidence interval calculation.

    - name: seed
      title: Random seed
      type: Integer
      min: 1
      default: 42
      description:
          R: >
            Seed for the bootstrap resampling (Krippendorff's alpha confidence
            interval and agreement stability) so that results are reproducible.

    - name: pairwiseAnalysis
      title: Pairwise Rater Analysis
      type: Bool
      default: false
      description:
          R: >
            Detailed agreement analysis for each rater pair. Each pair uses all
            cases rated by both raters, so pair-specific sample sizes can differ.

    - name: categoryAnalysis
      title: Category-Specific Agreement
      type: Bool
      default: false
      description:
          R: >
            Agreement analysis for each diagnostic category separately.

    - name: outlierAnalysis
      title: Identify Outlier Cases
      type: Bool
      default: false
      description:
          R: >
            Identify cases with unusually poor agreement across raters.

    - name: pathologyContext
      title: Pathology-Specific Metrics
      type: Bool
      default: false
      description:
          R: >
            Calculate pathology-specific metrics including diagnostic accuracy, sensitivity, and specificity when gold standard is available.

    # Enhanced Analysis Features
    - name: gwetAC
      title: Gwet's Agreement Coefficients
      type: Bool
      default: false
      description:
          R: >
            Calculate Gwet's AC1 and AC2 coefficients, which are more robust than kappa for high agreement scenarios and less affected by prevalence.

    - name: pabak
      title: PABAK Analysis
      type: Bool
      default: false
      description:
          R: >
            Calculate Prevalence-Adjusted Bias-Adjusted Kappa (PABAK) to address prevalence and bias issues in agreement studies.

    - name: sampleSizePlanning
      title: Sample Size Planning
      type: Bool
      default: false
      description:
          R: >
            Perform sample size planning calculations for agreement studies with specified precision requirements.

    - name: targetKappa
      title: Target Kappa Value
      type: Number
      min: 0.02
      max: 0.98
      default: 0.8
      description:
          R: >
            Target kappa value for sample size planning calculations. Values must
            be strictly between 0 and 1 because the confidence interval must extend
            on both sides of the target. The target precision must also be smaller
            than both the target and 1 minus the target.

    - name: targetPrecision
      title: Target precision (half-width of the 95 percent CI)
      type: Number
      min: 0.01
      max: 0.5
      default: 0.1
      description:
          R: >
            Half-width of the 95 percent confidence interval for kappa that the study should achieve, for example 0.1 for kappa 0.8 +/- 0.1.

    - name: raterBiasAnalysis
      title: Rater disagreement with consensus
      type: Bool
      default: false
      description:
          R: >
            For each rater, the share of cases on which their rating differs from the most common rating of the other raters, with any systematic over- or under-use of a category.

    - name: agreementTrendAnalysis
      title: Agreement Trend Analysis
      type: Bool
      default: false
      description:
          R: >
            Describe how agreement changes over time or case sequence. The analysis
            cannot distinguish learning or fatigue from changes in case mix or difficulty.
            Select a sequence variable to define the order explicitly; otherwise the current
            dataset row order is used.

    - name: sequenceVariable
      title: Trend Sequence Variable
      type: Variable
      suggested: [continuous, ordinal, id]
      default: null
      description:
          R: >
            Optional variable defining case order for agreement trend analysis, such as
            assessment date, training sequence, or case number. Ties retain dataset order;
            missing sequence values are placed last.

    - name: caseDifficultyScoring
      title: Case Difficulty Analysis
      type: Bool
      default: false
      description:
          R: >
            Difficulty of each case from the share of raters who chose the most common rating.

    - name: agreementStabilityAnalysis
      title: Agreement Stability Analysis
      type: Bool
      default: false
      description:
          R: >
            Bootstrap-based stability measures to assess the consistency of agreement statistics across different samples.

    # Rater Clustering Analysis (Usubutun 2012)
    - name: performClustering
      title: 'Perform Rater Clustering Analysis'
      type: Bool
      default: false
      description:
          R: >
            Identify diagnostic style groups among raters using hierarchical clustering.
            Implements methodology from Usubutun et al. (2012) Modern Pathology.
            Clusters raters based on diagnosis pattern similarity to reveal systematic differences in diagnostic approach.

    - name: clusteringMethod
      title: 'Clustering Linkage Method'
      type: List
      options:
          - title: "Ward's method (minimize variance)"
            name: ward
          - title: 'Complete linkage (furthest neighbor)'
            name: complete
          - title: 'Average linkage (mean distance)'
            name: average
          - title: 'Single linkage (nearest neighbor)'
            name: single
      default: ward
      description:
          R: >
            Hierarchical clustering linkage method. Ward's method minimizes within-group variance
            and is recommended for identifying distinct diagnostic styles (Usubutun 2012).

    - name: nStyleGroups
      title: 'Number of Style Groups'
      type: Integer
      min: 2
      max: 10
      default: 3
      description:
          R: >
            Number of diagnostic style groups to identify. Original study found 3 groups:
            conservative (under-diagnosis), moderate (majority), and sensitive (aligns with expert).

    - name: autoSelectGroups
      title: 'Automatically Select Number of Groups'
      type: Bool
      default: false
      description:
          R: >
            Use silhouette method or within-cluster sum of squares to automatically determine optimal number of style groups.

    - name: showClusteringHeatmap
      title: 'Show Clustering Heatmap'
      type: Bool
      default: true
      description:
          R: >
            Display Cases × Raters heatmap with hierarchical dendrograms showing diagnostic patterns and style groups.

    - name: heatmapColorScheme
      title: 'Heatmap Color Scheme'
      type: List
      options:
          - title: 'Diagnostic categories (blue-green-gold)'
            name: diagnostic
          - title: 'Viridis (colorblind-safe)'
            name: viridis
          - title: 'Red-Yellow-Blue (diverging)'
            name: RdYlBu
      default: diagnostic
      description:
          R: >
            Color scheme for clustering heatmap. Diagnostic uses distinct colors per category as in Usubutun (2012).

    - name: identifyDiscordant
      title: 'Identify Discordant Cases'
      type: Bool
      default: false
      description:
          R: >
            Flag cases with high inter-rater disagreement that distinguish diagnostic style groups.
            These cases are useful for training and quality assurance discussions.

    - name: discordantThreshold
      title: 'Discordant Case Threshold'
      type: Number
      min: 0.2
      max: 0.8
      default: 0.5
      description:
          R: >
            Minimum disagreement proportion for flagging discordant cases.
            0.5 means at least 50 percent of raters disagreed with majority diagnosis.

    # Rater Characteristics (optional)
    - name: referenceStandard
      title: 'Reference/Expert Standard (optional)'
      type: Variable
      suggested:
          - nominal
          - ordinal
      permitted:
          - factor
      description:
          R: >
            Expert consensus or reference standard diagnosis. Used to compare style groups
            and identify which group aligns most closely with expert judgment.
            Cases with missing reference ratings are omitted from reference comparisons
            but retained in interrater agreement analyses when all rater ratings are present.
      default: NULL

    - name: useMetadataRows
      title: 'Extract Rater Characteristics from Metadata Rows'
      type: Bool
      default: false
      description:
          R: >
            Enable extraction of rater characteristics from special metadata rows in the dataset.
            A case ID variable must be selected, and metadata rows should have identifiers starting
            with "META_" (e.g., META_experience, META_specialty).
            Values in rater columns will be extracted as characteristics for association testing.

    # Enhanced User Experience Options
    - name: showInlineComments
      title: Show Inline Statistical Comments
      type: Bool
      default: false
      description:
          R: >
            Show detailed statistical explanations and interpretations inline with results for educational purposes.

    - name: showClusteringInterpretation
      title: Show Clustering Interpretation Guide
      type: Bool
      default: false
      description:
          R: >
            Display explanatory guide for interpreting clustering results, diagnostic style groups,
            and discordant cases. Useful for understanding clinical implications.

    - name: readerWorkflow
      title: Reader workflow
      type: List
      default: 'off'
      options:
      - name: 'off'
        title: Standard agreement
      - name: binary
        title: Binary reader diagnostics
      - name: ordinal_cutoff
        title: Ordinal clinical cutoff
      - name: numeric_cutoff
        title: Numeric clinical cutoff
      description:
        R: Standard agreement preserves existing analyses. Reader diagnostics report accuracy and agreement
          on explicitly classified independent readings.
    - name: readerScores
      title: Numeric reader scores
      type: Variables
      default: null
      suggested:
      - continuous
      permitted:
      - numeric
      description:
        R: One numeric column per independent reader, on the same score scale.
    - name: readerPositive
      title: Reader positive label
      type: String
      default: ''
      description:
        R: Exact positive label shared by binary reader columns. Other labels are excluded as indeterminate.
    - name: readerNegative
      title: Reader negative label
      type: String
      default: ''
      description:
        R: Exact negative label shared by binary reader columns.
    - name: referenceAccuracy
      title: Reader accuracy against reference
      type: Bool
      default: true
      description:
        R: Compute each reader against the optional reference; agreement remains available without a reference.
    - name: referencePositive
      title: Reference positive label
      type: String
      default: ''
      description:
        R: Exact positive reference classification.
    - name: referenceNegative
      title: Reference negative label
      type: String
      default: ''
      description:
        R: Exact negative reference classification; other labels are excluded.
    - name: readerPopulation
      title: Accuracy case population
      type: List
      default: available
      options:
      - name: available
        title: Available for each reader
      - name: shared
        title: Shared across all readers
      - name: both
        title: Both populations
      description:
        R: Available uses each reader and reference. Shared requires all selected readers and reference.
    - name: clinicalCutoff
      title: Prespecified numeric cutoff
      type: String
      default: ''
      description:
        R: Enter one finite numeric threshold; blank means no cutoff has been specified.
    - name: positiveRule
      title: Positive call when score is
      type: List
      default: ge
      options:
      - name: ge
        title: At or above cutoff
      - name: gt
        title: Above cutoff
      - name: le
        title: At or below cutoff
      - name: lt
        title: Below cutoff
      description:
        R: The exact inequality is applied to every reader. Ordinal comparisons use declared level order.
    - name: nearCutoffWidth
      title: Near-cutoff width (optional)
      type: String
      default: ''
      description:
        R: Nonnegative distance on either side of the numeric cutoff. A pair is near cutoff if either reader
          falls in this inclusive band.
    - name: ordinalCutoff
      title: Ordinal boundary category
      type: String
      default: ''
      description:
        R: Exact boundary label from the common declared ordered scale.
    - name: nearCutoffLevels
      title: Near-cutoff categories (separate with ;)
      type: String
      default: ''
      description:
        R: Exact ordinal category labels separated by semicolons in the interface;
          R callers can also separate labels by newlines. Either reader in this set
          defines the pair-specific near-cutoff subset.
    - name: readerPairs
      title: Reader pairs
      type: List
      default: all
      options:
      - name: all
        title: All pairs
      - name: selected
        title: One selected pair
      description:
        R: Choose all pairs or one named pair. One pair is required for the exploratory composite.
    - name: readerPair1
      title: First reader column name
      type: String
      default: ''
      description:
        R: Exact name of the first selected reader column.
    - name: readerPair2
      title: Second reader column name
      type: String
      default: ''
      description:
        R: Exact name of the second selected reader column.
    - name: readerCaseLimit
      title: Maximum displayed disagreements
      type: Integer
      default: 50
      min: 0
      max: 500
      description:
        R: Limit the displayed list across pairs; all cases still contribute to aggregate estimates.
    - name: readerCluster
      title: Patient or cluster ID
      type: Variable
      default: null
      suggested:
      - id
      - nominal
      description:
        R: Repeated specimens from a patient must share this ID. Estimates remain specimen-weighted; intervals
          resample whole clusters.
    - name: readerIntervals
      title: Reader confidence intervals
      type: Bool
      default: true
      description:
        R: Independent-case proportions use exact binomial intervals. Other metrics need bootstrap.
    - name: readerBootstrap
      title: Joint bootstrap intervals
      type: Bool
      default: false
      description:
        R: Resample complete case rows or patient clusters for fixed selected readers. Undefined or constant
          draws suppress the affected interval.
    - name: readerConfidence
      title: Reader confidence level
      type: Number
      default: 0.95
      min: 0.01
      max: 0.999
      description:
        R: Confidence level for the new reader workflow.
    - name: showKappaBalanced
      title: Exploratory kappa-balanced score
      type: Bool
      default: false
      description:
        R: Module-specific exploratory score sqrt(BA * Cohen kappa), with BA from the explicitly selected
          reader on the pair/reference common cases. No clinical acceptance thresholds.
    - name: compositeReader
      title: Accuracy reader column name
      type: String
      default: ''
      description:
        R: Which member of the selected pair supplies balanced accuracy for the exploratory score.
    - name: readerCode
      title: Reproducible reader R code
      type: Bool
      default: false
      description:
        R: Display the selected options as an R call using a data frame named your_data.

    - name: referenceType
      title: Reference interpretation
      type: List
      default: legacy
      options:
      - name: legacy
        title: Not specified
      - name: disease
        title: Disease reference standard
      - name: consensus
        title: Expert consensus comparator
      - name: method
        title: Comparison method
    - name: referenceDescription
      title: Reference description
      type: String
      default: ''
    - name: targetDefinition
      title: Target condition or classification
      type: String
      default: ''
    - name: readerNondiagnostic
      title: Account for nondiagnostic readings
      type: Bool
      default: false
    - name: readerNondiagnosticLevel
      title: Exact nondiagnostic label
      type: String
      default: ''
    - name: readerAllObservedAgreement
      title: Agreement including nondiagnostic calls
      type: Bool
      default: false
      description:
        R: Separate estimates on observed readings with an eligible reference. Missing readings are excluded;
          ordinary binary estimates remain conditional on determinate calls.
    - name: readerFormat
      title: Reader input format
      type: List
      default: wide
      options:
      - name: wide
        title: 'Wide: one column per reader'
      - name: long
        title: 'Long: case, reader and modality'
    - name: readerID
      title: Reader ID
      type: Variable
      default: null
      suggested:
      - nominal
      - id
    - name: modality
      title: Modality
      type: Variable
      default: null
      suggested:
      - nominal
      - id
    - name: rating
      title: Long-format rating
      type: Variable
      default: null
      suggested:
      - nominal
      - ordinal
    - name: baselineModality
      title: Baseline modality label
      type: String
      default: ''
    - name: comparisonModality
      title: Comparison modality label
      type: String
      default: ''
    - name: readerModalityComparison
      title: Paired fixed-reader modality comparison
      type: Bool
      default: false
      description:
        R: A prespecified comparison minus baseline contrast on complete matched cases with equal fixed-reader
          weights. Intervals resample whole cases or patients; no random-reader inference or p-values.
    - name: modalityPopulation
      title: Matched comparison population
      type: List
      default: determinate
      options:
