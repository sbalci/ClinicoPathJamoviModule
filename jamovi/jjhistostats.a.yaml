---
name:  jjhistostats
title: Histogram
menuGroup: JJStatsPlot
menuSubgroup: Distribution
# menuSubtitle: Histogram
version: '1.0.81'
jas: '1.2'


description:
    main: |
        'Wrapper Function for ggstatsplot::gghistostats and
        ggstatsplot::grouped_gghistostats to generate Histogram.'

    # R:
    #     dontrun: true
    #     usage: |
    #         # Load test data
    #         data(jjhistostats_test_data)
            
    #         # Basic histogram
    #         jjhistostats(
    #           data = jjhistostats_test_data,
    #           dep = "age_years",
    #           typestatistics = "parametric"
    #         )
            
    #         # Multiple histograms
    #         jjhistostats(
    #           data = jjhistostats_test_data,
    #           dep = c("age_years", "tumor_size_mm", "bmi"),
    #           centralityline = TRUE,
    #           resultssubtitle = TRUE
    #         )
            
    #         # Grouped histogram by disease stage
    #         jjhistostats(
    #           data = jjhistostats_test_data,
    #           dep = "psa_level",
    #           grvar = "disease_stage",
    #           typestatistics = "nonparametric",
    #           changebinwidth = TRUE,
    #           binwidth = 2.0
    #         )

options:
    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: dep
      title: Variables
      type: Variables
      suggested: [ continuous ]
      permitted: [ numeric ]
      description:
          R: >
            One or more continuous numeric variables for which histograms will be
            created. Multiple variables will be displayed in separate panels.
          ui: >
            Select continuous variables to analyze (e.g., age, tumor size, biomarker levels, 
            lab values). Each variable will show its distribution shape and statistical properties.

    - name: grvar
      title: 'Split by (optional)'
      type: Variable
      default: NULL
      suggested: [ ordinal, nominal ]
      permitted: [ factor ]
      description:
          R: >
            Optional grouping variable to create separate histograms for each
            level of this variable (grouped analysis).
          ui: >
            Optional: Compare distributions between groups (e.g., treatment arms, 
            disease stages, patient subtypes). Creates separate histograms for each group.

# Data ----


# Analysis ----


    - name: typestatistics
      title: 'Type of statistic'
      type: List
      options:
        - title: Parametric (one-sample t-test)
          name: parametric
        - title: Nonparametric (Wilcoxon signed-rank)
          name: nonparametric
        - title: Robust (bootstrap-t on a trimmed mean)
          name: robust
        - title: Bayes (Bayesian one-sample t-test)
          name: bayes
      default: parametric
      description:
          R: >
            Which ONE-SAMPLE LOCATION TEST is reported in the plot subtitle, comparing the
            variable against the Test Value. 'parametric' is a one-sample t-test,
            'nonparametric' a Wilcoxon signed-rank test, 'robust' a bootstrap-t test on a
            trimmed mean, and 'bayes' a Bayesian one-sample t-test. This option does NOT
            perform a normality test - no Shapiro-Wilk, Anderson-Darling or similar statistic
            is computed or displayed anywhere in this analysis.
          ui: >
            Which one-sample test compares your variable against the Test Value: Parametric
            (t-test, assumes approximate normality), Nonparametric (Wilcoxon signed-rank, for
            skewed data or ordinal scales), Robust (trimmed mean, resists outliers), or Bayes
            (gives a Bayes factor alongside the estimate). This chooses the TEST, not a
            normality check.



# Plot ----


    - name: centralityline
      title: Centrality line
      type: Bool
      default: false
      description:
          R: >
            Whether to display a vertical line indicating the measure of central
            tendency (mean for parametric, median for nonparametric).
          ui: >
            Show a vertical line at the center of the distribution (mean or median). 
            Helpful for comparing typical values across groups or identifying distribution shifts.

    - name: changebinwidth
      title: Manual bin width
      type: Bool
      default: false
      description:
          R: >
            Whether to manually specify the bin width. If FALSE, automatic
            bin width calculation will be used.
          ui: >
            Enable to manually control histogram resolution. Useful for fine-tuning 
            visualization of biomarker ranges or lab value distributions.

    - name: binwidth
      title: Bin width
      type: Number
      default: 1.1
      description:
          R: >
            Manual bin width for histogram. Only used when changebinwidth is TRUE.
            When left automatic, the width is max(x) - min(x) / sqrt(N).
            Smaller values create more bins, larger values create fewer bins.




    - name: resultssubtitle
      title: Statistical results
      type: Bool
      default: false
      description:
          R: >
            Whether to display statistical test results as subtitle in the plot,
            including the selected one-sample location test and descriptive statistics.
          ui: >
            Show the selected one-sample location test and descriptive statistics on the plot.
            Helpful for quick interpretation without switching between tabs.
    
    - name: showInterpretation
      title: Clinical interpretation
      type: Bool
      default: false
      description:
          R: >
            Generate clinical interpretation of histogram results including distribution shape,
            normality assessment, and practical implications for clinical data.
            Note: Uses simplified heuristics (skewness threshold and sample size) as initial
            screening guidance, not formal diagnostic criteria. Should be supplemented with
            formal normality tests and expert judgment.
          ui: >
            Generate plain-language interpretation of results including what the distribution
            shape means for your clinical data. This provides simplified guidance for initial
            screening and should be supplemented with formal statistical tests and domain expertise.

    - name: clinicalPreset
      title: Clinical preset
      type: List
      options:
        - title: Custom (manual settings)
          name: custom
        - title: Lab Values Analysis (parametric, centrality line)
          name: lab_values
        - title: Biomarker Distribution (nonparametric, robust)
          name: biomarkers
        - title: Patient Characteristics (age, BMI - parametric)
          name: patient_chars
        - title: Pathology Scores (ordinal, nonparametric)
          name: pathology_scores
      default: custom
      description:
          R: >
            Predefined configurations optimized for common clinical data types.
            Automatically sets appropriate statistical methods and visualization options.
          ui: >
            Choose a preset optimized for your data type. Each preset automatically configures 
            statistical methods and display options appropriate for that clinical context.

    - name: enableOneSampleTest
      title: Custom null value
      type: Bool
      default: false
      description:
          R: >
            Whether the Test Value below is used as the null value of the one-sample test.
            IMPORTANT: this does not control whether a test is run. The test appears whenever
            'Statistical Results' (resultssubtitle) is enabled; leaving this option off simply
            means the test uses ggstatsplot's own default null of 0, which is rarely a
            meaningful comparison for clinical data. To suppress the test entirely, turn off
            'Statistical Results'.
          ui: >
            Use the Test Value below as the comparison value (e.g. a reference-range limit or
            population norm). Note that turning this OFF does not remove the test - if
            'Statistical Results' is on, the test still runs against a null of 0. Turn off
            'Statistical Results' for a purely descriptive histogram.

    - name: test.value
      title: Test value
      type: Number
      default: 0
      description:
          R: >
            Value to compare the sample against in one-sample test. Only used when enableOneSampleTest is TRUE.
            Note: Testing against 0 is rarely clinically meaningful for most biomedical data.
            Consider using a clinically relevant threshold (e.g., reference range limit,
            treatment cutoff, or population norm) for meaningful hypothesis testing.
          ui: >
            Specify a clinically meaningful value to test against (e.g., normal range upper limit,
            treatment threshold, population mean). WARNING: Using 0 is rarely clinically relevant
            for lab values, biomarkers, or patient measurements. Enter a meaningful reference value.

    - name: alternative
      title: Test direction
      type: List
      options:
        - title: Two-sided
          name: two.sided
        - title: Greater than the test value
          name: greater
        - title: Less than the test value
          name: less
      default: two.sided
      description:
          R: >
            Direction of the one-sample test. 'two.sided' asks whether the centre differs from
            the test value in either direction; 'greater' and 'less' are one-sided. Two-sided is
            the conventional default and the conservative choice - only pick a one-sided test if
            the direction was specified before seeing the data.
          ui: >
            Whether the test asks if your variable differs from the Test value in either
            direction (two-sided, the usual choice) or only in one direction. Choose a one-sided
            test only if you decided the direction before looking at the data.

    - name: trimlevel
      title: Trim proportion
      type: Number
      default: 0.2
      min: 0
      max: 0.4
      description:
          R: >
            Proportion trimmed from EACH tail for the robust test and the robust centrality
            measure. The default of 0.2 discards the highest and lowest 20 percent of
            observations. Only used when 'Type of statistic' is Robust, or when the centrality
            measure is Robust.
          ui: >
            How much of each tail the Robust option discards before computing the mean. The
            default 0.2 drops the top and bottom 20 percent. Raise it for heavier contamination,
            lower it to keep more of the distribution - but note a real high-expressing subgroup
            can be trimmed away.

    - name: bfprior
      title: Bayes prior scale
      type: Number
      default: 0.707
      min: 0.1
      max: 2
      description:
          R: >
            Scale of the Cauchy prior on effect size for the Bayesian test (the 'r' scale).
            The default 0.707 is JASP/BayesFactor's medium prior. A Bayes factor cannot be
            interpreted or reproduced without knowing this value, so it is reported alongside
            the result. Larger values place more prior mass on large effects, which lowers the
            Bayes factor for small observed effects.
          ui: >
            Width of the prior for the Bayesian test. 0.707 is the standard 'medium' prior.
            Because a Bayes factor depends on this choice, it is stated with the result - vary
            it to check how sensitive your conclusion is to the prior.

    - name: conf.level
      title: Confidence level
      type: Number
      default: 0.95
      min: 0.5
      max: 0.999
      description:
          R: >
            Confidence level for the interval reported in the plot subtitle, between 0.5 and
            0.999. The old bounds allowed 1, at which the entire statistical subtitle
            disappeared with no message, and 0, which printed a zero-width "0 percent CI".

    - name: bf.message
      title: Bayes factor
      type: Bool
      default: false
      description:
          R: >
            Whether to display Bayes Factor in the subtitle when using Bayesian analysis.

    - name: digits
      title: Decimal places
      type: Integer
      default: 2
      min: 0
      max: 5
      description:
          R: >
            Number of decimal places for displaying statistics in the subtitle.

    - name: xlab
      title: X-axis label
      type: String
      default: ''
      description:
          R: >
            Custom label for the x-axis. If empty, variable name will be used.

    - name: title
      title: Plot title
      type: String
      default: ''
      description:
          R: >
            Title for the plot.

    - name: subtitle
      title: Plot subtitle
      type: String
      default: ''
      description:
          R: >
            Subtitle for the plot (overrides statistical results if provided).

    - name: caption
      title: Plot caption
      type: String
      default: ''
      description:
          R: >
            Caption text to display at the bottom of the plot.

    - name: centralitytype
      title: Centrality measure
      type: List
      options:
        - title: Default (follows test type)
          name: default
        - title: Parametric (Mean)
          name: parametric
        - title: Nonparametric (Median)
          name: nonparametric
        - title: Robust (Trimmed Mean)
          name: robust
        - title: Bayes (MAP Estimator)
          name: bayes
      default: default
      description:
          R: >
            Type of central tendency measure to display. 'Default' uses the
            appropriate measure based on the statistical test type selected.

# Histogram Aesthetics ----

    - name: binfill
      title: Bin fill color
      type: String
      default: 'skyblue'
      description:
          R: >
            Fill color for histogram bins.

    - name: bincolor
      title: Bin border color
      type: String
      default: 'black'
      description:
          R: >
            Border color for histogram bins.

    - name: binalpha
      title: Bin transparency
      type: Number
      default: 0.7
      min: 0
      max: 1
      description:
          R: >
            Transparency level for histogram bins (0 = fully transparent, 1 = opaque).

# Centrality Line Aesthetics ----

    - name: centralitylinecolor
      title: Centrality line color
      type: String
      default: 'blue'
      description:
          R: >
            Color of the vertical centrality line.

    - name: centralitylinewidth
      title: Centrality line width
      type: Number
      default: 1
      min: 0.1
      max: 5
      description:
          R: >
            Width of the vertical centrality line.

    - name: centralitylinetype
      title: Centrality line type
      type: List
      options:
        - title: Solid
          name: solid
        - title: Dashed
          name: dashed
        - title: Dotted
          name: dotted
        - title: Dot-dash
          name: dotdash
        - title: Long dash
          name: longdash
        - title: Two dash
          name: twodash
      default: dashed
      description:
          R: >
            Line type for the vertical centrality line.

# Plot Size Configuration ----

    - name: plotwidth
      title: Plot width
      type: Integer
      default: 600
      min: 300
      max: 1200
      description:
          R: >
            Width of each plot in pixels. Default is 600.

    - name: plotheight
      title: Plot height
      type: Integer
      default: 450
      min: 300
      max: 800
      description:
          R: >
            Height of each plot in pixels. Default is 450.

    - name: addGGPubrPlot
      title: Publication-ready histogram
      type: Bool
      default: false
      description:
          R: >
            Add publication-ready histogram using ggpubr package.

    - name: ggpubrPalette
      title: Fill color
      type: String
      default: '#0073C2FF'
      description:
          R: >
            Fill color for ggpubr histogram (hex code).

    - name: ggpubrAddDensity
      title: Density curve
      type: Bool
      default: false
      description:
          R: >
            Add density curve overlay to ggpubr histogram.

    - name: ggpubrAddMean
      title: Mean line
      type: Bool
      default: false
      description:
          R: >
            Add vertical line at mean for ggpubr histogram.

    - name: addDistributionDiagnostics
      title: Distribution diagnostics
      type: Bool
      default: false
      description:
          R: >
            Add density plot, ECDF, and QQ plot for distribution assessment using ggpubr.

    - name: ggpubrDensityColor
      title: Density plot fill color
      type: String
      default: '#0073C2FF'
      description:
          R: >
            Fill color for density plot (hex code).

    - name: ggpubrShowQQ
      title: QQ plot
      type: Bool
      default: false
      description:
          R: >
            Show QQ plot for normality assessment.

    - name: ggpubrShowECDF
      title: ECDF plot
      type: Bool
      default: false
      description:
          R: >
            Show empirical cumulative distribution function plot.


    - name: originaltheme
      title: Original ggstatsplot theme
      type: Bool
      default: false
      description:
          R: >
            Use the original ggstatsplot theme rather than jamovi's default.

...

