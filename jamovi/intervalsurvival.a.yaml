name: intervalsurvival
title: Interval-Censored Survival Analysis
menuGroup: ClinicoPathDT
menuSubgroup: Survival Analysis
version: '1.0.83'
jas: '1.2'
description:
  main: Single-event interval-censored survival analysis using genuine Turnbull, proportional-hazards,
    or parametric accelerated-failure-time likelihoods. Exact, left, right, and interval censoring retain
    their observation semantics. Optional bootstrap intervals describe fitted prediction uncertainty;
    joint competing-risk interval censoring is not implemented.
options:
- name: data
  type: Data
  description:
    R: The data as a data frame.
- name: bootstrap_ci
  title: Bootstrap prediction intervals
  type: Bool
  default: false
- name: bootstrap_seed
  title: Bootstrap random seed
  type: Integer
  default: 2026
  min: 1
- name: left_time
  title: Left Interval Time
  type: Variable
  suggested:
  - continuous
  permitted:
  - numeric
  description:
    ui: Lower bound of the interval (last known event-free time)
    R: 'Left boundary of the censoring interval

      '
- name: right_time
  title: Right Interval Time
  type: Variable
  suggested:
  - continuous
  permitted:
  - numeric
  description:
    ui: Upper bound of the interval (first time event detected)
    R: 'Right boundary of the censoring interval

      '
- name: status_var
  title: Censoring Status Variable
  type: Variable
  suggested:
  - nominal
  permitted:
  - factor
  - numeric
  default: null
  description:
    ui: Type of censoring (0=right, 1=interval, 2=left, 3=exact)
    R: 'Censoring status indicator variable

      '
- name: covariates
  title: Covariates
  type: Variables
  suggested:
  - continuous
  - nominal
  permitted:
  - numeric
  - factor
  default: null
  description:
    ui: Predictive variables for regression analysis
    R: 'Covariates to include in the survival model

      '
- name: stratification_vars
  title: Stratification Variables
  type: Variables
  suggested:
  - nominal
  - ordinal
  permitted:
  - factor
  default: null
  description:
    ui: Variables for stratified analysis
    R: 'Variables for stratifying the baseline hazard

      '
  hidden: true
- name: model_type
  title: Model Type
  type: List
  options:
  - name: cox_ph
    title: Cox Proportional Hazards
  - name: aft_weibull
    title: AFT Weibull
  - name: aft_lognormal
    title: AFT Log-Normal
  - name: aft_loglogistic
    title: AFT Log-Logistic
  - name: aft_exponential
    title: AFT Exponential
  - name: aft_gamma
    title: AFT Gamma
  - name: nonparametric
    title: Non-parametric (Turnbull)
  default: aft_weibull
  description:
    ui: Statistical model for interval-censored data
    R: 'Model specification for interval-censored survival

      '
- name: estimation_method
  title: Automatic package likelihood estimation
  type: List
  options:
  - name: npmle
    title: Non-parametric MLE (Turnbull)
  - name: em_algorithm
    title: Automatic likelihood estimator for selected model
  - name: newton_raphson
    title: Newton-Raphson
  - name: mcmc
    title: MCMC (Bayesian)
  default: em_algorithm
  description:
    ui: Parameter estimation approach
    R: 'Method for parameter estimation

      '
  hidden: true
- name: confidence_level
  title: Confidence Level
  type: Number
  default: 0.95
  min: 0.8
  max: 0.99
  description:
    ui: Confidence level for intervals
    R: 'Confidence level for parameter estimates

      '
- name: convergence_tolerance
  title: Convergence Tolerance
  type: Number
  default: 0.0001
  min: 1.0e-05
  max: 0.01
  description:
    ui: Tolerance for algorithm convergence
    R: 'Convergence criterion for iterative algorithms

      '
  hidden: true
- name: max_iterations
  title: Maximum Iterations
  type: Integer
  default: 500
  min: 50
  max: 2000
  description:
    ui: Maximum iterations for estimation algorithms
    R: 'Maximum number of algorithm iterations

      '
- name: baseline_hazard_smooth
  title: Baseline Hazard Smoothing
  type: Bool
  default: false
  description:
    ui: Apply smoothing to baseline hazard estimate
    R: 'Whether to smooth the baseline hazard function

      '
  hidden: true
- name: smoothing_bandwidth
  title: Smoothing Bandwidth
  type: Number
  default: 1.0
  min: 0.1
  max: 10.0
  description:
    ui: Bandwidth parameter for smoothing
    R: 'Bandwidth for baseline hazard smoothing

      '
  hidden: true
- name: survival_curves
  title: Plot Survival Curves
  type: Bool
  default: true
  description:
    ui: Generate survival probability curves
    R: 'Whether to plot survival curves

      '
- name: hazard_function
  title: Plot Hazard Function
  type: Bool
  default: false
  description:
    ui: Generate hazard function plots
    R: 'Whether to plot hazard functions

      '
  hidden: true
- name: model_diagnostics
  title: Model Diagnostics
  type: Bool
  default: true
  description:
    ui: Perform model diagnostic analysis
    R: 'Whether to include model diagnostics

      '
- name: residual_analysis
  title: Residual Analysis
  type: Bool
  default: false
  description:
    ui: Generate residual plots and statistics
    R: 'Whether to perform residual analysis

      '
  hidden: true
- name: goodness_of_fit
  title: Goodness of Fit Tests
  type: Bool
  default: false
  description:
    ui: Perform goodness-of-fit testing
    R: 'Whether to test model goodness-of-fit

      '
  hidden: true
- name: model_comparison
  title: Model Comparison
  type: Bool
  default: false
  description:
    ui: Compare different model specifications
    R: 'Whether to compare multiple models

      '
  hidden: true
- name: prediction_times
  title: Prediction Time Points
  type: String
  default: 12,24,36,60
  description:
    ui: Comma-separated time points for predictions (months)
    R: 'Time points for survival probability predictions

      '
- name: bootstrap_samples
  title: Bootstrap Samples
  type: Integer
  default: 200
  min: 50
  max: 1000
  description:
    ui: Bootstrap samples for uncertainty estimation
    R: 'Number of bootstrap resamples

      '
- name: mcmc_iterations
  title: MCMC Iterations
  type: Integer
  default: 5000
  min: 1000
  max: 20000
  description:
    ui: MCMC sampling iterations (if MCMC selected)
    R: 'MCMC sampling iterations

      '
  hidden: true
- name: mcmc_burnin
  title: MCMC Burn-in
  type: Integer
  default: 1000
  min: 200
  max: 5000
  description:
    ui: MCMC burn-in samples (if MCMC selected)
    R: 'MCMC burn-in period

      '
  hidden: true
- name: imputation_method
  title: Missing Time Imputation
  type: List
  options:
  - name: midpoint
    title: Interval Midpoint
  - name: random
    title: Random Within Interval
  - name: conditional_mean
    title: Conditional Mean
  - name: multiple_imputation
    title: Multiple Imputation
  default: midpoint
  description:
    ui: Method for handling missing interval bounds
    R: 'Imputation approach for incomplete intervals

      '
  hidden: true
