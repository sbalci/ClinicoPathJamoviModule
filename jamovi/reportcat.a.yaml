---
name:  reportcat
title: Summary of Categorical Variables
menuGroup: Exploration
menuSubgroup: ClinicoPath Descriptives
version: '1.0.53'
jas: '1.2'

description:
  main: >
    Generates a detailed summary of categorical variables including counts, percentages,
    and missing value information. The output is presented in both textual and visual formats,
    making it easy to interpret the distribution of your data.
  # R:
  #   dontrun: true
  #   usage: |
  #     # Example usage:
  #     # 1. Load your data into a data frame.
  #     # 2. Select the categorical variables to summarize.
  #     # 3. Run the reportcat module to view the summary.
  #     #
  #     # The module will produce a styled textual report along with a visual summary table.
      
options:
  - name: data
    type: Data
    description:
      R: "The data as a data frame."

  - name: vars
    title: Variables
    type: Variables
    suggested: [ ordinal, nominal ]
    permitted: [ factor ]
    # .run() has a `length(self$options$vars) == 0` branch that shows the welcome
    # panel, so NULL is a supported state. Without an explicit default the compiler
    # makes `vars` a REQUIRED argument of the public wrapper. (This does not make
    # reportcat(data = df) work - jmvcore's select() fails on an empty variable
    # list either way - but it matches the 88 other Variables options in the
    # module and removes the "argument is missing" failure mode.)
    default: NULL
    description:
      R: >
        Select the variables from your data frame that you wish to summarize.
        Only categorical variables (nominal, ordinal, or factors) are allowed.




...
