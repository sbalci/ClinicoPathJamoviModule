          - Kendall1939

    - name: kendallWExplanation
      title: "About Kendall's W"
      type: Html
      visible: (showKendallWGuide)
      clearWith:
          - showKendallWGuide

    - name: robinsonATable
      title: "Robinson's A (Ordinal Agreement Index) Results"
      type: Table
      visible: (robinsonA)
      rows: 1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: robinsonA
          title: "A"
          type: number
        - name: ci_lower
          title: '95% CI Lower'
          type: number
        - name: ci_upper
          title: '95% CI Upper'
          type: number
        - name: interpretation
          title: 'Interpretation'
          type: text
      clearWith:
          - vars
