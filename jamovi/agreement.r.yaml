    - name: krippTableHeading
      title: "Krippendorff's Alpha"
      type:  Preformatted
      visible: (kripp || showKrippGuide)
      clearWith:
          - kripp
          - showKrippGuide

    - name: krippTable
      title: "Krippendorff's Alpha Results"
      type: Table
      visible: (kripp)
      rows: 1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: alpha
          title: 'Alpha'
          type: number
        - name: ci_lower
          title: 'CI Lower'
          type: number
          visible: (bootstrap)
        - name: ci_upper
          title: 'CI Upper'
          type: number
          visible: (bootstrap)
        - name: interpretation
          title: 'Interpretation'
          type: text
      clearWith:
          - vars
          - krippMethod
          - bootstrap
          - nBoot
          - confLevel
          - seed
      refs:
          - Krippendorff2004

    - name: krippExplanation
      title: "About Krippendorff's Alpha"
      type: Html
      visible: (showKrippGuide)
      clearWith:
          - showKrippGuide

    - name: lightKappaTableHeading
      title: Additional Categorical Agreement Measures
      type:  Preformatted
      visible: (lightKappa || showLightKappaGuide || finn || showFinnGuide || kendallW || showKendallWGuide || robinsonA || showRobinsonAGuide)
      clearWith:
          - lightKappa
          - showLightKappaGuide
          - finn
          - showFinnGuide
          - kendallW
          - showKendallWGuide
          - robinsonA
          - showRobinsonAGuide

    - name: lightKappaTable
      title: "Light's Kappa Results"
      type: Table
      visible: (lightKappa)
      rows: 1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: kappa
          title: "Kappa"
          type: number
      clearWith:
          - vars
      refs:
          - LandisKoch1977

    - name: lightKappaExplanation
      title: "About Light's Kappa"
      type: Html
      visible: (showLightKappaGuide)
      clearWith:
          - showLightKappaGuide

    - name: finnTable
      title: "Finn Coefficient Results (Variance-Based Agreement)"
      type: Table
      visible: (finn)
      rows: 1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: levels
          title: 'Categories'
          type: integer
        - name: finn_value
          title: 'Finn Coefficient'
          type: number
        - name: f_statistic
          title: 'F-statistic'
          type: number
        - name: df
          title: 'df'
          type: text
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Interpretation'
          type: text
      clearWith:
          - vars
          - finnLevels
          - finnModel
      refs:
          - Finn1970

    - name: finnExplanation
      title: "About Finn Coefficient"
      type: Html
      visible: (showFinnGuide)
      clearWith:
          - showFinnGuide

    - name: kendallWTable
      title: "Kendall's Coefficient of Concordance (W) Results"
      type: Table
      visible: (kendallW)
