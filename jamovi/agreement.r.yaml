    - name:  irrtableHeading
      title: Interrater Reliability
      type:  Preformatted

    - name:  irrtable
      title: 'Interrater Reliability'
      type: Table
      swapRowsColumns: true
      rows:  1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Subjects'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: peragree
          title: 'Agreement %'
          type: number
        - name: kappa
          title: 'Kappa'
          type: number
        - name: ci_lower
          title: 'Lower'
          superTitle: 'Confidence Interval'
          type: number
        - name: ci_upper
          title: 'Upper'
          superTitle: 'Confidence Interval'
          type: number
        - name: z
          title: 'z'
          type: number
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
      clearWith:
          - vars
          - wght
          - exct
          - confLevel
          - kappaCIMethod
      refs:
          - Cohen1960
          - Cohen1968
          - Fleiss1971
          - Conger1980
          - Gwet2008
          - irrCAC
          - LandisKoch1977


    - name:  contingencyTableHeading
      title: Data Summary
      type:  Preformatted
      visible: (sft)
      clearWith:
          - sft

    - name:  contingencyTable
      title: 'Contingency Table (2 Raters)'
      type: Table
      visible: (sft)
      rows: 0
      columns: []
      clearWith:
          - vars
          - wght
          - exct

    - name:  ratingCombinationsTable
      title: 'Rating Combinations (3+ Raters)'
      type: Table
      visible: (sft)
      rows: 0
      columns: []
      clearWith:
          - vars
          - wght
          - exct

    - name: contingencyTableExplanation
      title: "About Contingency Table & Rating Combinations"
      type: Html
      visible: (sft && showAbout)

    # ---- Pathologist Grading Analysis (model-based ordinal agreement) ----

    - name: gradingHeading
      title: Pathologist Grading Analysis
      type:  Preformatted
      visible: (gradingDesign || perPathologist || severityModel || latentModel || showGradingGuide)
      clearWith:
          - gradingDesign
          - perPathologist
          - severityModel
          - latentModel
          - showGradingGuide

    - name: designSummaryTable
      title: "Study Design"
      type: Table
      visible: (gradingDesign)
      rows: 0
      columns:
        - name: item
          title: 'Design Feature'
          type: text
        - name: value
          title: 'Value'
          type: text
      clearWith:
          - vars
          - clusterVariable

    - name: categoryDistributionTable
      title: "Category Distribution by Pathologist"
      type: Table
      visible: (gradingDesign)
      rows: 0
      columns:
        - name: pathologist
          title: 'Pathologist'
          type: text
        - name: n
          title: 'Ratings'
          type: integer
      clearWith:
          - vars

    - name: pathologistTable
      title: "Per-Pathologist Agreement and Grading Tendency"
      type: Table
      visible: (perPathologist || severityModel)
      rows: 0
      columns:
        - name: pathologist
          title: 'Pathologist'
          type: text
        - name: cases_read
          title: 'Cases Read'
          type: integer
          visible: (perPathologist)
        - name: pct_exact
          title: 'Exact agreement with colleagues %'
          type: number
          visible: (perPathologist)
        - name: mean_kappa
          title: 'Mean pairwise kappa'
          type: number
          visible: (perPathologist)
        - name: shift
          title: 'Grading tendency'
          type: number
          visible: (severityModel)
        - name: se
          title: 'SE'
          type: number
          visible: (severityModel)
        - name: ci_lower
          title: '95% CI Lower'
          type: number
          visible: (severityModel)
        - name: ci_upper
          title: '95% CI Upper'
          type: number
          visible: (severityModel)
        - name: p_holm
          title: 'p (Holm)'
          type: number
          format: zto,pvalue
          visible: (severityModel)
        - name: tendency
          title: 'Tendency'
          type: text
          visible: (severityModel)
      clearWith:
          - vars
          - confLevel
      refs:
          - Nelson2015
          - ordinal
          - holm1979

    - name: boundaryTable
      title: "Boundary Excess over Colleagues"
      type: Table
      visible: (perPathologist)
      rows: 0
      columns:
        - name: pathologist
          title: 'Pathologist'
          type: text
          combineBelow: true
        - name: boundary
          title: 'Boundary'
          type: text
        - name: n
          title: 'Shared Cases'
          type: integer
        - name: excess
          title: 'Excess over colleagues'
          type: number
        - name: ci_lower
          title: '95% CI Lower'
          type: number
        - name: ci_upper
          title: '95% CI Upper'
          type: number
      clearWith:
          - vars
          - confLevel

    - name: severityPlot
      title: "Grading Tendency per Pathologist"
      type: Image
      width: 600
      height: 400
      renderFun: .severityPlot
      requiresData: false
      visible: (severityModel)
      refs:
          - Nelson2015
          - ordinal

    - name: latentModelTable
      title: "Model-Based Agreement (Latent Probit Model)"
      type: Table
      visible: (latentModel)
      rows: 0
      columns:
        - name: quantity
          title: 'Quantity'
          type: text
        - name: estimate
          title: 'Estimate'
          type: number
        - name: se
          title: 'SE'
          type: number
        - name: ci_lower
          title: '95% CI Lower'
          type: number
        - name: ci_upper
          title: '95% CI Upper'
          type: number
      clearWith:
          - vars
          - clusterVariable
          - confLevel
      refs:
          - Nelson2015
          - ordinal

    - name: gradingGuide
      title: "About the Pathologist Grading Analysis"
      type: Html
      visible: (showGradingGuide)
      clearWith:
          - showGradingGuide
      refs:
          - Nelson2015

    - name: blandAltmanHeading
      title: Bland-Altman Method Comparison
      type:  Preformatted
      visible: (blandAltmanPlot || showBlandAltmanGuide)
      clearWith:
          - blandAltmanPlot
          - showBlandAltmanGuide

    - name: blandAltman
      title: 'Bland-Altman Plot'
      type: Image
      width: 500
      height: 400
      renderFun: .blandAltman
      visible: (blandAltmanPlot)
      clearWith:
          - vars
          - baConfidenceLevel
          # .blandAltman() adds a geom_smooth regression line whenever
          # proportionalBias is on, so without this the plot kept the old image
          # when the option was toggled.
          - proportionalBias
      refs:
          - BlandAltman1986

    - name: agreementHeatmapPlot
      title: 'Agreement Heatmap (Confusion Matrix)'
      type: Image
      width: 600
      height: 500
      renderFun: .agreementHeatmap
      visible: (agreementHeatmap)
      clearWith:
          - vars
          - heatmapColorScheme
          - heatmapShowPercentages
          - heatmapShowCounts
          - heatmapAnnotationSize

    - name: agreementHeatmapExplanation
      title: "About Agreement Heatmap"
      type: Html
      visible: (showAgreementHeatmapGuide)
      clearWith:
          - showAgreementHeatmapGuide

    - name: blandAltmanExplanation
      title: "About Bland-Altman Analysis"
      type: Html
      visible: (showBlandAltmanGuide)
      clearWith:
          - showBlandAltmanGuide

    - name: blandAltmanStats
      title: 'Bland-Altman Statistics'
      type: Table
      visible: (blandAltmanPlot)
      rows: 1
      columns:
        - name: meanDiff
          title: 'Mean Difference'
          type: number
        - name: sdDiff
          title: 'SD of Difference'
          type: number
        - name: lowerLoA
          title: 'Lower LoA'
          type: number
        - name: upperLoA
          title: 'Upper LoA'
          type: number
        - name: propBiasP
          title: 'Difference-Mean Slope (p)'
          type: number
          format: zto,pvalue
          visible: (proportionalBias)
        - name: normalityW
          title: 'Shapiro-Wilk W'
          type: number
        - name: normalityP
          title: 'Normality (p)'
          type: number
          format: zto,pvalue
      clearWith:
          - vars
          - baConfidenceLevel
          - proportionalBias
      refs:
          - BlandAltman1986
          - BlandAltman1999





