    - name: stuartMaxwellExplanation
      title: "About Stuart-Maxwell Test"
      type: Html
      visible: (showStuartMaxwellGuide)
      clearWith:
          - showStuartMaxwellGuide

    - name: pairwiseKappaTable
      title: "Pairwise Kappa (Each Rater vs Reference)"
      type: Table
      visible: (pairwiseKappa)
      rows: 0
      columns:
        - name: rater
          title: 'Rater'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: kappa
          title: 'Kappa'
          type: number
        - name: z
          title: 'z'
          type: number
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: rank
          title: 'Rank'
          type: integer
          visible: (rankRaters)
      clearWith:
          - vars
          - referenceRater
          - rankRaters
          - wght
      refs:
          - Cohen1960
          - LandisKoch1977

    - name: pairwiseKappaExplanation
      title: "About Pairwise Kappa Analysis"
      type: Html
      visible: (showPairwiseKappaGuide)
      clearWith:
          - showPairwiseKappaGuide

    # ---- All-Pairs Cohen's Kappa Table (every rater pair) ----

    - name: allPairsKappaTable
      title: "All-Pairs Kappa (Every Rater Pair)"
      type: Table
      visible: (allPairsKappa)
      rows: 0
      columns:
        - name: rater_a
          title: 'Rater A'
          type: text
        - name: rater_b
          title: 'Rater B'
          type: text
        - name: 'n'
          title: 'Cases'
          type: integer
        - name: peragree
          title: 'Agreement'
          type: number
          format: zto
        - name: kappa
          title: 'Kappa'
          type: number
        - name: se
          title: 'SE'
          type: number
        - name: ci_lower
          title: '95% CI Lower'
          type: number
          visible: (allPairsCI)
        - name: ci_upper
          title: '95% CI Upper'
          type: number
          visible: (allPairsCI)
        - name: z
          title: 'z'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue
        - name: p_adj
          title: 'p (adjusted)'
          type: number
          format: zto,pvalue
          visible: (multipleTestCorrection:bonferroni || multipleTestCorrection:bh || multipleTestCorrection:holm)
      clearWith:
          - vars
          - wght
          - allPairsCI
          - multipleTestCorrection
          - confLevel
          - kappaCIMethod
      refs:
          - Cohen1960
          - LandisKoch1977

    - name: allPairsKappaExplanation
      title: "About All-Pairs Kappa Analysis"
