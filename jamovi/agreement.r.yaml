        - name: w
          title: "W"
          type: number
        - name: chisq
          title: 'Chi-square'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
      clearWith:
          - vars
