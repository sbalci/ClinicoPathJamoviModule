          title: 'Min ρ'
          type: number
        - name: maxRho
          title: 'Max ρ'
          type: number
        - name: interpretation
          title: 'Interpretation'
          type: text
      clearWith:
          - vars
      refs:
          - Spearman1904
          - Mukaka2012

    - name: meanSpearmanExplanation
