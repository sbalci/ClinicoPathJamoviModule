      visible: (showMeanSpearmanGuide)
      clearWith:
          - showMeanSpearmanGuide

    - name: raterBiasHeading
      title: Directional Discordance and Marginal Homogeneity Tests
      type:  Preformatted
      visible: (raterBias || showRaterBiasGuide || bhapkar || showBhapkarGuide || stuartMaxwell || showStuartMaxwellGuide)
      clearWith:
          - raterBias
          - showRaterBiasGuide
          - bhapkar
          - showBhapkarGuide
          - stuartMaxwell
          - showStuartMaxwellGuide

    - name: raterBiasTable
      title: "Directional Discordance Test (ordinal, 2 raters)"
      type: Table
      visible: (raterBias)
      rows: 1
      columns:
        - name: method
          title: 'Test'
          type: text
        - name: chisq
          title: 'Chi-square'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
      clearWith:
          - vars
      refs:
          - agresti2013

    - name: raterBiasExplanation
      title: "About Directional Discordance Test"
      type: Html
      visible: (showRaterBiasGuide)
      clearWith:
          - showRaterBiasGuide

    - name: bhapkarTable
      title: "Bhapkar Test for Marginal Homogeneity"
      type: Table
      visible: (bhapkar)
      rows: 1
      columns:
        - name: method
          title: 'Test'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: chisq
