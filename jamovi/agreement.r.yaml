          - Robinson1957

    - name: robinsonAExplanation
      title: "About Robinson's A"
      type: Html
      visible: (showRobinsonAGuide)
      clearWith:
          - showRobinsonAGuide

    - name: meanSpearmanTable
      title: "Mean Spearman Rho (Average Rank Correlation) Results"
      type: Table
      visible: (meanSpearman)
      rows: 1
      columns:
        - name: method
          title: 'Method'
          type: text
        - name: subjects
          title: 'Cases'
