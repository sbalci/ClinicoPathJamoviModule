        - name: method
          title: 'Test'
          type: text
        - name: subjects
          title: 'Cases'
          type: integer
        - name: raters
          title: 'Raters'
          type: integer
        - name: chisq
          title: 'Chi-square'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p
          title: 'p-value'
          type: number
          format: zto,pvalue
        - name: interpretation
          title: 'Interpretation'
          type: text
      clearWith:
          - vars
      refs:
