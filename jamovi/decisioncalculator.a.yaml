---
name:  decisioncalculator
title: Medical Decision Calculator
menuGroup: meddecide
menuSubgroup: Decision Calculators
menuSubtitle: Sensitivity, Specificity, PPV, NPV, ...
version: '1.0.8'
jas: '1.2'

description:
    main: |
        Medical Decision Calculator for diagnostic test evaluation when you have 
        the four key counts: True Positives (TP), False Positives (FP), True 
        Negatives (TN), and False Negatives (FN). Calculates comprehensive 
        diagnostic performance metrics including sensitivity, specificity, 
        positive and negative predictive values, likelihood ratios, and 
        post-test probabilities. Supports confidence interval estimation and 
        Fagan nomogram visualization for educational interpretation. Presets and
        examples are illustrative only and are not clinical guides.
    R:
        dontrun: true
        usage: |
            # Illustrative examples only; these are not clinical guides.
            result1 <- decisioncalculator(
              TP = 90, FN = 10, TN = 80, FP = 20
            )

            result2 <- decisioncalculator(
              TP = 90, FN = 10, TN = 80, FP = 20,
              ci = TRUE, pp = TRUE, pprob = 0.15, fagan = TRUE
            )


options:
    - name: TP
      title: 'True Positive (TP)'
      type: Number
      default: 90
      description:
          ui: >
            Number of reference-positive cases with a positive test result.
          R: >
            True-positive frequency relative to the stated reference standard.

    - name: TN
      title: 'True Negative (TN)'
      type: Number
      default: 80
      description:
          ui: >
            Number of reference-negative cases with a negative test result.
          R: >
            True-negative frequency relative to the stated reference standard.

    - name: FP
      title: 'False Positive (FP)'
      type: Number
      default: 30
      description:
          ui: >
            Number of reference-negative cases with a positive test result.
          R: >
            False-positive frequency relative to the stated reference standard.

    - name: FN
      title: 'False Negative (FN)'
      type: Number
      default: 20
      description:
          ui: >
            Number of reference-positive cases with a negative test result.
          R: >
            False-negative frequency relative to the stated reference standard.

    - name: pp
      title: Known population prevalence
      type: Bool
      default: false
      description:
          ui: >
            Use known disease prevalence from population data for predictive values,
            post-test probabilities, and F1 score. Sensitivity, specificity, sample
            accuracy, and MCC remain based on the entered study table.
          R: >
            Boolean selection whether to use known population prevalence for
            prevalence-dependent predictive measures.



    - name: pprob
      title: Prior Probability (prevalence)
      type: Number
      default: 0.300
      min: 0.001
      max: 0.999
      description:
          ui: >
            Prior probability (disease prevalence in the community).
            Requires a value between 0.001 and 0.999, default 0.300.
          R: >
            Prior probability (disease prevalence in the community).
            Requires a value between 0.001 and 0.999, default 0.300.



    - name: fnote
      title: Explanatory footnotes
      type: Bool
      default: false
      description:
          ui: >
            Add detailed explanatory footnotes to the tables.
            Helpful for understanding what each statistic means.
          R: >
            Boolean selection whether to show detailed explanatory footnotes.

    - name: ci
      title: "95 percent confidence intervals"
      type: Bool
      default: false
      description:
          ui: >
            Calculate 95 percent confidence intervals for measures estimable from integer
            study counts. Prevalence-adjusted predictive-value intervals are omitted.
          R: >
            Boolean selection whether to calculate 95 percent confidence intervals.


    - name: fagan
      title: "Fagan nomogram plot"
      type: Bool
      default: false
      description:
          ui: >
            Generate a Fagan nomogram for visual interpretation of test results.
            Shows how test results change the probability of disease.
          R: >
            Boolean selection whether to generate a Fagan nomogram plot.

    - name: showWelcome
      title: Welcome message
      type: Bool
      default: false
      description:
          ui: >
            Display introductory message with quick start guide.
            Helpful for first-time users to understand the tool.
          R: >
            Boolean selection whether to show welcome message.

    - name: showSummary
      title: Plain-language summary
      type: Bool
      default: false
      description:
          ui: >
            Display a descriptive plain-language summary. It is educational and is not a clinical guide.
          R: >
            Boolean selection whether to show plain-language summary of results.

    - name: showAbout
      title: About this analysis
      type: Bool
      default: false
      description:
          ui: >
            Show explanatory panels describing test evaluation methodology and assumptions.
            Helpful for understanding when and how to use this analysis.
          R: >
            Boolean selection whether to show about and assumptions panels.

    - name: showGlossary
      title: Clinical terms glossary
      type: Bool
      default: false
      description:
          ui: >
            Display a glossary defining diagnostic-test terms with plain-language explanations.
          R: >
            Boolean selection whether to show clinical glossary.

    # Multiple cut-off evaluation (DiagROC inspired)
    - name: multiplecuts
      title: "Multiple cut-off evaluation"
      type: Bool
      default: false
      description:
          ui: >
            Descriptively compare illustrative cut-off scenarios. These examples are not clinical guides.
          R: >
            Boolean selection whether to evaluate multiple cut-off scenarios.
      
    - name: cutoff1
      title: 'Cut-off scenario 1 name'
      type: String
      default: 'Higher sensitivity example'
      description:
          ui: >
            Descriptive name for the first illustrative cut-off scenario; not clinical guidance.
          R: >
            Name identifier for cut-off scenario 1.
      
    - name: tp1
      title: 'TP (Cut-off 1)'
      type: Number
      default: 100
      description:
          ui: Reference-positive participants testing positive in illustrative scenario 1.
          R: True-positive frequency for illustrative scenario 1.
      
    - name: fp1
      title: 'FP (Cut-off 1)'
      type: Number
      default: 40
      description:
          ui: Reference-negative participants testing positive in illustrative scenario 1.
          R: False-positive frequency for illustrative scenario 1.
      
    - name: tn1
      title: 'TN (Cut-off 1)'
      type: Number
      default: 70
      description:
          ui: Reference-negative participants testing negative in illustrative scenario 1.
          R: True-negative frequency for illustrative scenario 1.
      
    - name: fn1
      title: 'FN (Cut-off 1)'
      type: Number
      default: 10
      description:
          ui: Reference-positive participants testing negative in illustrative scenario 1.
          R: False-negative frequency for illustrative scenario 1.
      
    - name: cutoff2
      title: 'Cut-off scenario 2 name'
      type: String
      default: 'Higher specificity example'
      description:
          ui: >
            Descriptive name for the second illustrative cut-off scenario; not clinical guidance.
          R: >
            Name identifier for cut-off scenario 2.
      
    - name: tp2
      title: 'TP (Cut-off 2)'
      type: Number
      default: 80
      description:
          ui: Reference-positive participants testing positive in illustrative scenario 2.
          R: True-positive frequency for illustrative scenario 2.
      
    - name: fp2
      title: 'FP (Cut-off 2)'
      type: Number
      default: 15
      description:
          ui: Reference-negative participants testing positive in illustrative scenario 2.
          R: False-positive frequency for illustrative scenario 2.
      
    - name: tn2
      title: 'TN (Cut-off 2)'
      type: Number
      default: 95
      description:
          ui: Reference-negative participants testing negative in illustrative scenario 2.
          R: True-negative frequency for illustrative scenario 2.
      
    - name: fn2
      title: 'FN (Cut-off 2)'
      type: Number
      default: 30
      description:
          ui: Reference-positive participants testing negative in illustrative scenario 2.
          R: False-negative frequency for illustrative scenario 2.


...
