---
name: summarydata
title: Summary of Continuous Variables
menuGroup: ExplorationT
menuSubgroup: ClinicoPath Descriptives
version: '1.0.7'
jas: '1.2'

description:
  main: |
    This module generates descriptive statistics for continuous variables.
    It provides both a textual summary and a visually appealing summary table.
    Optionally, you can enable distribution diagnostics to examine normality, skewness, and kurtosis.
  R:
    dontrun: true
    usage: |
      data(histopathology)

      # Descriptive statistics for two continuous variables
      summarydata(data = histopathology, vars = c("Age", "OverallTime"))

      # Add Shapiro-Wilk, skewness and kurtosis diagnostics
      summarydata(data = histopathology, vars = "Age", distr = TRUE)


options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: vars
      title: Variables
      type: Variables
      suggested: [ continuous ]
      permitted: [ numeric ]
      # .run() has a dedicated `length(self$options$vars) == 0` branch that shows
      # the welcome panel, so NULL is a supported state. Without an explicit
      # default the compiler makes `vars` a REQUIRED argument of the public
      # wrapper, and summarydata(data = df) errors instead of showing that panel.
      default: NULL
      description:
          R: >
            a string naming the variables from `data` that contains the
            continuous values used for the report


    - name: distr
      title: "Distribution diagnostics"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, additional distribution diagnostics (Shapiro-Wilk test, skewness, and kurtosis)
          will be computed and explained.

    - name: decimal_places
      title: "Decimal places"
      type: Integer
      min: 0
      max: 5
      default: 2
      description:
        R: >
          Number of decimal places to display for statistical measures.
          Default of 2 aligns with standard laboratory reporting.
          Governs the text summary, the skewness and kurtosis values, the
          visual summary table, the outlier report and the copy-ready clinical
          summary. P-values are always shown to 3 decimal places.

    - name: outliers
      title: "Outlier detection"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, detect and report potential outliers using IQR method.
          Helpful for quality control and identifying data entry errors.

    - name: report_sentences
      title: "Report sentences"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, generate copy-ready clinical report sentences
          for direct use in medical documentation.

