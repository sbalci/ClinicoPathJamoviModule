---
name: summarydata
title: Summary of Continuous Variables
menuGroup: Exploration
menuSubgroup: ClinicoPath Descriptives
version: '1.0.81'
jas: '1.2'

description:
  main: |
    This module generates descriptive statistics for continuous variables.
    It provides both a textual summary and a visually appealing summary table.
    Optionally, you can enable distribution diagnostics to examine normality, skewness, and kurtosis.
  R:
    dontrun: true
    usage: |
      data(histopathology)

      # Descriptive statistics for two continuous variables
      summarydata(data = histopathology, vars = c("Age", "OverallTime"))

      # Add Shapiro-Wilk, skewness and kurtosis diagnostics
      summarydata(data = histopathology, vars = "Age", distr = TRUE)


options:

    - name: data
      type: Data
      description:
          R: >
            The data as a data frame.

    - name: vars
      title: Variables
      type: Variables
      suggested: [ continuous ]
      permitted: [ numeric ]
      # The backend has a dedicated "no variables selected" branch that shows
      # the welcome panel, so NULL is a supported state. Without an explicit
      # `default: NULL` the compiler makes `vars` a REQUIRED argument of the
      # public wrapper and summarydata(data = df) fails with the opaque
      # `argument "vars" is missing, with no default`.
      default: NULL
      description:
          R: >
            A character vector naming the numeric variables from `data` to
            summarize. Until at least one variable is selected, the analysis
            shows a welcome panel with instructions instead of results.


    - name: distr
      title: "Distribution diagnostics"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, additional distribution diagnostics (Shapiro-Wilk test, skewness, and kurtosis)
          will be computed and explained.

    - name: decimal_places
      title: "Decimal places"
      type: Integer
      min: 0
      max: 5
      default: 2
      description:
        R: >
          Number of decimal places to display for statistical measures.
          Default of 2 aligns with standard laboratory reporting.
          Governs the text summary, the skewness and kurtosis values, the
          visual summary table, the outlier report and the draft statistical
          summary. P-values are normally shown to 3 decimal places; additional
          digits are retained near 0.05 when needed to preserve the test decision.

    - name: outliers
      title: "Outlier detection"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, flag observations outside the 1.5 x IQR fences as potential
          outliers. Helpful for quality control and identifying possible data
          entry errors or genuine extreme values that need contextual review.

    - name: report_sentences
      title: "Draft report sentences"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, generate draft statistical sentences that include sample
          size and missingness. Add measurement units, the study population,
          the time point, and missing-data handling before using the text in a
          manuscript or clinical document.

    - name: show_guidance
      title: "Interpretation guidance and glossary"
      type: Bool
      default: false
      description:
        R: >
          If TRUE, show the clinical interpretation guide, methodological
          explanation, and statistical glossary. These panels provide general
          educational guidance and do not establish clinical reference intervals.


...
