title: Comprehensive Time Interval Calculator
name: timeinterval
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Start Date Variable
        children:
          - type: VariablesListBox
            name: dx_date
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: End Date Variable
        children:
          - type: VariablesListBox
            name: fu_date
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Date Format Configuration
    collapsed: false
    children:
      - type: ComboBox
        name: time_format
      - type: ComboBox
        name: output_unit
      - type: ComboBox
        name: time_basis
      - type: ComboBox
        name: timezone
  - type: CollapseBox
    label: Landmark Analysis
    collapsed: true
    children:
      - type: CheckBox
        name: use_landmark
      - type: LayoutBox
        margin: large
        style: inline
        children:
          - type: TextBox
            name: landmark_time
            format: number
            enable: (use_landmark)
  - type: CollapseBox
    label: Data Quality & Statistics
    collapsed: true
    children:
      # Label matches the .a.yaml title. It used to read "Negative-interval
      # exclusion" while the .a.yaml said "Remove negative intervals" -- one
      # option under two names, with the GUI showing the vaguer one and two
      # backend messages quoting it. The verb stays: this filter deletes rows
      # from every statistic including the person-time denominator, and saying
      # so is the point (the sibling "Remove extreme values" was renamed from
      # "Flag extreme values" for exactly that reason).
      - type: CheckBox
        name: remove_negative
        label: Remove negative intervals
      - type: CheckBox
        name: remove_extreme
      - type: TextBox
        name: extreme_multiplier
        format: number
        suffix: x 99th %ile
        enable: (remove_extreme)
      - type: TextBox
        name: confidence_level
        format: number
        suffix: '%'
      - type: CheckBox
        name: include_quality_metrics
        label: Data quality assessment
  - type: CollapseBox
    label: Output Options
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: Output
            name: calculated_time
            label: Add calculated times to dataset
      - type: CheckBox
        name: show_summary
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: show_glossary
