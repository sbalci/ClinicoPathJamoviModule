        - fudate
        - dxdate
        - tint
        - multievent
        - analysistype
        - dod
        - dooc
        - awd
        - awod
        - explanatory
        - timetypedata
        # Person-time is computed on the complete-case set over ALL selected
        # variables, so any variable that enters the model changes the
        # denominator. Adding one continuous covariate with missing values moved
        # the overall row from 134 events / 8235.5 person-time to 94 / 6005.47 --
        # while `contexpl` was absent here, so the old rates stayed on screen.
        # The same reasoning applies to the remaining model-defining options.
        - contexpl
        - interactions
        - use_stratify
        - stratvar
        - timetypeoutput
        - uselandmark
        - landmark
        - person_time

