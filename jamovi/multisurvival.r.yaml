          title: "Level"
          type: text
        - name: time
          title: "Time"
          type: number
        # Observed counts, not properties of the adjusted curve. These used to be
        # the model's common risk set, identical for every level while labelled
        # per level; the titles now say what they are.
        - name: atrisk
          title: "Observed at Risk"
          type: integer
        - name: events
          title: "Observed Events"
          type: integer
        - name: surv
          title: "Adjusted Estimate"
          type: text
        - name: lower
          title: "95% CI Lower"
          type: text
        - name: upper
          title: "95% CI Upper"
          type: text
      clearWith:
          - ac
          - ac_summary
          - cutp
          - adjexplanatory
          - ac_method
          - timetypedata
          # The adjusted outputs are all predictions from the Cox model, so they
          # go stale whenever the model does. Only ac/ac_summary/adjexplanatory/
          # ac_method were listed, and jamovi keeps a panel's last content until
          # a listed option moves -- changing the covariates left the previous
          # run's adjusted numbers on screen next to a refitted model.
