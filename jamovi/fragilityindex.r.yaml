---
name:  fragilityindex
title: Fragility Index for Dichotomous Outcomes
jrs:   '1.1'

items:
    - name: todo
      title: Instructions
      type: Html
      visible: true
      clearWith:
          - dataFormat
          - group
          - outcome

    - name: countsTable
      title: 2x2 Contingency Table
      type: Table
      visible: (showCounts)
      clearWith:
          - dataFormat
          - group
          - outcome
          - outcomeEvent
          - events1
          - n1
          - events2
          - n2
      columns:
          - name: grp
            title: Group
            type: text
          - name: events
            title: Events
            type: integer
          - name: nonevents
            title: Non-events
            type: integer
          - name: 'n'
            title: Total
            type: integer
          - name: prop
            title: Event Rate
            type: number
            format: pc

    - name: mainTable
      title: Fragility Index
      type: Table
      visible: true
      clearWith:
          - dataFormat
          - group
          - outcome
          - outcomeEvent
          - events1
          - n1
          - events2
          - n2
          - testType
          - alpha
      columns:
          - name: statistic
            title: ''
            type: text
          - name: value
            title: Value
            type: number

    - name: trajectoryTable
      title: Reversal Trajectory
      type: Table
      visible: (showTrajectory)
      clearWith:
          - dataFormat
          - events1
          - n1
          - events2
          - n2
          - testType
          - alpha
      columns:
          - name: step
            title: Reversals
            type: integer
          - name: e1
            title: Group 1 Events
            type: integer
          - name: e2
            title: Group 2 Events
            type: integer
          - name: pval
            title: p-value
            type: number
            format: zto,pvalue

    - name: plot
      title: P-value Trajectory
      type: Image
      width: 500
      height: 350
      renderFun: .plot
      visible: (showPlot)
      clearWith:
          - dataFormat
          - events1
          - n1
          - events2
          - n2
          - testType
          - alpha

    - name: summary
      title: Analysis Summary
      type: Html
      visible: (showSummary)

    - name: explanation
      title: Methodology
      type: Html
      visible: (showExplanation)


refs:
    - walsh2014fragility
    - ClinicoPathJamoviModule
    - glue
    - ggplot2
...
