title: Horizontal Box-Violin Comparison
name: jjdotplotstats
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Split By (Optional)
        children:
          - type: VariablesListBox
            name: grvar
            maxItemCount: 1
            isTarget: true
  - type: CollapseBox
    label: Statistical Analysis
    collapsed: true
    children:
      - type: Label
        label: Test Method
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: typestatistics
      - type: Label
        label: Statistical Options
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: effsizetype
                enable: (typestatistics:parametric)
              - type: ComboBox
                name: pairwisedisplay
              - type: ComboBox
                name: padjustmethod
                enable: (!pairwisedisplay:none && !typestatistics:bayes)
              - type: TextBox
                name: conflevel
                format: number
              - type: CheckBox
                name: bfmessage
                enable: (resultssubtitle && typestatistics:parametric)
              - type: TextBox
                name: k
                format: number
  - type: CollapseBox
    label: Plot Display
    collapsed: true
    children:
      - type: Label
        label: Reference Lines
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: testvalueline
              - type: TextBox
                name: testvalue
                format: number
                enable: (testvalueline)
  - type: CollapseBox
    label: Centrality Options
    collapsed: true
    children:
      - type: Label
        label: Centrality Display
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: centralityplotting
              # Moved here from "Plot Display > Reference Lines". Sitting in a
              # different collapse box from centralitytype, it read as a second,
              # competing mean/median selector; it is not one - only its "none"
              # level does anything, and .prepareOptions() warns when the two
              # disagree. Adjacent and in resolution order, the redundancy is at
              # least visible.
              - type: ComboBox
                name: centralityparameter
                enable: (centralityplotting)
              - type: ComboBox
                name: centralitytype
                enable: (centralityplotting)
              # centralityk carries `hidden: true` in jjdotplotstats.a.yaml so
              # R scripts and saved .omv files keep working without a dead UI box.
  - type: CollapseBox
    label: Plot Appearance
    collapsed: true
    children:
      - type: Label
        label: Display Options
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: resultssubtitle
              - type: CheckBox
                name: showexplanation
              - type: CheckBox
                name: originaltheme
              - type: ComboBox
                name: colorpalette
      - type: Label
        label: Plot Labels
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: mytitle
                format: string
                width: large
              - type: TextBox
                name: xtitle
                format: string
                width: large
              - type: TextBox
                name: ytitle
                format: string
                width: large
  - type: CollapseBox
    label: Plot Configuration
    collapsed: true
    children:
      - type: Label
        label: Plot Dimensions
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: plotwidth
                format: number
              - type: TextBox
                name: plotheight
                format: number
      - type: Label
        label: Reproducibility
        fitToGrid: true
        children:
          - type: LayoutBox
            margin: large
            children:
              - type: TextBox
                name: seed
                format: number
